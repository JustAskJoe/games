<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Hexed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone-first single column — HUD, square board, Sable's coach line, the spread strip. One committed night look (a candlelit altar cloth), so no light theme. */
:root {
  --night: #15111E; --night-2: #1D1729; --cloth: #261D35; --cloth-2: #2E2440; --line: #3E3254;
  --fg: #EEE7F4; --muted: #A99CBC; --parchment: #ECE1C9; --parch-2: #DCCBA8; --parch-ink: #2A2131;
  --gold: #DDAA4F; --gold-hi: #F6D58C; --moss: #93BC8E; --rose: #DB8EA3; --warn: #E7956C;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --flavor: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--fg); height: 100%; }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(120% 70% at 50% -10%, #33264A 0%, transparent 60%), radial-gradient(80% 50% at 50% 110%, #2A1F2E 0%, transparent 70%), var(--night); }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 64px; display: flex; flex-direction: column; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--cloth); border-radius: 12px; min-height: 44px; padding: 8px 16px; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--gold); }
.btn:focus-visible, .cardtile:focus-visible, .spread button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.btn.primary { background: var(--gold); color: var(--parch-ink); border-color: var(--gold); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.icon { width: 44px; padding: 0; font-size: 20px; }
.btn[aria-pressed="true"] { border-color: var(--moss); color: var(--moss); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.eyebrow { font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; font-weight: 800; color: var(--gold); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }
.owner { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 80; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; color: rgba(238,231,244,.55); background: rgba(16,12,22,.7); padding: 3px 8px; border-radius: 999px; pointer-events: none; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.top .t { display: flex; flex-direction: column; min-width: 0; align-items: center; text-align: center; flex: 1; }
.top .t h1 { font-size: 22px; line-height: 1.1; }
.top .t span { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
.moves { background: var(--parchment); color: var(--parch-ink); border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 70px; box-shadow: 0 4px 0 #0c0912; }
.moves b { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.moves span { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 800; }
.moves.low b { color: #A3372E; }
.goal { background: var(--cloth); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.goal svg { width: 34px; height: 34px; flex: none; }
.goal .gt { display: flex; flex-direction: column; min-width: 0; }
.goal .gt b { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.goal .gt span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
.goal .bar i { display: block; height: 100%; background: var(--moss); transition: width .3s; }
.goal.done { border-color: var(--moss); }
.score { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; font-variant-numeric: tabular-nums; padding-right: 2px; }
.score b { font-size: 18px; }
.score span { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 800; }

/* ---------- board ---------- */
.board-wrap { position: relative; width: 100%; max-width: min(520px, calc(100vh - 290px)); min-width: 280px; margin: 0 auto; }
@media (max-width: 360px) { .board-wrap { min-width: 0; } }
.board { position: relative; width: 100%; aspect-ratio: 1 / 1; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 16px; background: var(--cloth); box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,.45); }
.board .layer { position: absolute; inset: 0; pointer-events: none; }
.cell { position: absolute; width: 12.5%; height: 12.5%; }
.cell.bg::before { content: ""; position: absolute; inset: 2px; border-radius: 10px; background: var(--cloth-2); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.cell.bg.alt::before { background: #2A2139; }
.cell.path::before { background: linear-gradient(180deg, rgba(221,170,79,.10), rgba(221,170,79,.28)); box-shadow: inset 0 0 0 1px rgba(221,170,79,.45); }
.veil { position: absolute; width: 12.5%; height: 12.5%; }
.veil::before { content: ""; position: absolute; inset: 3px; border-radius: 9px; background: repeating-linear-gradient(45deg, rgba(196,166,232,.28) 0 3px, transparent 3px 7px), repeating-linear-gradient(-45deg, rgba(196,166,232,.22) 0 3px, transparent 3px 7px), rgba(126,92,170,.35); box-shadow: inset 0 0 0 1.5px rgba(205,180,240,.55); }
.blk { position: absolute; width: 12.5%; height: 12.5%; }
.blk svg { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }
.beast { position: absolute; width: 25%; height: 25%; transition: transform .2s; }
.beast svg { width: 100%; height: 100%; }
.beast .hp { position: absolute; left: 10%; right: 10%; bottom: -2px; height: 7px; border-radius: 4px; background: #120d18; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.beast .hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width .3s; }
.beast.hit { animation: beastHit .35s; }
@keyframes beastHit { 30% { transform: translateX(-4px) scale(.96); } 60% { transform: translateX(4px); } }
.piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transition: transform .22s cubic-bezier(.3,.7,.3,1), opacity .2s; will-change: transform; }
.piece .in { position: absolute; inset: 6%; transition: transform .2s ease, opacity .2s ease; }
.piece svg { width: 100%; height: 100%; display: block; overflow: visible; }
.piece.sel .in { transform: scale(1.12); filter: drop-shadow(0 0 6px var(--gold-hi)); }
.piece.gone .in { transform: scale(0) rotate(40deg); opacity: 0; }
.piece.born .in { animation: born .32s ease-out; }
@keyframes born { from { transform: scale(.2); } 70% { transform: scale(1.18); } to { transform: scale(1); } }
.piece.hint .in { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { transform: scale(1.14); filter: drop-shadow(0 0 7px var(--gold-hi)); } }
.piece.nudge .in { animation: nudge 1s ease-in-out infinite; }
.lock { position: absolute; width: 12.5%; height: 12.5%; }
.lock svg { width: 100%; height: 100%; }
.dark { position: absolute; width: 12.5%; height: 12.5%; background: #0B0812; opacity: .93; transition: opacity .45s; }
.dark.lit { opacity: 0; }
.fx .beam { position: absolute; background: linear-gradient(90deg, transparent, rgba(246,213,140,.9), transparent); animation: beam .45s ease-out forwards; border-radius: 99px; }
.fx .beam.v { background: linear-gradient(180deg, transparent, rgba(246,213,140,.9), transparent); }
@keyframes beam { from { opacity: 1; transform: scale(1, .3); } to { opacity: 0; transform: scale(1, 1.4); } }
.fx .beam.v { animation-name: beamv; }
@keyframes beamv { from { opacity: 1; transform: scale(.3, 1); } to { opacity: 0; transform: scale(1.4, 1); } }
.fx .ring { position: absolute; border-radius: 50%; border: 3px solid var(--gold-hi); animation: ring .5s ease-out forwards; }
@keyframes ring { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(1.05); } }
.fx .spark { position: absolute; width: 12.5%; height: 12.5%; display: grid; place-items: center; color: var(--gold-hi); font-family: var(--display); font-size: clamp(14px, 4vw, 22px); animation: up .9s ease-out forwards; text-shadow: 0 2px 8px #000; }
@keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60%); } }
.spellname { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--display); font-size: clamp(26px, 8vw, 42px); color: var(--gold-hi); text-shadow: 0 3px 18px rgba(0,0,0,.9), 0 0 24px rgba(221,170,79,.6); animation: spell 1.3s ease-out forwards; pointer-events: none; z-index: 6; }
@keyframes spell { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1.06); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
.board.targeting { box-shadow: inset 0 0 0 2px var(--gold-hi), 0 0 0 4px rgba(221,170,79,.25), 0 18px 40px rgba(0,0,0,.45); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- coach + spread strip ---------- */
.coach { display: flex; gap: 12px; align-items: flex-start; background: var(--night-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-height: 64px; }
.coach .cat { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--cloth); box-shadow: 0 0 0 2px var(--gold); display: grid; place-items: center; }
.coach .cat svg { width: 36px; height: 36px; }
.coach p { margin: 0; font-size: 15.5px; }
.coach p b.who { color: var(--gold); }
.spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.spread .sc { background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; cursor: default; }
.spread .sc .pos { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.spread .sc b { font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 1.15; }
.spread .sc small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.spread .sc.power { border-color: var(--gold); cursor: pointer; }
.spread .sc.power .use { margin-top: 4px; align-self: flex-start; font-size: 12px; font-weight: 800; color: var(--parch-ink); background: var(--gold); border-radius: 999px; padding: 2px 9px; }
.spread .sc.used { opacity: .5; }
.spread .sc.met { border-color: var(--moss); }

/* ---------- tarot cards ---------- */
.tcard { --w: 150px; width: var(--w); aspect-ratio: 7 / 12; flex: none; border-radius: calc(var(--w) * .07); background: var(--parchment); color: var(--parch-ink); padding: calc(var(--w) * .06); display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 0 0 calc(var(--w) * .025) var(--parch-2); position: relative; }
.tcard .frame { flex: 1; width: 100%; border: 1.5px solid #8C7A57; border-radius: calc(var(--w) * .04); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(var(--w) * .05) calc(var(--w) * .04); background: radial-gradient(circle at 50% 42%, #F6EEDB 0%, #E7D9BB 70%); }
.tcard .rn { font-family: var(--display); font-size: calc(var(--w) * .12); line-height: 1; }
.tcard .em { width: 74%; aspect-ratio: 1; }
.tcard .em svg { width: 100%; height: 100%; }
.tcard .nm { font-family: var(--display); font-size: calc(var(--w) * .095); line-height: 1.05; text-align: center; text-wrap: balance; }
.tcard.back { background: #2A1F3C; box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 0 0 calc(var(--w) * .025) var(--gold); }
.tcard.back .frame { background: repeating-conic-gradient(from 0deg at 50% 50%, #34284A 0deg 15deg, #2A1F3C 15deg 30deg); border-color: var(--gold); justify-content: center; }
.flip { perspective: 900px; }
.flip .inner { position: relative; transition: transform .7s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.flip .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .face.front { position: absolute; inset: 0; transform: rotateY(180deg); }

/* ---------- screens (intro, map) ---------- */
.story { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: radial-gradient(90% 60% at 50% 0%, #3A2A52 0%, transparent 65%), radial-gradient(70% 40% at 50% 100%, #3A2430 0%, transparent 70%), var(--night); }
.story-in { min-height: 100%; max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; text-align: center; }
.stars-bg { position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 78% 12%, #fff9 50%, transparent 51%), radial-gradient(1.5px 1.5px at 64% 34%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 30% 62%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 88% 70%, #fff8 50%, transparent 51%), radial-gradient(1.5px 1.5px at 46% 86%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 8% 80%, #fff6 50%, transparent 51%); animation: twinkle 6s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .55; } }
.title { font-family: var(--display); font-size: clamp(72px, 22vw, 132px); line-height: .9; margin: 0; background: linear-gradient(180deg, #FFF0C8 0%, var(--gold) 60%, #A87A2E 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 22px rgba(221,170,79,.35)); }
.story .lead { font-family: var(--flavor); font-style: italic; font-size: clamp(18px, 4.6vw, 22px); color: #E3D8EC; max-width: 30ch; margin: 0; }
.story .copy { max-width: 36ch; margin: 0; color: var(--muted); font-size: 16px; }
.fan { display: flex; justify-content: center; margin: 8px 0 4px; height: 190px; }
.fan .tcard { --w: 104px; margin: 0 -26px; transform-origin: 50% 120%; }
.fan .tcard:nth-child(1) { transform: rotate(-14deg) translateY(10px); }
.fan .tcard:nth-child(2) { transform: rotate(-4deg); z-index: 1; }
.fan .tcard:nth-child(3) { transform: rotate(6deg); z-index: 2; }
.fan .tcard:nth-child(4) { transform: rotate(15deg) translateY(12px); }
.fan.three .tcard { margin: 0 -12px; }
.rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
.rise.d1 { animation-delay: .2s; } .rise.d2 { animation-delay: .45s; } .rise.d3 { animation-delay: .7s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
.dots span.on { background: var(--gold); }
.story .skip { background: transparent; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 10px; min-height: 44px; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; width: 100%; max-width: 380px; }
.legend div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.legend svg { width: 44px; height: 44px; }

.map-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.map-head h2 { font-size: 28px; }
.journey { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cardtile { background: var(--night-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; min-width: 0; position: relative; }
.cardtile:hover { border-color: var(--gold); }
.cardtile .tcard { --w: 54px; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.cardtile .tcard .nm { display: none; }
.cardtile .ti { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cardtile .ti b { font-family: var(--display); font-weight: 400; font-size: 17px; line-height: 1.1; }
.cardtile .ti small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.cardtile .st { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
.cardtile .st i { color: var(--line); font-style: normal; }
.cardtile.locked { opacity: .5; cursor: not-allowed; }
.cardtile.locked .tcard { filter: grayscale(.8); }
.cardtile.next { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(221,170,79,.18); }
.cardtile .tag { position: absolute; top: -9px; right: 10px; background: var(--gold); color: var(--parch-ink); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; }
.map-acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- sheets ---------- */
.veil-bg { position: fixed; inset: 0; background: rgba(10,7,15,.78); display: grid; place-items: end center; z-index: 50; }
.sheet { background: var(--night-2); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); width: min(560px, 100%); max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; animation: sheet .3s ease-out; }
@keyframes sheet { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: 28px; }
.sheet p, .sheet ol, .sheet ul { margin: 0; }
.sheet ol, .sheet ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.intro-card { display: flex; gap: 16px; align-items: center; }
.intro-card .tcard { --w: 118px; }
.intro-card .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.intro-card .theme { font-family: var(--flavor); font-style: italic; color: var(--muted); }
.twist { background: var(--cloth); border-radius: 12px; padding: 10px 12px; font-size: 15.5px; }
.goalline { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.goalline svg { width: 30px; height: 30px; flex: none; }
.drawn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.drawn .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.drawn .slot .pos { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 800; color: var(--gold); }
.drawn .tcard { --w: min(96px, 26vw); }
.drawn .does { font-size: 12.5px; color: var(--muted); line-height: 1.3; min-height: 3.9em; opacity: 0; transition: opacity .4s .3s; }
.drawn .flip.on + .does { opacity: 1; }
.endstars { display: flex; gap: 10px; justify-content: center; font-size: 46px; color: var(--line); }
.endstars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(221,170,79,.6); animation: born .5s ease-out both; }
.endstars span:nth-child(2) { animation-delay: .25s; } .endstars span:nth-child(3) { animation-delay: .5s; }
.spells { display: flex; flex-direction: column; gap: 8px; }
.spell { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--cloth); }
.spell svg { width: 44px; height: 44px; }
.spell b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.spell small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.spell.unknown { opacity: .55; }
.spell.unknown b { color: var(--muted); }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu .btn { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 6px; }

<script>
// Hexed match-3 engine. Pure: no DOM. Runs in the browser (window.HX) and in node (module.exports).
// © 2026 F Lane d/b/a One Fifty Labs. All rights reserved.
(function (root) {
  'use strict';
  const ROWS = 8, COLS = 8;
  const ITEM = 9; // lantern
  const SPELLS = {
    candle: { name: 'Candle Flame', how: 'Match 4 in a line. Burns its whole row or column.' },
    cauldron: { name: 'Cauldron Boil', how: 'Match in an L or T shape. Boils over the 3×3 around it.' },
    orb: { name: 'Scrying', how: 'Match 5 in a line for a Crystal Ball. Swap it with a piece to clear every piece of that kind.' },
    cc: { name: 'Crossroads Hex', how: 'Swap two Candles together. Burns a full row and column.' },
    ck: { name: 'Witch Storm', how: 'Swap a Candle with a Cauldron. Burns three rows and three columns.' },
    kk: { name: 'Full Moon', how: 'Swap two Cauldrons together. Boils over a 5×5 area.' },
    oc: { name: 'Starfall', how: 'Swap a Crystal Ball with a Candle. Every piece of that kind becomes a Candle and burns.' },
    ok: { name: 'Coven Brew', how: 'Swap a Crystal Ball with a Cauldron. Every piece of that kind becomes a Cauldron and boils.' },
    oo: { name: 'Great Arcanum', how: 'Swap two Crystal Balls together. Clears the whole board.' },
  };

  // ---------- rng ----------
  function rngNew(seed) { return { s: (seed >>> 0) || 1 }; }
  function rnd(R) { R.s = (R.s + 0x6D2B79F5) >>> 0; let t = R.s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const ri = (R, n) => Math.floor(rnd(R) * n);

  // ---------- levels ----------
  // Layout chars: '.' cell, '#' hole, 'v' veil, 'V' vine, 'S' stone (2 hits), 's' cracked stone (1 hit), 'B' beast (top-left of 2×2), 'L' bound pair (pairs left to right in a row)
  const LEVELS = [
    { id: 0, num: '0', card: 'The Fool', theme: 'New beginnings', moves: 15, colors: 5,
      goal: { type: 'score', n: 2400 },
      twist: 'No obstacles. Just learn the craft.',
      layout: ['........', '........', '........', '........', '........', '........', '........', '........'] },
    { id: 1, num: 'I', card: 'The Magician', theme: 'Skill and willpower', moves: 18, colors: 5,
      goal: { type: 'make', sp: 'candle', n: 4 },
      twist: 'Match 4 in a row to make a Candle. Make 4 of them.',
      layout: ['#......#', '........', '........', '........', '........', '........', '........', '#......#'] },
    { id: 2, num: 'II', card: 'The High Priestess', theme: 'Intuition and hidden things', moves: 18, colors: 5,
      goal: { type: 'veil' },
      twist: 'Veiled tiles hide the board. Make a match on a veil to lift it.',
      layout: ['##....##', '#.vvvv.#', '.vvvvvv.', '.vv..vv.', '.vv..vv.', '.vvvvvv.', '#.vvvv.#', '##....##'] },
    { id: 3, num: 'III', card: 'The Empress', theme: 'Abundance and growth', moves: 25, colors: 5,
      goal: { type: 'vine' },
      twist: 'Vines grow over a piece every turn you don’t cut one back. Match next to a vine to cut it.',
      layout: ['........', '........', '........', '........', '........', '.V....V.', 'VV....VV', 'VVV..VVV'] },
    { id: 4, num: 'IV', card: 'The Emperor', theme: 'Structure and order', moves: 22, colors: 5,
      goal: { type: 'stone' },
      twist: 'Stone blocks take two hits. Match next to them, or blast them with a spell.',
      layout: ['........', '........', '........', '.S.SS.S.', '.S....S.', 'SS.SS.SS', '........', '........'] },
    { id: 5, num: 'V', card: 'The Hierophant', theme: 'Tradition and teaching', moves: 22, colors: 6,
      goal: { type: 'collect', color: 2, n: 28 },
      twist: 'Your first tarot spread. Three cards change the level before you play.',
      spread: { past: 'sun', present: 'conjure', future: 'movesLeft' },
      layout: ['........', '........', '........', '........', '........', '........', '........', '........'] },
    { id: 6, num: 'VI', card: 'The Lovers', theme: 'Union and choices', moves: 22, colors: 6,
      goal: { type: 'lock' },
      twist: 'Bound pairs are tied with a ribbon. Match either piece of a pair to free both.',
      spread: { past: 'tower', present: 'temperance', future: 'makeCauldron' },
      layout: ['........', '.LL..LL.', '........', 'LL....LL', '........', '.LL..LL.', '........', '...LL...'] },
    { id: 7, num: 'VII', card: 'The Chariot', theme: 'Willpower and direction', moves: 22, colors: 6, gravity: 'left',
      goal: { type: 'collect', color: 0, n: 26 },
      twist: 'The board drives sideways. Pieces fall to the left and new ones arrive from the right.',
      spread: { past: 'wands', present: 'wish', future: 'combo' },
      layout: ['#......#', '........', '........', '........', '........', '........', '........', '#......#'] },
    { id: 8, num: 'VIII', card: 'Strength', theme: 'Courage and gentle power', moves: 24, colors: 6,
      goal: { type: 'beast', hp: 18 },
      twist: 'A beast sits on the board. Match next to it or hit it with spells to tame it.',
      spread: { past: 'tower', present: 'smite', future: 'movesLeft' },
      layout: ['........', '........', '........', '...B....', '........', '........', '........', '........'] },
    { id: 9, num: 'IX', card: 'The Hermit', theme: 'Solitude and inner light', moves: 26, colors: 6, dark: true,
      goal: { type: 'item', n: 3 },
      twist: 'The board is dark. Matches light it up for a few turns. Bring 3 lanterns down to the glowing path along the bottom two rows.',
      spread: { past: 'moon', present: 'sunlight', future: 'collectCandles' },
      layout: ['........', '........', '........', '........', '........', '........', '........', '........'] },
  ];

  // Spread cards: original wording, traditional meanings.
  const CARDS = {
    sun: { name: 'The Sun', num: 'XIX', pos: 'past', meaning: 'Warmth and success', does: 'Start with 2 Candles already on the board.' },
    tower: { name: 'The Tower', num: 'XVI', pos: 'past', meaning: 'Sudden upheaval', does: 'Three cracked stones fall onto the board.' },
    wands: { name: 'Three of Wands', num: '3', pos: 'past', meaning: 'Plans in motion', does: 'Start with a Cauldron already on the board.' },
    moon: { name: 'The Moon', num: 'XVIII', pos: 'past', meaning: 'Illusion and uncertainty', does: 'Darker night. Matches light a smaller area.' },
    conjure: { name: 'The Magician', num: 'I', pos: 'present', meaning: 'Skill made real', does: 'Once: tap any piece to turn it into a Candle.', power: true },
    temperance: { name: 'Temperance', num: 'XIV', pos: 'present', meaning: 'Patience and balance', does: '+3 moves this level.' },
    wish: { name: 'The Star', num: 'XVII', pos: 'present', meaning: 'Hope and renewal', does: 'Once: swap any two neighbors, even without a match.', power: true },
    smite: { name: 'Justice', num: 'XI', pos: 'present', meaning: 'Cause and effect', does: 'Once: tap a spot to blast the 3×3 around it.', power: true },
    sunlight: { name: 'The Sun', num: 'XIX', pos: 'present', meaning: 'Clarity', does: 'Once: light the whole board for 3 turns.', power: true },
    movesLeft: { name: 'Eight of Pentacles', num: '8', pos: 'future', meaning: 'Diligence', does: 'Bonus if you finish with 5 or more moves left.' },
    makeCauldron: { name: 'Ace of Cups', num: 'A', pos: 'future', meaning: 'New feeling', does: 'Bonus if you make a Cauldron.' },
    combo: { name: 'Seven of Cups', num: '7', pos: 'future', meaning: 'Many choices', does: 'Bonus if you cast a spell combo (swap two specials together).' },
    collectCandles: { name: 'Page of Pentacles', num: 'P', pos: 'future', meaning: 'A student’s focus', does: 'Bonus if you collect 25 candle flames.' },
  };

  // ---------- state ----------
  const key = (r, c) => r * COLS + c;
  const inB = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
  const grid2 = (v) => Array.from({ length: ROWS }, () => Array(COLS).fill(v));
  const isColor = (p) => p && p.c >= 0 && p.c < 6;

  function newLevel(def, seed) {
    const R = rngNew(seed);
    const S = {
      def, R, rows: ROWS, cols: COLS, nextId: 1, ncolors: def.colors,
      mask: grid2(true), grid: grid2(null), blk: grid2(null), veil: grid2(false), lock: grid2(null), lit: grid2(0),
      gravity: def.gravity || 'down', dark: !!def.dark, lightR: 2,
      moves: def.moves, used: 0, score: 0, over: false, won: false,
      stats: { candle: 0, cauldron: 0, orb: 0, combos: 0, col: [0, 0, 0, 0, 0, 0], veils: 0, vines: 0, stones: 0, locks: 0, items: 0 },
      totals: { veil: 0, vine: 0, stone: 0, lock: 0 },
      beast: null, itemsSpawned: 0, spells: {}, power: null, powerUsed: false, bonusMet: false, litAll: 0,
    };
    const L = def.layout;
    const pend = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = L[r][c];
      if (ch === '#') { S.mask[r][c] = false; continue; }
      if (ch === 'v') { S.veil[r][c] = true; S.totals.veil++; }
      if (ch === 'V') { S.blk[r][c] = { t: 'vine', hp: 1 }; }
      if (ch === 'S') { S.blk[r][c] = { t: 'stone', hp: 2 }; S.totals.stone++; }
      if (ch === 's') { S.blk[r][c] = { t: 'stone', hp: 1 }; S.totals.stone++; }
      if (ch === 'L') pend.push([r, c]);
      if (ch === 'B') {
        S.beast = { hp: def.goal.hp || 12, max: def.goal.hp || 12, r, c };
        for (const [dr, dc] of [[0, 0], [0, 1], [1, 0], [1, 1]]) S.blk[r + dr][c + dc] = { t: 'beast', hp: 1 };
      }
    }
    for (let i = 0; i + 1 < pend.length; i += 2) {
      const [a, b] = [pend[i], pend[i + 1]];
      S.lock[a[0]][a[1]] = { p: b }; S.lock[b[0]][b[1]] = { p: a }; S.totals.lock++;
    }
    fillInitial(S);
    const sp = def.spread;
    if (sp) {
      S.power = sp.present;
      if (sp.present === 'temperance') S.moves += 3;
      if (sp.past === 'moon') S.lightR = 1;
      if (sp.past === 'sun') convertRandom(S, 2, () => (rnd(R) < 0.5 ? 'candleH' : 'candleV'));
      if (sp.past === 'wands') convertRandom(S, 1, () => 'cauldron');
      if (sp.past === 'tower') {
        let n = 0;
        for (let g = 0; g < 200 && n < 3; g++) {
          const r = 1 + ri(R, ROWS - 2), c = ri(R, COLS);
          if (!S.mask[r][c] || S.blk[r][c] || S.lock[r][c] || !isColor(S.grid[r][c])) continue;
          S.grid[r][c] = null; S.blk[r][c] = { t: 'stone', hp: 1 }; S.totals.stone++; n++;
        }
      }
    }
    if (S.def.goal.type === 'vine') S.totals.vine = countBlk(S, 'vine');
    if (S.dark) S.litAll = 2; // a first look before the lights go out
    ensureMoves(S);
    return S;
  }

  function countBlk(S, t) { let n = 0; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.blk[r][c] && S.blk[r][c].t === t) n++; return n; }
  function playable(S, r, c) { return inB(r, c) && S.mask[r][c] && !S.blk[r][c]; }
  function mk(S, c, sp) { return { id: S.nextId++, c, sp: sp || null }; }

  function convertRandom(S, n, spFn) {
    let k = 0;
    for (let g = 0; g < 200 && k < n; g++) {
      const r = ri(S.R, ROWS), c = ri(S.R, COLS); const p = S.grid[r][c];
      if (!isColor(p) || p.sp || S.lock[r][c]) continue;
      p.sp = spFn(); k++;
    }
  }

  function fillInitial(S) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!playable(S, r, c)) continue;
      let col, tries = 0;
      do {
        col = ri(S.R, S.ncolors); tries++;
      } while (tries < 30 && ((c >= 2 && sameC(S, r, c - 1, col) && sameC(S, r, c - 2, col)) || (r >= 2 && sameC(S, r - 1, c, col) && sameC(S, r - 2, c, col))));
      S.grid[r][c] = mk(S, col);
    }
    if (S.def.goal.type === 'item') { // first lantern near the top
      for (const [r, c] of [[1, 2], [3, 5]]) if (playable(S, r, c)) { S.grid[r][c] = mk(S, ITEM); S.itemsSpawned++; }
    }
  }
  function sameC(S, r, c, col) { const p = S.grid[r][c]; return p && p.c === col; }

  // ---------- matching ----------
  function findGroups(S) {
    const runs = [];
    const scan = (horiz) => {
      for (let a = 0; a < (horiz ? ROWS : COLS); a++) {
        let b = 0; const N = horiz ? COLS : ROWS;
        while (b < N) {
          const r0 = horiz ? a : b, c0 = horiz ? b : a; const p = S.grid[r0][c0];
          if (!isColor(p)) { b++; continue; }
          let e = b + 1;
          while (e < N) { const q = horiz ? S.grid[a][e] : S.grid[e][a]; if (!isColor(q) || q.c !== p.c) break; e++; }
          if (e - b >= 3) { const cells = []; for (let k = b; k < e; k++) cells.push(horiz ? [a, k] : [k, a]); runs.push({ horiz, cells, color: p.c }); }
          b = e;
        }
      }
    };
    scan(true); scan(false);
    // union runs that share cells
    const groups = [];
    const owner = new Map();
    for (const run of runs) {
      let g = null;
      for (const [r, c] of run.cells) { const o = owner.get(key(r, c)); if (o) { g = o; break; } }
      if (!g) { g = { runs: [], cells: new Map(), color: run.color }; groups.push(g); }
      g.runs.push(run);
      for (const [r, c] of run.cells) { g.cells.set(key(r, c), [r, c]); owner.set(key(r, c), g); }
    }
    for (const g of groups) {
      const h = g.runs.filter((x) => x.horiz), v = g.runs.filter((x) => !x.horiz);
      const maxLen = Math.max(...g.runs.map((x) => x.cells.length));
      if (maxLen >= 5) g.sp = 'orb';
      else if (h.length && v.length) g.sp = 'cauldron';
      else if (maxLen === 4) g.sp = h.length ? 'candleH' : 'candleV';
      else g.sp = null;
    }
    return groups;
  }

  function wouldMatch(S, r, c) {
    const p = S.grid[r][c]; if (!isColor(p)) return false;
    let n = 1; for (let k = c - 1; k >= 0 && sameC(S, r, k, p.c); k--) n++; for (let k = c + 1; k < COLS && sameC(S, r, k, p.c); k++) n++;
    if (n >= 3) return true;
    n = 1; for (let k = r - 1; k >= 0 && sameC(S, k, c, p.c); k--) n++; for (let k = r + 1; k < ROWS && sameC(S, k, c, p.c); k++) n++;
    return n >= 3;
  }

  function canSwap(S, a, b) {
    if (!inB(a[0], a[1]) || !inB(b[0], b[1])) return false;
    if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) !== 1) return false;
    for (const [r, c] of [a, b]) { if (!playable(S, r, c) || !S.grid[r][c] || S.lock[r][c]) return false; }
    return true;
  }
  function swapCells(S, a, b) { const t = S.grid[a[0]][a[1]]; S.grid[a[0]][a[1]] = S.grid[b[0]][b[1]]; S.grid[b[0]][b[1]] = t; }
  function comboKind(pa, pb) {
    const t = (p) => (!p.sp ? 'n' : p.sp === 'orb' ? 'o' : p.sp === 'cauldron' ? 'k' : 'c');
    const k = [t(pa), t(pb)].sort().join('');
    if (k === 'nn' || k === 'cn' || k === 'kn') return null;
    if (pa.c === ITEM || pb.c === ITEM) return k.includes('o') ? null : null;
    return { cc: 'cc', ck: 'ck', kk: 'kk', co: 'oc', ko: 'ok', oo: 'oo', no: 'on' }[k] || null;
  }
  function isValidMove(S, a, b) {
    if (!canSwap(S, a, b)) return false;
    const pa = S.grid[a[0]][a[1]], pb = S.grid[b[0]][b[1]];
    if (comboKind(pa, pb) && pa.c !== ITEM && pb.c !== ITEM) return true;
    swapCells(S, a, b); const ok = wouldMatch(S, a[0], a[1]) || wouldMatch(S, b[0], b[1]); swapCells(S, a, b);
    return ok;
  }
  function validMoves(S) {
    const out = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (isValidMove(S, [r, c], [r, c + 1])) out.push([[r, c], [r, c + 1]]);
      if (isValidMove(S, [r, c], [r + 1, c])) out.push([[r, c], [r + 1, c]]);
    }
    return out;
  }

  // ---------- snapshots for the UI ----------
  function snap(S, kind, extra) {
    const pieces = []; const blk = []; const veil = []; const lock = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const p = S.grid[r][c]; if (p) pieces.push({ id: p.id, c: p.c, sp: p.sp, r, col: c });
      const b = S.blk[r][c]; if (b) blk.push({ r, c, t: b.t, hp: b.hp });
      if (S.veil[r][c]) veil.push([r, c]);
      if (S.lock[r][c]) lock.push({ r, c, p: S.lock[r][c].p });
    }
    return Object.assign({ kind, pieces, blk, veil, lock, lit: S.dark ? litMap(S) : null, beast: S.beast ? Object.assign({}, S.beast) : null, score: S.score }, extra || {});
  }
  function litMap(S) {
    const m = S.lit.map((row) => row.map((v) => v > 0 || S.litAll > 0));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const p = S.grid[r][c];
      if (p && p.c === ITEM) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (inB(r + dr, c + dc)) m[r + dr][c + dc] = true;
    }
    return m;
  }

  // ---------- clearing ----------
  function areaCells(S, sp, r, c) {
    const out = [];
    if (sp === 'candleH' || sp === 'row') for (let k = 0; k < COLS; k++) out.push([r, k]);
    if (sp === 'candleV' || sp === 'col') for (let k = 0; k < ROWS; k++) out.push([k, c]);
    if (sp === 'cauldron' || sp === 'r1') for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (inB(r + dr, c + dc)) out.push([r + dr, c + dc]);
    if (sp === 'r2') for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (inB(r + dr, c + dc)) out.push([r + dr, c + dc]);
    return out;
  }
  function mostCommonColor(S) {
    const n = [0, 0, 0, 0, 0, 0];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const p = S.grid[r][c]; if (isColor(p)) n[p.c]++; }
    let best = 0; for (let i = 1; i < 6; i++) if (n[i] > n[best]) best = i; return best;
  }

  // One clear pass. groups: match groups; seeds: {cells:[], acts:[{sp,r,c,color}]} for combos/powers.
  function clearPass(S, groups, seeds, pref, cascade) {
    const toClear = new Map(); // key -> [r,c]
    const fx = [];
    const queue = [];
    const activated = new Set();
    const blkHits = new Map(); // key -> hits
    let beastHits = 0; let vineHit = false;
    const newSpecials = [];
    const hitBlock = (r, c, n) => {
      const b = inB(r, c) && S.blk[r][c]; if (!b) return false;
      if (b.t === 'beast') { beastHits += n; return true; }
      blkHits.set(key(r, c), Math.max(blkHits.get(key(r, c)) || 0, n)); return true;
    };
    const addCell = (r, c) => {
      if (!inB(r, c) || !S.mask[r][c]) return;
      if (S.blk[r][c]) return;
      const p = S.grid[r][c];
      if (!p && !S.veil[r][c]) return;
      if (p && p.c === ITEM) return;
      toClear.set(key(r, c), [r, c]);
      if (p && p.sp && !activated.has(p.id)) { activated.add(p.id); queue.push({ sp: p.sp === 'orb' ? 'orbAuto' : p.sp, r, c, color: p.c }); }
    };
    for (const g of groups) {

    () => `<span class="eyebrow rise">A tarot match-three · prototype</span><h1 class="title rise d1">Hexed</h1><p class="lead rise d2">Light the candles, read the cards, and brew your way through the Fool’s Journey.</p>`,
    () => `<span class="eyebrow rise">Every level is a card</span><div class="fan rise d1">${levelCard(0)}${levelCard(2)}${levelCard(6)}${levelCard(9)}</div><p class="lead rise d2">Walk the Major Arcana from the Fool to the Hermit.</p><p class="copy rise d3">Each card changes the board in a way that fits its meaning. The High Priestess hides things. The Empress grows vines. The Hermit puts out the lights.</p>`,
    () => `<span class="eyebrow rise">Match ingredients, cast spells</span><div class="legend rise d1">${[0, 1, 2, 3, 4, 5].map((c) => `<div>${A.piece(c)}<span>${A.PIECE_NAMES[c]}</span></div>`).join('')}</div><p class="copy rise d2">Line up 3 of a kind. Lines of 4 make Candles, L and T shapes make Cauldrons, and 5 in a row makes a Crystal Ball. Swap two spell pieces together for something bigger.</p>`,
    () => `<span class="eyebrow rise">Then the cards answer</span><div class="fan three rise d1">${A.tcard('XIX', 'The Sun', 'sun')}${A.tcard('XVI', 'The Tower', 'tower')}${A.tcard('XVII', 'The Star', 'star')}</div><p class="lead rise d2">Past, Present, Future.</p><p class="copy rise d3">From card V on, you draw a spread before each level. The Past bends the board, the Present grants a power, and the Future sets a bonus goal.</p>`,
  ];
  let sceneI = 0;
  function showIntro(i) {
    sceneI = i || 0; const s = $('#story'); s.hidden = false;
    const last = sceneI === SCENES.length - 1;
    s.innerHTML = `<div class="stars-bg"></div><div class="story-in">${SCENES[sceneI]()}
      <div class="dots">${SCENES.map((_, k) => `<span class="${k === sceneI ? 'on' : ''}"></span>`).join('')}</div>
      <div style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap"><button class="skip" data-act="skipintro" type="button">Skip</button><button class="btn primary" data-act="${last ? 'skipintro' : 'scene'}" type="button" data-s="next">${last ? 'Begin the Journey' : 'Next'}</button></div></div>`;
  }

  // ---------- menu, how, grimoire, feedback ----------
  function menuHTML() {
    const on = (b) => (b ? 'On' : 'Off');
    const inGame = $('#story').hidden && S && !S.over;
    return `<h2>Menu</h2><div class="menu">
      ${inGame ? '<button class="btn" data-act="hint" type="button">Show me a move <span>›</span></button>' : ''}
      <button class="btn" data-act="how" type="button">How to play <span>›</span></button>
      <button class="btn" data-act="grimoire" type="button">Grimoire (spells found) <span>›</span></button>
      <button class="btn" data-act="tCoach" type="button" aria-pressed="${prog.coach}">Sable coaches and hints <span>${on(prog.coach)}</span></button>
      <button class="btn" data-act="tAll" type="button" aria-pressed="${prog.all}">Unlock all cards (for testers) <span>${on(prog.all)}</span></button>
      <button class="btn" data-act="intro" type="button">Replay the intro <span>›</span></button>
      <button class="btn" data-act="feedback" type="button">Give feedback <span>›</span></button>
      ${inGame ? '<button class="btn" data-act="map" type="button">Leave this level <span>›</span></button>' : ''}
      <button class="btn" data-act="resetAsk" type="button">Reset my progress <span>›</span></button>
      <div id="resetBox"></div>
    </div><div class="acts"><button class="btn primary" data-act="close" type="button">Close</button></div>`;
  }
  function howHTML() {
    const row = (svg, t, d) => `<div class="spell"><span>${svg}</span><span><b>${t}</b><small>${d}</small></span></div>`;
    return `<h2>How to play</h2>
      <ol><li>Swipe a piece into a neighbor, or tap one and then the other. The swap has to line up 3 or more of a kind.</li>
      <li>Reach the card’s goal before you run out of moves. Leftover moves are worth 150 points each.</li>
      <li>Bigger matches leave a spell piece behind. Match it to cast it.</li></ol>
      <div class="spells">${row(A.piece(1, 'candleH'), 'Candle', 'Match 4 in a line. Burns its row or column.')}${row(A.piece(3, 'cauldron'), 'Cauldron', 'Match in an L or T. Boils over the 3×3 around it.')}${row(A.piece(0, 'orb'), 'Crystal Ball', 'Match 5 in a line. Swap it with any piece to clear all of that kind.')}</div>
      <p>Swap two spell pieces together to cast a combo. Check the Grimoire to see which ones you’ve found.</p>
      <p><b>Spreads (cards V to IX):</b> the Past card changes the board, the Present card is a one-time power you tap to use, and the Future card is a bonus goal worth 1,500.</p>
      <div class="acts"><button class="btn primary" data-act="close" type="button">Got it</button></div>`;
  }
  function grimoireHTML() {
    const icon = { candle: A.piece(1, 'candleV'), cauldron: A.piece(2, 'cauldron'), orb: A.piece(0, 'orb'), cc: A.piece(1, 'candleH'), ck: A.piece(4, 'cauldron'), kk: A.piece(5, 'cauldron'), oc: A.piece(3, 'orb'), ok: A.piece(2, 'orb'), oo: A.piece(5, 'orb') };
    const n = Object.keys(HX.SPELLS).filter((k) => prog.spells[k]).length;
    return `<span class="eyebrow">${n} of ${Object.keys(HX.SPELLS).length} found</span><h2>Grimoire</h2><div class="spells">${Object.entries(HX.SPELLS).map(([k, s]) => {
      const got = prog.spells[k];
      return `<div class="spell ${got ? '' : 'unknown'}"><span>${icon[k]}</span><span><b>${got ? esc(s.name) : 'Unknown spell'}</b><small>${esc(s.how)}</small></span></div>`;
    }).join('')}</div><div class="acts"><button class="btn primary" data-act="close" type="button">Close</button></div>`;
  }
  const FB = { q: {}, text: '', nm: '', saved: null };
  const FQ = [
    { id: 'm3', q: 'How often do you play Candy Crush-style games?', opts: ['Daily', 'Sometimes', 'Rarely', 'Never'] },
    { id: 'witchy', q: 'Tarot and witchy stuff is…', opts: ['Very me', 'A bit me', 'Neutral', 'Not my thing'] },
    { id: 'spread', q: 'The three-card spread before levels V to IX…', opts: ['Loved it', 'Fine', 'Confusing', 'Didn’t reach it'] },
    { id: 'fun', q: 'How fun was it, 1 to 5?', opts: ['1', '2', '3', '4', '5'] },
    { id: 'fav', q: 'Favorite card so far?', opts: HX.LEVELS.map((d) => d.card.replace('The ', '')) },
    { id: 'play', q: 'Would you play this?', opts: ['Yes', 'Maybe', 'No'] },
  ];
  function feedbackHTML() {
    const qs = FQ.map((f) => `<div class="field"><label>${esc(f.q)}</label><div class="choices">${f.opts.map((o) => `<button class="btn" type="button" data-fq="${f.id}" data-fv="${esc(o)}" aria-pressed="${FB.q[f.id] === o}">${esc(o)}</button>`).join('')}</div></div>`).join('');
    return `<h2>What did you think?</h2><p class="muted">Six quick taps and anything else you want to say. Your answers go to F.</p>${qs}
      <div class="field"><label for="fbText">What was confusing, or what would you change?</label><textarea id="fbText" rows="3">${esc(FB.text)}</textarea></div>
      <div class="field"><label for="fbName">Your name (optional)</label><input id="fbName" type="text" value="${esc(FB.nm)}"></div>
      ${FB.saved === true ? '<p style="color:var(--moss);font-weight:700">Saved. Thank you!</p>' : FB.saved === 'copy' ? `<p class="muted">This device couldn’t save it, so copy your answers and text them to F:</p><div class="copybox" id="fbCopy">${esc(feedbackText())}</div>` : ''}
      <div class="acts">${FB.saved === 'copy' ? '<button class="btn" data-act="fbcopy" type="button">Copy answers</button>' : ''}<button class="btn" data-act="close" type="button">Close</button>${FB.saved !== true ? '<button class="btn primary" data-act="fbsend" type="button">Send</button>' : ''}</div>`;
  }
  function feedbackText() {
    const lines = FQ.map((f) => `${f.q} ${FB.q[f.id] || '–'}`);
    lines.push(`Notes: ${FB.text || '–'}`); lines.push(`From: ${FB.nm || 'anonymous'} · stars ${HX.LEVELS.map((_, i) => prog.stars[i] || 0).join(',')}`);
    return 'Hexed feedback\n' + lines.join('\n');
  }
  async function sendFeedback() {
    FB.text = $('#fbText').value; FB.nm = $('#fbName').value;
    const body = { answers: Object.assign({}, FB.q), notes: FB.text, name: FB.nm, stars: HX.LEVELS.map((_, i) => prog.stars[i] || 0), spells: Object.keys(prog.spells), at: new Date().toISOString() };
    try {
      const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (!db) throw new Error('no db');
      await db.collection('feedback').add(body);
      FB.saved = true;
    } catch (e) { FB.saved = 'copy'; }
    sheet(feedbackHTML());
  }
  function selectCopy() { const el = $('#fbCopy'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

  // ---------- clicks ----------
  document.addEventListener('click', (ev) => {
    const bg = ev.target.classList && ev.target.classList.contains('veil-bg') ? ev.target : null;
    if (bg) { if (bg.dataset.close === '1') closeSheet(); return; }
    const b = ev.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (b.id === 'bMenu' || act === 'menu') return sheet(menuHTML());
    if (b.id === 'bMap') { if (S && !S.over && S.used > 0) return sheet(`<h2>Leave this card?</h2><p>Your moves on ${esc(S.def.card)} won’t be saved.</p><div class="acts"><button class="btn" data-act="close" type="button">Keep playing</button><button class="btn primary" data-act="map" type="button">Leave</button></div>`); return showMap(); }
    if (b.dataset.lv !== undefined) { const i = +b.dataset.lv; if (!(prog.all || i < prog.unlocked)) return; return openLevel(i); }
    if (b.dataset.fq) { FB.q[b.dataset.fq] = b.dataset.fv; FB.text = ($('#fbText') || {}).value || FB.text; FB.nm = ($('#fbName') || {}).value || FB.nm; const sc = $('.sheet').scrollTop; sheet(feedbackHTML()); $('.sheet').scrollTop = sc; return; }
    switch (act) {
      case 'close': return closeSheet();
      case 'scene': return showIntro(sceneI + 1);
      case 'skipintro': prog.seen = true; save(); return showMap();
      case 'draw': return drawSpread();
      case 'begin': return startLevel(LV);
      case 'retry': return startLevel(LV);
      case 'next': return openLevel(LV + 1);
      case 'map': closeSheet(); return showMap();
      case 'power': return powerTap();
      case 'how': return sheet(howHTML());
      case 'grimoire': return sheet(grimoireHTML());
      case 'feedback': FB.saved = FB.saved === true ? true : null; return sheet(feedbackHTML());
      case 'fbsend': return sendFeedback();
      case 'fbcopy': { const t = feedbackText(); try { navigator.clipboard.writeText(t).catch(selectCopy); } catch (e) { selectCopy(); } return; }
      case 'intro': closeSheet(); return showIntro(0);
      case 'hint': closeSheet(); return showHint(true);
      case 'tCoach': prog.coach = !prog.coach; save(); if (!prog.coach) clearHint(); return sheet(menuHTML());
      case 'tAll': prog.all = !prog.all; save(); sheet(menuHTML()); if (!$('#story').hidden) showMap(); return;
      case 'resetAsk': $('#resetBox').innerHTML = '<div class="confirm"><span>This clears your stars, unlocked cards and Grimoire on this device.</span><div class="acts"><button class="btn sm" data-act="resetNo" type="button">Keep them</button><button class="btn sm primary" data-act="resetYes" type="button">Reset</button></div></div>'; return;
      case 'resetNo': $('#resetBox').innerHTML = ''; return;
      case 'resetYes': prog = { unlocked: 1, stars: [], spells: {}, all: false, coach: true, seen: true }; save(); closeSheet(); return showMap();
    }
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('#sheet').innerHTML && $('.veil-bg').dataset.close === '1') closeSheet(); });

  // ---------- boot ----------
  // A board sits behind the map so the page never looks empty.
  S = HX.newLevel(HX.LEVELS[0], 7); buildStatic(); renderFrame(HX.snap(S, 'init')); hud(); coachSay(INTRO[0]);
  if (prog.seen) showMap(); else showIntro(0);
  window.HXUI = { startLevel, showMap, get S() { return S; } };
})();

</script>

</body></html>
