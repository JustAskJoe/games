<div class="app" id="app">
  <header class="top">
    <button class="btn icon ghost" id="bMap" type="button" aria-label="Back to the journey map">‹</button>
    <div class="t"><h1 id="lvTitle">Hexed</h1><span id="lvSub">A tarot match-three</span></div>
    <button class="btn icon ghost" id="bMenu" type="button" aria-label="Menu">☰</button>
  </header>
  <section class="hud" aria-live="polite">
    <div class="moves" id="moves"><b>0</b><span>moves</span></div>
    <div class="goal" id="goal"></div>
    <div class="score" id="score"><b>0</b><span>score</span></div>
  </section>
  <div class="board-wrap">
    <div class="board" id="board" aria-label="Game board" role="application">
      <div class="layer" id="lCells"></div>
      <div class="layer" id="lVeil"></div>
      <div class="layer" id="lBlk"></div>
      <div class="layer" id="lPieces"></div>
      <div class="layer" id="lLock"></div>
      <div class="layer" id="lDark"></div>
      <div class="layer fx" id="lFx"></div>
    </div>
  </div>
  <div class="coach" id="coach"></div>
  <div class="spread" id="spread"></div>
  <p class="foot">© 2026 F Lane d/b/a One Fifty Labs. All rights reserved. Prototype. Placeholder vector art, not final.</p>
</div>
<div class="owner" aria-hidden="true">© 2026 F Lane d/b/a One Fifty Labs · All rights reserved</div>
<div id="sheet"></div>
<div id="story" class="story" hidden></div>
