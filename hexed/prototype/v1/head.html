<meta charset="utf-8">
<title>Hexed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone-first single column — HUD, square board, Sable's coach line, the spread strip. One committed night look (a candlelit altar cloth), so no light theme. */
:root {
  --night: #15111E; --night-2: #1D1729; --cloth: #261D35; --cloth-2: #2E2440; --line: #3E3254;
  --fg: #EEE7F4; --muted: #A99CBC; --parchment: #ECE1C9; --parch-2: #DCCBA8; --parch-ink: #2A2131;
  --gold: #DDAA4F; --gold-hi: #F6D58C; --moss: #93BC8E; --rose: #DB8EA3; --warn: #E7956C;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --flavor: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--fg); height: 100%; }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(120% 70% at 50% -10%, #33264A 0%, transparent 60%), radial-gradient(80% 50% at 50% 110%, #2A1F2E 0%, transparent 70%), var(--night); }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 64px; display: flex; flex-direction: column; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--cloth); border-radius: 12px; min-height: 44px; padding: 8px 16px; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--gold); }
.btn:focus-visible, .cardtile:focus-visible, .spread button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.btn.primary { background: var(--gold); color: var(--parch-ink); border-color: var(--gold); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.icon { width: 44px; padding: 0; font-size: 20px; }
.btn[aria-pressed="true"] { border-color: var(--moss); color: var(--moss); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.eyebrow { font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; font-weight: 800; color: var(--gold); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }
.owner { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 80; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; color: rgba(238,231,244,.55); background: rgba(16,12,22,.7); padding: 3px 8px; border-radius: 999px; pointer-events: none; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.top .t { display: flex; flex-direction: column; min-width: 0; align-items: center; text-align: center; flex: 1; }
.top .t h1 { font-size: 22px; line-height: 1.1; }
.top .t span { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
.moves { background: var(--parchment); color: var(--parch-ink); border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 70px; box-shadow: 0 4px 0 #0c0912; }
.moves b { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.moves span { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 800; }
.moves.low b { color: #A3372E; }
.goal { background: var(--cloth); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.goal svg { width: 34px; height: 34px; flex: none; }
.goal .gt { display: flex; flex-direction: column; min-width: 0; }
.goal .gt b { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.goal .gt span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
.goal .bar i { display: block; height: 100%; background: var(--moss); transition: width .3s; }
.goal.done { border-color: var(--moss); }
.score { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; font-variant-numeric: tabular-nums; padding-right: 2px; }
.score b { font-size: 18px; }
.score span { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 800; }

/* ---------- board ---------- */
.board-wrap { position: relative; width: 100%; max-width: min(520px, calc(100vh - 290px)); min-width: 280px; margin: 0 auto; }
@media (max-width: 360px) { .board-wrap { min-width: 0; } }
.board { position: relative; width: 100%; aspect-ratio: 1 / 1; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 16px; background: var(--cloth); box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,.45); }
.board .layer { position: absolute; inset: 0; pointer-events: none; }
.cell { position: absolute; width: 12.5%; height: 12.5%; }
.cell.bg::before { content: ""; position: absolute; inset: 2px; border-radius: 10px; background: var(--cloth-2); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.cell.bg.alt::before { background: #2A2139; }
.cell.path::before { background: linear-gradient(180deg, rgba(221,170,79,.10), rgba(221,170,79,.28)); box-shadow: inset 0 0 0 1px rgba(221,170,79,.45); }
.veil { position: absolute; width: 12.5%; height: 12.5%; }
.veil::before { content: ""; position: absolute; inset: 3px; border-radius: 9px; background: repeating-linear-gradient(45deg, rgba(196,166,232,.28) 0 3px, transparent 3px 7px), repeating-linear-gradient(-45deg, rgba(196,166,232,.22) 0 3px, transparent 3px 7px), rgba(126,92,170,.35); box-shadow: inset 0 0 0 1.5px rgba(205,180,240,.55); }
.blk { position: absolute; width: 12.5%; height: 12.5%; }
.blk svg { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }
.beast { position: absolute; width: 25%; height: 25%; transition: transform .2s; }
.beast svg { width: 100%; height: 100%; }
.beast .hp { position: absolute; left: 10%; right: 10%; bottom: -2px; height: 7px; border-radius: 4px; background: #120d18; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.beast .hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width .3s; }
.beast.hit { animation: beastHit .35s; }
@keyframes beastHit { 30% { transform: translateX(-4px) scale(.96); } 60% { transform: translateX(4px); } }
.piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transition: transform .22s cubic-bezier(.3,.7,.3,1), opacity .2s; will-change: transform; }
.piece .in { position: absolute; inset: 6%; transition: transform .2s ease, opacity .2s ease; }
.piece svg { width: 100%; height: 100%; display: block; overflow: visible; }
.piece.sel .in { transform: scale(1.12); filter: drop-shadow(0 0 6px var(--gold-hi)); }
.piece.gone .in { transform: scale(0) rotate(40deg); opacity: 0; }
.piece.born .in { animation: born .32s ease-out; }
@keyframes born { from { transform: scale(.2); } 70% { transform: scale(1.18); } to { transform: scale(1); } }
.piece.hint .in { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { transform: scale(1.14); filter: drop-shadow(0 0 7px var(--gold-hi)); } }
.piece.nudge .in { animation: nudge 1s ease-in-out infinite; }
.lock { position: absolute; width: 12.5%; height: 12.5%; }
.lock svg { width: 100%; height: 100%; }
.dark { position: absolute; width: 12.5%; height: 12.5%; background: #0B0812; opacity: .93; transition: opacity .45s; }
.dark.lit { opacity: 0; }
.fx .beam { position: absolute; background: linear-gradient(90deg, transparent, rgba(246,213,140,.9), transparent); animation: beam .45s ease-out forwards; border-radius: 99px; }
.fx .beam.v { background: linear-gradient(180deg, transparent, rgba(246,213,140,.9), transparent); }
@keyframes beam { from { opacity: 1; transform: scale(1, .3); } to { opacity: 0; transform: scale(1, 1.4); } }
.fx .beam.v { animation-name: beamv; }
@keyframes beamv { from { opacity: 1; transform: scale(.3, 1); } to { opacity: 0; transform: scale(1.4, 1); } }
.fx .ring { position: absolute; border-radius: 50%; border: 3px solid var(--gold-hi); animation: ring .5s ease-out forwards; }
@keyframes ring { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(1.05); } }
.fx .spark { position: absolute; width: 12.5%; height: 12.5%; display: grid; place-items: center; color: var(--gold-hi); font-family: var(--display); font-size: clamp(14px, 4vw, 22px); animation: up .9s ease-out forwards; text-shadow: 0 2px 8px #000; }
@keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60%); } }
.spellname { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--display); font-size: clamp(26px, 8vw, 42px); color: var(--gold-hi); text-shadow: 0 3px 18px rgba(0,0,0,.9), 0 0 24px rgba(221,170,79,.6); animation: spell 1.3s ease-out forwards; pointer-events: none; z-index: 6; }
@keyframes spell { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1.06); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
.board.targeting { box-shadow: inset 0 0 0 2px var(--gold-hi), 0 0 0 4px rgba(221,170,79,.25), 0 18px 40px rgba(0,0,0,.45); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- coach + spread strip ---------- */
.coach { display: flex; gap: 12px; align-items: flex-start; background: var(--night-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-height: 64px; }
.coach .cat { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--cloth); box-shadow: 0 0 0 2px var(--gold); display: grid; place-items: center; }
.coach .cat svg { width: 36px; height: 36px; }
.coach p { margin: 0; font-size: 15.5px; }
.coach p b.who { color: var(--gold); }
.spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.spread .sc { background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; cursor: default; }
.spread .sc .pos { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.spread .sc b { font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 1.15; }
.spread .sc small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.spread .sc.power { border-color: var(--gold); cursor: pointer; }
.spread .sc.power .use { margin-top: 4px; align-self: flex-start; font-size: 12px; font-weight: 800; color: var(--parch-ink); background: var(--gold); border-radius: 999px; padding: 2px 9px; }
.spread .sc.used { opacity: .5; }
.spread .sc.met { border-color: var(--moss); }

/* ---------- tarot cards ---------- */
.tcard { --w: 150px; width: var(--w); aspect-ratio: 7 / 12; flex: none; border-radius: calc(var(--w) * .07); background: var(--parchment); color: var(--parch-ink); padding: calc(var(--w) * .06); display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 0 0 calc(var(--w) * .025) var(--parch-2); position: relative; }
.tcard .frame { flex: 1; width: 100%; border: 1.5px solid #8C7A57; border-radius: calc(var(--w) * .04); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(var(--w) * .05) calc(var(--w) * .04); background: radial-gradient(circle at 50% 42%, #F6EEDB 0%, #E7D9BB 70%); }
.tcard .rn { font-family: var(--display); font-size: calc(var(--w) * .12); line-height: 1; }
.tcard .em { width: 74%; aspect-ratio: 1; }
.tcard .em svg { width: 100%; height: 100%; }
.tcard .nm { font-family: var(--display); font-size: calc(var(--w) * .095); line-height: 1.05; text-align: center; text-wrap: balance; }
.tcard.back { background: #2A1F3C; box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 0 0 calc(var(--w) * .025) var(--gold); }
.tcard.back .frame { background: repeating-conic-gradient(from 0deg at 50% 50%, #34284A 0deg 15deg, #2A1F3C 15deg 30deg); border-color: var(--gold); justify-content: center; }
.flip { perspective: 900px; }
.flip .inner { position: relative; transition: transform .7s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.flip .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .face.front { position: absolute; inset: 0; transform: rotateY(180deg); }

/* ---------- screens (intro, map) ---------- */
.story { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: radial-gradient(90% 60% at 50% 0%, #3A2A52 0%, transparent 65%), radial-gradient(70% 40% at 50% 100%, #3A2430 0%, transparent 70%), var(--night); }
.story-in { min-height: 100%; max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; text-align: center; }
.stars-bg { position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 78% 12%, #fff9 50%, transparent 51%), radial-gradient(1.5px 1.5px at 64% 34%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 30% 62%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 88% 70%, #fff8 50%, transparent 51%), radial-gradient(1.5px 1.5px at 46% 86%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 8% 80%, #fff6 50%, transparent 51%); animation: twinkle 6s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .55; } }
.title { font-family: var(--display); font-size: clamp(72px, 22vw, 132px); line-height: .9; margin: 0; background: linear-gradient(180deg, #FFF0C8 0%, var(--gold) 60%, #A87A2E 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 22px rgba(221,170,79,.35)); }
.story .lead { font-family: var(--flavor); font-style: italic; font-size: clamp(18px, 4.6vw, 22px); color: #E3D8EC; max-width: 30ch; margin: 0; }
.story .copy { max-width: 36ch; margin: 0; color: var(--muted); font-size: 16px; }
.fan { display: flex; justify-content: center; margin: 8px 0 4px; height: 190px; }
.fan .tcard { --w: 104px; margin: 0 -26px; transform-origin: 50% 120%; }
.fan .tcard:nth-child(1) { transform: rotate(-14deg) translateY(10px); }
.fan .tcard:nth-child(2) { transform: rotate(-4deg); z-index: 1; }
.fan .tcard:nth-child(3) { transform: rotate(6deg); z-index: 2; }
.fan .tcard:nth-child(4) { transform: rotate(15deg) translateY(12px); }
.fan.three .tcard { margin: 0 -12px; }
.rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
.rise.d1 { animation-delay: .2s; } .rise.d2 { animation-delay: .45s; } .rise.d3 { animation-delay: .7s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
.dots span.on { background: var(--gold); }
.story .skip { background: transparent; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 10px; min-height: 44px; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; width: 100%; max-width: 380px; }
.legend div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.legend svg { width: 44px; height: 44px; }

.map-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.map-head h2 { font-size: 28px; }
.journey { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cardtile { background: var(--night-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; min-width: 0; position: relative; }
.cardtile:hover { border-color: var(--gold); }
.cardtile .tcard { --w: 54px; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.cardtile .tcard .nm { display: none; }
.cardtile .ti { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cardtile .ti b { font-family: var(--display); font-weight: 400; font-size: 17px; line-height: 1.1; }
.cardtile .ti small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.cardtile .st { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
.cardtile .st i { color: var(--line); font-style: normal; }
.cardtile.locked { opacity: .5; cursor: not-allowed; }
.cardtile.locked .tcard { filter: grayscale(.8); }
.cardtile.next { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(221,170,79,.18); }
.cardtile .tag { position: absolute; top: -9px; right: 10px; background: var(--gold); color: var(--parch-ink); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; }
.map-acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- sheets ---------- */
.veil-bg { position: fixed; inset: 0; background: rgba(10,7,15,.78); display: grid; place-items: end center; z-index: 50; }
.sheet { background: var(--night-2); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); width: min(560px, 100%); max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; animation: sheet .3s ease-out; }
@keyframes sheet { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: 28px; }
.sheet p, .sheet ol, .sheet ul { margin: 0; }
.sheet ol, .sheet ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.intro-card { display: flex; gap: 16px; align-items: center; }
.intro-card .tcard { --w: 118px; }
.intro-card .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.intro-card .theme { font-family: var(--flavor); font-style: italic; color: var(--muted); }
.twist { background: var(--cloth); border-radius: 12px; padding: 10px 12px; font-size: 15.5px; }
.goalline { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.goalline svg { width: 30px; height: 30px; flex: none; }
.drawn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.drawn .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.drawn .slot .pos { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 800; color: var(--gold); }
.drawn .tcard { --w: min(96px, 26vw); }
.drawn .does { font-size: 12.5px; color: var(--muted); line-height: 1.3; min-height: 3.9em; opacity: 0; transition: opacity .4s .3s; }
.drawn .flip.on + .does { opacity: 1; }
.endstars { display: flex; gap: 10px; justify-content: center; font-size: 46px; color: var(--line); }
.endstars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(221,170,79,.6); animation: born .5s ease-out both; }
.endstars span:nth-child(2) { animation-delay: .25s; } .endstars span:nth-child(3) { animation-delay: .5s; }
.spells { display: flex; flex-direction: column; gap: 8px; }
.spell { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--cloth); }
.spell svg { width: 44px; height: 44px; }
.spell b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.spell small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.spell.unknown { opacity: .55; }
.spell.unknown b { color: var(--muted); }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu .btn { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 15px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
