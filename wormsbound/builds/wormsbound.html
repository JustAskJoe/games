<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wormsbound · Prototype 1</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Wormsbound Prototype 1: local hotseat. © 2026 justaskjoe. All rights reserved.
   A 1280×720 stage that scales to fit (desktop landscape first; a phone loads it letterboxed).
   Look from the brief: punchy, readable, explosive. Warm sunset oranges with teal accents and bright effects. */
:root {
  --ink: #1E1A2B; --ink-2: #3A3150; --cream: #FFF3E0; --cream-2: #F3DFC3; --muted: #9C8AA8;
  --sun: #FF8A3D; --sun-2: #FFB86B; --dusk: #6B3A5B; --gold: #FFD34D; --red: #FF4D5E;
  --ember: #FF7A30; --ember-2: #C9481A; --tide: #22C3B5; --tide-2: #0E7C7B;
  --display: 'Lilita One', 'Arial Black', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #120F1C; color: var(--cream); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
#wrap { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%; overflow: hidden; border-radius: 6px; background: #2A2140; touch-action: none; user-select: none; -webkit-user-select: none; }
#map { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; cursor: crosshair; }
.owner { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(6px, env(safe-area-inset-bottom, 0px)); z-index: 90; font-size: 11px; font-weight: 800; color: rgba(255,243,224,.55); pointer-events: none; }
.hint-rotate { display: none; position: fixed; left: 0; right: 0; top: max(8px, env(safe-area-inset-top, 0px)); text-align: center; font-size: 13px; font-weight: 800; color: var(--sun-2); z-index: 95; pointer-events: none; padding: 0 16px; }
@media (orientation: portrait) and (max-width: 700px) { .hint-rotate { display: block; } }

/* ---------- HUD (inside the stage, in stage pixels) ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; pointer-events: none; z-index: 5; }
.team { display: flex; align-items: center; gap: 10px; min-width: 300px; }
.team.r { flex-direction: row-reverse; text-align: right; }
.team .nm { font-family: var(--display); font-size: 26px; line-height: 1; letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.team .bar { width: 200px; height: 14px; border-radius: 99px; background: rgba(0,0,0,.4); border: 2px solid var(--ink); overflow: hidden; }
.team .bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
.team.ember .nm { color: var(--ember); } .team.ember .bar i { background: linear-gradient(90deg, var(--ember-2), var(--ember)); }
.team.tide .nm { color: var(--tide); } .team.tide .bar i { background: linear-gradient(90deg, var(--tide-2), var(--tide)); }
.pips { display: flex; gap: 5px; } .pips b { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(0,0,0,.35); } .pips b.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.mid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.timer { font-family: var(--display); font-size: 34px; line-height: 1; min-width: 64px; text-align: center; padding: 4px 12px; border-radius: 14px; background: var(--ink); border: 3px solid var(--cream); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.timer.low { color: var(--red); border-color: var(--red); }
.timer.off { opacity: .5; }
.wind { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,.4); }

.sidegrp { display: flex; gap: 10px; } .sidegrp.r { flex-direction: row-reverse; }
.team.plum .nm { color: #B57BFF; } .team.plum .bar i { background: linear-gradient(90deg, #7A4BC9, #B57BFF); }
.team.sun .nm { color: #FFD34D; } .team.sun .bar i { background: linear-gradient(90deg, #C99A1A, #FFD34D); }
.team .cn { font-size: 17px; opacity: .85; }
.team.sm { min-width: 0; gap: 6px; } .team.sm .nm { font-size: 19px; } .team.sm .cn { font-size: 13px; } .team.sm .bar { width: 150px; height: 11px; }
.team.sm .pips b { width: 11px; height: 11px; }
.team.out { opacity: .35; filter: grayscale(.6); }
.team.cur .bar { box-shadow: 0 0 0 2px var(--gold), 0 0 12px var(--gold); }
.order { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 11px; letter-spacing: 1px; color: var(--cream-2); min-height: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.order b { min-width: 22px; padding: 1px 5px; border-radius: 99px; border: 2px solid var(--ink); color: var(--ink); text-shadow: none; text-align: center; font-size: 11px; }
.cputag { font-family: var(--display); font-size: 22px; color: var(--tc); background: rgba(30,26,43,.85); border: 3px solid var(--tc); border-radius: 16px; padding: 10px 20px; }
.card .row.lv { flex-wrap: nowrap; align-items: stretch; }
.btn.lvl { position: relative; flex-direction: column; flex: 1; min-width: 0; width: 180px; min-height: 110px; padding: 12px 14px; font-size: 28px; }
.btn.lvl small { font-family: var(--body); font-weight: 800; font-size: 13px; line-height: 1.25; margin-top: 4px; }
.btn.lvl .num { position: absolute; left: 8px; top: 6px; font-size: 13px; opacity: .6; }
/* ---------- control bar ---------- */
.ctl { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 90px 10px 230px; z-index: 5; pointer-events: none; }
.ctl > * { pointer-events: auto; }
.btn { border: 3px solid var(--ink); background: var(--cream); color: var(--ink); border-radius: 16px; min-height: 52px; min-width: 52px; padding: 6px 16px; font-family: var(--display); font-size: 20px; letter-spacing: .4px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.fire { background: var(--sun); min-width: 120px; }
.btn.teal { background: var(--tide); }
.btn.gold { background: var(--gold); }
.btn.ghost { background: rgba(30,26,43,.75); color: var(--cream); border-color: var(--cream); box-shadow: 0 5px 0 rgba(0,0,0,.5); }
.btn.sm { min-height: 40px; font-size: 16px; padding: 4px 12px; }
.btn[aria-pressed="true"] { background: var(--gold); box-shadow: 0 5px 0 var(--ink), 0 0 16px var(--gold); }
.wpn { flex-direction: column; gap: 0; line-height: 1; min-width: 104px; }
.btn.ss { background: linear-gradient(180deg, #FFE27A, #FF8A3D); box-shadow: 0 5px 0 var(--ink), 0 0 22px rgba(255,211,77,.8); animation: ssglow 1.2s ease-in-out infinite alternate; }
.btn.ss.dim { animation: none; opacity: .8; box-shadow: 0 5px 0 var(--ink); }
@keyframes ssglow { from { box-shadow: 0 5px 0 var(--ink), 0 0 10px rgba(255,211,77,.5); } to { box-shadow: 0 5px 0 var(--ink), 0 0 26px rgba(255,211,77,1); } }
.ssm { display: flex; align-items: center; gap: 3px; font-weight: 900; font-size: 11px; letter-spacing: 1px; color: var(--muted); }
.ssm b { width: 10px; height: 10px; border-radius: 3px; border: 2px solid var(--ink); background: rgba(0,0,0,.35); }
.ssm b.f { background: var(--sun); } .ssm.on { color: var(--gold); } .ssm.on b { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.char .sh.ss { background: linear-gradient(90deg, rgba(255,211,77,.18), var(--ink-2)); } .char .sh.ss b { color: var(--gold); }
.wpn small { font-family: var(--body); font-weight: 900; font-size: 12px; opacity: .75; }
.steps { font-weight: 900; font-size: 14px; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,.5); min-width: 70px; text-align: center; }
.menu-btn { position: absolute; right: 16px; bottom: 14px; z-index: 6; }
.menu-btn[hidden] { display: none; }

/* ---------- coach line, banners ---------- */
.coach { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); max-width: 760px; text-align: center; background: rgba(30,26,43,.82); border: 2px solid rgba(255,243,224,.35); border-radius: 14px; padding: 8px 16px; font-weight: 800; font-size: 16px; z-index: 5; pointer-events: none; }
.coach:empty { display: none; }
.coach b { color: var(--gold); }
.banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 64px; letter-spacing: 1px; text-align: center; white-space: nowrap; text-shadow: 0 6px 0 rgba(0,0,0,.4), 0 0 30px rgba(255,138,61,.5); z-index: 7; pointer-events: none; animation: pop 1.5s ease both; }
.banner small { display: block; font-family: var(--body); font-weight: 900; font-size: 22px; letter-spacing: 0; color: var(--cream); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }

/* ---------- full-stage screens (title, round end, menu, feedback) ---------- */
.screen { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(255,138,61,.25), rgba(18,15,28,.88) 70%); }
.screen.clear { background: rgba(18,15,28,.6); }
.card { width: 640px; max-width: 92%; background: var(--ink); border: 4px solid var(--cream); border-radius: 26px; padding: 28px 34px; box-shadow: 0 10px 0 rgba(0,0,0,.45); text-align: center; }
.card h1 { font-family: var(--display); font-size: 84px; margin: 0; line-height: .95; letter-spacing: 1px; color: var(--sun); text-shadow: 0 6px 0 var(--dusk); }
.card h2 { font-family: var(--display); font-size: 44px; margin: 0 0 6px; letter-spacing: .5px; }
.card p { font-size: 18px; font-weight: 700; margin: 10px 0; color: var(--cream-2); }
.card .tag { font-weight: 900; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; color: var(--tide); }
.card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.how { text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin: 16px 0 4px; }
.how div { background: var(--ink-2); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 15px; }
.how b { display: block; font-family: var(--display); font-size: 20px; font-weight: 400; color: var(--gold); letter-spacing: .3px; }
.keys { font-size: 13px; color: var(--muted); font-weight: 800; margin-top: 12px; }
.score { font-family: var(--display); font-size: 56px; margin: 6px 0; }
.score .e { color: var(--ember); } .score .t { color: var(--tide); }
.fq { text-align: left; margin: 12px 0; }
.fq label { display: block; font-weight: 900; margin-bottom: 6px; }
.fq .choices { display: flex; gap: 8px; flex-wrap: wrap; }
.fq textarea, .fq input { width: 100%; border-radius: 12px; border: 2px solid var(--muted); background: var(--ink-2); color: var(--cream); padding: 8px 10px; font: inherit; font-weight: 700; }
.fq textarea { min-height: 64px; resize: vertical; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ink-2); font-weight: 800; text-align: left; }
#screen:not(:empty) ~ .foot { display: none; }
.foot { position: absolute; left: 18px; top: 80px; font-size: 11px; font-weight: 800; color: rgba(255,243,224,.45); z-index: 4; pointer-events: none; }
/* ---------- character select ---------- */
.pick { width: 1230px; text-align: center; }
.pick h2 { font-family: var(--display); font-size: 46px; margin: 2px 0 0; letter-spacing: .5px; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.pick .tag { font-weight: 900; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; color: var(--sun-2); }
.pick .sub { margin: 4px 0 12px; font-weight: 800; color: var(--cream-2); }
.pick .row { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 12px; }
.chars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.char { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: left; background: var(--ink); color: var(--cream); border: 3px solid var(--ink-2); border-radius: 18px; padding: 8px 10px 10px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.45); font-family: var(--body); font-size: 12.5px; line-height: 1.3; }
.char:hover, .char.cur { border-color: var(--tc); box-shadow: 0 6px 0 rgba(0,0,0,.45), 0 0 22px color-mix(in srgb, var(--tc) 55%, transparent); transform: translateY(-4px); }
.char:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
.char img { width: 100%; height: 92px; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink-2); }
.char .num { position: absolute; left: 14px; top: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 2px solid var(--cream); font-family: var(--display); font-size: 14px; display: grid; place-items: center; }
.char .cn { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; color: var(--tc); margin-top: 2px; }
.char .role { font-weight: 900; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.sb { display: grid; grid-template-columns: 62px 1fr 52px; align-items: center; gap: 6px; font-weight: 800; font-size: 11px; }
.sb i { height: 8px; border-radius: 99px; background: var(--ink-2); overflow: hidden; } .sb i b { display: block; height: 100%; background: var(--tc); border-radius: 99px; }
.sb em { font-style: normal; text-align: right; color: var(--cream-2); }
.char .bl { color: var(--cream-2); font-weight: 700; margin: 2px 0 1px; min-height: 44px; font-size: 12px; }
.char .sh { background: var(--ink-2); border-radius: 10px; padding: 5px 7px; font-weight: 700; }
.char .sh b { color: var(--gold); } .char .sh.two b { color: var(--tc); } .char .sh em { font-style: normal; color: var(--muted); font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .banner, .btn.ss { animation: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="map" width="1280" height="720" aria-label="The battlefield"></canvas>
    <div class="hud" id="hud"></div>
    <div class="coach" id="coach" aria-live="polite"></div>
    <div class="ctl" id="ctl"></div>
    <button class="btn ghost sm menu-btn" id="bMenu" type="button" data-act="menu" aria-label="Menu">☰</button>
    <div id="bannerHost"></div>
    <div id="screen"></div>
    <p class="foot">Wormsbound (working title) · Prototype 1 · placeholder art drawn in code, not final</p>
  </div>
</div>
<div class="hint-rotate">Best on a computer, or turn your phone sideways.</div>
<div class="owner" aria-hidden="true">© 2026 justaskjoe. All rights reserved.</div>
<script>
/* Wormsbound (working title) · Prototype 1 engine.
   © 2026 justaskjoe. All rights reserved.

   Pure game logic, no DOM. Runs in the browser as window.WB and in node (sim.js, test.js).
   - Seeded RNG whose state lives in G._s, so G is plain JSON (save = JSON.stringify(G)).
   - Every player input is an intent through act(G, intent). The UI, the bots and (later) online play all use it,
     so seed + intent log replays a match exactly. hash(G) is a checksum for spotting drift.
   - Fixed-step physics at 60 ticks a second while anything is flying or falling (phase 'flight').

   Each team picks one of five characters (CHARS) before the match. A character sets its units' health, armour,
   walking and climbing, and its shots: Shot 1 (unlimited), Shot 2 (its ability, 2 a match) and its SS (Special
   Shot): a big ultimate that charges one notch per turn of yours and is ready every SS_CHARGE turns. Every
   character also carries the Live dud. The idea of characters with their own shots comes from GunBound;
   the characters, names and shots here are our own.

   The map is a grid of terrain cells (1 = ground). Units, shells and duds move in cell units, y pointing down.
   Turn flow: aim (move, pick a shot, fire or lob a live dud, or pass) → flight (step() until everything
   settles) → live duds tick down one → the next turn, with new wind. Last team standing wins.

   Turn delay (GunBound's idea): there is no fixed back-and-forth. Every unit has a delay; whatever it does on its
   turn adds to it (each shot has its own cost, walking adds a little per step, passing isn't free), and the next
   turn always goes to the living unit with the lowest delay. Light shots get you back sooner, heavy ones later. */
(function (root) {
  'use strict';

  // ---------- tuning (everything a balance pass might touch lives here) ----------
  const TICK = 1 / 60;          // seconds per physics tick
  const COLS = 160, ROWS = 90;  // terrain grid, in cells (8 px each on a 1280×720 stage)
  const WATER0 = 82;            // water surface row at the start; below it you drown
  const GRAV = 30;              // cells / s²
  const VMAX = 60;              // launch speed at full power, cells / s
  const WIND_MAX = 7;           // strongest wind push, cells / s² sideways
  const UNIT_R = 1.5;           // unit body radius, cells
  const UNITS_PER_TEAM = 1;     // default side size: 1v1 and the 4-way free-for-all both use one unit a side
  const HP = 100;               // a "standard" unit; characters scale from it
  const MOVE_STEPS = 14;        // default steps a turn (characters override)
  const CLIMB = 2;              // default highest ledge a step can climb
  const SAFE_FALL = 22;         // landing speed (cells/s) before fall damage
  const FALL_DMG = 2.2;         // hp per cell/s over SAFE_FALL
  const KNOCK = 26;             // knockback speed at the blast centre
  const LOB_RANGE = 5;          // how close a unit must be to pick up a live dud
  const LOB_POWER = 0.65;       // a thrown dud tops out below a full-power shot
  const SUDDEN_ROUNDS = 12;     // after this many rounds (a round = one turn per side) the water rises
  const SUDDEN_RISE = 2;        // rows per turn
  const MAX_ROUNDS = 40;        // hard stop (the rising water should end it well before this)
  const suddenTurn = (G) => SUDDEN_ROUNDS * G.teams, maxTurns = (G) => MAX_ROUNDS * G.teams;
  const DMG_SPREAD = 1.6;       // damage falls off to 0 at r × 1.6
  const SS_CHARGE = 4;          // the SS is ready on your 4th turn, then every 4th turn after you use it
  // Turn delay: what each action adds to the acting unit's delay (shots carry their own `delay`).
  const DELAY = { move: 12, pass: 520, lob: 620, dud: 720 };
  // Health scale by format: characters' hp numbers are for a crew of two; one unit a side needs more to last.
  const HP_MUL = { duel: 2.6, ffa: 1.8, crew: 1 };
  const START_GAP = 10;         // starting delays alternate teams 0, 10, 20, 30 so the first round goes A B A B

  // The Live dud: every character has 2. Lands without exploding, ticks down 3 turns, anyone near can lob it.
  const DUD = { name: 'Live dud', ammo: 2, r: 6, dmg: 60, fuse: 3, delay: DELAY.dud, desc: 'Lands without exploding and ticks for 3 turns. Anyone close can lob it on.' };

  // Shot fields: r crater, dmg centre damage, wind (× wind push), speed (× launch speed), knock (× knockback),
  // bounce (bounces off the ground first), drill (cells it tunnels through), strike (lightning: {w, dmg}),
  // double (a second shot follows), ammo (-1 = unlimited), delay (turn delay it adds: heavier = your next turn later).
  // SS-only fields: rain (a fan of darts), storm (three lightning strikes), quake (hits every enemy on the ground),
  // tornado (flings everyone within reach).
  // Numbers tuned Nov 2, 2026 (1v1, one unit a side, with SS and turn delay) so every character wins 40-60% of
  // smart-bot matches across the roster (sim.js). Health here is the base; HP_MUL scales it by format.
  const CHARS = {
    brick: { name: 'Brick', role: 'Tank', hp: 110, armor: 0.88, steps: 10, climb: 2,
      blurb: 'Big, tough and slow. Takes 12% less damage. His heavy shots barely feel the wind.',
      shot1: { name: 'Slug', ammo: -1, delay: 680, r: 3.5, dmg: 40, wind: 0.45, desc: 'A heavy shell. Wind hardly moves it.' },
      shot2: { name: 'Wrecking Ball', ammo: 2, delay: 840, r: 5, dmg: 56, wind: 0.45, bounce: 1, desc: 'Bounces once, then a big blast.' },
      ss: { name: 'Meteor Slam', delay: 1040, r: 6, dmg: 56, wind: 0.3, speed: 0.95, desc: 'A huge, heavy shell: the biggest crater in the game.' } },
    zip: { name: 'Zip', role: 'Scout', hp: 105, armor: 1, steps: 22, climb: 3,
      blurb: 'Quick on her feet. Walks twice as far as most and climbs higher ledges.',
      shot1: { name: 'Dart', ammo: -1, delay: 560, r: 3, dmg: 46, speed: 1.15, wind: 0.8, desc: 'Fast and flat, with a small blast.' },
      shot2: { name: 'Double Tap', ammo: 2, delay: 740, r: 3, dmg: 38, speed: 1.15, wind: 0.8, double: true, desc: 'Two darts, one right after the other.' },
      ss: { name: 'Bullet Rain', delay: 960, r: 3.2, dmg: 36, speed: 1.15, wind: 0.8, rain: { n: 5, spread: 4 }, desc: 'Five darts fanned out in a quick burst.' } },
    volt: { name: 'Volt', role: 'All-rounder', hp: 100, armor: 1, steps: 14, climb: 2,
      blurb: 'Steady and simple. Calls lightning down on anyone hiding under cover.',
      shot1: { name: 'Arc Ball', ammo: -1, delay: 600, r: 3.2, dmg: 46, desc: 'A plain, reliable shell.' },
      shot2: { name: 'Thunderstrike', ammo: 2, delay: 800, r: 3, dmg: 26, strike: { w: 2.2, dmg: 34 }, desc: 'Where it lands, lightning hits everyone close by, cover or not.' },
      ss: { name: 'Storm Call', delay: 1000, r: 3, dmg: 24, storm: { gap: 7, w: 2.4, dmg: 42 }, desc: 'Three lightning bolts: where it lands and 7 cells to each side.' } },
    digger: { name: 'Digger', role: 'Miner', hp: 110, armor: 0.95, steps: 12, climb: 2,
      blurb: 'Sturdy. Can tunnel straight through hills to reach someone dug in.',

    thunk: () => { tone(160, 70, 0.12, 0.35, 'square'); },
    splash: () => noise(0.4, 3000, 400, 0.18),
    click: () => tone(900, 700, 0.04, 0.08, 'square'),
    tick: () => tone(1400, 1300, 0.05, 0.08, 'square'),
    ko: () => { noise(0.9, 1600, 500, 0.12); tone(520, 260, 0.35, 0.18, 'triangle'); },
    win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.22, 0.18, 'triangle'), i * 120)); },
  };

  // ---------- background: sunset sky, sun, two parallax ridges (baked once per round) ----------
  function bakeBackground(seed) {
    let s = seed >>> 0; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    const g = bctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2B1E45'); g.addColorStop(0.42, '#7A3B5E'); g.addColorStop(0.7, '#FF8A3D'); g.addColorStop(1, '#FFC37A');
    bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
    const sx = 260 + r() * 760, sy = 330 + r() * 60;
    const sg = bctx.createRadialGradient(sx, sy, 10, sx, sy, 170); sg.addColorStop(0, 'rgba(255,240,200,1)'); sg.addColorStop(0.25, 'rgba(255,214,140,.9)'); sg.addColorStop(1, 'rgba(255,170,90,0)');

    ridge(540, 45, 'rgba(70,40,78,.7)', 1);
    ui.clouds = Array.from({ length: 6 }, () => ({ x: r() * W, y: 60 + r() * 220, s: 0.6 + r() * 0.9 }));
    ui.dust = Array.from({ length: reduced ? 0 : 46 }, () => ({ x: r() * W, y: 90 + r() * 560, z: 0.4 + r() * 0.8 }));
  }

  // ---------- terrain: chunky cells, coloured by depth below the surface, with scorch marks ----------
  const hash2 = (x, y) => { let h = (x * 374761393 + y * 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return (h >>> 16) & 255; };
  const SHADES = [['#A6DE62', '#93CF55'], ['#6FAE45', '#62A03C'], ['#D2834A', '#C47640'], ['#B2643A', '#A55B36'], ['#8C4C3A', '#7F4436'], ['#6A3E4A', '#5E3743']];
  function shadeFor(depth) { return depth === 0 ? 0 : depth === 1 ? 1 : depth < 5 ? 2 : depth < 10 ? 3 : depth < 18 ? 4 : 5; }
  function renderTerrain() {
    const G = ui.G, T = G.T, C = WB.COLS, R = WB.ROWS;
    tctx.clearRect(0, 0, W, H);
    for (let x = 0; x < C; x++) {
      let depth = -1;
      for (let y = 0; y < R; y++) {
        if (!T[y * C + x]) { depth = -1; continue; }
        depth++;
        const pair = SHADES[shadeFor(depth)];
        tctx.fillStyle = pair[hash2(x, y) & 1]; tctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        if (depth > 3 && (hash2(x, y) & 31) === 0) { tctx.fillStyle = 'rgba(30,20,35,.25)'; tctx.fillRect(x * CELL + 2, y * CELL + 2, 3, 3); }
      }

    for (const s of ui.scorch) { // soot only on the ground that's left
      tctx.save(); tctx.globalCompositeOperation = 'source-atop';
      const g = tctx.createRadialGradient(s.x, s.y, s.r * 0.6, s.x, s.y, s.r * 1.5); g.addColorStop(0, 'rgba(30,18,28,.75)'); g.addColorStop(1, 'rgba(30,18,28,0)');
      tctx.fillStyle = g; tctx.beginPath(); tctx.arc(s.x, s.y, s.r * 1.5, 0, 7); tctx.fill(); tctx.restore();
    }
    // ink edges where ground meets air, and grass tufts on top
    tctx.fillStyle = '#2A1A2A';
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
      if (!T[y * C + x]) continue;
      const px = x * CELL, py = y * CELL;
      if (x > 0 && !T[y * C + x - 1]) tctx.fillRect(px, py, 2, CELL);
      if (x < C - 1 && !T[y * C + x + 1]) tctx.fillRect(px + CELL - 2, py, 2, CELL);
      if (y < R - 1 && !T[(y + 1) * C + x]) tctx.fillRect(px, py + CELL - 2, CELL, 2);

      }
    }
    ui.terrainDirty = false;
  }

  // ---------- particles ----------
  function burst(x, y, n, kind) {
    const lim = reduced ? Math.ceil(n / 3) : n;
    for (let i = 0; i < lim; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * (kind === 'chunk' ? 360 : 160);
      ui.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (kind === 'chunk' ? 160 : 40), t: 0, life: kind === 'smoke' ? 1.4 + Math.random() : 0.7 + Math.random() * 0.7, kind,
        c: kind === 'chunk' ? SHADES[2 + (i % 3)][i & 1] : kind === 'spark' ? (i & 1 ? '#FFD34D' : '#FF8A3D') : kind === 'drop' ? '#9FE8E0' : 'rgba(60,45,70,.5)', size: kind === 'smoke' ? 10 + Math.random() * 14 : 2 + Math.random() * 4 });
    }
  }
  function stepParts(dt) {
    for (const p of ui.parts) {
      p.t += dt;
      if (p.kind === 'smoke') { p.vx = p.vx * 0.96 + ui.G.wind * 3 * dt; p.vy = p.vy * 0.96 - 18 * dt; p.size += 10 * dt; }
      else { p.vy += 900 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    ui.parts = ui.parts.filter((p) => p.t < p.life && p.y < H + 40);
    for (const p of ui.pops) p.t += dt; ui.pops = ui.pops.filter((p) => p.t < 1.2);
  }

  // ---------- engine events → effects ----------
  function onFx(fx) {
    for (const e of fx) {
      if (e.k === 'boom') {
        const x = e.x * CELL, y = e.y * CELL, r = e.r * CELL;
        ui.scorch.push({ x, y, r }); ui.terrainDirty = true;
        burst(x, y, Math.round(e.r * 7), 'chunk'); burst(x, y, Math.round(e.r * 5), 'spark'); burst(x, y, Math.round(e.r * 2.5), 'smoke');
        ui.parts.push({ x, y, t: 0, life: 0.25, kind: 'flash', size: r * 2.2 });
        if (!reduced) ui.shake = Math.min(26, ui.shake + e.r * 3.5);
        SFX.boom(e.r);
      } else if (e.k === 'splash') { burst(e.x * CELL, e.y * CELL, 18, 'drop'); SFX.splash(); }
      else if (e.k === 'bolt') {
        const x = e.x * CELL, gy = WB.surfaceY(ui.G, e.x) * CELL;
        ui.parts.push({ x, y: gy, t: 0, life: 0.45, kind: 'bolt', seed: Math.random() * 1000 });
        ui.parts.push({ x, y: gy, t: 0, life: 0.2, kind: 'flash', size: 70 });
        burst(x, gy, 14, 'spark'); if (!reduced) ui.shake = Math.min(26, ui.shake + 8);
        noise(0.35, 6000, 800, 0.3); tone(1800, 200, 0.25, 0.12, 'sawtooth');
        for (const id of e.hits) { const u = ui.G.units.find((v) => v.id === id); if (u) ui.pops.push({ x: u.x * CELL, y: u.y * CELL - 50, t: 0, text: 'ZAP!', c: '#8FD8FF' }); }
      }
      else if (e.k === 'quake') {
        if (!reduced) ui.shake = Math.min(34, ui.shake + 22);
        noise(1.1, 300, 40, 0.5); tone(55, 30, 0.9, 0.4);
        for (let x = 40; x < W; x += 80) burst(x, WB.surfaceY(ui.G, x / CELL) * CELL, 3, 'chunk');
        for (const id of e.hits) { const u = ui.G.units.find((v) => v.id === id); if (u) { burst(u.x * CELL, u.y * CELL, 10, 'smoke'); ui.pops.push({ x: u.x * CELL, y: u.y * CELL - 50, t: 0, text: 'QUAKE!', c: '#FFB86B' }); } }
      }
      else if (e.k === 'tornado') {
        ui.parts.push({ x: e.x * CELL, y: e.y * CELL, t: 0, life: 1.1, kind: 'swirl' });
        noise(1.0, 2500, 300, 0.3); if (!reduced) ui.shake = Math.min(26, ui.shake + 10);
        ui.pops.push({ x: e.x * CELL, y: e.y * CELL - 60, t: 0, text: 'TORNADO!', c: '#7BE07A' });
      }
      else if (e.k === 'dud') { SFX.thunk(); ui.pops.push({ x: e.x * CELL, y: e.y * CELL - 22, t: 0, text: 'LIVE DUD!', c: '#FFD34D' }); }
      else if (e.k === 'ko') {
        const u = ui.G.units.find((x) => x.id === e.id);

  function onTurn() {
    const G = ui.G, u = WB.current(G); if (!u) return;
    const ss = WB.ssReady(G);
    ui.tLeft = TURN_SECONDS; ui.lob = false; ui.weapon = ss ? 'ss' : 'shot1'; ui.cpu = null;
    if (!isCPU(G.team)) ui.turnsSeen++;
    banner(sideLabel(G.team), `${charName(G.team)}${ss ? ' · SS READY!' : ''}${isCPU(G.team) ? '' : ui.mode === 'solo' || (online() && G.team === ui.you) ? ' · your turn' : ''}`, TEAMS[G.team].c);

    renderHUD(); renderCtl(); coachLine();
  }
  function banner(big, small, color) {
    const h = $('#bannerHost');
    h.innerHTML = `<div class="banner" style="color:${color || '#FFF3E0'}">${esc(big)}${small ? `<small>${esc(small)}</small>` : ''}</div>`;
    clearTimeout(banner.t); banner.t = setTimeout(() => { h.innerHTML = ''; }, 1600);
  }

  // ---------- aiming ----------
  function aimOf(u) {
    if (!ui.aim[u.id]) ui.aim[u.id] = { angle: u.x < WB.COLS / 2 ? 50 : 130, power: 0.62 };
    return ui.aim[u.id];
  }
  function canAct() {
    if (online()) return ui.screen === 'game' && ui.G && ui.G.phase === 'aim' && ui.G.team === ui.you && ui.net && ui.net.queue.length === 0 && !ui.net.waiting;
    return ui.screen === 'game' && !ui.paused && ui.G && ui.G.phase === 'aim' && !isCPU(ui.G.team);
  }
  // Every move goes through here. Offline it changes the game at once; online it goes to the server, and the game
  // changes when the server sends it back (net.onApplied), on both screens the same way.
  function play(it) {
    if (!online()) return WB.act(ui.G, it);
    ui.net.send({ t: 'act', it });
    if (it.k !== 'move' && it.k !== 'weapon') ui.net.waiting = true; // don't let a double-click send a second shot
    return true;
  }

  // ---------- computer turns (1 Player) ----------
  // The bot decides on a copy of the game (same seed and state, so the same choice), then the moves are played on
  // the real game one by one, with pauses so you can watch it walk, aim and fire.
  function cpuStart() {
    const plan = WB.botTurn(JSON.parse(JSON.stringify(ui.G)), ui.level);
    ui.cpu = { plan, i: 0, t: 0.8, aimed: false };
  }
  function cpuStep(dt) {
    const c = ui.cpu, G = ui.G; c.t -= dt * (ui.fast ? 8 : 1); if (c.t > 0) return;
    const it = c.plan[c.i++], u = WB.current(G);
    if (!it || !u) { if (G.phase === 'aim') WB.act(G, { k: 'pass' }); ui.cpu = null; renderCtl(); return; }
    if (it.k === 'move') { WB.act(G, it); c.t = 0.09; renderCtl(); return; }
    if (it.k === 'weapon') { WB.act(G, it); ui.weapon = it.w; c.t = 0.3; renderCtl(); coachLine(); return; }
    if ((it.k === 'fire' || it.k === 'lob') && !c.aimed) { const a = aimOf(u); a.angle = it.angle; a.power = it.power; ui.lob = it.k === 'lob'; c.aimed = true; c.i--; c.t = 0.75; return; }
    if (WB.act(G, it) && (it.k === 'fire' || it.k === 'lob')) { SFX.fire(); burst(...muzzle(u, aimOf(u)), 8, 'spark'); }
    if (G.phase !== 'aim') { ui.cpu = null; renderCtl(); coachLine(); }
  }
  function doFire() {
    if (!canAct()) return false;
    const G = ui.G, u = WB.current(G), a = aimOf(u);
    let ok;
    if (ui.lob) {
      const ds = WB.lobbable(G); if (!ds.length) { ui.lob = false; renderCtl(); return false; }
      const [cx, cy] = WB.center(u); ds.sort((p, q) => Math.hypot(p.x - cx, p.y - cy) - Math.hypot(q.x - cx, q.y - cy));
      ok = play({ k: 'lob', dud: ds[0].id, angle: a.angle, power: a.power });

      if (G.weapon !== ui.weapon) play({ k: 'weapon', w: ui.weapon });

    }

    return ok;
  }
  function muzzle(u, a) { const [cx, cy] = WB.center(u), r = a.angle * Math.PI / 180; return [(cx + Math.cos(r) * 2.2) * CELL, (cy - Math.sin(r) * 2.2) * CELL]; }
  function walk(dir) { if (!canAct()) return; if (play({ k: 'move', dir }) && !online()) { SFX.click(); renderCtl(); coachLine(); } }
  function pass() { if (canAct()) { play({ k: 'pass' }); renderCtl(); } }

  function stagePoint(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
  cv.addEventListener('pointerdown', (e) => {
    audio(); if (!canAct()) return;
    const [x, y] = stagePoint(e); ui.drag = { x0: x, y0: y, x, y, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!ui.drag || e.pointerId !== ui.drag.id) return;

    const dx = ui.drag.x0 - ui.drag.x, dy = ui.drag.y0 - ui.drag.y, len = Math.hypot(dx, dy);
    if (len < DRAG_MIN || !canAct()) return;
    const a = aimOf(WB.current(ui.G));
    a.angle = Math.round(((Math.atan2(-dy, dx) * 180 / Math.PI) + 360) % 360 * 10) / 10;
    if (a.angle > 180) a.angle = a.angle > 270 ? 0 : 180; // aim at the sky, never into the ground

  });
  const endDrag = (e) => {
    if (!ui.drag || e.pointerId !== ui.drag.id) return;

  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', (e) => { if (ui.drag && e.pointerId === ui.drag.id) ui.drag = null; });

  addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const k = e.key;
    if (ui.screen === 'end' && (k === 'r' || k === 'R')) { if (online()) { if (ui.net) { ui.net.send({ t: 'rematch' }); ui.net.rematchAsked = true; roundOverAgain(); } } else startMatch(); return; }
    if (ui.screen === 'level') { if (/^[1-3]$/.test(k)) { ui.level = Object.keys(LEVELS)[+k - 1]; ui.cursor = 2; selectScreen(0); } return; }
    if (ui.screen === 'select') {
      const n = WB.CHAR_IDS.length;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { ui.cursor = (ui.cursor + n - 1) % n; selectScreen(ui.pickTeam); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { ui.cursor = (ui.cursor + 1) % n; selectScreen(ui.pickTeam); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); choose(WB.CHAR_IDS[ui.cursor]); }
      else if (/^[1-5]$/.test(k)) choose(WB.CHAR_IDS[+k - 1]);
      return;
    }
    if (k === 'Escape' || k === 'p' || k === 'P') { if (ui.screen === 'game') { e.preventDefault(); toggleMenu(); } return; }
    if (!canAct()) return;
    const a = aimOf(WB.current(ui.G)), fine = e.shiftKey ? 0.5 : 2;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); walk(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); walk(1); }
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); a.angle = clamp(a.angle + (a.angle <= 90 ? fine : -fine), 0, 180); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); a.angle = clamp(a.angle + (a.angle <= 90 ? -fine : fine), 0, 180); }
    else if (k === 'q' || k === 'Q') a.power = clamp(Math.round((a.power - 0.02) * 100) / 100, 0.05, 1);
    else if (k === 'e' || k === 'E') a.power = clamp(Math.round((a.power + 0.02) * 100) / 100, 0.05, 1);
    else if (k === 'f' || k === 'F') { a.angle = 180 - a.angle; }
    else if (k === '1') pickWeapon(WB.ssReady(ui.G) ? 'ss' : 'shot1');
    else if (k === '2' || k === '3') pickWeapon(WB.WEAPON_IDS[+k - 1]);
    else if (k === 'l' || k === 'L') toggleLob();
    else if (k === ' ' || k === 'Enter') { e.preventDefault(); doFire(); }
    if (/^(Arrow(Up|Down)|[wWsSqQeEfF])$/.test(k)) shareAim(a);
    else if (k === 'x' || k === 'X') pass();
  });
  function pickWeapon(w) { if (!canAct() || (w === 'ss' ? !WB.ssReady(ui.G) : ui.G.ammo[ui.G.team][w] === 0)) return; ui.weapon = w; ui.lob = false; SFX.click(); renderCtl(); coachLine(); }
  function toggleLob() { if (!canAct() || !WB.lobbable(ui.G).length) return; ui.lob = !ui.lob; SFX.click(); renderCtl(); coachLine(); }

  // ---------- HUD and controls (DOM) ----------
  function renderHUD() {
    const G = ui.G; if (!G) { $('#hud').innerHTML = ''; return; }
    const n = G.teams, half = Math.ceil(n / 2);
    const side = (t) => {
      const us = G.units.filter((u) => u.team === t), hp = us.reduce((a, u) => a + Math.max(0, u.hp), 0), max = us.reduce((a, u) => a + u.maxHp, 0);
      const out = !us.some((u) => u.alive), cur = t === G.team && G.phase !== 'over';
      return `<div class="team ${TEAMS[t].key}${t >= half ? ' r' : ''}${n > 2 ? ' sm' : ''}${out ? ' out' : ''}${cur ? ' cur' : ''}"><div><div class="nm">${esc(sideLabel(t))} <span class="cn">· ${esc(charName(t))}</span></div><div class="bar"><i style="width:${(100 * hp / max).toFixed(1)}%"></i></div></div>
        <div class="ssm${WB.ssReady(G, t) ? ' on' : ''}" title="SS charge: ready every ${WB.SS_CHARGE} turns"><span>SS</span>${Array.from({ length: WB.SS_CHARGE }, (_, i) => `<b class="${G.ss[t] > i ? 'f' : ''}"></b>`).join('')}</div>
        <div class="pips" title="rounds won">${Array.from({ length: Math.ceil(BEST_OF / 2) }, (_, i) => `<b class="${ui.wins[t] > i ? 'on' : ''}"></b>`).join('')}</div></div>`;
    };
    const w = G.wind, arrows = Math.round(Math.abs(w) / WB.WIND_MAX * 4);
    const windTxt = Math.abs(w) < 0.2 ? 'calm' : `${w < 0 ? '◀'.repeat(Math.max(1, arrows)) : ''} ${Math.abs(w).toFixed(1)} ${w > 0 ? '▶'.repeat(Math.max(1, arrows)) : ''}`;
    const left = Array.from({ length: half }, (_, t) => side(t)).join(''), right = Array.from({ length: n - half }, (_, i) => side(n - 1 - i)).join('');
    $('#hud').innerHTML = `<div class="sidegrp">${left}</div>` + `<div class="mid"><div class="timer${ui.timerOn ? '' : ' off'}" id="timer">${ui.timerOn ? Math.ceil(ui.tLeft) : '∞'}</div><div class="wind" aria-label="wind">WIND ${windTxt}</div><div class="wind" style="font-size:12px;opacity:.8">Round ${ui.round}${ui.mode === 'solo' ? ' · ' + LEVELS[ui.level].name : ''}${G.turn >= WB.suddenTurn(G) ? ' · <span style="color:#FF4D5E">SUDDEN DEATH: the water rises</span>' : ''}</div>${orderHTML()}</div><div class="sidegrp r">${right}</div>`;
  }
  // The next turns if everyone keeps firing their Shot 1, counting the current side's chosen shot: what the
  // turn delay means right now. Light shot: you may go again before them; heavy shot: they may go twice.
  function orderHTML() {
    const G = ui.G; if (!G || G.phase !== 'aim') return '<div class="order"></div>';
    const w = ui.lob ? 'lob' : ui.weapon, d = G.units.filter((u) => u.alive).map((u) => ({ u, d: u.id === G.actor ? WB.delayIf(G, w) : u.delay }));
    const seq = [];
    for (let i = 0; i < 6 && d.length; i++) { d.sort((a, b) => a.d - b.d || a.u.id - b.u.id); const x = d[0]; seq.push(x.u.team); x.d += WB.shotSpec(G, x.u.team, 'shot1').delay; }
    return `<div class="order" title="Who plays next, if everyone fires their Shot 1 after this">NEXT ${seq.map((t) => `<b style="background:${TEAMS[t].c}">${esc(sideLabel(t) === 'You' ? 'You' : ui.mode === 'solo' ? TEAMS[t].name[0] : online() ? sideLabel(t).slice(0, 6) : 'P' + (t + 1))}</b>`).join('')}</div>`;

  function renderCtl() {
    const G = ui.G; $('#bMenu').hidden = !G || ui.screen !== 'game';

    const aim = G.phase === 'aim', am = G.ammo[G.team], lob = WB.lobbable(G).length > 0;
    const wb = (w, key) => { const S = WB.shotSpec(G, G.team, w);

  function coachLine() {
    const el = $('#coach'); if (!ui.coach || ui.screen !== 'game' || !ui.G) { el.innerHTML = ''; return; }

    if (isCPU(G.team) || (online() && G.team !== ui.you)) { el.innerHTML = ''; return; }
    const danger = G.duds.find((d) => d.fuse <= 1 && Math.hypot(d.x - u.x, d.y - u.y) < WB.DUD.r * WB.DMG_SPREAD);
    let t;
    if (danger && WB.lobbable(G).includes(danger)) t = '<b>That dud blows at the end of this turn!</b> Tap LOB (L), then drag to throw it away.';

  // ---------- online 1v1 ----------
  function serverURL() {
    let q = null; try { q = new URLSearchParams(location.search).get('server'); } catch (e) { /* no query */ }
    const local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

  }
  function onlineScreen(msg) {
    ui.screen = 'online'; ui.G = null; renderHUD(); renderCtl(); coachLine();
    const srv = serverURL();
    show(`<div class="tag">Online 1v1 · beta</div><h2>Play a friend online</h2>
      <p>One of you makes a room and reads out the 4-letter code; the other joins with it.</p>
      <div class="fq"><label for="oName">Your name</label><input id="oName" maxlength="16" value="${esc(lsGet('wb-name') || '')}" placeholder="Player"></div>
      <div class="row"><button class="btn fire" type="button" data-act="ocreate" ${srv ? '' : 'disabled'}>MAKE A ROOM</button></div>
      <div class="fq" style="display:flex;gap:10px;align-items:end"><div style="flex:1"><label for="oCode">Or join with a code</label><input id="oCode" maxlength="4" style="text-transform:uppercase;letter-spacing:6px;font-size:22px" placeholder="ABCD"></div><button class="btn teal" type="button" data-act="ojoin" ${srv ? '' : 'disabled'}>JOIN</button></div>
      ${srv ? `<p class="keys">Server: ${esc(srv)}</p>` : '<p style="color:#FF4D5E">The online server isn\'t set up yet. (Crew: see wormsbound/server/README.md.)</p>'}

  }
  async function netStart(kind) {
    const name = ($('#oName') && $('#oName').value.trim()) || 'Player'; lsSet('wb-name', name);
    const srv = serverURL(); if (!srv) return onlineScreen('No server address.');
    let code = (($('#oCode') && $('#oCode').value) || '').trim().toUpperCase();
    if (kind === 'create') {
      try { const r = await fetch(srv.replace(/^ws/, 'http') + '/new'); code = (await r.json()).code; }
      catch (e) { return onlineScreen("Couldn't reach the online server. Is it running?"); }
    } else if (!/^[A-Z]{4}$/.test(code)) return onlineScreen('Room codes are 4 letters.');
    netOpen(srv, code, kind === 'create' ? { t: 'create', name } : { t: 'join', name });
  }
  function netOpen(srv, code, hello) {
    netLeave(true);
    ui.mode = 'online';
    const net = ui.net = { srv, code, queue: [], room: null, ws: null, token: null, waiting: false, retries: 0, closed: false, expect: null };
    const connect = () => {
      let ws; try { ws = new WebSocket(`${srv}/room/${code}`); } catch (e) { return onlineScreen("Couldn't open a connection to the server."); }
      net.ws = ws;
      ws.onopen = () => { net.retries = 0; ws.send(JSON.stringify(net.token ? { t: 'rejoin', token: net.token } : hello)); };
      ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onNet(m); };
      ws.onclose = () => {
        if (net.closed || ui.net !== net) return;
        if (!net.token) return onlineScreen("Couldn't join that room.");
        if (net.retries++ < 10) { banner('Connection lost', 'reconnecting…'); setTimeout(connect, 1500); }
        else { netLeave(); onlineScreen('Lost the connection to the room.'); }
      };
    };
    net.send = (m) => { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(m)); };
    // moves from the server are played in order, each only once the last shot has landed on this screen
    net.drain = () => {
      while (net.queue.length && ui.G && ui.G.phase !== 'flight' && !net.expect) {

    if (p.w === 'ss') { const g = ctx.createRadialGradient(x, y, 2, x, y, 24); g.addColorStop(0, 'rgba(255,211,77,.8)'); g.addColorStop(1, 'rgba(255,138,61,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 24, 0, 7); ctx.fill(); }
    ctx.strokeStyle = '#1E1A2B'; ctx.lineWidth = 2;
    if (ch === 'zip' || (ch === 'digger' && big)) { // darts and drills point where they fly
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      if (ch === 'zip') { ctx.fillStyle = '#FFD34D'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -4); ctx.lineTo(-3, 0); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      else { ctx.fillStyle = '#9A9CA3'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.strokeStyle = '#4A4D58'; for (let i = 0; i < 3; i++) { const sx = 6 - i * 4 - (t * 40 % 4); ctx.beginPath(); ctx.moveTo(sx, -4 + i); ctx.lineTo(sx - 2, 4 - i); ctx.stroke(); } }
      ctx.restore(); return;
    }
    const look = { brick: ['#5A5F6E', p.w === 'ss' ? 10 : big ? 8 : 6], volt: ['#4FB3FF', big ? 6.5 : 5.5], digger: ['#B2643A', 6], gale: ['#7BE07A', big ? 6.5 : 5.5] }[ch] || ['#3A3150', 5.5];
    if (ch === 'volt') { const g = ctx.createRadialGradient(x, y, 1, x, y, 16); g.addColorStop(0, 'rgba(143,216,255,.7)'); g.addColorStop(1, 'rgba(143,216,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill(); }
    if (ch === 'gale') { ctx.strokeStyle = '#FFF3E0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - p.vx * 0.4 + 4 * Math.sin(t * 20), y - p.vy * 0.4, x - p.vx * 0.7, y - p.vy * 0.7); ctx.stroke(); ctx.strokeStyle = '#1E1A2B'; }
    ctx.fillStyle = look[0]; ctx.beginPath(); ctx.arc(x, y, look[1], 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x - look[1] * 0.35, y - look[1] * 0.35, look[1] * 0.35, 0, 7); ctx.fill();
  }
  function drawAim(u, t) {
    const a = aimOf(u), [cx, cy] = WB.center(u), rad = a.angle * Math.PI / 180;
    const ox = cx * CELL, oy = cy * CELL, len = 26 + a.power * 46;
    // short preview of the first part of the arc (no wind: reading the wind is your job)
    const s = (ui.lob ? a.power * WB.LOB_POWER : a.power * WB.shotSpec(ui.G, u.team, ui.weapon).speed) * WB.VMAX;
    let px = cx + Math.cos(rad) * (WB.UNIT_R + 0.6), py = cy - Math.sin(rad) * (WB.UNIT_R + 0.6), vx = Math.cos(rad) * s, vy = -Math.sin(rad) * s;
    ctx.fillStyle = 'rgba(255,243,224,.85)';
    for (let i = 0; i < 16; i++) { for (let k = 0; k < 3; k++) { vy += WB.GRAV / 60; px += vx / 60; py += vy / 60; } const r = 3 - i * 0.13; if (r <= 0.6) break; ctx.beginPath(); ctx.arc(px * CELL, py * CELL, r, 0, 7); ctx.fill(); }
    // power arrow
    ctx.strokeStyle = '#1E1A2B'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(rad) * len, oy - Math.sin(rad) * len); ctx.stroke();
    const pc = a.power < 0.5 ? '#FFD34D' : a.power < 0.85 ? '#FF8A3D' : '#FF4D5E';
    ctx.strokeStyle = ui.lob ? '#22C3B5' : pc; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(rad) * len, oy - Math.sin(rad) * len); ctx.stroke();
    ctx.font = FONT(15); ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,26,43,.9)';
    const lab = `${Math.round(a.angle > 90 ? 180 - a.angle : a.angle)}° · ${Math.round(a.power * 100)}%${ui.lob ? ' · LOB' : ''}`;
    const lx = ox + Math.cos(rad) * (len + 26), ly = oy - Math.sin(rad) * (len + 26) - 4;
    ctx.strokeText(lab, lx, ly); ctx.fillStyle = '#FFF3E0'; ctx.fillText(lab, lx, ly);
    if (ui.lob) { ctx.strokeStyle = 'rgba(34,195,181,.6)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ox, oy, WB.LOB_RANGE * CELL, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  }
  function drawWater(t) {
    const wy = ui.G.water * CELL;
    const g = ctx.createLinearGradient(0, wy, 0, H); g.addColorStop(0, 'rgba(34,195,181,.85)'); g.addColorStop(1, 'rgba(14,60,90,.95)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) ctx.lineTo(x, wy + (reduced ? 0 : Math.sin(x / 40 + t * 2) * 3 + Math.sin(x / 17 - t * 3) * 1.5));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(200,255,250,.7)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= W; x += 16) { const y = wy + (reduced ? 0 : Math.sin(x / 40 + t * 2) * 3 + Math.sin(x / 17 - t * 3) * 1.5); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  }
  function draw(t, dt) {
    const G = ui.G;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!G) { ctx.drawImage(bgCv, 0, 0); return; }
    if (ui.terrainDirty) renderTerrain();
    const sh = ui.shake; if (sh > 0.3) { ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh); }
    ctx.drawImage(bgCv, -20, -20, W + 40, H + 40);
    // clouds and dust drift with the wind: you can see it
    for (const c of ui.clouds) {
      c.x += G.wind * 2.2 * c.s * dt; if (c.x > W + 120) c.x = -120; if (c.x < -120) c.x = W + 120;
      ctx.fillStyle = 'rgba(255,230,210,.18)'; for (const [dx, dy, r] of [[0, 0, 26], [24, 6, 20], [-24, 8, 18], [8, -10, 18]]) { ctx.beginPath(); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 7); ctx.fill(); }
    }
    ctx.drawImage(terrCv, 0, 0);
    for (const d of ui.dust) {
      d.x += (G.wind * 22 + 6) * d.z * dt; d.y += Math.sin(t + d.x / 90) * 6 * dt;
      if (d.x > W) d.x = 0; if (d.x < 0) d.x = W;
      ctx.fillStyle = `rgba(255,236,200,${0.15 + d.z * 0.25})`; ctx.fillRect(d.x, d.y, 2 + d.z * 6 * Math.min(1, Math.abs(G.wind) / 3), 2);
    }
    for (const d of G.duds) drawDud(d, t, false);
    const cur = WB.current(G);
    for (const u of G.units) if (!u.alive) drawUnit(u, false, t);
    for (const u of G.units) if (u.alive) drawUnit(u, u === cur && G.phase === 'aim', t);
    if (online() && cur && G.phase === 'aim' && G.team !== ui.you) { if (ui.remoteAim && performance.now() - ui.remoteAim.at < 4000) { const a = aimOf(cur); a.angle = ui.remoteAim.angle; a.power = ui.remoteAim.power; drawAim(cur, t); } }
    else if (cur && G.phase === 'aim' && ui.screen === 'game' && !ui.paused && (!isCPU(G.team) || (ui.cpu && ui.cpu.aimed))) drawAim(cur, t);
    for (const p of G.proj) drawProj(p, t);
    for (const id of Object.keys(ui.trails)) if (!G.proj.some((p) => String(p.id) === id)) delete ui.trails[id];
    for (const p of ui.parts) {
      const k = 1 - p.t / p.life;
      if (p.kind === 'bolt') {
        let s = p.seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
        const pts = [[p.x, 0]]; for (let yy = 40; yy < p.y; yy += 40) pts.push([p.x + (rnd() - 0.5) * 34, yy]); pts.push([p.x, p.y]);
        for (const [w, col] of [[10, `rgba(143,216,255,${k * 0.5})`], [4, `rgba(255,255,255,${k})`]]) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); pts.forEach(([a, b], i) => (i ? ctx.lineTo(a, b) : ctx.moveTo(a, b))); ctx.stroke(); }
        continue;
      }
      if (p.kind === 'swirl') { // tornado: rising rings that spin out
        for (let i = 0; i < 9; i++) { const yy = p.y - i * 18 - p.t * 60, rr = 10 + i * 9 * (0.6 + p.t), a = t * 12 + i;
          ctx.strokeStyle = `rgba(200,255,220,${k * (0.75 - i * 0.06)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(p.x + Math.sin(a) * 6, yy, rr, rr * 0.28, 0, 0, 7); ctx.stroke(); }
        continue;
      }
      if (p.kind === 'flash') { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, `rgba(255,250,220,${k})`); g.addColorStop(0.4, `rgba(255,180,80,${k * 0.8})`); g.addColorStop(1, 'rgba(255,120,60,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); continue; }
      ctx.globalAlpha = Math.max(0, p.kind === 'smoke' ? k * 0.8 : k);
      ctx.fillStyle = p.c;
      if (p.kind === 'smoke') { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); } else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
    drawWater(t);
    for (const p of ui.pops) {
      const k = p.t / 1.2; ctx.globalAlpha = 1 - k * k; ctx.font = FONT(26 + (1 - k) * 8); ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = '#1E1A2B';
      ctx.strokeText(p.text, p.x, p.y - k * 40); ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y - k * 40); ctx.globalAlpha = 1;
    }
    if (ui.slow > 0 && !reduced) { ctx.fillStyle = `rgba(30,26,43,${Math.min(0.25, ui.slow * 0.3)})`; ctx.fillRect(0, 0, 8 + W, 40); ctx.fillRect(0, H - 40, W + 8, 40); }
  }

  // ---------- the clock ----------
  let lastTimerShown = -1;
  function frame(ts) {
    const now = ts / 1000, dt = Math.min(0.05, ui.last ? now - ui.last : 0.016); ui.last = now;
    const G = ui.G;
    if (G && ui.screen === 'game' && !ui.paused) {
      if (G.phase === 'flight') {
        const speed = (ui.fast ? 8 : 1) * (ui.slow > 0 ? 0.3 : 1);
        ui.acc += dt * speed; let n = 0;
        while (ui.acc >= WB.TICK && G.phase === 'flight' && n++ < 400) { onFx(WB.step(G)); ui.acc -= WB.TICK; }
        if (G.phase !== 'flight') { ui.acc = 0; if (online() && ui.net) ui.net.settled(); renderHUD(); renderCtl(); coachLine(); }
      } else if (online() && ui.net && ui.net.queue.length) {
        ui.net.drain();
      } else if (G.phase === 'aim' && isCPU(G.team)) {
        if (!ui.cpu) cpuStart();
        cpuStep(dt);
      } else if (G.phase === 'aim' && ui.timerOn && (!online() || G.team === ui.you)) {
        const before = Math.ceil(ui.tLeft); ui.tLeft -= dt;
        if (Math.ceil(ui.tLeft) !== before && ui.tLeft <= 5 && ui.tLeft > 0) SFX.tick();
        if (ui.tLeft <= 0) { ui.tLeft = 0; pass(); }
      }
      if (G.phase === 'over') { // a short beat to watch the last blast, then the round screen (also covers the turn-cap ending)
        if (!ui.overAt) ui.overAt = performance.now() + 1500;
        else if (ui.overAt > 0 && performance.now() >= ui.overAt) { ui.overAt = -1; roundOver(); }
      }
      const shown = Math.ceil(ui.tLeft); const el = $('#timer');
      if (el && shown !== lastTimerShown) { lastTimerShown = shown; if (ui.timerOn) { el.textContent = shown; el.classList.toggle('low', shown <= 5); } }
    }
    if (ui.slow > 0) ui.slow -= dt;
    ui.shake *= Math.pow(0.02, dt);
    if (G) stepParts(dt);
    draw(now, dt);
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  window.WBUI = {
    get G() { return ui.G; }, ui, startMatch, levelScreen, onlineScreen, netStart, play, selectScreen, choose, startRound, roundOver, doFire, walk, pass, botTurn, renderAll: () => { renderHUD(); renderCtl(); coachLine(); },
    aim: (angle, power) => { const u = WB.current(ui.G); const a = aimOf(u); a.angle = angle; a.power = power; },
  };
  fit(); addEventListener('resize', fit);
  { const lv = lsGet('wb-level'); if (LEVELS[lv]) ui.level = lv; }
  bakeBackground(20261102); titleScreen();
  requestAnimationFrame(frame);
})();

</script>
