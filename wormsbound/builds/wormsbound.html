/* Wormsbound Prototype 1: local hotseat. © 2026 justaskjoe. All rights reserved.
   A 1280×720 stage that scales to fit (desktop landscape first; a phone loads it letterboxed).
   Look from the brief: punchy, readable, explosive. Warm sunset oranges with teal accents and bright effects. */
:root {
  --ink: #1E1A2B; --ink-2: #3A3150; --cream: #FFF3E0; --cream-2: #F3DFC3; --muted: #9C8AA8;
  --sun: #FF8A3D; --sun-2: #FFB86B; --dusk: #6B3A5B; --gold: #FFD34D; --red: #FF4D5E;
  --ember: #FF7A30; --ember-2: #C9481A; --tide: #22C3B5; --tide-2: #0E7C7B;
  --display: 'Lilita One', 'Arial Black', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #120F1C; color: var(--cream); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
#wrap { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%; overflow: hidden; border-radius: 6px; background: #2A2140; touch-action: none; user-select: none; -webkit-user-select: none; }
#map { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; cursor: crosshair; }
.owner { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(6px, env(safe-area-inset-bottom, 0px)); z-index: 90; font-size: 11px; font-weight: 800; color: rgba(255,243,224,.55); pointer-events: none; }
.hint-rotate { display: none; position: fixed; left: 0; right: 0; top: max(8px, env(safe-area-inset-top, 0px)); text-align: center; font-size: 13px; font-weight: 800; color: var(--sun-2); z-index: 95; pointer-events: none; padding: 0 16px; }
@media (orientation: portrait) and (max-width: 700px) { .hint-rotate { display: block; } }

/* ---------- HUD (inside the stage, in stage pixels) ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; pointer-events: none; z-index: 5; }
.team { display: flex; align-items: center; gap: 10px; min-width: 300px; }
.team.r { flex-direction: row-reverse; text-align: right; }
.team .nm { font-family: var(--display); font-size: 26px; line-height: 1; letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.team .bar { width: 200px; height: 14px; border-radius: 99px; background: rgba(0,0,0,.4); border: 2px solid var(--ink); overflow: hidden; }
.team .bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
.team.ember .nm { color: var(--ember); } .team.ember .bar i { background: linear-gradient(90deg, var(--ember-2), var(--ember)); }
.team.tide .nm { color: var(--tide); } .team.tide .bar i { background: linear-gradient(90deg, var(--tide-2), var(--tide)); }
.pips { display: flex; gap: 5px; } .pips b { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(0,0,0,.35); } .pips b.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.mid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.timer { font-family: var(--display); font-size: 34px; line-height: 1; min-width: 64px; text-align: center; padding: 4px 12px; border-radius: 14px; background: var(--ink); border: 3px solid var(--cream); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.timer.low { color: var(--red); border-color: var(--red); }
.timer.off { opacity: .5; }
.wind { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,.4); }

.sidegrp { display: flex; gap: 10px; } .sidegrp.r { flex-direction: row-reverse; }
.team.plum .nm { color: #B57BFF; } .team.plum .bar i { background: linear-gradient(90deg, #7A4BC9, #B57BFF); }
.team.sun .nm { color: #FFD34D; } .team.sun .bar i { background: linear-gradient(90deg, #C99A1A, #FFD34D); }
.team.rose .nm { color: #FF6FB5; } .team.rose .bar i { background: linear-gradient(90deg, #C23F86, #FF6FB5); }
.team.sky .nm { color: #5AA9FF; } .team.sky .bar i { background: linear-gradient(90deg, #2C6FC9, #5AA9FF); }
.team .cn { font-size: 17px; opacity: .85; }
.team.sm { min-width: 0; gap: 6px; } .team.sm .nm { font-size: 19px; } .team.sm .cn { font-size: 13px; } .team.sm .bar { width: 150px; height: 11px; }
.team.sm .pips b { width: 11px; height: 11px; }
/* 5 or 6 sides (online free-for-all): three a side, narrower */
.team.xs { gap: 4px; } .team.xs .nm { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; } .team.xs .cn { display: none; } .team.xs .bar { width: 96px; height: 9px; }
.team.xs .pips { display: none; } .team.xs .ssm span { display: none; } .team.xs .ssm b { width: 6px; height: 6px; }
.team.out { opacity: .35; filter: grayscale(.6); }
.team.cur .bar { box-shadow: 0 0 0 2px var(--gold), 0 0 12px var(--gold); }
.order { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 11px; letter-spacing: 1px; color: var(--cream-2); min-height: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.order b { min-width: 22px; padding: 1px 5px; border-radius: 99px; border: 2px solid var(--ink); color: var(--ink); text-shadow: none; text-align: center; font-size: 11px; }
.cputag { font-family: var(--display); font-size: 22px; color: var(--tc); background: rgba(30,26,43,.85); border: 3px solid var(--tc); border-radius: 16px; padding: 10px 20px; }
.card .row.lv { flex-wrap: nowrap; align-items: stretch; }
.card .row.maps { gap: 6px; margin-top: 12px; }
.card .row.maps { align-items: center; }
.card .mapsel, .card .mapcode { font: inherit; font-weight: 800; font-size: 14px; color: var(--cream); background: var(--ink-2); border: 2px solid var(--muted); border-radius: 12px; padding: 7px 10px; }
.card .mapcode { width: 200px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.card a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.card p.mapabout { font-size: 14px; margin: 6px 0 0; opacity: .85; min-height: 1.2em; }
/* Custom Map screen: a wide card, preview on the left, themes and settings on the right */
.card.ed { width: 1220px; max-width: 97%; max-height: 700px; overflow-y: auto; padding: 14px 20px; text-align: left; }
.card.ed .edhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card.ed h2 { font-size: 34px; margin: 0 12px 0 0; }
.card.ed .edgrid { display: grid; grid-template-columns: 640px 1fr; gap: 16px; margin-top: 10px; }
.card.ed canvas { width: 640px; height: 360px; display: block; border-radius: 10px; border: 2px solid var(--muted); image-rendering: pixelated; }
.card.ed .edchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.card.ed .edchips span { background: var(--ink-2); border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 800; }
.card.ed p.edrule { font-size: 13px; margin: 6px 0 0; opacity: .9; } .card.ed p.edrule b { color: var(--sun); }
.card.ed .edrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.card.ed .edrow .mapcode { width: 190px; }
.card.ed .edlock { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.card.ed .edfavs small { opacity: .6; font-size: 12px; }
.card.ed .edfav { display: inline-flex; } .card.ed .edfav button { font: inherit; font-size: 12px; font-weight: 800; color: var(--cream); background: var(--ink-2); border: 2px solid var(--muted); padding: 3px 8px; cursor: pointer; }
.card.ed .edfav button:first-child { border-radius: 99px 0 0 99px; } .card.ed .edfav button:last-child { border-radius: 0 99px 99px 0; border-left: 0; }
.card.ed .edthemes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.card.ed .edthemes button { font: inherit; font-size: 11px; font-weight: 800; color: var(--cream); background: var(--ink-2); border: 2px solid transparent; border-radius: 10px; padding: 4px; cursor: pointer; line-height: 1.1; }
.card.ed .edthemes button i { display: block; height: 22px; border-radius: 6px; margin-bottom: 3px; }
.card.ed .edthemes button[aria-pressed="true"] { border-color: var(--sun); }
.card.ed .edfields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 10px; }
.card.ed .edf label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; opacity: .9; } .card.ed .edf label b { color: var(--sun); }
.card.ed .edf input[type=range] { width: 100%; accent-color: var(--sun); margin: 2px 0 0; }
.card.ed .edf select { width: 100%; font: inherit; font-size: 13px; font-weight: 800; color: var(--cream); background: var(--ink-2); border: 2px solid var(--muted); border-radius: 10px; padding: 3px 6px; }
.card.ed .row { justify-content: flex-end; }
.card.ed .row #edMsg { margin: 0 auto 0 0; align-self: center; }
.card.title { width: 860px; padding: 20px 34px; } /* the title: wide enough for three mode buttons in a row and the map row */
.card.title .row.maps .mapcode { width: 170px; }
.card.title .row .btn { padding-left: 14px; padding-right: 14px; }
.card.scroll { max-height: 690px; overflow-y: auto; }
/* character select with ten characters: small cards, one detail panel */
.chars.ten { grid-template-columns: repeat(10, 1fr); gap: 8px; }
.char.mini { padding: 6px; gap: 1px; text-align: center; align-items: center; } .char.mini img { height: 62px; } .char.mini .cn { font-size: 18px; } .char.mini .role { font-size: 9px; letter-spacing: 1px; margin: 0; }
.char.mini .num { left: 8px; top: 8px; width: 20px; height: 20px; font-size: 12px; }
.cdetail { display: grid; grid-template-columns: 1.15fr .8fr 1.5fr; gap: 14px; margin-top: 10px; padding: 10px 12px; background: var(--ink); border: 3px solid var(--tc); border-radius: 18px; text-align: left; font-size: 12px; min-height: 150px; }
.cdetail .cdl { display: flex; gap: 10px; } .cdetail .cdl img { width: 130px; height: 96px; border-radius: 12px; border: 2px solid var(--ink-2); object-fit: cover; flex: none; }
.cdetail .cn { display: block; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; } .cdetail .role { display: block; font-weight: 900; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 2px 0 4px; }
.cdetail .bl { color: var(--cream-2); font-weight: 700; } .cdetail .cdm { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.cdetail .cdr { display: flex; flex-direction: column; gap: 4px; } .cdetail .sh { background: var(--ink-2); border-radius: 10px; padding: 4px 7px; font-weight: 700; }
.cdetail .sh b { color: var(--gold); } .cdetail .sh.two b { color: var(--tc); } .cdetail .sh em { font-style: normal; color: var(--muted); font-weight: 800; } .cdetail .sh.ss { background: linear-gradient(90deg, rgba(255,211,77,.18), var(--ink-2)); }
/* gear step */
.gears { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gearb { position: relative; display: flex; flex-direction: column; gap: 2px; text-align: left; font: inherit; color: var(--cream); background: var(--ink); border: 3px solid var(--ink-2); border-radius: 16px; padding: 10px 12px 10px 40px; cursor: pointer; min-height: 92px; }
.gearb:hover, .gearb.cur { border-color: var(--tc); } .gearb:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
.gearb b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); line-height: 1; } .gearb em { font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); } .gearb span { font-size: 13px; font-weight: 700; color: var(--cream-2); }
.gearb .num { position: absolute; left: 10px; top: 10px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--cream); font-family: var(--display); font-size: 13px; display: grid; place-items: center; color: var(--cream); }
/* Squads setup and crew picking */
.card .sqrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; }
.card .sqrow > span { font-size: 13px; font-weight: 800; opacity: .8; min-width: 90px; text-align: right; }
.crewslots { display: inline-flex; gap: 5px; margin-right: 8px; vertical-align: middle; } .crewslots b { min-width: 26px; padding: 1px 8px; border-radius: 99px; border: 2px dashed var(--muted); font-size: 12px; opacity: .7; } .crewslots b.on { border: 2px solid var(--tc); color: var(--tc); opacity: 1; }
/* team battle lobby: two columns of unit slots */
.tcols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; text-align: left; }
.tcol h3 { margin: 0 0 4px; font-family: var(--display); font-size: 20px; }
.tslot { border: 2px solid var(--tc); border-radius: 12px; padding: 4px 10px; margin-bottom: 5px; font-size: 14px; } .tslot.cpu { border-style: dashed; opacity: .6; } .tslot em { float: right; font-style: normal; font-weight: 800; color: #7BE07A; } .tslot.cpu em { color: var(--muted); }
/* camera buttons (maps bigger than one screen), under the minimap */
.camctl { position: absolute; left: 12px; top: 244px; z-index: 12; display: flex; gap: 4px; } .camctl[hidden] { display: none; }
.camctl .btn.sm { min-height: 28px; font-size: 12px; padding: 2px 8px; box-shadow: 0 3px 0 rgba(0,0,0,.5); }
.btn.lvl { position: relative; flex-direction: column; flex: 1; min-width: 0; width: 180px; min-height: 110px; padding: 12px 14px; font-size: 28px; }
.btn.lvl small { font-family: var(--body); font-weight: 800; font-size: 13px; line-height: 1.25; margin-top: 4px; }
.btn.lvl .num { position: absolute; left: 8px; top: 6px; font-size: 13px; opacity: .6; }
/* ---------- control bar ---------- */
.ctl { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 90px 10px 230px; z-index: 5; pointer-events: none; }
.ctl > * { pointer-events: auto; }
.btn { border: 3px solid var(--ink); background: var(--cream); color: var(--ink); border-radius: 16px; min-height: 52px; min-width: 52px; padding: 6px 16px; font-family: var(--display); font-size: 20px; letter-spacing: .4px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.fire { background: var(--sun); min-width: 120px; }
.btn.teal { background: var(--tide); }
.btn.gold { background: var(--gold); }
.btn.plum { background: #B57BFF; }
.btn.ghost { background: rgba(30,26,43,.75); color: var(--cream); border-color: var(--cream); box-shadow: 0 5px 0 rgba(0,0,0,.5); }
.btn.sm { min-height: 40px; font-size: 16px; padding: 4px 12px; }
.btn[aria-pressed="true"] { background: var(--gold); box-shadow: 0 5px 0 var(--ink), 0 0 16px var(--gold); }
.wpn { flex-direction: column; gap: 0; line-height: 1; min-width: 104px; }
.wpn { white-space: nowrap; } .ctl.four .wpn { min-width: 92px; font-size: 19px; padding-left: 10px; padding-right: 10px; } .ctl.four .wpn small { font-size: 11px; } /* with a gear slot: four shots in the row */
.btn.ss { background: linear-gradient(180deg, #FFE27A, #FF8A3D); box-shadow: 0 5px 0 var(--ink), 0 0 22px rgba(255,211,77,.8); animation: ssglow 1.2s ease-in-out infinite alternate; }
.btn.ss.dim { animation: none; opacity: .8; box-shadow: 0 5px 0 var(--ink); }

.ssm b.f { background: var(--sun); } .ssm.on { color: var(--gold); } .ssm.on b { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

.wpn small { font-family: var(--body); font-weight: 900; font-size: 12px; opacity: .75; }
.steps { font-weight: 900; font-size: 14px; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,.5); min-width: 70px; text-align: center; }
.menu-btn { position: absolute; right: 16px; bottom: 14px; z-index: 6; }
.menu-btn[hidden] { display: none; }

/* ---------- coach line, banners ---------- */
.coach { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); max-width: 760px; text-align: center; background: rgba(30,26,43,.82); border: 2px solid rgba(255,243,224,.35); border-radius: 14px; padding: 8px 16px; font-weight: 800; font-size: 16px; z-index: 5; pointer-events: none; }
.coach:empty { display: none; }
.coach b { color: var(--gold); }
.banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 64px; letter-spacing: 1px; text-align: center; white-space: nowrap; text-shadow: 0 6px 0 rgba(0,0,0,.4), 0 0 30px rgba(255,138,61,.5); z-index: 7; pointer-events: none; animation: pop 1.5s ease both; }
.banner small { display: block; font-family: var(--body); font-weight: 900; font-size: 22px; letter-spacing: 0; color: var(--cream); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }

/* ---------- full-stage screens (title, round end, menu, feedback) ---------- */
.screen { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(255,138,61,.25), rgba(18,15,28,.88) 70%); }
.screen.clear { background: rgba(18,15,28,.6); }
.card { width: 640px; max-width: 92%; background: var(--ink); border: 4px solid var(--cream); border-radius: 26px; padding: 28px 34px; box-shadow: 0 10px 0 rgba(0,0,0,.45); text-align: center; }
.card h1 { font-family: var(--display); font-size: 84px; margin: 0; line-height: .95; letter-spacing: 1px; color: var(--sun); text-shadow: 0 6px 0 var(--dusk); }
.card h2 { font-family: var(--display); font-size: 44px; margin: 0 0 6px; letter-spacing: .5px; }

.card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

/* ---------- character select ---------- */
.pick { width: 1230px; text-align: center; }

.pick .row { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 12px; }
.chars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.char { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: left; background: var(--ink); color: var(--cream); border: 3px solid var(--ink-2); border-radius: 18px; padding: 8px 10px 10px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.45); font-family: var(--body); font-size: 12.5px; line-height: 1.3; }
.char:hover, .char.cur { border-color: var(--tc); box-shadow: 0 6px 0 rgba(0,0,0,.45), 0 0 22px color-mix(in srgb, var(--tc) 55%, transparent); transform: translateY(-4px); }
.char:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
.char img { width: 100%; height: 92px; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink-2); }
.char .num { position: absolute; left: 14px; top: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 2px solid var(--cream); font-family: var(--display); font-size: 14px; display: grid; place-items: center; }
.char .cn { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; color: var(--tc); margin-top: 2px; }
.char .role { font-weight: 900; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.sb { display: grid; grid-template-columns: 62px 1fr 52px; align-items: center; gap: 6px; font-weight: 800; font-size: 11px; }
.sb i { height: 8px; border-radius: 99px; background: var(--ink-2); overflow: hidden; } .sb i b { display: block; height: 100%; background: var(--tc); border-radius: 99px; }
.sb em { font-style: normal; text-align: right; color: var(--cream-2); }
.char .bl { color: var(--cream-2); font-weight: 700; margin: 2px 0 1px; min-height: 44px; font-size: 12px; }
.char .sh { background: var(--ink-2); border-radius: 10px; padding: 5px 7px; font-weight: 700; }
.char .sh b { color: var(--gold); } .char .sh.two b { color: var(--tc); } .char .sh em { font-style: normal; color: var(--muted); font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .banner, .btn.ss { animation: none; } .btn:active { transform: none; } }
</style>

<script>
/* Wormsbound map generator (mapgen.js).
   © 2026 justaskjoe. All rights reserved.

   Pure and seeded: no DOM, no engine imports. generate(settings) returns a cell grid plus everything a game needs
   to play it and draw it. Runs in the browser as window.MapGen and in node (require). Wormsbound's engine calls it
   from newGame; another side-on game can use it as it is (any grid size, its own spawn rule).

   Setting up a map works like a strategy game's map screen: pick a preset (a theme map or a mode such as
   Tournament), then change any setting (SETTINGS: landform, height, caves, water, hazards, wind, mirror...).
   Every combination packs into a short share code ("frost-peak-1222120211020-k3j9a") that rebuilds the same
   map anywhere. Seed 0 in a code means "new layout every match, same settings".

   How a map is made, in order (every step reads the settings):
     1. landform: the big shape (hills, islands, mesas, caverns, canyon, peak, bowl, city, towers, bridges)
     2. caves and tunnels, then overhangs
     3. platforms (ledges or girders), then theme props (trees, cars, mushrooms...), all solid and breakable
     4. clean-up (crumbs too small to stand on go), hard rock deep inside the ground, mirror if asked
     5. hazards (the theme's barrels or old duds), placed on the final ground
     6. checks: enough land, room to spawn across the whole map, both halves fair. A map that fails is rebuilt
        from the next seed in a fixed order (up to 12 tries), so the same settings always give the same map.

   Cells: 0 air, 1 ground, 2 hard rock (blasts can't break it), 3 prop, 4 prop accent. Anything non-zero is solid.
   y points down; row `water` and below is liquid. */
(function (root) {
  'use strict';

  const AIR = 0, DIRT = 1, ROCK = 2, PROP = 3, ACCENT = 4;
  const SIZES = { small: { w: 128, h: 72, name: 'Small' }, medium: { w: 160, h: 90, name: 'Medium' }, large: { w: 200, h: 112, name: 'Large' }, huge: { w: 240, h: 135, name: 'Huge' }, giant: { w: 320, h: 180, name: 'Giant' } };
  // the size a match needs: more units, more room (a game with a camera; 1v1 still fits one screen)
  const sizeFor = (units) => (units <= 4 ? 'medium' : units <= 6 ? 'large' : units <= 8 ? 'huge' : 'giant');
  const SIZE_IDS = Object.keys(SIZES);
  // tuning tables, indexed by a setting's level
  const HEIGHTS = [0.74, 0.67, 0.6, 0.52, 0.44];   // typical ground-top row, as a share of the map height
  const RUGGED = [0.02, 0.05, 0.09, 0.14, 0.2];    // surface bumpiness, as a share of the map height
  const WATER = [0.045, 0.09, 0.135, 0.18];        // liquid depth from the bottom (Normal = row 82 of 90)
  const WIND = [0.5, 1, 1.3, 1.6];                 // wind strength multiplier by weather
  const TRIES = 12;

  // ---------- seeded randomness ----------
  function rng(seed) {
    let s = (seed >>> 0) || 1;

    arch(c, x, y) { const R = 6 + c.r() * 3; for (let yy = Math.floor(y - R - 1); yy <= y; yy++) for (let xx = Math.floor(x - R - 1); xx <= x + R + 1; xx++) { const d = Math.hypot(xx + 0.5 - x, yy + 0.5 - y); if (d <= R && d >= R - 2.2) put(c, xx, yy, DIRT); } },
    mushroom(c, x, y) { const t = y - 3 - c.r() * 3, R = 3 + c.r() * 2; rect(c, x - 1, t, x + 1, y + 1, PROP); for (let yy = Math.floor(t - R); yy <= t; yy++) for (let xx = Math.floor(x - R); xx <= x + R; xx++) if (Math.hypot((xx + 0.5 - x) / R, (yy + 0.5 - t) / (R * 0.7)) <= 1) put(c, xx, yy, ACCENT); },
    stalactite: 'hang',
    hull(c, x, y) {
      for (let yy = Math.floor(y - 6); yy <= y; yy++) for (let xx = Math.floor(x - 9); xx <= x + 9; xx++) { const d = Math.hypot((xx + 0.5 - x) / 9, (yy + 0.5 - (y - 6)) / 6); if (d <= 1 && d >= 0.72 && yy >= y - 6) put(c, xx, yy, PROP); }
      rect(c, x, y - 17, x + 1, y - 4, PROP); tri(c, x + 3, y - 8, 2.5, 7, ACCENT);
    },
    coral(c, x, y) { for (let i = 0; i < 3; i++) { let px = x + i - 1, py = y; for (let k = 0, n = 4 + Math.floor(c.r() * 4); k < n; k++) { put(c, px, py, ACCENT); px += Math.round((c.r() - 0.5) * 2); py--; } } },
    gravestone(c, x, y) { rect(c, x - 1, y - 4, x + 2, y + 1, PROP); if (c.r() < 0.4) { rect(c, x, y - 6, x + 1, y - 4, PROP); rect(c, x - 1, y - 5, x + 2, y - 4, PROP); } },
    deadtree(c, x, y) { const t = y - 6 - c.r() * 2; rect(c, x, t, x + 1, y + 1, ACCENT); line(c, x, t + 3, x - 3, t, ACCENT); line(c, x, t + 5, x + 3, t + 2, ACCENT); },
    crypt(c, x, y) { rect(c, x - 4, y - 6, x + 5, y + 1, PROP); rect(c, x - 3, y - 5, x + 4, y, AIR); rect(c, x + 4, y - 3, x + 5, y, AIR); tri(c, x + 0.5, y - 6, 5, 3, ACCENT); },
  };
  function props(c) {
    const list = c.th.props, tot = list.reduce((a, p) => a + p[1], 0);
    for (let i = 0, n = Math.round([0, 2, 4, 7][c.s.props] * c.sx); i < n; i++) {
      let pick = c.r() * tot, id = list[0][0]; for (const [k, wgt] of list) { if ((pick -= wgt) < 0) { id = k; break; } }
      const x = Math.round(4 + c.r() * (c.w - 8)), y = surf(c, x);
      if (STAMPS[id] === 'hang') { // hangs from a cave ceiling, if this column has one
        for (let yy = y + 2; yy < c.water - 3; yy++) if (!c.T[yy * c.w + x] && c.T[(yy - 1) * c.w + x]) { tri(c, x + 0.5, yy, 1.5 + c.r(), 3 + c.r() * 4, ACCENT, true); break; }
        continue;
      }
      if (y >= c.water - 3 || y < c.sky + 12) continue;
      STAMPS[id](c, x, y);
    }
  }
  // drop crumbs too small to stand on (4-neighbour pieces under 10 cells) and single cells sticking out
  function cleanup(c) {
    const { w, h, T } = c, seen = new Uint8Array(w * h), stack = [];
    for (let i = 0; i < w * h; i++) {
      if (!T[i] || seen[i]) continue;
      const piece = []; stack.push(i); seen[i] = 1;
      while (stack.length) { const j = stack.pop(); piece.push(j); const x = j % w; for (const k of [j - w, j + w, x > 0 ? j - 1 : -1, x < w - 1 ? j + 1 : -1]) if (k >= 0 && k < w * h && T[k] && !seen[k]) { seen[k] = 1; stack.push(k); } }
      if (piece.length < 10) for (const j of piece) T[j] = AIR;
    }
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x; if (T[i] && (T[i - 1] ? 1 : 0) + (T[i + 1] ? 1 : 0) + (T[i - w] ? 1 : 0) + (T[i + w] ? 1 : 0) <= 1) T[i] = AIR; }
  }
  // hard rock: Bedrock = ground at least 9 cells from any air; Veins adds noisy streaks at least 5 cells in.
  // Never near the surface or a cave wall, so nobody starts under cover they can't blast away.
  function hardRock(c) {
    if (!c.s.rock) return;
    const { w, h, T } = c, dist = new Int16Array(w * h).fill(-1), q = [];
    for (let i = 0; i < w * h; i++) if (!T[i]) { dist[i] = 0; q.push(i); }
    for (let qi = 0; qi < q.length; qi++) {
      const j = q[qi], x = j % w, y = (j / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue; const k = ny * w + nx; if (dist[k] < 0) { dist[k] = dist[j] + 1; q.push(k); } }
    }
    const f = c.s.rock >= 2 ? noise2(c.r, w, h, 7 * c.sx) : null;
    for (let i = 0; i < w * h; i++) if (T[i] === DIRT && dist[i] >= 0 && (dist[i] >= 9 || (f && dist[i] >= 5 && Math.abs(f[i]) < 0.09))) T[i] = ROCK;
  }
  function mirror(c) { for (let y = 0; y < c.h; y++) for (let x = 0; x < c.w / 2; x++) c.T[y * c.w + (c.w - 1 - x)] = c.T[y * c.w + x]; }
  // Hazards: the theme's barrels (blow up when a blast reaches them) or old live duds (lobbable, tick from turn 1).
  function hazards(c) {
    const n = Math.round([0, 2, 4, 6][c.s.hazards] * c.sx), half = c.s.symmetry, maxX = half ? c.w / 2 - 3 : c.w - 4;
    for (let i = 0, tries = 0; i < (half ? Math.ceil(n / 2) : n) && tries < n * 10; tries++) {
      const x = Math.floor(4 + c.r() * (maxX - 4)), y = surf(c, x);
      if (y >= c.water - 3 || y <= c.sky || c.feats.some((f) => Math.abs(f.x - x) < 8)) continue;
      const f = { kind: c.th.hazard.kind, x, y: y - 0.3 }; if (f.kind === 'dud') f.fuse = 4 + Math.floor(c.r() * 3);
      c.feats.push(f); if (half) c.feats.push(Object.assign({}, f, { x: c.w - 1 - x })); i++;
    }
  }

  // ---------- checks ----------
  function surfaceY(m, x) { const cx = Math.max(0, Math.min(m.w - 1, Math.floor(x))); for (let y = 0; y < m.h; y++) if (m.T[y * m.w + cx]) return y; return m.h; }
  // A column is a good spawn if it and the columns 3 and 6 to each side all have dry ground under them
  // (Wormsbound's rule). spawnNear finds the nearest one to x, or -1.
  function spawnOK(m, s) { return s >= 4 && s < m.w - 4 && [s - 6, s - 3, s, s + 3, s + 6].every((c) => surfaceY(m, c) < m.water - 4); }
  function spawnNear(m, x, reach = m.w) { x = Math.round(x); for (let d = 0; d <= reach; d++) for (const s of [x + d, x - d]) if (spawnOK(m, s)) return s; return -1; }
  function check(m) {
    const problems = [], { w, h, T, water } = m, sky = Math.round(h * 0.1);
    let solid = 0, area = 0, massL = 0, massR = 0;
    for (let y = sky; y < water; y++) for (let x = 0; x < w; x++) { area++; if (T[y * w + x]) { solid++; if (x < w / 2) massL++; else massR++; } }
    const land = solid / area;
    if (land < 0.08) problems.push('too little land'); if (land > 0.8) problems.push('too much land');
    const bands = []; for (let b = 0; b < 8; b++) bands.push(spawnNear(m, w * (0.08 + 0.84 * (b + 0.5) / 8), Math.round(w / 16)) >= 0);
    const okBands = bands.filter(Boolean).length;
    if (okBands < 6) problems.push(`room to spawn in only ${okBands} of 8 spots`);
    if (!bands[0] && !bands[1]) problems.push('no spawn room on the far left'); if (!bands[6] && !bands[7]) problems.push('no spawn room on the far right');
    const tops = (a, b) => { let s = 0, k = 0; for (let x = a; x < b; x++) { const y = surfaceY(m, x); if (y < water) { s += y; k++; } } return k ? s / k : water; };
    const fair = Math.max(0, Math.round(100 - 100 * Math.abs(massL - massR) / Math.max(1, massL + massR) - 100 * Math.abs(tops(0, w / 2) - tops(w / 2, w)) / h));
    if (fair < 70) problems.push(`halves too different (fairness ${fair})`);
    return { ok: !problems.length, problems, land: Math.round(land * 100), spawnRoom: okBands, fairness: fair };
  }

  async function netStart(kind, mode) {
    const name = ($('#oName') && $('#oName').value.trim()) || 'Player'; lsSet('wb-name', name);
    const srv = serverURL(); if (!srv) return onlineScreen('No server address.');
    let code = (($('#oCode') && $('#oCode').value) || '').trim().toUpperCase();
    if (kind === 'create') {
      try { const r = await fetch(srv.replace(/^ws/, 'http') + '/new'); code = (await r.json()).code; }
      catch (e) { return onlineScreen("Couldn't reach the online server. Is it running?"); }
    } else if (!/^[A-Z]{4}$/.test(code)) return onlineScreen('Room codes are 4 letters.');
    netOpen(srv, code, kind === 'create' ? { t: 'create', name, mode: mode === 'ffa' || mode === 'teams' ? mode : 'duel' } : { t: 'join', name });
  }
  function netOpen(srv, code, hello) {
    netLeave(true);
    ui.mode = 'online';
    const net = ui.net = { srv, code, hello, queue: [], room: null, ws: null, token: null, waiting: false, retries: 0, closed: false, expect: null };
    const connect = () => {
      let ws; try { ws = new WebSocket(`${srv}/room/${code}`); } catch (e) { return onlineScreen("Couldn't open a connection to the server."); }
      net.ws = ws;
      ws.onopen = () => { net.retries = 0; ws.send(JSON.stringify(net.token ? { t: 'rejoin', token: net.token } : hello)); };
      ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onNet(m); };
      ws.onclose = () => {
        if (net.closed || ui.net !== net) return;
        if (!net.token) return onlineScreen("Couldn't join that room.");
        if (net.retries++ < 10) { banner('Connection lost', 'reconnecting…'); setTimeout(connect, 1500); }
        else { netLeave(); onlineScreen('Lost the connection to the room.'); }
      };
    };
    net.send = (m) => { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(m)); };
    // moves from the server are played in order, each only once the last shot has landed on this screen
    net.drain = () => {
      while (net.queue.length && ui.G && ui.G.phase !== 'flight' && !net.expect) {
        const m = net.queue.shift(), G = ui.G, u = WB.current(G), mine = teamRoom() ? !!u && u.own === ui.seat : m.by === ui.you; // was this move mine?
        if (!WB.act(G, m.it)) { net.send({ t: 'sync' }); net.queue = []; return; }
        if (m.it.k === 'weapon' && mine) ui.weapon = m.it.w;
        if ((m.it.k === 'fire' || m.it.k === 'lob') && u) { SFX.fire(); burst(...muzzle(u, aimOf(u)), 8, 'spark'); ui.cam.manual = false; ui.cam.over = false; }

    net.settled = () => {

      if (WB.hash(ui.G) !== net.expect) { net.send({ t: 'sync' }); net.queue = []; }
      net.expect = null;

    if (!reduced) { ctx.fillStyle = pulse > 0.5 ? '#FFD34D' : '#FF8A3D'; ctx.beginPath(); ctx.arc(x + 5, y - 15, 2 + pulse * 2, 0, 7); ctx.fill(); }
    if (d.fuse != null && !inFlight) {
      ctx.font = FONT(18); ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#1E1A2B'; ctx.strokeText(String(d.fuse), x, y - 20); ctx.fillStyle = d.fuse <= 1 ? '#FF4D5E' : '#FFD34D'; ctx.fillText(String(d.fuse), x, y - 20);
    }
  }
  // a map hazard (oil drum, gas canister, spore pod...): a drum in the theme's hazard colour with a warning band
  function drawBarrel(b) {
    const x = b.x * CELL, y = b.y * CELL;
    ctx.fillStyle = theme().hazard; ctx.strokeStyle = '#1E1A2B'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(x - 8, y - 18, 16, 18); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFD34D'; ctx.fillRect(x - 7, y - 11, 14, 4);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x - 5, y - 16, 3, 12);
  }
  function drawProj(p, t) {
    if (p.wait > 0) return; // Double Tap's second dart hasn't left yet
    const x = p.x * CELL, y = p.y * CELL;
    const tr = ui.trails[p.id] || (ui.trails[p.id] = []); tr.push([x, y]); if (tr.length > 26) tr.shift();
    ctx.lineCap = 'round';
    for (let i = 1; i < tr.length; i++) { ctx.strokeStyle = `rgba(255,243,224,${i / tr.length * 0.5})`; ctx.lineWidth = (i / tr.length) * (p.w === 'bomblet' ? 3 : 5); ctx.beginPath(); ctx.moveTo(tr[i - 1][0], tr[i - 1][1]); ctx.lineTo(tr[i][0], tr[i][1]); ctx.stroke(); }
    if (p.w === 'dud') { drawDud({ x: p.x, y: p.y + 5 / CELL, fuse: p.fuse }, t, true); return; }
    const LOOK = { tusk: 'brick', hopper: 'zip', flint: 'volt', patch: 'digger', nimbus: 'gale' }, c0 = p.char || ui.G.chars[p.team];
    const ch = p.w === 'gear' || p.w === 'frag' ? 'gear' : LOOK[c0] || c0, big = p.w === 'shot2' || p.w === 'ss', ang = Math.atan2(p.vy, p.vx);
    if (p.w === 'ss') { const g = ctx.createRadialGradient(x, y, 2, x, y, 24); g.addColorStop(0, 'rgba(255,211,77,.8)'); g.addColorStop(1, 'rgba(255,138,61,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 24, 0, 7); ctx.fill(); }
    ctx.strokeStyle = '#1E1A2B'; ctx.lineWidth = 2;
    if (ch === 'zip' || (ch === 'digger' && big)) { // darts and drills point where they fly
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      if (ch === 'zip') { ctx.fillStyle = '#FFD34D'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -4); ctx.lineTo(-3, 0); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      else { ctx.fillStyle = '#9A9CA3'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.strokeStyle = '#4A4D58'; for (let i = 0; i < 3; i++) { const sx = 6 - i * 4 - (t * 40 % 4); ctx.beginPath(); ctx.moveTo(sx, -4 + i); ctx.lineTo(sx - 2, 4 - i); ctx.stroke(); } }
      ctx.restore(); return;
    }
    const look = { brick: ['#5A5F6E', p.w === 'ss' ? 10 : big ? 8 : 6], volt: ['#4FB3FF', big ? 6.5 : 5.5], digger: ['#B2643A', 6], gale: ['#7BE07A', big ? 6.5 : 5.5], gear: ['#FFD34D', p.w === 'frag' ? 3.5 : 5.5] }[ch] || ['#3A3150', 5.5];
    if (ch === 'volt') { const g = ctx.createRadialGradient(x, y, 1, x, y, 16); g.addColorStop(0, 'rgba(143,216,255,.7)'); g.addColorStop(1, 'rgba(143,216,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill(); }
    if (ch === 'gale') { ctx.strokeStyle = '#FFF3E0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - p.vx * 0.4 + 4 * Math.sin(t * 20), y - p.vy * 0.4, x - p.vx * 0.7, y - p.vy * 0.7); ctx.stroke(); ctx.strokeStyle = '#1E1A2B'; }
    ctx.fillStyle = look[0]; ctx.beginPath(); ctx.arc(x, y, look[1], 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x - look[1] * 0.35, y - look[1] * 0.35, look[1] * 0.35, 0, 7); ctx.fill();
  }
  function drawAim(u, t) {
    const a = aimOf(u), [cx, cy] = WB.center(u), rad = a.angle * Math.PI / 180;
    const ox = cx * CELL, oy = cy * CELL, len = 26 + a.power * 46;
    // short preview of the first part of the arc (no wind: reading the wind is your job)
    const s = (ui.lob ? a.power * WB.LOB_POWER : a.power * WB.shotSpec(ui.G, u.team, ui.weapon).speed) * WB.VMAX;
    let px = cx + Math.cos(rad) * (WB.UNIT_R + 0.6), py = cy - Math.sin(rad) * (WB.UNIT_R + 0.6), vx = Math.cos(rad) * s, vy = -Math.sin(rad) * s;
    ctx.fillStyle = 'rgba(255,243,224,.85)';
    for (let i = 0; i < 16; i++) { for (let k = 0; k < 3; k++) { vy += WB.GRAV / 60; px += vx / 60; py += vy / 60; } const r = 3 - i * 0.13; if (r <= 0.6) break; ctx.beginPath(); ctx.arc(px * CELL, py * CELL, r, 0, 7); ctx.fill(); }
    // power arrow
    ctx.strokeStyle = '#1E1A2B'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(rad) * len, oy - Math.sin(rad) * len); ctx.stroke();
    const pc = a.power < 0.5 ? '#FFD34D' : a.power < 0.85 ? '#FF8A3D' : '#FF4D5E';
    ctx.strokeStyle = ui.lob ? '#22C3B5' : pc; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(rad) * len, oy - Math.sin(rad) * len); ctx.stroke();
    ctx.font = FONT(15); ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,26,43,.9)';
    const lab = `${Math.round(a.angle > 90 ? 180 - a.angle : a.angle)}° · ${Math.round(a.power * 100)}%${ui.lob ? ' · LOB' : ''}`;

    ctx.strokeText(lab, lx, ly); ctx.fillStyle = '#FFF3E0'; ctx.fillText(lab, lx, ly);
    if (ui.lob) { ctx.strokeStyle = 'rgba(34,195,181,.6)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ox, oy, WB.LOB_RANGE * CELL, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  }
  function drawWater(t) {
    const wy = ui.G.water * CELL, W = worldW(), H = worldH(); // the whole world, not just the screen
    const L = theme().liquid, g = ctx.createLinearGradient(0, wy, 0, H); g.addColorStop(0, L.top); g.addColorStop(1, L.deep);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) ctx.lineTo(x, wy + (reduced ? 0 : Math.sin(x / 40 + t * 2) * 3 + Math.sin(x / 17 - t * 3) * 1.5));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = L.foam; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= W; x += 16) { const y = wy + (reduced ? 0 : Math.sin(x / 40 + t * 2) * 3 + Math.sin(x / 17 - t * 3) * 1.5); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  }
  function draw(t, dt) {
    const G = ui.G;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!G) { ctx.drawImage(bgCv, 0, 0); return; }
    if (ui.terrainDirty) renderTerrain();
    camStep(dt);
    const sh = ui.shake, shx = sh > 0.3 ? (Math.random() - 0.5) * sh : 0, shy = sh > 0.3 ? (Math.random() - 0.5) * sh : 0, cam = ui.cam;
    ctx.setTransform(1, 0, 0, 1, shx, shy);
    const par = cam.on ? (cam.cx / worldW() - 0.5) * -30 : 0; // the far background slides a little as you look around
    ctx.drawImage(bgCv, -40 + par, -20, W + 80, H + 40);
    // clouds and dust drift with the wind: you can see it
    for (const c of ui.clouds) {
      c.x += G.wind * 2.2 * c.s * dt; if (c.x > W + 120) c.x = -120; if (c.x < -120) c.x = W + 120;
      ctx.fillStyle = 'rgba(255,230,210,.18)'; for (const [dx, dy, r] of [[0, 0, 26], [24, 6, 20], [-24, 8, 18], [8, -10, 18]]) { ctx.beginPath(); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 7); ctx.fill(); }
    }
    for (const d of ui.dust) {
      d.x += (G.wind * 22 + 6) * d.z * dt; d.y += Math.sin(t + d.x / 90) * 6 * dt;
      if (d.x > W) d.x = 0; if (d.x < 0) d.x = W;
      ctx.fillStyle = `rgba(255,236,200,${0.15 + d.z * 0.25})`; ctx.fillRect(d.x, d.y, 2 + d.z * 6 * Math.min(1, Math.abs(G.wind) / 3), 2);
    }
    ctx.setTransform(cam.z, 0, 0, cam.z, -cam.x * cam.z + shx, -cam.y * cam.z + shy); // from here on: world pixels

    for (const b of G.barrels) drawBarrel(b);
    for (const d of G.duds) drawDud(d, t, false);
    const cur = WB.current(G);
    for (const u of G.units) if (!u.alive) drawUnit(u, false, t);
    for (const u of G.units) if (u.alive) drawUnit(u, u === cur && G.phase === 'aim', t);
    if (online() && cur && G.phase === 'aim' && !myTurn()) { if (ui.remoteAim && performance.now() - ui.remoteAim.at < 4000) { const a = aimOf(cur); a.angle = ui.remoteAim.angle; a.power = ui.remoteAim.power; drawAim(cur, t); } }
    else if (cur && G.phase === 'aim' && ui.screen === 'game' && !ui.paused && (!isCPU(G.team) || (ui.cpu && ui.cpu.aimed))) drawAim(cur, t);
    for (const p of G.proj) drawProj(p, t);
    for (const id of Object.keys(ui.trails)) if (!G.proj.some((p) => String(p.id) === id)) delete ui.trails[id];
    for (const p of ui.parts) {
      const k = 1 - p.t / p.life;
      if (p.kind === 'bolt') {
        let s = p.seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
        const pts = [[p.x, 0]]; for (let yy = 40; yy < p.y; yy += 40) pts.push([p.x + (rnd() - 0.5) * 34, yy]); pts.push([p.x, p.y]);
        for (const [w, col] of [[10, `rgba(143,216,255,${k * 0.5})`], [4, `rgba(255,255,255,${k})`]]) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); pts.forEach(([a, b], i) => (i ? ctx.lineTo(a, b) : ctx.moveTo(a, b))); ctx.stroke(); }

        for (let i = 0; i < 9; i++) { const yy = p.y - i * 18 - p.t * 60, rr = 10 + i * 9 * (0.6 + p.t), a = t * 12 + i;
          ctx.strokeStyle = `rgba(200,255,220,${k * (0.75 - i * 0.06)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(p.x + Math.sin(a) * 6, yy, rr, rr * 0.28, 0, 0, 7); ctx.stroke(); }
        continue;

      if (p.kind === 'flash') { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); g.addColorStop(0, `rgba(255,250,220,${k})`); g.addColorStop(0.4, `rgba(255,180,80,${k * 0.8})`); g.addColorStop(1, 'rgba(255,120,60,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); continue; }

    }

  }

  // ---------- the clock ----------
  let lastTimerShown = -1;
  function frame(ts) {
    const now = ts / 1000, dt = Math.min(0.05, ui.last ? now - ui.last : 0.016); ui.last = now;
    const G = ui.G;

      } else if (online() && ui.net && ui.net.queue.length) {

      } else if (G.phase === 'aim' && isCPU(G.team)) {

      } else if (G.phase === 'aim' && ui.timerOn && (!online() || myTurn())) {
        const before = Math.ceil(ui.tLeft); ui.tLeft -= dt;
        if (Math.ceil(ui.tLeft) !== before && ui.tLeft <= 5 && ui.tLeft > 0) SFX.tick();
        if (ui.tLeft <= 0) { ui.tLeft = 0; pass(); }
      }

    get G() { return ui.G; }, ui, startMatch, levelScreen, squadScreen, chooseGear, gearScreen, camAct, camZoom, camPan, toWorld, onlineScreen, netStart, play, selectScreen, choose, startRound, roundOver, doFire, walk, pass, botTurn, renderAll: () => { renderHUD(); renderCtl(); coachLine(); },

  { const lv = lsGet('wb-level'); if (LEVELS[lv]) ui.level = lv; }

  requestAnimationFrame(frame);
})();
