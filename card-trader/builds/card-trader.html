<style>
/* Desktop-landscape stage: a fixed 1280x720 world scaled to fit the window (letterboxed).
   Look: cel-shaded street graffiti. Thick ink outlines, flat loud color, halftone, sticker panels tilted a few degrees. */
:root {
  --ink: #120A1F; --paper: #FFF6E3; --magenta: #FF2E93; --cyan: #19D3F0; --lime: #A6F01E; --sun: #FFD21F; --violet: #6A2BD9; --night: #1B0E33;
  --orange: #FF7A1A; --mint: #4CF2B5; --coral: #FF6B6B; --good: #2BD96B; --bad: #FF3B3B;
  --shell: #FF8FC7; --shell2: #19C8D8; --hive: #A6F01E; --hive2: #1A1A1A; --star: #8B5CF6; --star2: #FFD21F;
  --display: 'Bungee', 'Arial Black', Impact, sans-serif; --tag: 'Permanent Marker', 'Comic Sans MS', cursive; --body: 'Rubik', system-ui, 'Segoe UI', sans-serif;
  --ol: 3px solid var(--ink); --shadow: 5px 5px 0 var(--ink);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
body { font-family: var(--body); color: var(--ink); -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
#wrap { position: fixed; inset: 0; display: grid; place-items: center; background:
  radial-gradient(circle at 20% 20%, #3a1a6a 0, transparent 40%), radial-gradient(circle at 80% 80%, #5a1050 0, transparent 45%), var(--night); }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center center; overflow: hidden; background: #000; border: 4px solid var(--ink); box-shadow: 0 0 0 3px var(--magenta), 0 20px 60px rgba(0,0,0,.6); }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.bg::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.4px); background-size: 6px 6px; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,10,31,.55), rgba(18,10,31,.15) 30%, rgba(18,10,31,.35)); }

/* stickers / panels */
.panel { position: absolute; background: var(--paper); border: var(--ol); border-radius: 14px; box-shadow: var(--shadow); }
.tilt-l { transform: rotate(-1.6deg); } .tilt-r { transform: rotate(1.4deg); }
.h { font-family: var(--display); letter-spacing: .5px; line-height: 1; margin: 0; }
.tag { font-family: var(--tag); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 2.5px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; }
.btn { position: relative; color: var(--ink); border: var(--ol); background: var(--sun); border-radius: 12px; min-height: 44px; padding: 8px 18px; cursor: pointer; font-family: var(--display); font-size: 16px; letter-spacing: .5px; box-shadow: 4px 4px 0 var(--ink); transition: transform .08s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { transform: translate(-1px, -1px) rotate(-1deg); box-shadow: 5px 5px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.btn.pink { background: var(--magenta); color: #fff; } .btn.cyan { background: var(--cyan); } .btn.lime { background: var(--lime); } .btn.white { background: #fff; } .btn.dark { background: var(--ink); color: #fff; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
.btn.big { font-size: 26px; padding: 14px 30px; min-height: 64px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.muted { opacity: .7; }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 14px; z-index: 20; background: linear-gradient(90deg, var(--magenta), var(--violet) 55%, var(--cyan)); border-bottom: var(--ol); color: #fff; }
#hud .day { font-family: var(--display); font-size: 22px; text-shadow: 3px 3px 0 var(--ink); }
#hud .stat { background: var(--ink); border-radius: 10px; padding: 5px 12px; font-weight: 800; font-size: 17px; display: flex; gap: 6px; align-items: baseline; }
#hud .stat small { font-weight: 600; font-size: 11px; opacity: .75; text-transform: uppercase; letter-spacing: 1px; }
#hud .spacer { flex: 1; }
#hud .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; }
.cash { color: var(--sun); } .tabv { color: var(--coral); }

/* DJ ticker */
#dj { position: absolute; left: 14px; right: 14px; bottom: 10px; height: 64px; display: flex; align-items: center; gap: 12px; z-index: 15; background: var(--ink); color: #fff; border: 3px solid var(--sun); border-radius: 16px; padding: 6px 14px 6px 6px; box-shadow: 4px 4px 0 rgba(0,0,0,.5); }
#dj .face { width: 52px; height: 52px; border-radius: 12px; border: 2.5px solid var(--sun); background: var(--violet) center/cover; flex: none; }
#dj .who { font-family: var(--display); color: var(--sun); font-size: 13px; }
#dj .txt { font-size: 16px; line-height: 1.25; }
#dj .onair { margin-left: auto; font-family: var(--display); font-size: 11px; background: var(--bad); padding: 3px 8px; border-radius: 6px; animation: blink 1.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* customer */
#cust { left: 16px; top: 72px; width: 330px; height: 528px; padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.portrait { position: relative; height: 290px; border: var(--ol); border-radius: 10px; overflow: hidden; background: var(--cyan); }
.portrait .pic { position: absolute; inset: 0; background-size: cover; background-position: center top; }
.portrait .nameplate { position: absolute; left: 8px; bottom: 8px; background: var(--ink); color: #fff; font-family: var(--display); padding: 4px 10px; border-radius: 8px; font-size: 20px; transform: rotate(-3deg); }
.portrait .sp { position: absolute; right: 8px; top: 8px; }
.fallback-face { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 120px; color: rgba(255,255,255,.9); text-shadow: 6px 6px 0 var(--ink); }
.pips { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.pip { width: 14px; height: 14px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--lime); }
.pip.off { background: transparent; opacity: .35; }
.bubble { position: relative; background: #fff; border: var(--ol); border-radius: 16px; padding: 10px 12px; font-size: 16px; line-height: 1.3; font-weight: 600; min-height: 64px; }
.bubble::before { content: ''; position: absolute; left: 30px; top: -14px; border: 12px solid transparent; border-bottom-color: var(--ink); border-top: 0; }
.wants { font-size: 13px; font-weight: 700; }

/* the mat */
#mat { position: absolute; left: 360px; top: 300px; width: 548px; height: 300px; z-index: 4; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 10px; }
#mat.lot { top: 150px; height: 450px; gap: 8px; }
#idle { position: absolute; left: 360px; top: 300px; width: 548px; height: 290px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 4; }

/* deal box */
#deal { right: 16px; top: 72px; width: 350px; height: 528px; padding: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 5; overflow-y: auto; overflow-x: hidden; }
.price-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
.price-row .big { font-family: var(--display); font-size: 30px; }
.slider { width: 100%; accent-color: var(--magenta); height: 32px; }
.offer-val { font-family: var(--display); font-size: 34px; text-align: center; color: var(--magenta); text-shadow: 2px 2px 0 var(--ink); -webkit-text-stroke: 1px var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1; }
.est { font-size: 13px; background: #fff; border: 2px dashed var(--ink); border-radius: 10px; padding: 6px 8px; }
.stocklist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* cards */
.card { --w: 120px; position: relative; width: var(--w); aspect-ratio: 5 / 7; border: 3px solid var(--ink); border-radius: calc(var(--w) * .07); background: var(--fr, #fff); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; flex: none; transition: transform .12s; overflow: hidden; }
.card:hover { transform: translateY(-4px) rotate(-1.5deg); z-index: 3; }
.card.sm { --w: 92px; } .card.xs { --w: 74px; } .card.md { --w: 150px; } .card.lg { --w: 270px; cursor: default; } .card.lg:hover { transform: none; }
.card .inner { position: absolute; left: var(--l, 7%); right: var(--r, 7%); top: var(--t, 6%); bottom: var(--b, 6%); border: 2px solid var(--ink); border-radius: calc(var(--w) * .04); background: var(--fr2, #222); overflow: hidden; }
.card .art { position: absolute; left: 4%; right: 4%; top: 4%; height: 56%; border: 2px solid var(--ink); border-radius: 4px; background-color: #333; background-size: 200% 200%; overflow: hidden; }
.card .art .glyph-art { position: absolute; inset: 0; display: none; place-items: center; font-size: calc(var(--w) * .34); color: #fff; text-shadow: 3px 3px 0 var(--ink); }
/* until a game's card sheet exists, draw its emblem on a halftone gradient instead */
.noart-shell .card .art[data-g=shell], .noart-hive .card .art[data-g=hive], .noart-star .card .art[data-g=star] { background-image: radial-gradient(rgba(0,0,0,.25) 1px, transparent 1.5px), linear-gradient(160deg, var(--magenta), var(--violet)) !important; background-size: 5px 5px, 100% 100% !important; }
.noart-shell .card .art[data-g=shell] .glyph-art, .noart-hive .card .art[data-g=hive] .glyph-art, .noart-star .card .art[data-g=star] .glyph-art { display: grid; }
.card .name { position: absolute; left: 4%; right: 4%; top: 63%; height: 13%; background: rgba(255,255,255,.92); border: 2px solid var(--ink); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--w) * .085); line-height: 1; text-align: center; padding: 0 3px; overflow: hidden; }
.card .name svg { height: 80%; width: 92%; }
.card .gem { position: absolute; right: 6%; bottom: 5%; width: 18%; aspect-ratio: 1; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--w) * .08); background: #fff; }
.card .gameic { position: absolute; left: 6%; bottom: 6%; font-family: var(--display); font-size: calc(var(--w) * .07); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.card .holo { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .55; background: linear-gradient(115deg, transparent 20%, #ff6ad5 35%, #8af7ff 45%, #fffd8a 55%, transparent 70%); background-size: 250% 250%; animation: sheen 3.2s linear infinite; }
@keyframes sheen { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.card .wear { position: absolute; inset: 0; pointer-events: none; }
.card.uv { filter: hue-rotate(220deg) saturate(1.6) brightness(.8); }
.card .wm { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); width: 46%; aspect-ratio: 1; display: none; }
.card.uv .wm { display: block; filter: hue-rotate(-220deg) drop-shadow(0 0 6px #b9ff4a); }
.card .badge { position: absolute; top: 3px; right: 3px; z-index: 2; font-family: var(--display); font-size: 11px; padding: 2px 6px; border: 2px solid var(--ink); border-radius: 6px; background: var(--lime); }
.card .badge.fake { background: var(--bad); color: #fff; }
.card.sel { outline: 4px solid var(--magenta); outline-offset: 2px; }
.card.pick { outline: 4px dashed var(--lime); outline-offset: 2px; }
.slab { position: relative; padding: 26px 8px 8px; border: 3px solid var(--ink); border-radius: 12px; background: linear-gradient(160deg, rgba(255,255,255,.75), rgba(200,230,255,.45)); box-shadow: 4px 4px 0 var(--ink); }
.slab .lbl { position: absolute; left: 6px; right: 6px; top: 4px; height: 18px; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 11px; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; padding: 0 6px; }
.slab.halo .lbl { background: var(--sun); } .slab.quik .lbl { background: var(--cyan); }

/* loupe */
#loupe { position: absolute; inset: 58px 0 0 0; z-index: 30; display: grid; grid-template-columns: 330px 1fr; gap: 24px; padding: 30px 60px; background: rgba(18,10,31,.82); backdrop-filter: blur(3px); }
#loupe .side { color: #fff; display: flex; flex-direction: column; gap: 10px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.read { background: var(--paper); color: var(--ink); border: var(--ol); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 15px; }
.read dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; } .read dt { font-weight: 800; } .read dd { margin: 0; }
.cen-guide { position: absolute; inset: 0; pointer-events: none; }
.zoomrow { display: flex; gap: 10px; }
.zoom { width: 96px; height: 96px; border: var(--ol); border-radius: 50%; overflow: hidden; background: #fff; position: relative; box-shadow: 3px 3px 0 var(--ink); }

/* overlays: morning, close, card night, end */
.sheet { position: absolute; z-index: 10; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 120px 1fr 52px; gap: 8px; align-items: center; font-weight: 800; }
.bar .track { height: 22px; border: 2.5px solid var(--ink); border-radius: 8px; background: #fff; overflow: hidden; }
.bar .fill { height: 100%; }
.ledger { width: 100%; border-collapse: collapse; font-size: 14px; } .ledger td { padding: 3px 4px; border-bottom: 1.5px dashed rgba(18,10,31,.25); } .ledger td:last-child { text-align: right; font-weight: 800; }
.pos { color: #0a8a3e; } .neg { color: #c41d1d; }
.stamp { font-family: var(--display); font-size: 60px; color: var(--magenta); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); transform: rotate(-8deg); animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: scale(3) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
.pop { animation: pop .35s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.wobble { animation: wob .5s ease-in-out; } @keyframes wob { 25% { transform: rotate(-4deg) scale(1.04); } 75% { transform: rotate(3deg); } }
.flipin { animation: flipin .5s ease-out both; } @keyframes flipin { from { transform: rotateY(90deg) translateY(-30px); } to { transform: none; } }
.title-logo { font-family: var(--display); color: #fff; font-size: 74px; line-height: .9; text-shadow: 6px 6px 0 var(--ink), -2px -2px 0 var(--magenta); -webkit-text-stroke: 2.5px var(--ink); transform: rotate(-4deg); }
.title-logo span { color: var(--sun); display: block; font-size: 44px; }
.toast { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); z-index: 50; background: var(--sun); border: var(--ol); border-radius: 12px; padding: 8px 18px; font-family: var(--display); box-shadow: var(--shadow); animation: pop .3s both; }
.owner { position: fixed; right: 8px; bottom: 6px; z-index: 80; font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.55); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
// Intergalactic Card Trader · v1 engine. Pure: seeded RNG, no DOM, runs in node (sim.js) and the browser.

(function (root) {
'use strict';

// ---------- seeded RNG ----------
function rng(seed) {
  let a = seed >>> 0;
  return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const R = (G) => G._r();
const pick = (G, arr) => arr[Math.floor(R(G) * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const gauss = (G) => (R(G) + R(G) + R(G) - 1.5) * 1.15; // cheap bell curve, sd ~1

// ---------- the world ----------
const SPECIES = {
  mollu: { name: 'Mollu', game: 'shell', patience: 12, conc: 0.22, insultAt: 0.62, insultCost: 3, flaw: 0.10, roundBonus: 0.15 },

    cards: ['Drone Unit', 'Pollen Scout', 'Gear Mite', 'Wax Builder', 'Buzz Bot', 'Antenna Tech', 'Larva Cache', 'Swarm Token',
            'Stinger Mk II', 'Honey Engineer', 'Mantis Lancer', 'Comb Fortress',

const RARITY_BY_INDEX = i => i < 8 ? 'c' : i < 12 ? 'u' : i < 15 ? 'r' : i < 17 ? 'h' : 'g';

const PACK_RETAIL = 28;

const FLUENT_AT = 3;

// Named regulars. askMul/floorMul shape them as sellers (vs what they believe it's worth); ceilMul as buyers.

  tumbo:  { name: 'Tumbo',  species: 'mollu', askMul: 1.3, floorMul: 0.8, ceilMul: 1.15, line: 'a teen who is bad at hiding excitement' },
  sheelo: { name: 'Sheelo', species: 'mollu', askMul: 1.25, floorMul: 0.82, ceilMul: 0.95, line: 'a dealer who can\'t read other species\' scripts' },

// ---------- cards ----------
const tid = (game, i) => game + '-' + i;

}

  const c = { uid: 'c' + (++G._uid), t: tid(game, rollIdx(G, rarity)), cen: at(), edg: at(), sur: at(), fake: null, graded: null,
    know: { loupe: false, uv: false, read: !!opts.read }, cost: 0, flawUsed: false };

  if (opts.mint) { c.cen = Math.max(c.cen, 9); c.edg = Math.max(c.edg, 9); c.sur = Math.max(c.sur, 9); }
  return c;
}

// ---------- value ----------
function demandOf(G, game) { return (G.demand[game] || 1) + (G.dayIdx === 2 ? (G.hype[game] || 0) : 0); }
function hot(G, c) { return G.hotList.indexOf(c.t) >= 0 ? 1.5 : 1; }
// What the card is really worth to a buyer today (they can see the real condition).
function trueValue(G, c, demand) {

// The player's best guess from what they've learned. Bots use only this.

  const rar = own ? tm.rarity : (RANK[tm.rarity] >= 2 ? 'u' : tm.rarity); // misreads rares and up as "some uncommon"

// ---------- state ----------
function newGame(seed) {

    stock: [], packs: { shell: 2, hive: 2, star: 2 }, bulk: 12, fluency: { shell: 0, hive: 0, star: 0 },
    grading: [], demand: {}, hotList: [], hype: { shell: 0, hive: 0, star: 0 },
    visitIdx: -1, visit: null, ledger: [], days: [], say: null, events: [], complaints: [],

    startValue: 0, log: [] };
  G._r = rng(seed || 1);
  // starting case: a few singles you already know
  for (const [g, r] of [['shell', 'u'], ['shell', 'c'], ['hive', 'u'], ['star', 'r'], ['star', 'c'], ['hive', 'c']]) {
    const c = makeCard(G, g, r, 7.2, { read: true }); c.know.loupe = true; c.know.uv = true; c.cost = Math.round(trueValue(G, c, 1)); G.stock.push(c);
  }

const findStock = (G, uid) => G.stock.find(c => c.uid === uid);
const visitCard = (G, uid) => G.visit && (G.visit.cards || []).find(c => c.uid === uid);

// ---------- days ----------
function startDay(G) {

  for (const k of G.complaints) { money(G, -k.price, 'refund', 'Refund: ' + k.who + ' found a fake'); G.rep = clamp(G.rep - 8, 0, 100); event(G, { t: 'complaint', who: k.who, price: k.price }); }
  G.complaints = [];

}
function resolveGrades(G, all) {

    const c = p.card;

// ---------- customers ----------
function spawnVisit(G, spec) {
  const P = PEOPLE[spec.who], S = SPECIES[P.species];
  const v = { who: spec.who, species: P.species, role: spec.role, wants: spec.wants || null, patience: S.patience + (spec.role === 'lot' ? 6 : 0),
    maxPatience: 0, cards: [], ask: 0, floor: 0, bid: 0, ceil: 0, showing: null, rounds: 0, done: false, packs: 0, result: null };
  if (spec.role === 'sell' || spec.role === 'lot' || spec.role === 'bulk') {

    for (let k = 0; k < (spec.fakes || 0); k++) fakeAt.push((gem + 1 + k * 3) % spec.n);

      const rar = isGem ? spec.gem : spec.role === 'bulk' ? (R(G) < 0.2 ? 'u' : 'c') : rollRarity(G, false);
      const isFake = fakeAt.indexOf(i) >= 0;

}

}

function buyerValue(G, v, c) {

const LINES = {

    counter: ['Mmm. How about {p}?', 'I could slide to {p}, slowly.'], insult: ['Oh my. That\'s rather low, dear.', 'My shell is shrinking at that number.'],
    round: ['Ooh, a nice round number. I do like those.'], deal: ['Lovely doing business.', 'You have a kind eye.'], walk: ['I think I\'ll keep them a while longer.'],
    flaw: ['Oh! I hadn\'t seen that. Fine, fine.'], buyHello: ['I\'m looking for {w}.'] },
  zekk: { hello: ['Yo yo yo, fast deal, fast deal!', 'Four hands, zero time. Let\'s go.'],
    counter: ['Split it: {p}.', '{p}. Final-ish. Go!'], insult: ['HA. No. Insulting.', 'Bzzt. Try again, rookie.'],
    round: [], deal: ['DONE. Pleasure.', 'Bzz! Deal!'], walk: ['Too slow! I\'m out.'],
    flaw: ['Pfft. Scratches add character. Small cut.'], buyHello: ['Got {w}? Quick quick.'] },
  puffi: { hello: ['H-hi! I love your shop!', 'Hello! *floats nervously*'],
    counter: ['Um... {p}?', 'Would {p} be okay?'], insult: ['*sniff* That hurts my fluff.', 'Oh... no...'],
    round: [], deal: ['Yay! Thank you!', '*happy spin*'], walk: ['I... I have to go. Sorry!'],

function line(G, v, key, p) { const L = LINES[v.species][key]; if (!L || !L.length) return null; return pick(G, L).replace('{p}', p != null ? p + '₵' : '').replace('{w}', wantsText(v.wants)); }

// ---------- act: the only way state changes ----------
function act(G, it) {
  const v = G.visit;
  switch (it.t) {
    case 'start': if (G.phase !== 'title') return err('not now'); startDay(G); return ok();
    case 'open': if (G.phase !== 'morning') return err('not now'); G.phase = 'shop'; say(G, 'vee', 'Doors open! First customer\'s at the counter.'); return ok();
    case 'next': {
      if (G.phase !== 'shop') return err('finish this customer first');
      const D = DAYS[G.dayIdx];
      if (G.visitIdx + 1 >= D.visitors.length) { closeShop(G); return ok(); }
      G.visitIdx++; G.visit = spawnVisit(G, D.visitors[G.visitIdx]); G.phase = 'visit';
      const nv = G.visit;
      if (nv.role === 'bulk') { // Nubb digs the bin first
        const n = Math.min(G.bulk, 8); if (n) { G.bulk -= n; money(G, n, 'bulk', PEOPLE[nv.who].name + ' dug ' + n + ' from the bulk bin'); }
        say(G, nv.who, (n ? 'I dug ' + n + ' cards outta your bin! ' : '') + 'Wanna buy my whole shoebox? ' + nv.ask + '₵!');
      } else if (nv.role === 'sell' || nv.role === 'lot') say(G, nv.who, line(G, nv, 'hello') + ' ' + (nv.role === 'lot' ? 'The whole binder page' : nv.cards.length > 1 ? 'These ' + nv.cards.length : 'This one') + ' for ' + nv.ask + '₵.');
      else if (nv.role === 'sealed') say(G, nv.who, 'Any sealed packs? I want ' + nv.packs + '!');
      else say(G, nv.who, line(G, nv, 'buyHello'));

    }
    case 'inspect': {
      if (G.phase !== 'visit' && G.phase !== 'shop' && G.phase !== 'close' && G.phase !== 'cardnight') return err('not now');
      const c = visitCard(G, it.uid) || findStock(G, it.uid); if (!c) return err('no card');
      const atCounter = G.phase === 'visit' && v && v.cards.indexOf(c) >= 0;
      if (it.tool === 'translate') {
        if (readable(G, c)) return err('already readable');
        if (G.cash < TRANSLATE_FEE) return err('not enough cash');
        money(G, -TRANSLATE_FEE, 'fee', 'Translator'); c.know.read = true; return ok();
      }
      const key = { loupe: 'loupe', uv: 'uv', read: 'read' }[it.tool]; if (!key) return err('bad tool');
      if (key === 'read' && readable(G, c)) return err('already readable');
      if (c.know[key]) return ok();
      c.know[key] = true;
      if (key === 'read') { const g = tmpl(c.t).game; G.fluency[g]++; if (G.fluency[g] === FLUENT_AT) event(G, { t: 'fluent', game: g }); }
      if (key === 'uv' && c.fake) { G.stats.fakesCaught++; event(G, { t: 'fakeFound', uid: c.uid }); }

      const c = visitCard(G, it.uid); if (!c || !c.know.loupe || c.flawUsed) return err('no flaw to point at');
      if (Math.min(c.cen, c.edg, c.sur) > 6 && !(c.know.uv && c.fake)) return err('it looks clean');
      c.flawUsed = true;

      say(G, v.who, (c.fake && c.know.uv ? 'Wh-what? That one\'s... not mine! ' : line(G, v, 'flaw')) + ' ' + v.ask + '₵.');
      return ok();
    }
    case 'show': {
      if (G.phase !== 'visit' || !v || !(v.role === 'buy' || v.role === 'flip')) return err('not now');
      const c = findStock(G, it.uid); if (!c) return err('no card');
      if (!matches(G, v.wants, c)) { say(G, v.who, 'Hmm, that\'s not what I\'m after.'); costPatience(G, 1); return ok(); }
      v.showing = c.uid; startHaggleBuyer(G, v, buyerValue(G, v, c)); v.rounds = 0;

      v.packs = Math.min(v.packs, have);

      startHaggleBuyer(G, v, per * v.packs * PEOPLE[v.who].ceilMul); v.showing = 'packs';
      say(G, v.who, v.packs + ' packs? I\'ll give ' + v.bid + '₵ for the lot.');

    }

    case 'accept': {
      if (G.phase !== 'visit' || !v) return err('not now');

      return dealBuy(G, v.ask);
    }
    case 'pass': {
      if (G.phase !== 'visit' || !v) return err('not now');

      endVisit(G, 'pass'); return ok();
    }
    case 'crack': {

      if (!G.packs[it.game]) return err('no packs of that game');
      G.packs[it.game]--; G.stats.cracked++;

      return ok({ pulled });
    }
    case 'toBulk': {
      if (G.phase !== 'shop' && G.phase !== 'close') return err('not now');
      const c = findStock(G, it.uid); if (!c) return err('no card');

    }
    case 'grade': {

      const c = findStock(G, it.uid), co = GRADERS[it.co]; if (!c || !co) return err('bad card or grader');
      if (c.graded) return err('already slabbed');

      money(G, -co.fee, 'fee', co.name + ' grading fee');
      G.stock.splice(G.stock.indexOf(c), 1);
      G.grading.push({ card: c, co: it.co, due: G.dayIdx + co.days, roll: R(G) });
      return ok();
    }
    case 'restock': {
      if (G.phase !== 'close') return err('restock at close');

    }
    case 'endDay': {

// ---------- coach: one hint at a time, tied to what's on the counter ----------
function hint() {
  const G = UI.G, v = G.visit;
  if (G.say && G.say.who === 'vee' && (G.phase === 'morning' || G.phase === 'close' || G.phase === 'cardnight' || G.phase === 'end')) return G.say.text;
  if (G.phase === 'shop') {
    if (G.visitIdx < 0) return G.say && G.say.who === 'vee' ? G.say.text : 'Doors are open. Tap NEXT CUSTOMER.';
    return 'Breather! Rip a pack from the back room, check your Stock, or bring in the next customer.';
  }
  if (G.phase !== 'visit' || !v) return '';
  const looked = v.cards.some(c => c.know.loupe || c.know.uv || c.know.read);
  if (v.role === 'sell' || v.role === 'lot' || v.role === 'bulk') {
    if (!looked) return v.role === 'lot' ? 'A whole binder page for one price! Tap cards to inspect. Unreadable scripts hide the big finds, and there\'s often a fake: try the UV lamp.' : 'Tap a card to put it under the Loupe. Each tool costs the customer 1 patience, so pick what matters.';
    if (v.cards.some(c => c.know.loupe && !c.flawUsed && Math.min(c.cen, c.edg, c.sur) <= 6)) return 'You found a flaw! POINT OUT FLAW knocks their price down.';
    return v.species === 'mollu' ? 'Mollu love round numbers: offers ending in 0 make them come down faster.' : v.species === 'zekk' ? 'Zekk split the difference fast but walk fast too.' : 'Puffi care about condition above all. A flaw hits them hard.';
  }
  if (v.role === 'sealed') return v.showing ? 'Name your price for the packs, or take their bid.' : 'They want sealed packs. SHOW PACKS to hear an offer.';
  if (!v.showing) return 'They want ' + CT.wantsText(v.wants) + '. Pick a card from your stock on the right. Today\'s demand and the hot list raise what buyers pay.';
  return 'Name your price. Push too far past what it\'s worth and they\'ll get insulted.';
}

    <div class="price-row" style="margin-top:10px"><span>Rent due</span><span class="big neg">${money(D.rent)}</span></div>
    <div style="font-size:13px">${G.cash < D.rent ? 'Short on rent: the rest goes on a tab, and the tab comes off your final score.' : 'Rent is paid when you end the day.'}</div>
  </div>
  <div class="panel" style="left:416px;top:76px;width:470px;height:520px;padding:14px;overflow:auto">
    <div class="h" style="font-size:24px">SEND TO A GRADER</div>
    <div style="font-size:13px;margin:4px 0 8px"><b>QuikSlab</b> ${CT.GRADERS.quik.fee}₵, back tomorrow, ±1 grade. <b>Halo Bureau</b> ${CT.GRADERS.halo.fee}₵, back in 2 days, exact, pays the most. A slab only pays off at grade 9 or 10.${!next ? ' <b>Tonight is Grade Day: everything comes home.</b>' : ''}</div>
    <div class="stocklist">${gradeable.map(c => `<div style="text-align:center">${card(c, { size: 'xs', act: 'loupe' })}<div style="font-size:12px;font-weight:800">${estText(c)}</div>
      <div class="row" style="gap:4px;margin-top:4px"><button class="btn sm cyan" data-act="grade" data-co="quik" data-uid="${c.uid}" style="padding:2px 6px">QUIK</button><button class="btn sm" data-act="grade" data-co="halo" data-uid="${c.uid}" style="padding:2px 6px">HALO</button></div></div>`).join('')}</div>
    ${G.grading.length ? `<div style="margin-top:10px;font-size:13px">At the graders: ${G.grading.map(p => (CT.readable(G, p.card) ? CT.tmpl(p.card.t).name : 'a card') + ' (' + CT.GRADERS[p.co].name + ')').join(', ')}</div>` : ''}
  </div>
  <div class="panel tilt-r" style="right:20px;top:76px;width:360px;height:520px;padding:14px">
    <div class="h" style="font-size:24px">${next ? 'TOMORROW: ' + esc(next.name.toUpperCase()) : 'LAST NIGHT'}</div>
    ${next ? demandBars(next.demand) + `<div class="h" style="font-size:16px;margin:12px 0 6px">RESTOCK · box of ${CT.BOX.packs} for ${CT.BOX.cost}₵</div>
      ${Object.keys(CT.GAMES).map(g => `<div class="row" style="align-items:center;margin-bottom:6px"><span class="chip" style="background:${GAME_COLOR[g]};flex:1">${CT.GAMES[g].name} · have ${G.packs[g]}</span><button class="btn sm" data-act="restock" data-game="${g}" ${G.cash >= CT.BOX.cost ? '' : 'disabled'}>BUY BOX</button></div>`).join('')}` : '<div style="margin:10px 0">No tomorrow: sell-off is over. Grade anything worth slabbing, then end the night.'}
    <div style="margin-top:auto;position:absolute;left:14px;right:14px;bottom:14px"><button class="btn big pink" style="width:100%" data-act="endDay">${next ? (D.cardNight ? 'PAY RENT → CARD NIGHT' : 'PAY RENT · END DAY') : 'PAY RENT → GRADE DAY'}</button></div>
  </div>
  ${dj(hint())}`;
}

function nightScreen() {
  const G = UI.G, done = G.events.find(e => e.t === 'cardNight');
  const g = UI.nightGame || Object.keys(G.packs).sort((a, b) => G.packs[b] - G.packs[a])[0];
  UI.nightGame = g; const maxN = Math.min(6, G.packs[g]); UI.nightN = Math.min(UI.nightN, maxN);
  let body;
  if (!done) body = `<div class="h" style="font-size:20px">FEATURE A GAME</div>
    <div class="row" style="margin:8px 0">${Object.keys(CT.GAMES).map(k => `<button class="btn ${k === g ? 'pink' : 'white'}" data-act="nightGame" data-game="${k}">${CT.GAMES[k].name} (${G.packs[k]})</button>`).join('')}</div>
    <div>Rip <b id="nightv">${UI.nightN}</b> pack${UI.nightN === 1 ? '' : 's'} live on Floss's stream. Every holo or grail you pull adds hype: tomorrow's demand for ${CT.GAMES[g].name} goes up. The crowd buys a few packs and your rep rises.</div>
    <input id="nightn" class="slider" type="range" min="0" max="${maxN}" value="${UI.nightN}" aria-label="Packs to rip">
    <div class="row"><button class="btn big pink" data-act="rip">RIP LIVE!</button></div>`;
  else {
    const pulls = done.uids.map(u => G.stock.find(c => c.uid === u)).filter(Boolean);
    body = `<div class="h" style="font-size:26px">${done.grail ? 'A GRAIL ON STREAM!!' : done.holo ? 'HOLO HYPE!' : 'WHAT A NIGHT'}</div>
      <div class="row" style="margin:10px 0;max-height:300px;overflow:auto">${pulls.map((c, i) => `<div class="flipin" style="animation-delay:${i * .06}s">${card(c, { size: 'xs', act: 'loupe' })}</div>`).join('')}</div>
      <div>${CT.GAMES[done.game].name} hype <b>+${Math.round(done.hype * 100)}%</b> tomorrow · crowd bought ${done.sold} packs · rep +6</div>
      <div class="row" style="margin-top:12px"><button class="btn big pink" data-act="nextMorning">NEXT MORNING ▶</button></div>`;
  }
  return `${hud()}${bg('cardnight', .25)}<div class="panel tilt-r" style="left:200px;top:110px;width:880px;padding:18px">${body}</div>${dj(hint())}`;
}

function endScreen() {
  const G = UI.G, F = G.final, S = G.stats;
  const best = S.bestFlip ? `${CT.tmpl(S.bestFlip.t).name}: +${S.bestFlip.flip}₵` : '—';
  const bg_ = S.bestGrade ? `${CT.tmpl(S.bestGrade.t).name}: ${CT.GRADERS[S.bestGrade.co].name} ${S.bestGrade.grade}` : '—';
  const ev = eventsHTML(G.events);
  return `${hud()}${bg('grader', .3)}
  ${ev ? `<div class="panel tilt-l" style="left:30px;top:80px;width:600px;padding:14px"><div class="h" style="font-size:24px">GRADE DAY</div><div class="row" style="margin-top:10px;gap:18px">${ev}</div></div>` : ''}
  <div class="panel tilt-r" style="right:40px;top:90px;width:560px;padding:18px">
    <div class="h" style="font-size:30px">THREE DAYS ON THE STRIP</div>
    <div class="stamp" style="font-size:44px;margin:14px 0">${esc(F.rank.toUpperCase())}</div>
    <div class="price-row"><span>Shop value</span><span class="big">${money(F.value)}</span></div>
    <div class="price-row"><span>You started with</span><span>${money(F.start)}</span></div>
    <div class="price-row"><span>Change</span><span class="${F.gain >= 0 ? 'pos' : 'neg'}" style="font-family:var(--display);font-size:22px">${F.gain >= 0 ? '+' : ''}${F.gain}₵</span></div>
    <table class="ledger" style="margin-top:10px">
      <tr><td>Best flip</td><td>${esc(best)}</td></tr><tr><td>Best grade</td><td>${esc(bg_)}</td></tr>
      <tr><td>Fakes caught</td><td>${S.fakesCaught}</td></tr><tr><td>Fakes sold</td><td>${S.fakesSold}</td></tr>
      <tr><td>Deals</td><td>${S.deals}</td></tr><tr><td>Packs ripped</td><td>${S.cracked}</td></tr>${F.tab ? `<tr><td>Unpaid tab</td><td class="neg">−${F.tab}</td></tr>` : ''}
    </table>
    <div class="row" style="margin-top:14px"><button class="btn big pink" data-act="again">PLAY AGAIN</button></div>
  </div>${dj(hint())}`;
}

// ---------- input ----------
function onClick(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (!MUSIC.on && !UI.muted) MUSIC.start();
  const a = el.dataset.act, G = UI.G, v = G.visit, uid = el.dataset.uid || el.closest('[data-uid]') && el.closest('[data-uid]').dataset.uid;
  let r = null;
  switch (a) {
    case 'start': r = act({ t: 'start' }); break;
    case 'open': r = act({ t: 'open' }); break;
    case 'next': UI.lastPull = null; r = act({ t: 'next' }); UI.offer = 0; break;
    case 'loupe': UI.sel = uid; UI.uvView = false; UI.stock = false; break;
    case 'closeLoupe': UI.sel = null; break;
    case 'uvview': UI.uvView = !UI.uvView; break;
    case 'tool': { const t = el.dataset.tool; r = act({ t: 'inspect', uid: UI.sel, tool: t }); if (t === 'uv' && r.ok) UI.uvView = true;
      const c = G.stock.find(x => x.uid === UI.sel) || (v && v.cards.find(x => x.uid === UI.sel)); if (t === 'uv' && c && c.fake) MUSIC.sting('fake');
      if (!G.visit && v) UI.sel = null; break; }
    case 'flaw': { const target = el.dataset.uid || (v && (v.cards.find(c => c.know.loupe && !c.flawUsed && (Math.min(c.cen, c.edg, c.sur) <= 6 || (c.know.uv && c.fake))) || {}).uid); r = act({ t: 'flaw', uid: target }); UI.sel = null; break; }
    case 'offer': r = act({ t: 'offer', price: UI.offer }); break;
    case 'accept': r = act({ t: 'accept' }); break;
    case 'pass': r = act({ t: 'pass' }); break;
    case 'show': r = act({ t: 'show', uid }); UI.offer = 0; break;
    case 'showPacks': r = act({ t: 'showPacks' }); UI.offer = 0; break;
    case 'crack': r = act({ t: 'crack', game: el.dataset.game }); if (r.ok) { UI.lastPull = r.pulled; MUSIC.sting('rip'); } break;
    case 'toBulk': r = act({ t: 'toBulk', uid: UI.sel }); UI.sel = null; break;
    case 'grade': r = act({ t: 'grade', uid, co: el.dataset.co }); if (r.ok) toast('Sent to ' + CT.GRADERS[el.dataset.co].name); break;
    case 'restock': r = act({ t: 'restock', game: el.dataset.game }); if (r.ok) toast('+' + CT.BOX.packs + ' ' + CT.GAMES[el.dataset.game].name + ' packs'); break;
    case 'endDay': r = act({ t: 'endDay' }); if (G.phase === 'end') MUSIC.sting('grade'); break;
    case 'nightGame': UI.nightGame = el.dataset.game; UI.nightN = Math.min(3, G.packs[el.dataset.game]); break;
    case 'rip': r = act({ t: 'cardNight', game: UI.nightGame, n: UI.nightN }); MUSIC.sting('rip'); break;
    case 'nextMorning': r = act({ t: 'nextMorning' }); UI.nightGame = null; break;
    case 'stock': UI.stock = !UI.stock; UI.sel = null; break;
    case 'music': if (MUSIC.on) { MUSIC.stop(); UI.muted = true; } else { MUSIC.start(); UI.muted = false; } break;
    case 'again': newRun(); return;
  }
  if (v && !G.visit && G.lastVisit === v) { MUSIC.sting(v.result === 'deal' ? 'deal' : 'walk'); UI.sel = null; }
  for (const ev of G.events.slice(UI.seenEvents)) { if (ev.t === 'fluent') toast('You can read ' + CT.GAMES[ev.game].name + ' now!'); if (ev.t === 'fakeFound') toast('FAKE spotted!'); }
  UI.seenEvents = G.events.length;
  render();
}
function onInput(e) { if (e.target.id === 'nightn') { UI.nightN = +e.target.value; const n = $('#nightv'); if (n) n.textContent = UI.nightN; } }
function onKey(e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-act]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && (UI.sel || UI.stock)) { UI.sel = null; UI.stock = false; render(); } }

// Mark card sheets that haven't been made yet, so cards fall back to a drawn emblem.
function probeArt() { for (const g of Object.keys(CT.GAMES)) { const im = new Image(); im.onerror = () => document.body.classList.add('noart-' + g); im.src = 'img/cards-' + g + '.jpg'; } }
function boot() {
  probeArt(); fit(); addEventListener('resize', fit);
  const st = $('#stage'); st.addEventListener('click', onClick); st.addEventListener('input', onInput); st.addEventListener('keydown', onKey);
  newRun();
}
root.CTUI = UI; root.CTUI.render = render; root.CTUI.newRun = newRun;
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(this);

</script>
</body>
</html>
