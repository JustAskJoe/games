<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cyberpunk Gate Runner · Prototype 2</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070B1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#F2EFE6; --mute:#B9B4CC; --dim:#8A85A3; --night:#070B1F; --panel:#0F1433; --panel2:#1A2050;
  --pink:#FF3DA8; --pink2:#FF7AD0; --cyan:#3DF0FF; --violet:#8B5CFF; --gold:#FFB547; --green:#4BFFA5; --red:#FF4D6D; --line:rgba(242,239,230,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none}
#game.idle .hud{display:none}
.hud{position:absolute;pointer-events:none;font-weight:700;background:rgba(5,6,18,.62);border:1px solid rgba(61,240,255,.18);border-radius:12px;padding:8px 12px}
#hudL{top:calc(10px + var(--sat));left:calc(10px + var(--sal));max-width:56vw}
#hudL .a{font-size:14px;color:var(--pink2);letter-spacing:.5px} #hudL .b{font-size:12px;color:var(--mute);font-weight:500;margin-top:2px;line-height:1.35}
#hudR{top:calc(10px + var(--sat));right:calc(10px + var(--sar));text-align:right;min-width:112px}
#hudR .n{font-size:22px;color:var(--cyan);line-height:1} #hudR .n small{font-size:11px;color:var(--mute);font-weight:500;margin-left:4px}
#hudR .oc{font-size:10px;color:var(--mute);margin-top:6px;letter-spacing:1px}
#hudR .bar{height:7px;border-radius:4px;background:rgba(242,239,230,.15);margin-top:3px;overflow:hidden} #hudR .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .2s}
#hudR.on .bar i{background:linear-gradient(90deg,#fff,var(--gold))} #hudR .w{font-size:11px;color:var(--gold);margin-top:5px}
#menuBtn,#muteBtn{position:absolute;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(5,6,18,.62);color:var(--ink);font:700 18px 'Space Grotesk',system-ui,sans-serif;z-index:5;cursor:pointer}
#menuBtn{bottom:calc(14px + var(--sab));right:calc(10px + var(--sar))} #muteBtn{bottom:calc(14px + var(--sab));right:calc(62px + var(--sar))}
#menuBtn:focus-visible,#muteBtn:focus-visible{outline:3px solid var(--cyan)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));background:rgba(4,5,16,.84);overflow-y:auto}
.sheet[hidden]{display:none}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:auto}
.card h1{margin:0 0 6px;font-size:40px;letter-spacing:2px;line-height:1}
.card h1 .p{color:var(--pink)} .card h1 .c{color:var(--cyan)}
.card h2{margin:0 0 10px;font-size:22px}
.card p{margin:0 0 12px;color:var(--mute);line-height:1.5;font-size:15px}
.tag{display:inline-block;font-size:12px;color:var(--gold);border:1px solid rgba(255,181,71,.4);border-radius:99px;padding:3px 10px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px 'Space Grotesk',system-ui,sans-serif;margin-top:10px;cursor:pointer}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#1A0414}
.btn.cy{background:var(--cyan);border-color:var(--cyan);color:#022A30}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.row{display:flex;gap:10px} .row .btn{flex:1}
.steps{list-style:none;padding:0;margin:0 0 6px;counter-reset:s}
.steps li{position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--panel2);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:700}
b.p{color:var(--pink2)} b.c{color:var(--cyan)} b.g{color:var(--gold)} b.gr{color:var(--green)} b.r{color:var(--red)}
.big{font-size:64px;font-weight:700;line-height:1;margin:6px 0;color:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--mute)}
.note{font-size:14px;background:rgba(61,240,255,.08);border:1px solid rgba(61,240,255,.25);border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.45}
.fq{border-top:1px solid var(--line);padding:12px 0}
.fq .q{font-size:15px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:500 14px 'Space Grotesk',system-ui,sans-serif;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--cyan);color:#022A30;border-color:var(--cyan);font-weight:700}
textarea,input.tx{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:15px 'Space Grotesk',system-ui,sans-serif;padding:10px}
textarea{min-height:80px} input.tx{min-height:44px;margin-top:8px}
.err{color:#FF8A80;font-size:13px;margin-top:6px;min-height:1em}
.mark{position:fixed;left:calc(8px + var(--sal));bottom:calc(4px + var(--sab));font-size:10px;color:rgba(242,239,230,.45);z-index:30;pointer-events:none}
.foot{font-size:11px;color:var(--dim);margin-top:14px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:340px){ .card{padding:16px} .card h1{font-size:32px} .big{font-size:52px} .stat b{font-size:17px} #hudL{max-width:52vw} }
</style>
</head>
<body>
