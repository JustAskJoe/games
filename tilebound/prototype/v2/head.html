<style>
/* Layout: phone-first, one column. Seats, pond, your rack and prompt, then the House Card. Desktop puts the card beside the table. Single dark parlor look on purpose. */
:root {
  --felt: #2A2030; --felt-2: #33283A; --panel: #3C2F43; --panel-2: #47384F; --line: #5C4B62;
  --ink: #F5ECDD; --muted: #C3B3C0; --gold: #E8B86A; --gold-ink: #2A2030;
  --ivory: #FBF5E8; --ivory-2: #EFE2C8; --ivory-edge: #CDB894;
  --ember: #B5482F; --tide: #2C6C80; --grove: #4E7A3E; --crimson: #A8322A; --pale: #5E7F94; --verdant: #3E7B55; --blossom: #B4507A; --mimic: #7A4E86; --wind: #33283A;
  --good: #9CC98A; --warn: #E89A6A;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tw: 46px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--felt); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px 40px; background: radial-gradient(ellipse at 50% 20%, #3A2D41 0%, transparent 60%), var(--felt); min-height: 100%; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; }
.brand span { color: var(--muted); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
.meta { display: flex; gap: 6px; align-items: center; }
.chip { font-size: 12px; color: var(--muted); padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 14px; }
.btn:hover { border-color: var(--gold); }
.btn:focus-visible, .tile:focus-visible, .hand:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; border-radius: 8px; }
.btn[aria-pressed="true"] { border-color: var(--good); color: var(--good); }
.icon { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; font-size: 20px; line-height: 1; }

/* Board */
.board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: start; }
.main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.seats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 9px; display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.seat.turn { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,184,106,.25); }
.seat .wind { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold); font-weight: 800; }
.seat .who { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.seat .who b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.seat .score { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14px; }
.seat .sub { color: var(--muted); font-size: 11.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seat .exps { display: flex; flex-wrap: wrap; gap: 3px; }
.exp { display: inline-flex; gap: 1px; padding: 2px; border-radius: 5px; background: rgba(0,0,0,.2); }
.bubble { position: absolute; top: -12px; right: 6px; background: var(--gold); color: var(--gold-ink); font-weight: 800; padding: 2px 9px; border-radius: 999px; font-size: 12px; animation: pop .25s ease-out; z-index: 2; white-space: nowrap; max-width: 95%; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.seat .tell { font-size: 11px; color: var(--warn); font-weight: 800; }

.pond { background: rgba(0,0,0,.16); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pond-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 800; }
.prow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; align-items: center; }
.prow .pn { font-size: 12px; color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pt { display: flex; flex-wrap: wrap; gap: 2px; }
.prow .tile { --tw: 22px; }
.prow .tile.last { box-shadow: 0 0 0 2px var(--gold), 0 2px 0 var(--ivory-edge); }
.log { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--line); padding-top: 5px; }
.log div:last-child { color: var(--ink); }

/* You */
.me { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.me.turn { border-color: var(--gold); }
.me-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.counter { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.counter .big { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.counter .lbl { font-weight: 700; font-size: 14px; }
.counter .sub { color: var(--muted); font-size: 12px; }
.rack { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; padding-top: 12px; }
.prompt { background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.prompt p { margin: 0; }
.prompt .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.coach { display: flex; gap: 10px; align-items: flex-start; }
.coach img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; border: 2px solid var(--gold); flex: none; }
[data-focus] { position: relative; animation: focus 1.2s ease-in-out infinite; }
@keyframes focus { 50% { box-shadow: 0 0 0 6px rgba(232,184,106,.45); } }
.peek { display: flex; gap: 4px; align-items: center; }
.peek .tile { --tw: 30px; }

/* Tiles */
.tile { --c: var(--wind); width: var(--tw); height: calc(var(--tw) * 1.36); flex: none; background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-2) 100%); border: 0; border-radius: calc(var(--tw) * .16); box-shadow: 0 3px 0 var(--ivory-edge), 0 5px 10px rgba(0,0,0,.35); display: grid; place-items: center; position: relative; padding: 0; color: var(--c); font-family: var(--display); cursor: default; transition: transform .15s ease, box-shadow .15s ease; }
button.tile { cursor: pointer; }
.tile .n { font-size: calc(var(--tw) * .5); font-weight: 700; line-height: 1; margin-top: -14%; }
.tile .g { position: absolute; bottom: 6%; left: 0; right: 0; text-align: center; font-style: normal; font-family: var(--body); font-weight: 800; font-size: max(7px, calc(var(--tw) * .19)); letter-spacing: .2px; opacity: .85; overflow: hidden; }
.tile.ember { --c: var(--ember); } .tile.tide { --c: var(--tide); } .tile.grove { --c: var(--grove); }
.tile.crimson { --c: var(--crimson); } .tile.pale { --c: var(--pale); } .tile.verdant { --c: var(--verdant); }
.tile.blossom { --c: var(--blossom); } .tile.mimic { --c: var(--mimic); background: linear-gradient(180deg, #F6EEF8, #E7D7EC); }
.tile.sm { --tw: 20px; border-radius: 4px; box-shadow: 0 2px 0 var(--ivory-edge); }
.tile.sm .g { display: none; } .tile.sm .n { margin-top: 0; }
.tile.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--gold), 0 3px 0 var(--ivory-edge), 0 10px 14px rgba(0,0,0,.4); }
.tile.new::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.tile.hint { animation: hint 1.1s ease-in-out infinite; }
@keyframes hint { 50% { box-shadow: 0 0 0 4px var(--good), 0 3px 0 var(--ivory-edge); transform: translateY(-6px); } }
.tile.fits::before { content: ""; position: absolute; bottom: -8px; left: 25%; right: 25%; height: 3px; border-radius: 2px; background: var(--good); }
.tile.danger::before { content: ""; position: absolute; bottom: -8px; left: 25%; right: 25%; height: 3px; border-radius: 2px; background: var(--warn); }
.tile.off { opacity: .35; } .tile.dim { filter: saturate(.3); opacity: .5; }
.tapme { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--gold-ink); font-family: var(--body); font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; white-space: nowrap; pointer-events: none; }

/* House Card panel */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
.card .note { color: var(--muted); font-size: 12.5px; margin: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hand { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: var(--ink); width: 100%; cursor: pointer; }
.hand:first-of-type { border-top: 0; }
.hand .star { font-size: 20px; line-height: 1; color: var(--line); text-align: center; }
.hand.target .star { color: var(--gold); }
.hand .nm { font-family: var(--display); font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.hand .nm small { font-family: var(--body); color: var(--muted); font-size: 11px; font-weight: 700; }
.hand .away { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; text-align: right; }
.hand .away.far { color: var(--muted); font-weight: 600; }
.hand .tiles { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 3px; }
.hand .grp { display: flex; gap: 1px; }
.hand .rule { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; }
.hand.collapsed .tiles, .hand.collapsed .rule { display: none; }
.hand.target { background: rgba(232,184,106,.08); border-radius: 8px; padding-left: 4px; padding-right: 4px; }
.more { color: var(--muted); font-size: 12.5px; background: transparent; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-align: left; }

/* Sheets / overlays */
.veil { position: fixed; inset: 0; background: rgba(20,14,24,.74); display: grid; place-items: end center; z-index: 30; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); width: min(680px, 100%); max-height: 88vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; text-wrap: balance; }
.modal h3 { margin: 0; font-size: 15px; }
.modal p, .modal ol, .modal ul { margin: 0; }
.modal ol, .modal ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.modal .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.menu { display: flex; flex-direction: column; gap: 6px; }
.menu .btn { text-align: left; display: flex; justify-content: space-between; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
th { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
td.ok { color: var(--good); font-weight: 800; } td.warn { color: var(--gold); font-weight: 800; }
.win-tiles { display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-end; }
.win-tiles .tile { --tw: 32px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
.owner { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 60; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; color: rgba(245,236,221,.55); background: rgba(20,15,23,.55); padding: 3px 8px; border-radius: 999px; pointer-events: none; }
.abil { background: rgba(232,184,106,.1); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 13px; }
.abil b { color: var(--gold); }

/* Feedback form */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices .btn { padding: 6px 10px; font-size: 13px; }
textarea, input[type=text] { font: inherit; color: var(--ink); background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
.copybox { background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }

/* Story: intro, doors, starter, lessons */
.story { position: fixed; inset: 0; z-index: 40; background: #140F17; color: var(--ink); overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; pointer-events: none; }
.scene.on { opacity: 1; pointer-events: auto; }
.scene .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); }
.scene.on .art { animation: drift 14s ease-out forwards; }
@keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
.scene .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,15,23,.15) 0%, rgba(20,15,23,.25) 45%, rgba(20,15,23,.92) 100%); }
.scene .copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(20px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.scene .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 800; color: var(--gold); }
.scene h2 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 5vw, 56px); line-height: 1.08; margin: 0; max-width: 18ch; text-wrap: balance; }
.scene p { margin: 0; font-size: clamp(15px, 2vw, 20px); max-width: 44ch; color: #E6DACB; }
.scene .title { font-family: var(--display); font-weight: 700; font-size: clamp(60px, 14vw, 168px); line-height: .95; margin: 0; letter-spacing: -1px; background: linear-gradient(180deg, #FFE7B0 0%, #E8B86A 55%, #B9853F 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 18px rgba(0,0,0,.6)); }
.scene.on .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.scene.on .rise.d1 { animation-delay: .35s; } .scene.on .rise.d2 { animation-delay: .7s; } .scene.on .rise.d3 { animation-delay: 1.05s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.trio { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.trio figure { margin: 0; position: relative; overflow: hidden; }
.trio img { width: 100%; height: 100%; object-fit: cover; }
.trio figcaption { position: absolute; top: max(18px, env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-family: var(--display); font-size: clamp(18px, 3vw, 34px); font-weight: 600; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.scene.on .trio figure { animation: slide 1s cubic-bezier(.2,.7,.2,1) both; }
.scene.on .trio figure:nth-child(2) { animation-delay: .25s; } .scene.on .trio figure:nth-child(3) { animation-delay: .5s; }
@keyframes slide { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
.story-nav { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 2; }
.dots { display: flex; gap: 8px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); }
.dots span.on { background: var(--gold); }
.story .btn { backdrop-filter: blur(6px); background: rgba(60,47,67,.75); }
.story .btn.primary { background: var(--gold); }
.story .skip { background: transparent; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 8px; }

.screen { position: absolute; inset: 0; overflow-y: auto; background: radial-gradient(ellipse at 50% 20%, #3A2D41 0%, var(--felt) 70%); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.screen-in { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.screen h2 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 5vw, 36px); margin: 0; text-wrap: balance; }
.screen .lead { color: var(--muted); margin: 0; font-size: 15px; }
.doors { display: grid; grid-template-columns: 1fr; gap: 10px; }
.door { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; color: var(--ink); }
.door:hover { border-color: var(--gold); }
.door b { font-family: var(--display); font-size: 20px; font-weight: 600; }
.door span { color: var(--muted); font-size: 13.5px; }
.door .tag { align-self: flex-start; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 800; color: var(--gold); }
.starters { display: grid; grid-template-columns: 1fr; gap: 10px; }
.starter { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden; display: grid; grid-template-columns: 120px minmax(0, 1fr); text-align: left; cursor: pointer; color: var(--ink); }
.starter img { width: 120px; height: 100%; min-height: 120px; object-fit: cover; }
.starter .txt { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.starter b { font-family: var(--display); font-size: 20px; font-weight: 600; }
.starter .suit { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 800; }
.starter .ab { font-size: 13px; color: var(--muted); }
.starter.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,184,106,.3); }
.starter.ember .suit { color: #E07A5F; } .starter.tide .suit { color: #7FB7C9; } .starter.grove .suit { color: #9CC98A; }

.lesson-in { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.l-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.l-top h2 { font-size: 22px; }
.l-top .eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 800; }
.l-goal { background: var(--ivory); color: var(--felt); border-radius: 14px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; box-shadow: 0 6px 0 #1a131d; transform: rotate(-.4deg); }
.l-goal b { font-family: var(--display); font-size: 17px; }
.l-goal .grp { display: flex; gap: 2px; }
.l-goal .tile { --tw: 30px; }
.l-goal .mini { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.l-goal .mini button { background: transparent; border: 2px solid transparent; border-radius: 10px; padding: 6px 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--felt); cursor: pointer; text-align: left; }
.l-goal .mini button.pick { border-color: var(--gold); background: rgba(232,184,106,.2); }
.l-goal .mini button b { font-size: 15px; }
.l-board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.l-bev { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.l-bev img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; border: 2px solid var(--gold); }
