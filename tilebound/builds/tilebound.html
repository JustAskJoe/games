  }

  function renderOverlay() {
    const el = $('#overlay'); const O = ui.over;
    if (!O) { el.innerHTML = ''; return; }
    let inner = '';
    if (O.kind === 'how') inner = howHTML();
    else if (O.kind === 'menu') inner = menuHTML();
    else if (O.kind === 'targets') inner = targetsHTML();
    else if (O.kind === 'sim') inner = simHTML();
    else if (O.kind === 'feedback') inner = feedbackHTML();
    else if (O.kind === 'handEnd') {
      const r = O.data;
      if (r.wall) inner = '<h2>Wall game</h2><p>The wall ran out and nobody made a hand, so nobody pays.</p>';
      else {
        const who = r.winner === 0 ? 'You win' : name(r.winner) + ' wins';
        const how = r.from === null ? 'drawn from the wall' : `on ${r.from === 0 ? 'your' : name(r.from) + '’s'} discard`;
        inner = `<h2>${who} with ${esc(r.hand.name)}</h2><p>${esc(r.hand.pattern)}, ${how}. ${r.hand.pts} points${r.clean ? `, doubled for using no ${V('mimics')}` : ''}.</p>${handTilesHTML(r.snap)}`;
        inner += '<div class="tbl-wrap"><table><thead><tr><th>Player</th><th>This hand</th><th>Total</th></tr></thead><tbody>' + G.players.map((p, i) => `<tr><td>${esc(name(i))}</td><td class="${r.pays[i] > 0 ? 'ok' : ''}">${r.pays[i] > 0 ? '+' : ''}${r.pays[i]}</td><td>${p.score}</td></tr>`).join('') + '</tbody></table></div>';
      }
      if (O.data.mine) inner += `<p class="note" style="color:var(--muted)">You finished ${O.data.mine}.</p>`;
      inner += `<div class="acts"><button class="btn primary" data-act="next" type="button">${G.handNo + 1 >= G.hands ? 'See the results' : 'Next hand'}</button></div>`;
    } else if (O.kind === 'matchEnd') {
      const ranks = G.players.map((p, i) => ({ i, s: p.score })).sort((a, b) => b.s - a.s); const top = ranks[0];
      inner = `<h2>${top.i === 0 ? 'You win the evening' : esc(name(top.i)) + ' wins the evening'}</h2>
        <div class="tbl-wrap"><table><thead><tr><th>Place</th><th>Player</th><th>Score</th></tr></thead><tbody>${ranks.map((r, k) => `<tr><td>${k + 1}</td><td>${esc(name(r.i))}</td><td>${r.s}</td></tr>`).join('')}</tbody></table></div>
        <p class="note" style="color:var(--muted)">${G.history.map((h, k) => `Hand ${k + 1}: ${h.wall ? 'wall game' : esc(name(h.winner)) + ', ' + esc(h.hand.name)}`).join(' · ')}</p>
        <div class="acts"><button class="btn" data-act="again" type="button">Play another evening</button><button class="btn primary" data-act="feedback" type="button" data-focus="1">Tell us what you thought</button></div>`;
    }
    el.innerHTML = `<div class="veil"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  }

  // ---------- feedback ----------
  const FB = { q: {}, text: '', nm: '', saved: null };
  const FQ = [
    { id: 'exp', q: 'Have you played American mahjong before?', opts: ['In a club or weekly game', 'A few times', 'Never'] },
    { id: 'rules', q: 'Did the rules feel like real American mahjong?', opts: ['Yes', 'Mostly', 'Not really', 'Can’t tell'] },
    { id: 'help', q: 'The helpers (counter, closest hands, Bev)…', opts: ['Helped', 'Fine', 'Got in the way', 'Didn’t use them'] },
    { id: 'fun', q: 'How fun was it, 1 to 5?', opts: ['1', '2', '3', '4', '5'] },
    { id: 'critters', q: 'The critters and abilities…', opts: ['Loved them', 'Nice', 'Didn’t notice', 'Didn’t like them'] },
    { id: 'play', q: 'Would you play this game?', opts: ['Yes', 'Maybe', 'No'] },
  ];
  function feedbackHTML() {
    const qs = FQ.map((f) => `<div class="field"><label>${esc(f.q)}</label><div class="choices">${f.opts.map((o) => `<button class="btn" type="button" data-fq="${f.id}" data-fv="${esc(o)}" aria-pressed="${FB.q[f.id] === o}">${esc(o)}</button>`).join('')}</div></div>`).join('');
    const summary = feedbackText();
    return `<h2>What did you think?</h2>
      <p class="note" style="color:var(--muted)">Six quick taps plus anything you want to say. Your answers go to F, no names needed.</p>
      ${qs}
      <div class="field"><label for="fbText">What was confusing, or what would you change?</label><textarea id="fbText" rows="3">${esc(FB.text)}</textarea></div>
      <div class="field"><label for="fbName">Your name (optional)</label><input id="fbName" type="text" value="${esc(FB.nm)}"></div>
      ${FB.saved === true ? '<p style="color:var(--good);font-weight:700">Saved. Thank you!</p>' : FB.saved === 'copy' ? `<p class="note" style="color:var(--muted)">Couldn’t save from this device, so copy your answers and text them to F:</p><div class="copybox" id="fbCopy">${esc(summary)}</div>` : ''}
      <div class="acts">${FB.saved === 'copy' ? '<button class="btn" data-act="fbcopy" type="button">Copy answers</button>' : ''}<button class="btn" data-act="close" type="button">Close</button>${FB.saved !== true ? '<button class="btn primary" data-act="fbsend" type="button">Send</button>' : ''}</div>`;
  }
  function feedbackText() {
    const lines = FQ.map((f) => `${f.q} ${FB.q[f.id] || '–'}`);
    lines.push(`Notes: ${FB.text || '–'}`); lines.push(`From: ${FB.nm || 'anonymous'} · mode ${ui.mode}${ui.starter !== null ? ' · ' + CRITTER_FULL[ui.starter][0] : ''}`);
    return 'Tilebound feedback\n' + lines.join('\n');
  }
  async function sendFeedback() {
    FB.text = $('#fbText').value; FB.nm = $('#fbName').value;
    const body = { answers: Object.assign({}, FB.q), notes: FB.text, name: FB.nm, mode: ui.mode, starter: ui.starter, at: new Date().toISOString(), hands: G ? G.history.length : 0 };
    try {
      const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (!db) throw new Error('no db');
      await db.collection('feedback').add(body);
      FB.saved = true;
    } catch (e) { FB.saved = 'copy'; }
    ui.feedbackDone = true; render();
  }

  // ---------- bot simulation ----------
  const sim = { running: false, st: null, n: 0, target: 200 };
  function simHTML() {
    const st = sim.st;
    let body = '<h2>Bot simulation</h2><p>Four bots play full hands with no screen, on the same rules engine as the table. Step 1 of the prototype plan: do the rules work?</p>';
    if (st && st.hands) {
      const w = Math.max(1, st.wins); const pct = (x, n) => (100 * x / n).toFixed(0) + '%';
      const rounds = st.rounds / st.hands, wallP = st.wall / st.hands, eastP = st.east / w;
      body += `<p><b>${st.hands}</b> hands played${sim.running ? '…' : ''}.</p><div class="tbl-wrap"><table><thead><tr><th>Measure</th><th>Result</th><th>Target</th></tr></thead><tbody>
        <tr><td>Rounds per hand</td><td class="${rounds >= 12 && rounds <= 20 ? 'ok' : 'warn'}">${rounds.toFixed(1)}</td><td>12–20</td></tr>
        <tr><td>Wall games (nobody wins)</td><td class="${wallP <= 0.25 ? 'ok' : 'warn'}">${pct(st.wall, st.hands)}</td><td>under 25%</td></tr>
        <tr><td>Dealer wins</td><td class="${Math.abs(eastP - 0.25) <= 0.05 ? 'ok' : 'warn'}">${pct(st.east, w)}</td><td>about 25%</td></tr>
        <tr><td>Won on a self-drawn tile</td><td>${pct(st.self, w)}</td><td>–</td></tr></tbody></table></div>
        <h3>Which hands win</h3><div class="tbl-wrap"><table><thead><tr><th>Hand</th><th>Share of wins</th></tr></thead><tbody>${TB.HANDS.map((H, i) => `<tr><td>${esc(H.name)}</td><td class="${st.byHand[i] / w > 0.35 ? 'warn' : ''}">${pct(st.byHand[i], w)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    body += `<div class="acts"><button class="btn" data-act="close" type="button">Close</button><button class="btn primary" data-act="runsim" type="button" ${sim.running ? 'disabled' : ''}>${sim.running ? 'Running…' : 'Run 200 hands'}</button></div>`;
    return body;
  }
  function runSim() {
    sim.running = true; sim.n = 0;
    sim.st = { hands: 0, wall: 0, rounds: 0, byHand: TB.HANDS.map(() => 0), east: 0, wins: 0, self: 0 };
    const seed0 = Math.floor(Math.random() * 1e6);
    const step = () => {
      for (let k = 0; k < 10 && sim.n < sim.target; k++, sim.n++) {
        const S = TB.newMatch(seed0 + sim.n); S.dealer = sim.n % 4; S.secondSwap = true; S.courtesy = true;
        const res = TB.simHand(S); const st = sim.st; st.hands++; st.rounds += res.draws / 4;
        if (res.wall) st.wall++; else { st.wins++; st.byHand[res.T.h]++; if (res.winner === S.dealer) st.east++; if (res.self) st.self++; }
      }
      if (sim.n >= sim.target) sim.running = false;
      if (ui.over && ui.over.kind === 'sim') renderOverlay();
      if (sim.running) setTimeout(step, 0);
    };
    renderOverlay(); setTimeout(step, 30);
  }

  // ---------- input ----------
  function ask(prompt) {
    ui.prompt = prompt; ui.sel = []; ui.hint = [];
    if (ui.coach || (ui.helpers && prompt.kind === 'courtesy')) {
      if (prompt.kind === 'swap') { const tmp = { c: me().c.slice(), exps: [], persona: {} }; const picks = pickPass(tmp, 3); ui.sel = keysFor(picks); ui.hint = ui.sel.slice(); }
      if (prompt.kind === 'courtesy') { const tmp = { c: me().c.slice(), exps: [], persona: {} }; const far = TB.best(me()).d >= 4; const picks = far ? pickPass(tmp, 3) : []; ui.sel = keysFor(picks); ui.hint = ui.sel.slice(); }
      if ((prompt.kind === 'discard' || prompt.kind === 'discard2') && ui.coach) { const b = bestDiscard(); if (b) { ui.hint = keysFor([b.t]); ui.sel = ui.hint.slice(); } }
    }
    render();
    return new Promise((res) => { ui.resolver = res; });
  }
  // Pass picks that respect the player's chosen targets.
  function pickPass(tmp, n) {
    const out = [];
    for (let k = 0; k < n; k++) {
      const ch = TB.discardChoices(tmp, targetSet()).filter((x) => x.t !== TB.MIMIC);
      if (!ch.length) break;
      tmp.c[ch[0].t]--; out.push(ch[0].t);
    }
    return out;
  }
  function answer(v) {
    const r = ui.resolver; ui.resolver = null; ui.prompt = null; ui.sel = []; ui.hint = [];
    if (r) r(v);
  }
  let overResolver = null;
  function overlayWait(kind, data) { showOverlay(kind, data); return new Promise((res) => { overResolver = res; }); }

  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (b.id === 'bMenu') return showOverlay('menu');
    if (b.dataset.star !== undefined) {
      const h = Number(b.dataset.star); const i = ui.targets.indexOf(h);
      if (i >= 0) ui.targets.splice(i, 1); else { ui.targets.push(h); if (ui.targets.length > 2) ui.targets.shift(); }
      if (ui.prompt && (ui.prompt.kind === 'discard' || ui.prompt.kind === 'swap') && ui.coach) { const bd = ui.prompt.kind === 'discard' ? bestDiscard() : null; if (bd) { ui.hint = keysFor([bd.t]); ui.sel = ui.hint.slice(); } }
      return render();
    }
    if (b.dataset.open !== undefined) { const h = Number(b.dataset.open); if (ui.expanded.has(h)) ui.expanded.delete(h); else ui.expanded.add(h); return render(); }
    if (b.dataset.fq) { FB.q[b.dataset.fq] = b.dataset.fv; FB.text = ($('#fbText') || {}).value || FB.text; FB.nm = ($('#fbName') || {}).value || FB.nm; return render(); }

    if (act === 'close') { closeOverlay(); return; }
    if (act === 'how') return showOverlay('how');
    if (act === 'sim') return showOverlay('sim');
    if (act === 'feedback') { if (ui.over && ui.over.kind === 'matchEnd') { const r = overResolver; overResolver = null; if (r) r('feedback'); } return showOverlay('feedback'); }
    if (act === 'fbsend') return sendFeedback();
    if (act === 'fbcopy') { const t = feedbackText(); try { navigator.clipboard.writeText(t).catch(() => selectCopy()); } catch (e) { selectCopy(); } return; }
    if (act === 'intro') { closeOverlay(); if (window.TBStory) window.TBStory.replay(); return; }
    if (act === 'tHelpers') { ui.helpers = !ui.helpers; if (!ui.helpers) { ui.hint = []; } return render(); }
    if (act === 'tCoach') { ui.coach = !ui.coach; return render(); }
    if (act === 'tWords') { ui.words = ui.words === 'table' ? 'plain' : 'table'; return render(); }
    if (act === 'tFast') { ui.fast = !ui.fast; try { localStorage.setItem('tb-fast', ui.fast ? 'on' : 'off'); } catch (e) { /* ignore */ } return render(); }
    if (act === 'newmatch') { closeOverlay(); ui.started = false; if (window.TBStory) window.TBStory.doors(); return; }
    if (act === 'runsim') return runSim();
    if (act === 'opencard') return showOverlay('targets');
    if (act === 'chase') { closeOverlay(); return answer(ui.targets.slice()); }
    if (act === 'next' || act === 'again') { closeOverlay(); const r = overResolver; overResolver = null; if (r) r(act); return; }

    const P = ui.prompt;
    if (b.dataset.key && P) return tapTile(b.dataset.key);
    if (!P) return;
    if (P.kind === 'swap') {
      if (act === 'suggest') { const tmp = { c: me().c.slice(), exps: [], persona: {} }; ui.sel = keysFor(pickPass(tmp, 3)); return render(); }
      if (act === 'pass' && ui.sel.length === 3) return answer(ui.sel.map(typeOf));
    } else if (P.kind === 'vote') {
      if (act === 'yes') return answer(true); if (act === 'no') return answer(false);
    } else if (P.kind === 'courtesy') {
      if (act === 'skip') return answer([]); if (act === 'trade') return answer(ui.sel.map(typeOf));
    } else if (P.kind === 'discard' || P.kind === 'discard2' || P.kind === 'selfMahj') {
      if (act === 'hint') { me().av = null; const bd = bestDiscard(); if (bd) { ui.hint = keysFor([bd.t]); ui.sel = ui.hint.slice(); } return render(); }
      if (act === 'discard' && ui.sel.length === 1) return answer({ discard: typeOf(ui.sel[0]) });
      if (act === 'mahj') return answer({ mahj: true });
      if (act === 'keep') { ui.prompt = { kind: 'discard' }; return render(); }
      if (act === 'peek') return answer({ peek: true });
      if (act === 'extra') return answer({ extra: true });
      if (act === 'jswapgo') return answer({ jswap: true });
    } else if (P.kind === 'claimMahj') return answer(act === 'mahj' ? 'mahj' : 'pass');
    else if (P.kind === 'claimSet') return answer(act === 'take' ? 'take' : 'pass');
    else if (P.kind === 'jswap') return answer(act === 'jswap' ? 'swap' : 'pass');
  });
  function selectCopy() { const el = $('#fbCopy'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

  function tapTile(key) {
    const P = ui.prompt; const t = typeOf(key);
    if (P.kind === 'swap' || P.kind === 'courtesy') {
      if (t === TB.MIMIC) return;
      const i = ui.sel.indexOf(key);
      if (i >= 0) ui.sel.splice(i, 1); else if (ui.sel.length < 3) ui.sel.push(key);
      return render();
    }
    if (P.kind === 'discard' || P.kind === 'discard2' || P.kind === 'selfMahj') {
      if (ui.sel.length === 1 && ui.sel[0] === key) return answer({ discard: t });
      ui.sel = [key]; ui.hint = []; return render();
    }
  }

  // ---------- game flow ----------
  function snap(p) { return { c: p.c.slice(), exps: p.exps.map((e) => Object.assign({}, e)) }; }
  function finish(w, T, from) {
    const res = TB.settle(G, w, T, from); res.snap = snap(G.players[w]);
    addLog(`${name(w)} ${w === 0 ? 'declare' : 'declares'} ${V('mahj')} with ${res.hand.name}`);
    if (w !== 0) bubble(w, V('mahj'));
    return res;
  }
  function discardTile(seat, t) {
    const p = G.players[seat]; p.c[t]--; p.pond.push(t); TB.see(G, t); ui.last = { i: seat, k: p.pond.length - 1 };
  }
  function undoDiscard(seat) { const p = G.players[seat]; p.pond.pop(); ui.last = null; }
  function refreshDanger() { ui.danger = ui.helpers ? TB.dangerTiles(G, 0) : new Set(); }
  function botAbility(seat, when) {
    const p = G.players[seat]; if (ui.mode !== 'tilebound' || p.suit === undefined) return false;
    if (when === 'expose' && p.suit === 0) { const b = TB.burnWall(G); if (b !== null) { addLog(`${name(seat)}’s Cindermole burns the next wall tile (${tName(b)}).`); G.seen[b]++; return true; } }
    if (when === 'turn' && p.suit === 2 && !p.usedAb && TB.best(p).d <= 2 && G.wall.length > 2) {
      p.usedAb = true; p.c[G.wall.pop()]++; G.draws++;
      TB.setAvail(G, p); const d = TB.botDiscard(p, G.r); discardTile(seat, d);
      addLog(`${name(seat)}’s Mossmouse sprouts an extra draw; ${name(seat)} discards ${tName(d)} with it.`); return true;
    }
    return false;
  }

  async function swapRound(dirs, second) {
    for (let i = 0; i < dirs.length; i++) {
      const [dir, label, arrow] = dirs[i]; const to = dir % 4;
      const mine = await ask({ kind: 'swap', step: i + 1, label, arrow, toName: G.players[to].persona.name, second });
      for (const t of mine) me().c[t]--;
      const passes = [mine]; for (let s = 1; s <= 3; s++) passes[s] = TB.botPass(G.players[s], G.r);
      const from = (4 - dir) % 4;
      TB.applyPass(G, passes, dir); ui.received = passes[from].slice();
      addLog(`You passed 3 ${label}; ${name(from)} passed you 3.`); render();
    }
  }

  async function playHand() {
    TB.deal(G);
    ui.received = []; ui.drawn = null; ui.log = []; ui.last = null; ui.peek = null; ui.used = {}; ui.targets = []; ui.expanded = new Set(); ui.danger = new Set();
    for (const p of G.players) p.usedAb = false;
    if (ui.mode === 'tilebound' && ui.starter !== null) { const n = TB.favorSuit(G, 0, ui.starter, 4); if (n) addLog(`${CRITTER_FULL[ui.starter][0]} tucked ${n} ${TB.SUITS[ui.starter]} tiles into your deal.`); }
    addLog(`Hand ${G.handNo + 1}. ${name(G.dealer)} ${G.dealer === 0 ? 'are' : 'is'} East and start${G.dealer === 0 ? '' : 's'} with 14 tiles.`);
    G.turn = -1; render();

    if (ui.helpers) {
      const c = closest(); ui.targets = c.slice(0, 2).map((x) => x.h);
      await ask({ kind: 'targets' });
    }
    await swapRound([[1, 'right', '→'], [2, 'across', '↑'], [3, 'left', '←']], false);
    const yes = await ask({ kind: 'vote' });
    const botsYes = [1, 2, 3].every((i) => TB.best(G.players[i]).d >= 4);
    if (yes && botsYes) { addLog('Everyone agreed to a second round.'); await swapRound([[3, 'left', '←'], [2, 'across', '↑'], [1, 'right', '→']], true); }
    else if (yes) addLog(`${[1, 2, 3].filter((i) => TB.best(G.players[i]).d < 4).map(name).join(' and ')} said no, so no second round.`);
    else addLog('No second round.');
    const give = await ask({ kind: 'courtesy' });
    if (give.length) {
      const q = G.players[2]; const tmp = { c: q.c.slice(), exps: [], persona: {} }; const theirs = pickPass(tmp, give.length);
      for (const t of give) me().c[t]--; for (const t of theirs) q.c[t]--;
      for (const t of give) q.c[t]++; for (const t of theirs) me().c[t]++;
      ui.received = theirs.slice(); addLog(`You and ${name(2)} traded ${theirs.length}.`);
    }

    let seat = G.dealer, needDraw = false;
    for (let guard = 0; guard < 600; guard++) {
      G.turn = seat; refreshDanger(); render();
      const p = G.players[seat];
      if (needDraw) {
        if (!G.wall.length) { addLog('The wall is empty.'); return { wall: true }; }
        const t = G.wall.pop(); p.c[t]++; G.draws++;
        if (seat === 0) { ui.drawn = t; ui.received = []; addLog(`You draw ${tName(t)}.`); }
      }
      let T = TB.isWin(p);
      if (T && seat !== 0) { await wait(500); return finish(seat, T, null); }

      let t, extraPending = false;
      if (seat === 0) {
        // Joker swap offer first, then ability, then discard.
        let a = await ask(T ? { kind: 'selfMahj', T } : { kind: 'discard' });
        while (a.jswap || a.peek || a.extra) {
          if (a.jswap) { const opt = TB.jokerSwapOptions(G, 0)[0]; const c = await ask({ kind: 'jswap', opt }); if (c === 'swap') { TB.applyJokerSwap(G, 0, opt); addLog(`You swapped a real ${tName(opt.t)} for ${name(opt.owner)}’s ${V('mimic')}.`); if (opt.owner !== 0) bubble(opt.owner, 'Hey!'); } }
          if (a.peek) { ui.used[TB.ABILITIES.tide.name] = true; ui.peek = TB.peekWall(G, 3); addLog('Reedling shows you the next three wall tiles.'); }
          if (a.extra) { ui.used[TB.ABILITIES.grove.name] = true; const x = G.wall.pop(); p.c[x]++; G.draws++; ui.drawn = x; addLog(`Mossmouse sprouts an extra draw: ${tName(x)}.`); extraPending = true; }
          T = extraPending ? null : TB.isWin(p);
          a = await ask(T ? { kind: 'selfMahj', T } : { kind: extraPending ? 'discard2' : 'discard' });
        }
        if (a.mahj) return finish(0, T, null);
        t = a.discard;
        ui.peek = null;
        if (extraPending) {
          discardTile(0, t); addLog(`You discard ${tName(t)}.`); render();
          T = TB.isWin(p);
          const a2 = await ask(T ? { kind: 'selfMahj', T } : { kind: 'discard2' });
          if (a2.mahj) return finish(0, T, null);
          t = a2.discard;
        }
      } else {
        await wait(650);
        const js = TB.jokerSwapOptions(G, seat).filter((o) => o.owner !== seat);
        if (js.length && G.r() < (p.persona.name === 'Rosa' ? 1 : 0.7)) { TB.applyJokerSwap(G, seat, js[0]); addLog(`${name(seat)} swaps a real ${tName(js[0].t)} for ${name(js[0].owner)}’s ${V('mimic')}.`); bubble(seat, 'Mine now.'); render(); await wait(400); }
        if (botAbility(seat, 'turn')) { render(); await wait(300); }
        TB.setAvail(G, p);
        t = TB.botDiscard(p, G.r, TB.dangerTiles(G, seat));
      }
      discardTile(seat, t); ui.drawn = null; ui.received = [];
      addLog(`${name(seat)} discard${seat === 0 ? '' : 's'} ${tName(t)}.`); render();

      // Claims: a win beats a set; nearest in turn order first.
      for (let k = 1; k <= 3; k++) {
        const o = (seat + k) % 4, q = G.players[o]; const WT = TB.winWith(q, t); if (!WT) continue;
        if (o === 0) { const c = await ask({ kind: 'claimMahj', t, from: seat, T: WT }); if (c !== 'mahj') continue; } else await wait(400);
        undoDiscard(seat); q.c[t]++; return finish(o, WT, seat);
      }
      let claimed = false;
      for (let k = 1; k <= 3 && !claimed; k++) {
        const o = (seat + k) % 4, q = G.players[o]; const opt = TB.exposeOption(q, t); if (!opt) continue;
        let take;
        if (o === 0) take = (await ask({ kind: 'claimSet', t, from: seat, opt })) === 'take'; else take = TB.botWantsCall(q, opt, G.r);
        if (take) {
          undoDiscard(seat); TB.applyExpose(q, opt); TB.see(G, TB.MIMIC, opt.need); TB.see(G, t, opt.real);
          addLog(`${name(o)} ${o === 0 ? 'take' : 'takes'} the ${tName(t)} and lay${o === 0 ? '' : 's'} down a ${setWord(opt.s)}.`);
          if (o !== 0) bubble(o, seat === 0 ? pick(['Thank you!', 'Mine!', 'I’ll take that.']) : pick(['Mine!', 'Ooh, yes.', 'Thanks, ' + name(seat) + '.']));
          botAbility(o, 'expose');
          if (o === 0 && ui.mode === 'tilebound' && ui.starter === 0) { const b = TB.burnWall(G); if (b !== null) { G.seen[b]++; addLog(`Cindermole’s Hot Hands burns the next wall tile (${tName(b)}).`); } }
          seat = o; needDraw = false; claimed = true; render(); await wait(450);
        }
      }
      if (!claimed) { seat = (seat + 1) % 4; needDraw = true; await wait(120); }
    }
    return { wall: true };
  }

  async function playMatch() {
    G = TB.newMatch(Math.floor(Math.random() * 1e9)); G.hands = 4;
    if (ui.mode === 'tilebound') { G.players[1].suit = 0; G.players[2].suit = 1; G.players[3].suit = 2; }
    for (let h = 0; h < G.hands; h++) {
      G.handNo = h; G.dealer = h % 4;
      const res = await playHand();
      if (res.wall) res.pays = [0, 0, 0, 0];
      if (!res.wall && res.winner !== 0) { const d = TB.best(me()).d; res.mine = d < 99 ? `${d} tile${d === 1 ? '' : 's'} from ${V('mahj').replace('!', '')}` : 'with no hand left that fits your sets'; }
      G.history.push(res); G.turn = -1;
      await overlayWait('handEnd', res);
    }
    const a = await overlayWait('matchEnd');
    if (a === 'again') playMatch();
  }

  G = TB.newMatch(1); TB.deal(G); G.turn = -1; render();
  window.TBUI = {
    start(opts) {
      Object.assign(ui, opts);
      if (ui.mode === 'classic') { ui.coach = false; ui.helpers = opts.helpers !== undefined ? opts.helpers : false; ui.words = 'table'; ui.starter = null; }
      else { ui.words = 'plain'; }
      ui.started = true; playMatch();
    },
    get started() { return ui.started; },
  };
})();

</script>
<script>
(function () {
  const TB = window.TB;
  const root = document.getElementById('story');
  const num = TB.num, N = 27, E = 28, W = 29, S = 30, MIMIC = TB.MIMIC, BL = TB.BLOSSOM;
  const Em = (n) => num(0, n), Ti = (n) => num(1, n), Gr = (n) => num(2, n);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const CRIT = [['mole', 'kiln', 'wyrm'], ['reed', 'koi', 'deluge'], ['moss', 'badger', 'elder']];
  const WINDC = ['owl', 'hare', 'fox', 'finch'];

  function parts(t) {
    if (t < 27) { const s = Math.floor(t / 9); return { cls: ['ember', 'tide', 'grove'][s], n: t % 9 + 1, g: CRIT[s][Math.floor((t % 9) / 3)] }; }
    if (t < 31) return { cls: 'wind', n: 'NEWS'[t - 27], g: WINDC[t - 27] };
    if (t < 34) return { cls: ['crimson', 'pale', 'verdant'][t - 31], n: 'CPV'[t - 31], g: 'drake' };
    if (t === BL) return { cls: 'blossom', n: '✿', g: 'bloom' };
    return { cls: 'mimic', n: '?', g: 'mimic' };
  }
  function tile(t, extra, tag, attrs) {
    const p = parts(t); const el = tag || 'span';
    return `<${el} class="tile ${p.cls} ${extra || ''}" aria-label="${TB.tileName(t)}" title="${TB.tileName(t)}" ${attrs || ''}><b class="n">${p.n}</b><i class="g">${p.g}</i></${el}>`;
  }

  // ---------------- Intro ----------------
  const SCENES = [
    { html: `<img class="art" src="img/parlor.jpg" alt="An illustrated mahjong parlor at night, four friends at a table under a crescent moon window"><div class="shade"></div>
      <div class="copy"><span class="eyebrow rise">One Fifty Labs presents</span><h1 class="title rise d1">Tilebound</h1><p class="rise d2">A cozy mahjong adventure.</p><span class="eyebrow rise d3" style="color:#CBBDC8;letter-spacing:1.5px">© 2026 F Lane d/b/a One Fifty Labs · All rights reserved</span></div>` },
    { html: `<img class="art" src="img/tiles.jpg" alt="Three ivory mahjong tiles painted with a mole, a frog and a mouse"><div class="shade"></div>
      <div class="copy"><span class="eyebrow rise">Tessera Isle</span><h2 class="rise d1">Here, every mahjong tile is a critter.</h2><p class="rise d2">Collect them, play them, and watch them grow from plain ivory to carved, jade and gilded.</p></div>` },
    { html: `<div class="trio"><figure><img src="img/ember.jpg" alt="Ember critters by a stove"><figcaption>Ember</figcaption></figure><figure><img src="img/tide.jpg" alt="Tide critters at a moonlit pond"><figcaption>Tide</figcaption></figure><figure><img src="img/grove.jpg" alt="Grove critters in a greenhouse"><figcaption>Grove</figcaption></figure></div><div class="shade"></div>
      <div class="copy"><span class="eyebrow rise">Three suits, three families</span><h2 class="rise d1">Pick a starter. Grow your collection.</h2><p class="rise d2">The numbers 1 to 9 are each critter growing up.</p></div>` },
    { html: `<img class="art" src="img/island.jpg" alt="An illustrated map of a small island with four towns"><div class="shade"></div>
      <div class="copy"><span class="eyebrow rise">Four towns, four parlor masters</span><h2 class="rise d1">Beat the masters. Come home to Mahj Night.</h2><p class="rise d2">Every town has its own House Card of hands to learn.</p></div>`, last: true },
  ];
  let scene = 0;
  function showIntro(i) {
    scene = i; root.hidden = false;
    root.innerHTML = SCENES.map((s, k) => `<section class="scene${k === i ? ' on' : ''}" aria-hidden="${k !== i}">${s.html}</section>`).join('') +
      `<div class="story-nav"><button class="skip" type="button" data-s="skip">Skip intro</button>
       <div class="dots">${SCENES.map((_, k) => `<span class="${k === i ? 'on' : ''}"></span>`).join('')}</div>
       <button class="btn primary" type="button" data-s="next">${SCENES[i].last ? 'Let’s play →' : 'Next →'}</button></div>`;
  }
  function goScene(i) {
    root.querySelectorAll('.scene').forEach((el, k) => { el.classList.toggle('on', k === i); el.setAttribute('aria-hidden', String(k !== i)); });
    scene = i;
    root.querySelectorAll('.dots span').forEach((d, k) => d.classList.toggle('on', k === i));
    root.querySelector('.story-nav .btn').textContent = SCENES[i].last ? 'Let’s play →' : 'Next →';
  }

  // ---------------- Doors ----------------
  function doors() {
    root.hidden = false;
    root.innerHTML = `<div class="screen"><div class="screen-in">
      <div style="display:flex;gap:14px;align-items:center"><img src="img/bev.jpg" alt="Bev" style="width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:3px solid var(--gold)"><div><h2>“Hi, I’m Bev. How do you want to play?”</h2><p class="lead">I run the Tile &amp; Teacup club. Pick a door; you can change your mind from the menu any time.</p></div></div>
      <div class="doors">
        <button class="door" type="button" data-s="learn"><span class="tag">New to mahjong</span><b>Learn with Bev</b><span>Five tiny lessons, about three minutes, then I sit with you at the table and tell you every tap.</span></button>
        <button class="door" type="button" data-s="tilebound"><span class="tag">I’ve played</span><b>Tilebound table</b><span>Pick a starter critter and play with abilities. Helpers on, coach off.</span></button>
        <button class="door" type="button" data-s="classic"><span class="tag">Club players</span><b>Classic table</b><span>Just the rules: Charleston, jokers, the card. No critters, no helpers. Judge whether it plays right.</span></button>
      </div>
      <p class="lead">A game is one evening: four hands against Rosa, Lena and me. Afterwards, tell us what you thought.</p>
    </div></div>`;
  }

  // ---------------- Starter pick ----------------
  let starter = 0;
  function starterScreen(then) {
    root.hidden = false;
    const A = TB.ABILITIES;
    const cards = [['ember', 'Cindermole', 'img/ember.jpg', A.ember], ['tide', 'Reedling', 'img/tide.jpg', A.tide], ['grove', 'Mossmouse', 'img/grove.jpg', A.grove]];
    root.innerHTML = `<div class="screen"><div class="screen-in">
      <h2>Pick your starter.</h2><p class="lead">Your starter tucks a few of its suit into every deal and gives you one ability. The others play theirs: Rosa has Cindermole, Lena has Reedling, Bev has Mossmouse.</p>
      <div class="starters">${cards.map(([s, n, img, ab], i) => `<button class="starter ${s}${i === starter ? ' sel' : ''}" type="button" data-st="${i}"><img src="${img}" alt=""><span class="txt"><span class="suit">${s} · ${['1–3 of the suit', '1–3 of the suit', '1–3 of the suit'][i]}</span><b>${n}</b><span class="ab"><b style="font-size:13px;font-family:var(--body)">${esc(ab.name)}:</b> ${esc(ab.when)}, ${esc(ab.does)}</span></span></button>`).join('')}</div>
      <div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn primary" type="button" data-s="${then}" data-focus="1">Go with ${['Cindermole', 'Reedling', 'Mossmouse'][starter]}</button></div>
    </div></div>`;
  }

  // ---------------- Lessons ----------------
  // Mini lessons use 4–8 tile hands against Bev alone, scripted tile by tile.
  const LESSONS = [
    { title: 'Draw, discard, match', goal: { name: 'Ember 111 22', groups: [[Em(1), 3], [Em(2), 2]] }, start: [Em(1), Em(1), Em(2), N],
      steps: [
        { say: 'This is <b>your hand</b>, at the bottom: four tiles. The cream card at the top is your <b>goal</b>: three Ember 1s and two Ember 2s. Match it exactly and you win. Tap <b>Next</b>.', expect: 'next' },
        { say: 'Every turn starts the same way: you <b>draw</b> one tile. Tap the glowing <b>wall</b>.', expect: 'draw', draw: Em(1) },
        { say: 'You drew an Ember 1. That’s three 1s! Every turn also <b>ends with a discard</b>. The North Wind doesn’t fit your goal. Tap the glowing <b>North Wind</b> to throw it away.', expect: { tile: N } },
        { say: 'That was a whole turn: draw one, discard one. Now it’s my turn…', bev: Ti(7), then: 'I threw away a Tide 7. You don’t need it, so let it go. Tap <b>Next</b>.', expect: 'next' },
        { say: 'Your turn again. Tap the <b>wall</b> to draw.', expect: 'draw', draw: Em(2) },
        { say: 'Look at your hand: <b>1 1 1 2 2</b>. It matches your goal exactly. When it does, you call <b>Mahj!</b> Tap the glowing button.', expect: 'mahj' },
        { say: 'That’s mahjong! <b>Draw, discard, match the card.</b> Everything else is just more tiles. Tap <b>Next lesson</b>.', expect: 'next', nextLabel: 'Next lesson' },
      ] },
    { title: 'Mimics are jokers', goal: { name: 'Tide 333 55', groups: [[Ti(3), 3], [Ti(5), 2]] }, start: [Ti(3), Ti(3), MIMIC, Ti(5)],
      steps: [
        { say: 'New goal: three Tide 3s and two Tide 5s. See the purple tile with the question mark? That’s a <b>Mimic</b>, our joker. Tap <b>Next</b>.', expect: 'next' },
        { say: 'A Mimic can stand in for <b>any tile in a group of 3 or more</b>. Here it’s playing your third Tide 3. Now draw: tap the <b>wall</b>.', expect: 'draw', draw: Gr(8) },
        { say: 'A Grove 8. No help at all. Throw it away: tap the glowing <b>Grove 8</b>.', expect: { tile: Gr(8) } },
        { say: 'My turn…', bev: W, then: 'I discarded a West Wind. Not one you need. Tap <b>Next</b>.', expect: 'next' },
        { say: 'Your turn. Tap the <b>wall</b> to draw.', expect: 'draw', draw: Ti(5) },
        { say: 'Tide 3, 3, Mimic, then 5, 5. The Mimic fills your set of 3s, so this matches! Tap <b>Mahj!</b>', expect: 'mahj' },
        { say: 'One rule to remember: Mimics fill groups of <b>3 or more</b>, never a pair. So a Mimic could not have been one of your 5s. Tap <b>Next lesson</b>.', expect: 'next', nextLabel: 'Next lesson' },
      ] },
    { title: 'Grab a discard', goal: { name: 'Grove 666 77', groups: [[Gr(6), 3], [Gr(7), 2]] }, start: [Gr(6), Gr(6), Gr(7), Gr(9)],
      steps: [
        { say: 'Goal: three Grove 6s and two Grove 7s. You have two 6s. Watch what I throw away. Tap <b>Next</b>.', expect: 'next' },
        { say: 'My turn…', bev: Gr(6), then: 'I just threw away a <b>Grove 6</b>, the exact tile you need! When someone’s discard <b>finishes a group of 3 or more</b> for you, you can grab it. Tap <b>Take it</b>.', expect: 'take', take: [Gr(6), 3] },
        { say: 'Your three 6s are now <b>face up</b> for everyone to see. You grabbed a tile instead of drawing one, so now discard. The Grove 9 doesn’t fit: tap it.', expect: { tile: Gr(9) } },
        { say: 'My turn…', bev: Em(4), then: 'An Ember 4. Not for you. Tap <b>Next</b>.', expect: 'next' },
        { say: 'Tap the <b>wall</b> to draw.', expect: 'draw', draw: Gr(7) },
        { say: 'Three 6s face up, plus 7 7 in your hand. That’s your goal! Tap <b>Mahj!</b>', expect: 'mahj' },
        { say: 'Laying a group down also <b>tells the table</b> what you’re building. Good players watch for that and stop throwing you tiles. Tap <b>Next lesson</b>.', expect: 'next', nextLabel: 'Next lesson' },
      ] },
    { title: 'Pick a goal from the card', mini: [
        { name: 'Evens', groups: [[Em(2), 3], [Em(4), 3], [Em(6), 2]] },
        { name: 'Low Tide', groups: [[Ti(1), 3], [Ti(2), 3], [Ti(3), 2]] },
        { name: 'Two Winds', groups: [[N, 3], [E, 3], [W, 2]] },
      ], start: [Em(2), Em(2), Em(4), Em(4), Em(6), Ti(1), Gr(5), N],
      steps: [
        { say: 'Now the real idea. At the table there isn’t one goal, there’s a <b>card</b> of many hands, and you choose which to chase. This card has three. Look at your 8 tiles: which hand are you closest to? Tap it on the card.', expect: 'pickgoal', goal: 0 },
        { say: 'Right: <b>Evens</b>. You already hold 2 2, 4 4 and a 6. Everything else is junk now. Every pass and discard from here serves that choice. Tap the <b>wall</b>.', expect: 'draw', draw: Em(6) },
        { say: 'Ember 6: that makes your pair. Throw away something that isn’t Evens: the <b>North Wind</b>.', expect: { tile: N } },
        { say: 'My turn…', bev: BL, then: 'A Blossom. Not yours. Tap <b>Next</b>.', expect: 'next' },
        { say: 'Tap the <b>wall</b>.', expect: 'draw', draw: Em(2) },
        { say: 'Three 2s now. Discard the <b>Tide 1</b>.', expect: { tile: Ti(1) } },
        { say: 'My turn…', bev: S, then: 'South Wind, no. Tap <b>Next</b>.', expect: 'next' },
        { say: 'Tap the <b>wall</b>.', expect: 'draw', draw: Em(4) },
        { say: '2 2 2, 4 4 4, 6 6 and one Grove 5 too many. Discard the <b>Grove 5</b>… and you’ll have it.', expect: { tile: Gr(5) } },
        { say: 'That’s Evens! Tap <b>Mahj!</b>', expect: 'mahj' },
        { say: 'At the real table the card has <b>ten hands</b> and you’ll pick one or two to chase. The glowing tiles and the hints all point at your choice. Tap <b>Next lesson</b>.', expect: 'next', nextLabel: 'Next lesson' },
      ] },
    { title: 'The Swap', goal: { name: 'Ember 111 222 33', groups: [[Em(1), 3], [Em(2), 3], [Em(3), 2]] }, start: [Em(1), Em(1), Em(1), Em(2), Ti(7), Gr(3), W, S],
      steps: [
        { say: 'Last lesson. Before any tiles are played, everyone <b>passes 3 tiles they don’t want</b> to the player on their right. That’s the Swap. Your goal needs Ember 1s, 2s and 3s, so pick <b>3 of the junk</b>: tap three of Tide 7, Grove 3, West, South.', expect: 'pass3', junk: [Ti(7), Gr(3), W, S], give: [Em(2), Em(3), Em(3)] },
        { say: 'And you got 3 back from the player on your left (that’s me). Look: Ember 2, 3, 3. The Swap is how a messy hand turns into a plan. Now draw: tap the <b>wall</b>.', expect: 'draw', draw: Em(2) },
        { say: '1 1 1, 2 2 2, 3 3, and one leftover. Discard it and you’re there.', expect: 'anyjunk' },
        { say: 'Tap <b>Mahj!</b>', expect: 'mahj' },
        { say: 'You’ve got it all: <b>draw and discard, Mimics, grabbing a discard, choosing from the card, the Swap.</b> The real table is the same game with 14 tiles and four players. I’ll sit with you and tell you every tap. First, pick your starter critter.', expect: 'next', nextLabel: 'Pick my starter' },
      ] },
  ];

  const L = { i: 0, step: 0, hand: [], exps: [], pond: [], bev: 4, busy: false, wrong: false, saying: '', goal: null, sel: [] };

  function startLesson(i) {
    const les = LESSONS[i];
    Object.assign(L, { i, step: 0, hand: les.start.slice().sort((a, b) => a - b), exps: [], pond: [], bev: les.start.length, busy: false, wrong: false, goal: les.goal || null, sel: [] });
    root.hidden = false; enterStep();
  }
  function enterStep() {
    const st = LESSONS[L.i].steps[L.step];
    L.saying = st.say; L.wrong = false; L.sel = [];
    if (st.bev !== undefined) {
      L.busy = true; renderLesson();
      setTimeout(() => { L.pond.push(st.bev); L.saying = st.then; L.busy = false; renderLesson(); }, 1300);
    } else renderLesson();
  }
  function goalTiles(goal) {
    const all = L.hand.slice(); let g = '';
    for (const [t, s] of goal.groups) {
      const laid = L.exps.find((e) => e.t === t && e.s === s); let have = laid ? s : 0;
      if (!laid) for (let k = 0; k < s; k++) { const idx = all.indexOf(t); if (idx >= 0) { all.splice(idx, 1); have++; } }
      g += '<span class="grp">'; for (let k = 0; k < s; k++) g += tile(t, k < have ? '' : 'dim'); g += '</span>';
    }
    return g;
  }
  function goalHTML() {
    const les = LESSONS[L.i];
    if (les.mini) {
      const st = les.steps[L.step];
      return `<b>The card</b><span class="mini">${les.mini.map((m, k) => `<button type="button" data-goal="${k}" class="${L.goal === m ? 'pick' : ''}" ${st.expect === 'pickgoal' ? 'data-focus-soft="1"' : ''}><b>${esc(m.name)}</b>${goalTiles(m)}</button>`).join('')}</span>`;
    }
    return `<b>Your goal</b>${goalTiles(L.goal)}<span style="font-size:12px;color:#5B4D5C">Faded = still needed</span>`;
  }
  function renderLesson() {
    const les = LESSONS[L.i], st = les.steps[L.step];
    const exp = L.busy ? null : st.expect;
    const focusTile = exp && typeof exp === 'object' ? exp.tile : null;
    let focused = false;
    const rack = L.hand.map((t, k) => {
      let f = focusTile === t && !focused; if (f) focused = true;
      if (exp === 'pass3' && st.junk.includes(t)) f = true;
      if (exp === 'anyjunk' && !L.goal.groups.some(([gt]) => gt === t)) f = true;
      const sel = L.sel.includes(k) ? ' sel' : '';
      return tile(t, sel, 'button', `type="button" data-lt="${k}" ${f ? 'data-focus="1"' : ''}`);
    }).join('');
    const backs = Array.from({ length: L.bev }, () => '<span class="back"></span>').join('');
    let acts = '';
    if (exp === 'next') acts = `<button class="btn primary" type="button" data-l="next" data-focus="1">${esc(st.nextLabel || 'Next')}</button>`;
    if (exp === 'mahj') acts = '<button class="btn primary" type="button" data-l="mahj" data-focus="1">Mahj!</button>';
    if (exp === 'take') acts = '<button class="btn" type="button" data-l="pass">Pass</button><button class="btn primary" type="button" data-l="take" data-focus="1">Take it</button>';
    if (exp === 'pass3') acts = `<button class="btn primary" type="button" data-l="pass3" ${L.sel.length === 3 ? 'data-focus="1"' : 'disabled'}>Pass ${L.sel.length}/3 →</button>`;
    root.innerHTML = `<div class="screen"><div class="lesson-in">
      <div class="l-top"><div><span class="eyebrow">Lesson ${L.i + 1} of ${LESSONS.length}</span><h2>${esc(les.title)}</h2></div><button class="skip" type="button" data-s="skiplessons">Skip lessons</button></div>
      <div class="l-goal">${goalHTML()}</div>
      <div class="l-board">
        <div class="l-bev"><img src="img/bev.jpg" alt="Bev"><div><b>Bev</b><div class="backs" aria-label="${L.bev} tiles">${backs}</div></div></div>
        <div class="l-mid">
          <button class="wall" type="button" data-l="draw" ${exp === 'draw' ? 'data-focus="1"' : ''} aria-label="The wall: tap to draw">${exp === 'draw' ? '<span class="tapme">Tap to draw</span>' : ''}<span class="stack">${'<span></span>'.repeat(8)}</span><b>Wall</b></button>
          <div class="l-pond"><span class="lbl">The pond (discards)</span>${L.pond.map((t, k) => tile(t, k === L.pond.length - 1 ? 'last' : '')).join('')}</div>
        </div>
      </div>
      <div class="l-coach" aria-live="polite"><img src="img/bev.jpg" alt=""><p><span class="who">Bev:</span> ${L.busy ? '<i>…thinking…</i> ' + L.saying : L.saying}${L.wrong ? '<br><b style="color:var(--gold)">Not that one: tap the glowing one.</b>' : ''}</p></div>
      <div class="l-hand">
        ${L.exps.length ? `<div class="exps" style="justify-content:center;display:flex;gap:6px;align-items:center">${L.exps.map((e) => '<span class="exp">' + Array.from({ length: e.s }, () => tile(e.t)).join('') + '</span>').join('')}<span style="color:var(--muted);font-size:12px">face up</span></div>` : ''}
        <div class="rack">${rack}</div>
        <div class="l-acts">${acts}</div>
      </div>
    </div></div>`;
    const f = root.querySelector('.rack .tile[data-focus]');
    if (f && exp !== 'pass3' && exp !== 'anyjunk') f.insertAdjacentHTML('beforeend', '<span class="tapme">Tap me</span>');
  }
  function wrong() { L.wrong = true; renderLesson(); const f = root.querySelector('[data-focus]'); if (f) f.classList.add('shake'); }
  function burst(text, after) { const d = document.createElement('div'); d.className = 'burst'; d.innerHTML = `<span>${text}</span>`; root.appendChild(d); setTimeout(() => { d.remove(); after(); }, 1400); }
  function advance() {
    const les = LESSONS[L.i];
    if (L.step + 1 < les.steps.length) { L.step++; enterStep(); return; }
    if (L.i + 1 < LESSONS.length) startLesson(L.i + 1); else starterScreen('tablecoach');
  }
  function act(kind, el) {
    if (L.busy) return;
    const st = LESSONS[L.i].steps[L.step]; const exp = st.expect;
    if (kind === 'goal') { const k = Number(el.dataset.goal); if (exp !== 'pickgoal') return; if (k !== st.goal) return wrong(); L.goal = LESSONS[L.i].mini[k]; return advance(); }
    if (kind === 'tile') {
      const k = Number(el.dataset.lt); const t = L.hand[k];
      if (exp === 'pass3') { if (!st.junk.includes(t)) return wrong(); const i = L.sel.indexOf(k); if (i >= 0) L.sel.splice(i, 1); else if (L.sel.length < 3) L.sel.push(k); return renderLesson(); }
      if (exp === 'anyjunk') { if (L.goal.groups.some(([gt]) => gt === t)) return wrong(); L.hand.splice(k, 1); L.pond.push(t); return advance(); }
      if (!(exp && typeof exp === 'object' && exp.tile === t)) return wrong();
      L.hand.splice(k, 1); L.pond.push(t); return advance();
    }
    if (kind === 'pass3') { if (exp !== 'pass3' || L.sel.length !== 3) return; const out = L.sel.sort((a, b) => b - a).map((k) => L.hand.splice(k, 1)[0]); L.hand.push(...st.give); L.hand.sort((a, b) => a - b); L.pond.push(...out); return advance(); }
    if (kind !== exp && !(kind === 'pass' && exp === 'take')) return wrong();
    if (kind === 'pass') return wrong();
    if (kind === 'next') return advance();
    if (kind === 'draw') { L.hand.push(st.draw); L.hand.sort((a, b) => a - b); return advance(); }
    if (kind === 'take') { const [t, s] = st.take; L.pond.pop(); for (let k = 0; k < s - 1; k++) L.hand.splice(L.hand.indexOf(t), 1); L.exps.push({ t, s }); return advance(); }
    if (kind === 'mahj') { L.busy = true; burst('Mahj!', () => { L.busy = false; advance(); }); }
  }

  function toTable(opts) { root.hidden = true; root.innerHTML = ''; window.TBUI.start(opts); }

  root.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    const s = b.dataset.s;
    if (s === 'next') { if (scene + 1 < SCENES.length) goScene(scene + 1); else doors(); return; }
    if (s === 'skip') return doors();
    if (s === 'learn') return startLesson(0);
    if (s === 'tilebound') return starterScreen('table');
    if (s === 'classic') return toTable({ mode: 'classic', coach: false, helpers: false });
    if (s === 'table') return toTable({ mode: 'tilebound', coach: false, helpers: true, starter });
    if (s === 'tablecoach') return toTable({ mode: 'tilebound', coach: true, helpers: true, starter });
    if (s === 'skiplessons') return starterScreen('tablecoach');
    if (b.dataset.st !== undefined) { starter = Number(b.dataset.st); const then = root.querySelector('[data-s="table"],[data-s="tablecoach"]').dataset.s; return starterScreen(then); }
    if (b.dataset.goal !== undefined) return act('goal', b);
    if (b.dataset.l) return act(b.dataset.l, b);
    if (b.dataset.lt !== undefined) return act('tile', b);
  });
  document.addEventListener('keydown', (ev) => {
    if (root.hidden || !root.querySelector('.scene.on')) return;
    if (ev.key === 'ArrowRight') { if (scene + 1 < SCENES.length) goScene(scene + 1); else doors(); }
  });

  window.TBStory = { replay() { showIntro(0); }, doors };
  showIntro(0);
})();

</script>
