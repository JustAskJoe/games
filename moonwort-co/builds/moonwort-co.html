 spring", "planet": "Sun", "culpeper": {"heading": "ROSEMARY.", "quote": "The Sun claims privilege in it, and it is under the celestial Ram.", "summary": "Culpeper believed rosemary, the Sun's herb, warmed all cold diseases of the head and stomach and 'helps a weak memory'. He valued it for civil as well as physical uses."}, "folklore": {"text": "Rosemary was the herb of remembrance and fidelity: brides wore sprigs in their wreaths, wedding guests received gilded branches, and mourners dropped sprigs onto coffins.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/r/rosema17.html"}, "science": {"text": "EU regulators (EMA) list rosemary leaf only as a traditional herbal product for mild indigestion and minor muscle aches, based on long-standing use rather than clinical studies.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/rosmarini-folium"}, "safety": "Safe as a kitchen herb. Medicinal use not advised in pregnancy, breastfeeding, gallstones or liver disease. Can cause contact dermatitis.", "card": "Rosemary is for remembrance. Brides wove it into their wreaths, guests carried gilded sprigs home from weddings, and mourners laid it on coffins so no one would be forgotten.", "true_fact": "Botanists now place rosemary in the sage genus: its accepted name is Salvia rosmarinus.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:457138-1", "https://www.ema.europa.eu/en/medicines/herbal/rosmarini-folium", "https://www.botanical.com/botanical/mgmh/r/rosema17.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "sage", "common": "Sage", "folk_names": ["common sage", "sawge"], "botanical": "Salvia officinalis", "family": "Lamiaceae", "part": "leaf", "season": "Late spring to midsummer, before and as it flowers", "planet": "Jupiter", "culpeper": {"heading": "SAGE.", "quote": "Jupiter claims this, and bids me tell you", "summary": "Culpeper believed sage, ruled by Jupiter, was good for the liver and blood, and repeated older writers praising it for pains in the head and joints."}, "folklore": {"text": "An old Latin saying asks why anyone should die while sage grows in the garden. Another belief held that a sage plant thrives or withers along with its owner's fortunes.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/s/sages-05.html"}, "science": {"text": "NCCIH says only small amounts of research exist; a few small studies suggest common sage might reduce menopausal hot flashes, but no firm conclusions can be drawn.", "source": "NCCIH", "url": "https://www.nccih.nih.gov/health/sage"}, "safety": "Safe in food amounts. Contains thujone, which can be toxic in large amounts or long use. May be unsafe in pregnancy.", "card": "An old Latin proverb asks: why should anyone die while sage grows in the garden? Folk also said a sage bush flourishes when its household does, and droops when it doesn't.", "true_fact": "Sage's genus name, Salvia, comes from the Latin salvere, 'to be saved' or 'to be well'.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:456833-1", "https://www.nccih.nih.gov/health/sage", "https://www.botanical.com/botanical/mgmh/s/sages-05.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "thyme", "common": "Thyme", "folk_names": ["garden thyme"], "botanical": "Thymus vulgaris", "family": "Lamiaceae", "part": "leaf", "season": "Early summer, as it begins to flower; leaves usable most of the year", "planet": "Venus", "culpeper": {"heading": "THYME.", "quote": "It is in vain to describe an herb so commonly known.", "summary": "Culpeper believed thyme, 'a notable herb of Venus', was a noble strengthener of the lungs and comforted the stomach."}, "folklore": {"text": "Thyme stood for courage. In the age of chivalry, ladies embroidered a bee hovering over a sprig of thyme on the scarves they gave their knights.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/t/thygar16.html"}, "science": {"text": "EU regulators (EMA) accept thyme only as a traditional herbal product for chesty coughs with colds; the clinical studies they reviewed were too small for firm conclusions.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/thymi-herba"}, "safety": "Safe as a kitchen herb. Avoid with mint-family (Lamiaceae) allergies. Can upset the stomach. Medicinal use not advised in pregnancy.", "card": "Thyme meant courage. Knights rode off wearing scarves embroidered with a bee above a sprig of thyme, and Greek honey from the thyme-covered hills was famous.", "true_fact": "The honey of Mount Hymettus near Athens was famed in ancient times; its flavour was credited to wild thyme.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:461765-1", "https://www.ema.europa.eu/en/medicines/herbal/thymi-herba", "https://www.botanical.com/botanical/mgmh/t/thygar16.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "lemon_balm", "common": "Lemon balm", "folk_names": ["balm", "sweet balm", "melissa"], "botanical": "Melissa officinalis", "family": "Lamiaceae", "part": "leaf", "season": "Late spring to midsummer, before it flowers", "planet": "Jupiter", "culpeper": {"heading": "BALM.", "quote": "it causes the mind and heart to become merry", "summary": "Culpeper believed balm, an herb of Jupiter under Cancer, strengthened nature, and quoted Arabian physicians who said it drove away troublesome cares and melancholy."}, "folklore": {"text": "Beekeepers rubbed hives with balm leaves, believing it kept their bees together and drew in new swarms. Pliny wrote that straying bees found their way home by it.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/b/balm--02.html"}, "science": {"text": "EU regulators (EMA) accept lemon balm only as a traditional herbal product for mild stress, sleep and digestive upsets; the one small trial they reviewed was too flawed for firm conclusions.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/melissae-folium"}, "safety": "May cause drowsiness; avoid driving if affected. Not established for children under 12, pregnancy or breastfeeding.", "card": "Melissa means 'bee' in Greek, and bees adore this lemony herb. Old beekeepers rubbed their hives with the leaves so their swarms would always find their way home.", "true_fact": "Lemon balm's botanical name, Melissa, is the Greek word for 'bee'.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:450084-1", "https://www.ema.europa.eu/en/medicines/herbal/melissae-folium", "https://www.botanical.com/botanical/mgmh/b/balm--02.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "elder", "common": "Elder", "folk_names": ["elderberry", "pipe-tree", "bore-tree", "bour-tree"], "botanical": "Sambucus nigra", "family": "Viburnaceae", "part": "berry", "season": "Flowers in early summer; berries ripen in late summer to early autumn", "planet": "Venus", "culpeper": {"heading": "THE ELDER TREE.", "quote": "every boy that plays with a pop-gun will not mistake another tree instead of Elder", "summary": "Culpeper believed elder, under Venus, carried off phlegm and choler. He thought it so well known that any boy with an elder pop-gun could name it."}, "folklore": {"text": "Danish folklore told of the Hylde-Moer, an Elder Mother spirit living in the tree. Woodcutters asked her permission before cutting, and furniture made of elder wood was said to be haunted.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/e/elder-04.html"}, "science": {"text": "NCCIH says some preliminary research suggests elderberry may relieve cold and flu symptoms, but there is not enough information on other uses; no good evidence supports COVID-19 claims.", "source": "NCCIH", "url": "https://www.nccih.nih.gov/health/elderberry"}, "safety": "Raw or unripe berries, leaves and stems are poisonous (cyanide-producing), causing vomiting and diarrhoea. Only cooked ripe berries are eaten.", "card": "In Danish folklore an Elder Mother lived in the tree, and you asked her leave before taking a branch. Its berries make fine jam, but only ripe and cooked: raw, they make you ill.", "true_fact": "Raw elderberries, leaves and stems contain cyanide-producing substances; cooking the ripe berries removes them.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:30122169-2", "https://www.nccih.nih.gov/health/elderberry", "https://www.botanical.com/botanical/mgmh/e/elder-04.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "yarrow", "common": "Yarrow", "folk_names": ["nose-bleed", "milfoil", "soldier's woundwort", "knight's milfoil", "devil's nettle"], "botanical": "Achillea millefolium", "family": "Asteraceae", "part": "flower", "season": "Summer into early autumn", "planet": "Venus", "culpeper": {"heading": "YARROW, CALLED NOSE-BLEED, MILFOIL AND THOUSAND-LEAL.", "quote": "Achilles is supposed to be the first that left the virtues of this herb to posterity", "summary": "Culpeper believed yarrow, an herb of Dame Venus, was drying and binding, and fit for ointments for wounds. He credited Achilles with first recording its virtues."}, "folklore": {"text": "Folk sewed yarrow into flannel and slept on it while reciting a verse, hoping to dream of a future spouse. In Sweden it was called Field Hop and brewed into beer.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/y/yarrow02.html"}, "science": {"text": "EU regulators (EMA) accept yarrow only as a traditional herbal product for appetite loss, mild digestive upsets, period cramps and small wounds, based on long use, not clinical trials.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/millefolii-herba"}, "safety": "Can cause allergic skin reactions. Avoid with daisy-family (Asteraceae) allergies.", "card": "Legend says Achilles took yarrow to war with him, which is how it got its name, Achillea. Lovesick folk slept with it under their pillows to dream of their sweethearts.", "true_fact": "Yarrow's genus, Achillea, is named after the Greek hero Achilles.", "kitchen_safe": false, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:2294-2", "https://www.ema.europa.eu/en/medicines/herbal/millefolii-herba", "https://www.botanical.com/botanical/mgmh/y/yarrow02.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "fennel", "common": "Fennel", "folk_names": ["sweet fennel"], "botanical": "Foeniculum vulgare", "family": "Apiaceae", "part": "seed", "season": "Late summer to autumn, when the seeds ripen", "planet": "Mercury", "culpeper": {"heading": "FENNEL.", "quote": "One good old fashion is not yet left off, viz. to boil Fennel with fish", "summary": "Culpeper believed fennel, an herb of Mercury under Virgo, was good to break wind, and that cooking it with fish worked because Virgo opposes Pisces."}, "folklore": {"text": "In the Middle Ages fennel was hung over doors on Midsummer's Eve to keep evil spirits away. On fast days the poor ate it to quiet hunger and liven plain food.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/f/fennel01.html"}, "science": {"text": "EU regulators (EMA) accept sweet fennel fruit only as a traditional herbal product for mild bloating, period cramps and chesty coughs, based on long use rather than clinical evidence.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/foeniculi-dulcis-fructus"}, "safety": "Generally well tolerated; can cause skin or breathing allergies, especially with celery- or dill-family or mugwort allergies. Medicinal use not advised in pregnancy.", "card": "On Midsummer's Eve, medieval households hung fennel over their doors to keep mischief out. Cooks have paired its anise-sweet seeds with fish for centuries.", "true_fact": "Charlemagne ordered fennel grown on his imperial farms, helping it spread through central Europe.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:842680-1", "https://www.ema.europa.eu/en/medicines/herbal/foeniculi-dulcis-fructus", "https://www.botanical.com/botanical/mgmh/f/fennel01.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "ginger", "common": "Ginger", "folk_names": [], "botanical": "Zingiber officinale", "family": "Zingiberaceae", "part": "rhizome", "season": "Tropical: in a northern garden only under glass, lifted in autumn", "planet": null, "culpeper": null, "folklore": {"text": "In medieval Europe ginger was a costly import carried along long, taxed trade routes. Noble households perfumed great halls with spiced wine fountains that included ginger.", "source": "Newberry Library, 'The Medieval Spice Trade' (Digital Collections for the Classroom)", "url": "https://dcc.newberry.org/?p=14381"}, "science": {"text": "NCCIH says research suggests ginger may help nausea and vomiting in pregnancy and possibly period cramps; most studies of motion sickness have not shown benefit.", "source": "NCCIH", "url": "https://www.nccih.nih.gov/health/ginger"}, "safety": "Can cause heartburn, stomach discomfort or mouth irritation. Ask a health provider before using supplements in pregnancy or alongside medicines.", "card": "Ginger came to medieval Europe from far-off Asia along long, costly trade roads, so precious that great halls bubbled with spiced-wine fountains just to show it off.", "true_fact": "The ginger we cook with is a rhizome, an underground stem, not a true root.", "kitchen_safe": true, "sources": ["https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:798372-1", "https://www.nccih.nih.gov/health/ginger", "https://dcc.newberry.org/?p=14381"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "rose", "common": "Rose", "folk_names": ["red Provins rose"], "botanical": "Rosa gallica", "family": "Rosaceae", "part": "petal", "season": "Early summer, when the once-blooming old roses flower", "planet": "Jupiter", "culpeper": {"heading": "ROSES.", "quote": "What a pother have authors made with Roses! What a racket have they kept?", "summary": "Culpeper believed red roses were under Jupiter, damask under Venus and white under the Moon, and that roses were cooling and drying, binding more when dried."}, "folklore": {"text": "A rose hung over the dinner table once meant everything said there was secret: 'sub rosa'. The plaster ornament in the middle of a ceiling is still called a rose.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/r/roses-18.html"}, "science": {"text": "EU regulators (EMA) accept rose petals only as a traditional herbal product for mild mouth, throat and skin inflammation; one small mouthwash study was promising but not enough on its own.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/rosae-flos"}, "safety": "No side effects known from EU review. Medicinal use not established for children under 12 or in pregnancy.", "card": "A rose hung above the table meant 'what's said here stays here', which is why secrets are told sub rosa. Apothecaries once pounded the red petals with sugar into a sweet conserve.", "true_fact": "Rose hips are the rose's fruit. In 1941, British volunteers and schoolchildren gathered 200 tons of them to make vitamin C syrup when oranges were scarce.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:732569-1", "https://www.ema.europa.eu/en/medicines/herbal/rosae-flos", "https://www.botanical.com/botanical/mgmh/r/roses-18.html", "https://www.bmj.com/content/1/4230/171.1.full.pdf"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "nettle", "common": "Stinging nettle", "folk_names": ["nettle"], "botanical": "Urtica dioica", "family": "Urticaceae", "part": "leaf", "season": "Spring, when the young tops are tender", "planet": "Mars", "culpeper": {"heading": "NETTLES.", "quote": "they may be found by feeling, in the darkest night", "summary": "Culpeper believed nettles, hot and dry under Mars, eaten as spring tops cleared away winter's cold, moist humours."}, "folklore": {"text": "Nettle fibre was woven into household linen in 16th and 17th century Scotland. During the First World War, cotton was scarce in Germany, and its army turned to nettle fibre for cloth.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/n/nettle03.html"}, "science": {"text": "EU regulators (EMA) accept nettle leaf only as a traditional herbal product for minor joint pain and to increase urine flow, based on long-standing use rather than clinical trials.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/urticae-folium"}, "safety": "Fresh plants sting the skin. Can cause mild stomach upset or rash. Medicinal use not advised in pregnancy, or with heart or kidney disease.", "card": "Nettles sting, but they also clothe and feed. Scottish homes once wove nettle linen, and spring nettle soup is an old cottage favourite. Gloves on when gathering!", "true_fact": "During the First World War, Germany made army clothing from nettle fibre when cotton ran short.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:260630-2", "https://www.ema.europa.eu/en/medicines/herbal/urticae-folium", "https://www.botanical.com/botanical/mgmh/n/nettle03.html", "https://www.ema.europa.eu/en/documents/herbal-monograph/final-community-herbal-monograph-urtica-dioica-l-urtica-urens-l-folium_en.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9230748"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "dandelion", "common": "Dandelion", "folk_names": ["piss-a-beds", "lion's tooth", "dens leonis"], "botanical": "Taraxacum officinale", "family": "Asteraceae", "part": "root", "season": "Leaves in early spring; roots lifted in autumn", "planet": "Jupiter", "culpeper": {"heading": "DANDELION, VULGARLY CALLED PISS-A-BEDS.", "quote": "the French and Dutch so often eat them in the Spring", "summary": "Culpeper believed dandelion, under Jupiter, had an opening and cleansing quality, and praised the French and Dutch for eating it in spring."}, "folklore": {"text": "Children blew on dandelion seed clocks, counting the puffs needed to clear every seed to tell the hour. Roasted, ground roots were brewed as a coffee substitute.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/d/dandel08.html"}, "science": {"text": "NCCIH says there is no compelling scientific evidence for dandelion for any health condition; very little research exists, mostly laboratory studies.", "source": "NCCIH", "url": "https://www.nccih.nih.gov/health/dandelion"}, "safety": "Likely safe in food amounts. May trigger allergies, especially with eczema. Possible interactions with diabetes, blood-thinning and water-pill medicines.", "card": "Blow a dandelion clock and count the puffs: folk said the number told the hour. Its roots, roasted and ground, made a homely coffee, and its spring leaves were eaten as greens.", "true_fact": "'Dandelion' comes from the French dent de lion, 'lion's tooth', after its jagged leaves.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:1003018-2", "https://www.nccih.nih.gov/health/dandelion", "https://www.botanical.com/botanical/mgmh/d/dandel08.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "valerian", "common": "Valerian", "folk_names": ["all-heal", "phu"], "botanical": "Valeriana officinalis", "family": "Caprifoliaceae", "part": "root", "season": "Flowers in June and July; roots lifted in autumn", "planet": "Mercury", "culpeper": {"heading": "GARDEN VALERIAN.", "quote": "The root smells more strong than either leaf or flower", "summary": "Culpeper believed garden valerian, under Mercury, had a warming faculty and helped coughs and shortness of breath. His plant may have been a related species."}, "folklore": {"text": "Cats roll in bruised valerian, and rat-catchers baited traps with it. One old suggestion holds that the Pied Piper of Hamelin carried valerian root to lure the rats.", "source": "Mrs. M. Grieve, A Modern Herbal (1931), botanical.com", "url": "https://www.botanical.com/botanical/mgmh/v/valeri01.html"}, "science": {"text": "NCCIH says evidence on valerian for sleep is inconsistent; sleep medicine experts recommend against it for chronic insomnia, and there is too little evidence for other uses.", "source": "NCCIH", "url": "https://www.nccih.nih.gov/health/valerian"}, "safety": "Sedating: never combine with alcohol or sedatives. Can cause headache, dullness, vivid dreams; rare liver injury reported. Pregnancy safety unknown.", "card": "Valerian's root smells so strong the ancients called it 'phu'. Cats adore it, and legend whispers that the Pied Piper kept some in his pocket to charm the rats.", "true_fact": "Cats are attracted to valerian root and will roll on bruised plants.", "kitchen_safe": false, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:860012-1", "https://www.nccih.nih.gov/health/valerian", "https://www.botanical.com/botanical/mgmh/v/valeri01.html"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "hops", "common": "Hops", "folk_names": ["hop", "wild hop"], "botanical": "Humulus lupulus", "family": "Cannabaceae", "part": "strobile", "season": "Early autumn: Culpeper says the heads are gathered in September", "planet": "Mars", "culpeper": {"heading": "HOPS.", "quote": "the heads are not gathered until the middle or latter end of September", "summary": "Culpeper believed hops, under Mars, opened obstructions of the liver and spleen and cleansed the blood."}, "folklore": {"text": "Old English ale was brewed without hops. In 1530 Henry VIII's household rules told his ale brewer at Eltham to use no hops, but his beer brewer used them, and hopped beer won out in the end. The popular story of a nationwide ban is a myth.", "source": "Martyn Cornell, beer historian, 'Myth two: hops were forbidden by Henry VI and Henry VIII', Zythophile", "url": "https://zythophile.co.uk/false-ale-quotes/myth-two-hops-were-forbidden-by-henry-vi"}, "science": {"text": "EU regulators (EMA) accept hops only as a traditional herbal product for mild stress and sleep; trials mixed hops with valerian, so hops' own effect is unproven.", "source": "EMA", "url": "https://www.ema.europa.eu/en/medicines/herbal/lupuli-flos"}, "safety": "Sedating: may impair driving. Not advised in pregnancy, breastfeeding or under 12. Toxic to dogs (ASPCA).", "card": "Pliny said the hop strangles willows as a wolf does a sheep; its name lupulus comes from lupus, 'wolf'. Henry VIII told his own ale brewer to keep hops out of the royal ale.", "true_fact": "The hops brewers use are the papery cones of the female hop vine.", "kitchen_safe": false, "sources": ["https://www.gutenberg.org/ebooks/49513", "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:303502-2", "https://www.ema.europa.eu/en/medicines/herbal/lupuli-flos", "https://www.botanical.com/botanical/mgmh/h/hops--32.html", "https://www.ema.europa.eu/en/documents/herbal-monograph/final-community-herbal-monograph-humulus-lupulus-l-flos-revision-1_en.pdf", "https://www.aspca.org/pet-care/animal-poison-control/toxic-and-non-toxic-plants/hops", "https://zythophile.co.uk/false-ale-quotes/myth-two-hops-were-forbidden-by-henry-vi"], "checked": "2026-11-02", "reviewed_by": null}, {"id": "garlic", "common": "Garlic", "folk_names": ["poor man's treacle"], "botanical": "Allium sativum", "family": "Amaryllidaceae", "part": "bulb", "season": "Bulbs lifted in mid to late summer", "planet": "Mars", "culpeper": {"heading": "GARLICK.", "quote": "This was anciently accounted the poor man’s treacle", "summary": "Culpeper believed garlic, owned by Mars, was an old cure-all against venom and plague, though he admitted its smell made it offensive."}, "folklore": {"text": "Herodotus wrote that an inscription on the Great Pyramid recorded how much was spent on radishes, onions and skorodon for its builders. Macaulay translates skorodon as leeks; most translators read it as garlic.", "source": "Herodotus, Histories, Book 2, ch. 125 (tr. G. C. Macaulay, public domain)", "url": "https://www.gutenberg.org/ebooks/2707"}, "science": {"text": "NCCIH says garlic supplements may lower cholesterol, blood pressure and blood sugar slightly; there is very little research on immune claims.", "source": "NCCIH", "url": "https://www.nccih.nih.gov/health/garlic"}, "safety": "Supplements may raise bleeding risk, especially with blood thinners or before surgery. Raw garlic on skin can burn.", "card": "Country folk called garlic 'the poor man's treacle': a homely standby for those who couldn't pay the apothecary. A braid hung by the hearth keeps for months.", "true_fact": "'Garlic' comes from Old English words for 'spear' and 'plant', after its spear-shaped leaves.", "kitchen_safe": true, "sources": ["https://www.gutenberg.org/ebooks/49513" (function (root) {
  const D = root.MW_DATA || (typeof require !== 'undefined' ? require('./data.js') : null);
  const ING = Object.fromEntries(D.INGREDIENTS.map(i => [i.id, i]));

  // ---------- the real sky ----------
  const SYNODIC = 29.530588853;
  const NEW_MOON_REF = Date.UTC(2000, 0, 6, 18, 14); // a known new moon
  function moon(date) {
    const age = (((date.getTime() - NEW_MOON_REF) / 864e5) % SYNODIC + SYNODIC) % SYNODIC;
    const names = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
    const name = names[Math.floor((age / SYNODIC) * 8 + 0.5) % 8];
    const lit = (1 - Math.cos((2 * Math.PI * age) / SYNODIC)) / 2;
    return { age, lit, name, waxing: age < SYNODIC / 2 };
  }
  function season(date) {
    const m = date.getMonth();
    return m <= 1 || m === 11 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn';
  }

  // ---------- brewing ----------
  function processed(id, proc, sky) {
    const t = Object.assign({}, ING[id].t);
    if (proc === 'grind') {
      let k = 'H';
      for (const a of AX) if (Math.abs(t[a]) > Math.abs(t[k])) k = a;
      if (t[k] !== 0) t[k] += Math.sign(t[k]);
    } else if (proc === 'dry') t.B += 1;
    else if (proc === 'moon') t.M += sky && sky.waxing ? 1 : -1;
    return t;
  }
  function profile(items, sky) {
    const p = { H: 0, M: 0, B: 0 };
    for (const it of items) { const t = processed(it.id, it.proc, sky); for (const a of AX) p[a] += t[a]; }
    return p;

  function resolve(items, sky) {

      if (outer && !b.external) continue;

      if (d < bd) { bd = d; best = b; }

        const r = resolve(items, sky);
        if (r.brew === target) out.push(items.slice());
        if (limit && out.length >= limit) return true;
      }
      if (items.length === 3) return false;
      for (let i = start; i < ids.length; i++) {
        const id = ids[i];
        if ((used[id] || 0) >= pantry[id]) continue;
        for (const pr of procs) {
          used[id] = (used[id] || 0) + 1; items.push({ id, proc: pr });
          const stop = rec(i, items, used);
          items.pop(); used[id]--;

      return false;

    rec(0, [], {});
    return out;

  // ---------- the day loop ----------
  function newGame(familiar, date) {
    return {
      v: 1, familiar, day: 0, coin: D.START.coin, trust: { pell: 0, wren: 0, tamsin: 0 },
      pantry: Object.assign({}, D.START.pantry), plots: Array(D.PLOTS).fill(null),
      foraged: false, served: [], seen: {}, brewsFound: {}, log: [], started: date.getTime(), firstBrewMs: null,

    return out;
  }
  function add(G, id, n) { G.pantry[id] = (G.pantry[id] || 0) + n; G.seen[id] = true; }
  function forage(G, date) {
    if (G.foraged) return null;
    G.foraged = true;
    const list = D.FORAGE[season(date)];
    const got = [];
    for (let i = 0; i < 3; i++) { const id = list[(G.day + i) % list.length]; add(G, id, 1); got.push(id); }
    const moonwort = G.day === 1 && !G.seen.moonwort;
    if (moonwort) G.seen.moonwort = true;
    return { got, moonwort };
  }
  function plant(G, plot, seedId) {
    const s = D.SEEDS.find(x => x.id === seedId);
    if (!s || G.plots[plot] || G.coin < s.cost) return false;
    G.coin -= s.cost; G.plots[plot] = { id: s.id, yield: s.yield, day: G.day };

  }
  function troubles(G) { return (D.DAYS[G.day] || { troubles: [] }).troubles; }
  function brew(G, items, sky) {
    for (const it of items) if (!(G.pantry[it.id] > 0)) return null;
    const need = {};
    for (const it of items) need[it.id] = (need[it.id] || 0) + 1;
    for (const id in need) if (G.pantry[id] < need[id]) return null;
    for (const id in need) G.pantry[id] -= need[id];
    for (const it of items) G.seen[it.id] = true;
    const res = resolve(items, sky);
    if (res.brew) G.brewsFound[res.brew] = Math.max(G.brewsFound[res.brew] || 0, res.stars);
    return res;
  }
  function serve(G, idx, res, nowMs) {
    const tr = troubles(G)[idx];
    const g = grade(tr, res);
    G.coin += D.PAY[g]; G.trust[tr.v] += D.TRUST[g];
    if (G.firstBrewMs == null) G.firstBrewMs = nowMs - G.started;
    G.served.push({ idx, g, brew: res.brew, name: res.name });
    G.log.push({ day: G.day, v: tr.v, g, brew: res.brew || res.dud });
    return g;
  }
  function endDay(G) {
    G.day++;
    if (G.day >= D.DAYS.length) { G.done = true; G.phase = 'end'; } else G.phase = 'dawn';
  }

  const MW = { ING, BREW, moon, season, processed, profile, resolve, grade, hint, solutions, newGame, dawn, forage, plant, troubles, brew, serve, endDay, add };
  root.MW = MW;

    v.innerHTML = U.tab === 'shop' ? shopView() : U.tab === 'bench' ? benchView() : U.tab === 'garden' ? gardenView() : grimoireView();
  }
  function shopView() {
    const left = waiting();
    const cards = today().map((tr, i) => {
      const vi = vill(tr.v), s = U.G.served.find(x => x.idx === i);
      return `<div class="box ${s ? 'served' : ''}"><div class="cust">${ART.face(vi)}<div style="flex:1"><div class="who">${vi.name} <span>${vi.role}</span></div>
        <div class="bubble">${esc(tr.text)}</div>
        ${s ? `<div style="margin-top:6px"><span class="tag ${s.g}">${esc(s.name)}</span></div>` : `<div class="row"><button class="btn pri sm" data-act="brewFor" data-i="${i}" type="button">Brew for ${vi.name.replace('Old ', '')}</button></div>`}</div></div></div>`;
    }).join('');
    return `<h2>The shop</h2><p class="small">${left.length ? `${left.length} at the door. Read what they need; they won't tell you what to make.` : 'Everyone has been helped today.'}</p>${cards}
      ${left.length ? '' : '<button class="btn pri wide" data-act="dusk" type="button">Close up for the night</button>'}`;
  }
  function benchView() {
    const G = U.G;
    if (U.cust == null || servedIdx().includes(U.cust)) U.cust = waiting()[0] ?? null;
    const tr = U.cust != null ? today()[U.cust] : null;
    const used = {}; U.mix.forEach(m => used[m.id] = (used[m.id] || 0) + 1);
    const slots = [0, 1, 2].map(k => {
      const m = U.mix[k];
      if (!m) return `<div class="slot">empty</div>`;
      const ing = MW.ING[m.id], pr = D.PROCESSES.find(p => p.id === m.proc);
      return `<div class="slot full">${ART.herb(ing)}<div>${ing.name}</div><button class="proc" data-act="proc" data-k="${k}" type="button">${pr.name} ↻</button><button class="x" data-act="unmix" data-k="${k}" type="button">remove</button></div>`;
    }).join('');
    const p = MW.profile(U.mix, U.sky);
    const herbs = D.INGREDIENTS.filter(i => !i.loreOnly && (G.pantry[i.id] || 0) > 0).map(i => {
      const left = G.pantry[i.id] - (used[i.id] || 0);
      return `<button class="herb" data-act="mix" data-id="${i.id}" type="button" ${left <= 0 || U.mix.length >= 3 ? 'disabled' : ''}><span class="n">${left}</span>${ART.herb(i)}${i.name}${i.outerOnly ? '<span class="tag">pillow only</span>' : ''}</button>`;
    }).join('');
    return `${tr ? `<div class="box"><div class="cust">${ART.face(vill(tr.v))}<div style="flex:1"><div class="who">For ${vill(tr.v).name}</div><div class="bubble">${esc(tr.text)}</div></div></div></div>` : '<div class="box small">Nobody is waiting. You can still experiment; set-aside brews sell at dusk.</div>'}
      <h3>Mortar</h3><div class="slots">${slots}</div>
      ${U.mix.length ? bars(p) : '<p class="small">Tap herbs below to add up to three. Tap a herb\'s preparation to change it.</p>'}
      <div class="row"><button class="btn pri" data-act="stir" type="button" ${U.mix.length ? '' : 'disabled'}>Stir the brew</button>${U.mix.length ? '<button class="btn sm" data-act="clear" type="button">Clear</button>' : ''}</div>
      <h3>Pantry</h3>${U.mix.length ? `<p class="small">${U.mix.map(m => MW.ING[m.id].name + ': ' + traitWords(MW.processed(m.id, m.proc, U.sky))).join('<br>')}</p>` : ''}
      <div class="pantry">${herbs || '<p class="small">The pantry is empty. Try the garden.</p>'}</div>`;
  }
  function gardenView() {
    const G = U.G;
    const plots = G.plots.map((pl, k) => pl
      ? `<div class="box plot"><div class="soil">${ART.herb(MW.ING[pl.id])}</div><div><b>${MW.ING[pl.id].name}</b><div class="small">${pl.day < G.day ? 'Ready' : 'Growing. Ready at dawn.'}</div></div></div>`
      : `<div class="box"><div class="plot"><div class="soil"></div><div><b>Empty plot</b><div class="small">Sow seeds; they're ready at dawn.</div></div></div>
          <div class="seeds">${D.SEEDS.map(s => `<button class="btn sm" data-act="plant" data-k="${k}" data-id="${s.id}" type="button" ${G.coin < s.cost || G.done ? 'disabled' : ''}>${MW.ING[s.id].name} · ${s.cost}◉ → ${s.yield}</button>`).join('')}</div></div>`).join('');
    return `<h2>Garden &amp; hedgerow</h2>
      <div class="box"><b>The hedgerow</b><p class="small">${G.foraged ? 'You foraged today. The hedge needs time to grow back.' : `Gather a little of what the ${MW.season(U.date)} hedge offers. Take only a little, and only what you know.`}</p>
      <button class="btn ${G.foraged ? '' : 'pri'} wide" data-act="forage" type="button" ${G.foraged || G.done ? 'disabled' : ''}>Forage (once a day)</button></div>
      <h3>One garden bed</h3>${plots}`;
  }
  function grimoireView() {
    const G = U.G;
    const tabs = `<div class="tabs"><button class="${U.gTab === 'herbs' ? 'on' : ''}" data-act="gTab" data-t="herbs" type="button">Herbs ${Object.keys(G.seen).length}/${D.INGREDIENTS.length}</button><button class="${U.gTab === 'brews' ? 'on' : ''}" data-act="gTab" data-t="brews" type="button">Brews ${Object.keys(G.brewsFound).length}/${D.BREWS.length}</button></div>`;
    if (U.gTab === 'brews') return `<h2>Grimoire</h2>${tabs}` + D.BREWS.map(b => G.brewsFound[b.id]
      ? `<div class="box"><b>${b.name}</b> ${stars(G.brewsFound[b.id])}<div class="small">${esc(b.blurb)}</div></div>`
      : `<div class="box small">??? · not yet discovered</div>`).join('');
    return `<h2>Grimoire</h2>${tabs}<p class="small">Use a herb to open its lore card.</p><div class="pantry">` + D.INGREDIENTS.map(i => G.seen[i.id]
      ? `<button class="herb" data-act="lore" data-id="${i.id}" type="button">${ART.herb(i)}${i.name}</button>`
      : `<button class="herb locked" type="button" disabled>${ART.herb(i)}???</button>`).join('') + '</div>';
  }

  // ---------- lore card ----------
  function loreScreen(id, back) {
    const ing = MW.ING[id], L = LORE[id] || {};
    const c = L.culpeper, f = L.folklore, s = L.science;
    showSheet(`<div class="frame lore"><div style="display:flex;gap:10px;align-items:center"><div style="width:52px">${ART.herb(ing)}</div><div><h2 style="margin:0">${ing.name}</h2>
      <div class="bot">${esc(L.botanical || '')}${L.family ? ' · ' + esc(L.family) : ''}</div></div></div>
      ${L.card ? `<p>${esc(L.card)}</p>` : '<p class="small">Lore card coming soon.</p>'}
      ${L.true_fact ? `<div class="fact"><b>True fact:</b> ${esc(L.true_fact)}</div>` : ''}
      ${c && c.quote ? `<q>${esc(c.quote)}</q><div class="src">Nicholas Culpeper, <i>The Complete Herbal</i> (1653)${L.planet ? ' · he gave it to ' + esc(L.planet) : ''}</div>` : ''}
      ${f && f.text ? `<h3>Folklore</h3><p class="small">${esc(f.text)}</p>` : ''}
      ${s && s.text ? `<h3>What science says today</h3><p class="small">${esc(s.text)}</p>` : ''}
      ${L.safety ? `<div class="safe">${esc(L.safety)}</div>` : ''}
      ${ing.t ? `<p class="small">In the game: ${traitWords(ing.t)}</p>` : '<p class="small">Lore only. Never picked, never brewed.</p>'}
      ${(L.sources || []).length ? `<div class="src">Sources: ${L.sources.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0])}</a>`).join(' · ')}</div>` : ''}
      <p class="src">Folklore and history, not medical advice.</p>
      <button class="btn pri wide" data-act="${back || 'close'}" type="button">Close</button></div>`);
  }

  // ---------- brewing ----------
  function stirScreen() {
    U.stir = { turns: 0, last: null, acc: 0 };
    showSheet(`<div class="frame" style="text-align:center"><h2>Stir</h2><p class="small">Draw circles in the cauldron. Two turns.</p>
      <div id="stir"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#1d1526" stroke="#e3b75a" stroke-width="3"/>
      <circle cx="100" cy="100" r="74" fill="${mixColor()}" opacity=".85"/><circle class="ring" id="stirRing" cx="100" cy="100" r="84" fill="none" stroke="#f2d48f" stroke-width="6" stroke-dasharray="528" stroke-dashoffset="528" transform="rotate(-90 100 100)"/>
      <circle id="spoon" cx="100" cy="40" r="9" fill="#c9953e"/></svg></div>
      <button class="btn sm" data-act="autoStir" type="button">Stir for me</button></div>`);
    const el = $('#stir');
    const ang = e => { const r = el.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
    el.addEventListener('pointerdown', e => { U.stir.last = ang(e); el.setPointerCapture && el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (U.stir.last == null) return;
      const a = ang(e); let d = a - U.stir.last; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
      U.stir.last = a; U.stir.acc += Math.abs(d); stirProgress(a);
    });
    el.addEventListener('pointerup', () => { U.stir.last = null; });
  }
  function mixColor() {
    const cs = U.mix.map(m => MW.ING[m.id].color);
    return cs[0] || '#6b5a7a';
  }
  function stirProgress(a) {
    const f = Math.min(1, U.stir.acc / (4 * Math.PI));
    const ring = $('#stirRing'); if (ring) ring.setAttribute('stroke-dashoffset', String(528 * (1 - f)));
    const sp = $('#spoon'); if (sp && a != null) { sp.setAttribute('cx', 100 + Math.cos(a) * 60); sp.setAttribute('cy', 100 + Math.sin(a) * 60); }
    if (Math.floor(U.stir.acc / Math.PI) > (U.stir.ticks || 0)) { U.stir.ticks = Math.floor(U.stir.acc / Math.PI); A.bubble(); if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {} }
    if (f >= 1 && !U.stir.done) { U.stir.done = true; setTimeout(finishBrew, 150); }
  }
  function finishBrew() {
    const before = Object.assign({}, U.G.seen);
    const res = MW.brew(U.G, U.mix, U.sky);
    if (!res) { hideSheet(); toast('Not enough in the pantry.'); return; }
    U.res = res; U.res.newLore = Object.keys(U.G.seen).filter(k => !before[k]);
    U.mix = []; save();
    A.chime(!!res.brew);
    const tr = U.cust != null ? today()[U.cust] : null;
    showSheet(`<div class="frame" style="text-align:center"><p class="small">You made…</p><h2>${esc(res.name)}</h2>
      ${res.brew ? stars(res.stars) + `<p class="small">${esc(MW.BREW[res.brew].blurb)}</p>` : '<p class="small">A dud! Still sellable. Nothing is ever wasted in Little Hollow.</p>'}
      ${bars(res.profile)}
      ${res.newLore.length ? `<p class="small" style="margin-top:8px">New in your grimoire: ${res.newLore.map(id => MW.ING[id].name).join(', ')}</p>` : ''}
      <div style="height:10px"></div>
      ${tr ? `<button class="btn pri wide" data-act="give" type="button">Give it to ${vill(tr.v).name}</button><div style="height:8px"></div>` : ''}
      <button class="btn wide" data-act="shelf" type="button">Set it aside and brew again</button></div>`);
  }
  function give() {
    const G = U.G, i = U.cust, tr = today()[i], res = U.res, vi = vill(tr.v);
    const coin0 = G.coin;
    const g = MW.serve(G, i, res, Date.now());
    U.res = null; save();
    const react = {
      best: `${vi.name} sips, and the whole face softens. "That's exactly it. How did you know?"`,
      ok: `${vi.name} smiles. "That helps. Not quite what I had in mind, but it helps."`,
      other: `${vi.name} looks puzzled but polite. "It's lovely... just not for this."`,
      dud: `${vi.name} takes a sip and ${D.DUDS[res.dud] ? D.DUDS[res.dud].fx : 'blinks.'} You both laugh.`,
    }[g];
    const hintLine = g === 'best' ? (res.newLore && res.newLore.length ? `Have a look at the grimoire. ${MW.ING[res.newLore[0]].name} has a story.` : 'Well read.')
      : MW.hint(tr, res.profile);
    const lore = (res.newLore || [])[0];
    showSheet(`<div class="frame"><div class="cust">${ART.face(vi)}<div class="bubble" style="flex:1">${esc(react)}</div></div>
      <p style="margin-top:10px">+${G.coin - coin0} coin${D.TRUST[g] ? ` · +${D.TRUST[g]} trust` : ''}</p>
      <div class="cust"><div style="flex:0 0 48px">${ART.familiar(fam().kind).replace('<svg', '<svg width="48" height="48"')}</div><div class="bubble" style="flex:1"><b>${fam().name}:</b> ${esc(hintLine)}</div></div>
      <div style="height:12px"></div>
      ${lore ? `<button class="btn wide" data-act="lore" data-id="${lore}" data-back="afterGive" type="button">Read the ${MW.ING[lore].name} card</button><div style="height:8px"></div>` : ''}
      <button class="btn pri wide" data-act="afterGive" type="button">${waiting().length ? 'Next neighbor' : 'Close up for the night'}</button></div>`);
  }
  function afterGive() {
    hideSheet();
    if (!waiting().length) return duskScreen();
    U.tab = 'shop'; render();
  }

  // ---------- garden ----------
  function doForage() {
    const r = MW.forage(U.G, U.date); if (!r) return; save(); A.chime(true);
    showSheet(`<div class="frame"><h2>The hedgerow</h2><p>You gather ${r.got.map(id => MW.ING[id].name).join(', ')}.</p>
      ${r.moonwort ? `<div class="box"><div style="display:flex;gap:10px;align-items:center"><div style="width:44px">${ART.herb(MW.ING.moonwort)}</div><div><b>Moonwort!</b><div class="small">A tiny fern with half-moon leaves, the plant the shop is named for. It's rare, so you leave it be and only sketch it in the grimoire.</div></div></div></div>` : ''}
      <p class="small">${fam().name} says: only gather what you know for certain, and leave plenty for the bees.</p>
      ${r.moonwort ? '<button class="btn wide" data-act="lore" data-id="moonwort" data-back="close" type="button">Read the Moonwort card</button><div style="height:8px"></div>' : ''}
      <button class="btn pri wide" data-act="close" type="button">Back</button></div>`);
  }

  // ---------- feedback ----------
  const FQ = [
    { id: 'fun', q: 'How fun was it? (1-5)', o: ['1', '2', '3', '4', '5'] },
    { id: 'again', q: 'Do you want to keep playing?', o: ['Yes', 'Maybe', 'No'] },
    { id: 'found', q: 'Did you find brews without help?', o: ['Yes', 'Sometimes', 'No'] },
  ];
  function feedbackScreen() {
    U.fb = {};
    const qs = FQ.map(f => `<div class="q">${f.q}</div><div class="opts">${f.o.map(o => `<button type="button" data-fq="${f.id}" data-fv="${o}">${o}</button>`).join('')}</div>`).join('');
    showSheet(`<div class="frame fb"><h2>Quick feedback</h2><p class="small">Tap what fits. One answer is enough.</p>${qs}
      <div class="q">One real plant fact you remember (no peeking):</div><textarea id="fbFact"></textarea>
      <div class="q">Anything else?</div><textarea id="fbNote"></textarea><div id="fbErr"></div>
      <button class="btn pri wide" data-act="fbSend" type="button">Send</button><div style="height:8px"></div>
      <button class="btn wide" data-act="${U.G && U.G.done ? 'endBack' : 'back'}" type="button">Back</button><div id="fbCopy" hidden></div></div>`);
  }
  async function sendFeedback() {
    U.fb.fact = $('#fbFact').value.trim(); U.fb.note = $('#fbNote').value.trim();
    if (!FQ.some(f => U.fb[f.id]) && !U.fb.fact && !U.fb.note) { $('#fbErr').textContent = 'Tap at least one answer first.'; return; }
    const body = { version: VERSION, at: new Date().toISOString(), answers: U.fb, result: U.lastRes || (U.G ? { day: U.G.day, coin: U.G.coin } : null) };
    let ok = false;
    try { const db = window.claude && window.claude.use ? await window.claude.use('db') : null; if (db) { await db.collection('feedback').add(body); ok = true; } } catch (e) {}
    if (!ok && location.protocol !== 'file:') { try { const res = await fetch('/forge/api/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ game: 'moonwort-co' }, body)) }); ok = res.ok; } catch (e) {} }
    if (ok) { toast('Thank you!'); return U.G && U.G.done ? endScreen() : titleScreen(); }
    const txt = 'Moonwort & Co. ' + VERSION + ' feedback\n' + FQ.map(f => f.q + ' ' + (U.fb[f.id] || '-')).join('\n') + '\nPlant fact: ' + (U.fb.fact || '-') + '\nNotes: ' + (U.fb.note || '-') + '\nResult: ' + JSON.stringify(body.result);
    const c = $('#fbCopy'); c.hidden = false;
    c.innerHTML = `<p class="small" style="margin-top:10px">Couldn't send from here. Copy this and paste it to the crew:</p><textarea readonly>${esc(txt)}</textarea>`;
    try { navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
  }

  // ---------- input ----------
  document.addEventListener('click', e => {
    const fq = e.target.closest('[data-fq]');
    if (fq) { U.fb[fq.dataset.fq] = fq.dataset.fv; fq.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === fq)); return; }
    const tabB = e.target.closest('#nav [data-tab]');
    if (tabB) { U.tab = tabB.dataset.tab; A.tap(); render(); $('#view').scrollTop = 0; return; }
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act; A.unlock();
    if (a === 'new') quizScreen(0);
    else if (a === 'continue') { U.G = load(); U.mode = 'play'; hideSheet(); U.tab = 'shop'; render(); if (U.G.phase === 'dawn') dawnScreen(); }
    else if (a === 'how') howScreen();
    else if (a === 'back' || a === 'title') titleScreen();
    else if (a === 'sound') { A.toggle(); titleScreen(); }
    else if (a === 'feedback') feedbackScreen();
    else if (a === 'fbSend') sendFeedback();
    else if (a === 'endBack') endScreen();
    else if (a === 'quiz') { U.quiz.push(D.QUIZ[+b.dataset.q].a[+b.dataset.a].f); A.tap(); quizScreen(+b.dataset.q + 1); }
    else if (a === 'startGame') startGame();
    else if (a === 'openShop') { hideSheet(); U.tab = 'shop'; render(); }
    else if (a === 'brewFor') { U.cust = +b.dataset.i; U.mix = []; U.tab = 'bench'; render(); $('#view').scrollTop = 0; }
    else if (a === 'mix') { if (U.mix.length < 3) { U.mix.push({ id: b.dataset.id, proc: 'steep' }); A.tap(); render(); } }
    else if (a === 'unmix') { U.mix.splice(+b.dataset.k, 1); render(); }
    else if (a === 'proc') { const m = U.mix[+b.dataset.k], ps = D.PROCESSES.map(p => p.id); m.proc = ps[(ps.indexOf(m.proc) + 1) % ps.length]; A.tap(); render(); }
    else if (a === 'clear') { U.mix = []; render(); }
    else if (a === 'stir') stirScreen();
    else if (a === 'autoStir') { U.stir.acc = 4 * Math.PI; stirProgress(null); }
    else if (a === 'give') give();
    else if (a === 'shelf') { if (U.res) U.G.shelf = (U.G.shelf || 0) + 1; U.res = null; save(); hideSheet(); render(); }
    else if (a === 'afterGive') afterGive();
    else if (a === 'dusk') duskScreen();
    else if (a === 'sleep') sleep();
    else if (a === 'tab') { hideSheet(); U.tab = b.dataset.tab; render(); }
    else if (a === 'forage') doForage();
    else if (a === 'plant') { if (MW.plant(U.G, +b.dataset.k, b.dataset.id)) { save(); A.tap(); toast(MW.ING[b.dataset.id].name + ' sown. Ready at dawn.'); } render(); }
    else if (a === 'gTab') { U.gTab = b.dataset.t; render(); }
    else if (a === 'lore') loreScreen(b.dataset.id, b.dataset.back);
    else if (a === 'grim') { hideSheet(); U.mode = 'play'; U.tab = 'grimoire'; render(); }
    else if (a === 'close') { hideSheet(); render(); }
    else if (a === 'menu') showSheet(`<div class="frame"><h2>Menu</h2><div class="row" style="flex-direction:column"><button class="btn wide" data-act="close" type="button">Back to the shop</button><button class="btn wide" data-act="how" type="button">How to play</button><button class="btn wide" data-act="feedback" type="button">Feedback</button><button class="btn wide" data-act="title" type="button">Title screen</button></div></div>`);
  });

  // Test and sim hooks
  window.MWUI_API = { render, startGame, dawnScreen, duskScreen, loreScreen, LORE };
  titleScreen();
})();

</script>
</body>
</html>
