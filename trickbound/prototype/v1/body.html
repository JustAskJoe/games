<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Trickbound</h1><span id="modeTag">Books on the Line</span></div>
    <div class="meta">
      <span class="chip" id="chipHand">Hand 1</span>
      <button class="btn icon" id="bMenu" type="button" aria-label="Menu">☰</button>
    </div>
  </header>

  <div class="board">
    <div class="main">
      <section class="pad" id="pad" aria-label="Score pad"></section>
      <section class="seats" aria-label="The other players">
        <div class="seat" id="seat1"></div>
        <div class="seat partner" id="seat2"></div>
        <div class="seat" id="seat3"></div>
      </section>
      <section class="table" id="table" aria-live="polite"></section>
      <div class="logrow"><div class="log" id="log"></div><div id="flagBtn"></div></div>
      <section class="me" id="me" aria-label="Your seat">
        <div class="me-top" id="meTop"></div>
        <div id="wild"></div>
        <div class="hand" id="hand"></div>
        <div class="prompt" id="prompt"></div>
      </section>
    </div>
    <aside class="side">
      <div class="card" id="sidePanel"></div>
    </aside>
  </div>
  <p class="foot">© 2026 F Lane d/b/a One Fifty Labs. All rights reserved. Prototype. Placeholder cards, voices and table talk; art is AI mood reference.</p>
</div>
<div class="owner" aria-hidden="true">© 2026 F Lane d/b/a One Fifty Labs · All rights reserved</div>
<div id="overlay"></div>
<div id="story" class="story" hidden></div>
