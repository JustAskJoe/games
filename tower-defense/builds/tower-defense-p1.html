<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tower Defense · Prototype 1.1</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column. Top bar, map canvas, context sheet (build / draft / wave info), coach line.
   One committed look pulled from the chosen art reference: ink linework over flat painterly color.
   Teal slate, warm timber, cream plaster, moss, dusty-rose sky. */
:root {
  --sky: #D9C9C0; --sky-2: #CDB9B0; --paper: #F1E4CC; --paper-2: #E6D6B8; --ink: #3A2518; --ink-2: #6B4226; --muted: #8A6B52;
  --teal: #4E8F86; --teal-2: #3A6E67; --moss: #6E9A4C; --moss-2: #4F7A33; --timber: #6B4226; --plaster: #F7EEDC;
  --gold: #D9A441; --rust: #B8533A; --frost: #8FC8D8; --spark: #4F8FD6; --good: #4F7A33; --bad: #A3382E;
  --display: 'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); height: 100%; }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(180deg, #E3D4CB 0%, var(--sky) 40%, var(--sky-2) 100%); }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px 72px; display: flex; flex-direction: column; gap: 10px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; letter-spacing: -.01em; line-height: 1.05; text-wrap: balance; }
.btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 12px; min-height: 44px; padding: 8px 16px; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }
.btn.primary { background: var(--teal); color: #fff; }
.btn.gold { background: var(--gold); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-2); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.icon { width: 44px; padding: 0; font-size: 20px; }
.btn[aria-pressed="true"] { background: var(--moss); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.eyebrow { font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--teal-2); }
.muted { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }
.owner { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 80; font-size: 10.5px; font-weight: 700; color: rgba(58,37,24,.6); background: rgba(241,228,204,.85); padding: 3px 8px; border-radius: 999px; pointer-events: none; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.top .t { display: flex; flex-direction: column; min-width: 0; }
.top .t h1 { font-size: 20px; }
.top .t span { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; box-shadow: 0 3px 0 var(--ink); }
.stat b { font-family: var(--display); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.stat.hp b { color: var(--rust); } .stat.gold b { color: #9A6A12; } .stat.wave b { color: var(--teal-2); }
.stat .bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; margin-top: 4px; }
.stat .bar i { display: block; height: 100%; background: var(--rust); transition: width .3s; }

/* ---------- map ---------- */
.map-wrap { position: relative; width: 100%; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; background: var(--moss); box-shadow: 0 6px 0 var(--ink), 0 14px 30px rgba(58,37,24,.25); }
canvas#map { display: block; width: 100%; height: auto; touch-action: manipulation; }
.map-wrap.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 8vw, 40px); color: var(--plaster); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 0 3px 0 var(--ink), 0 6px 18px rgba(0,0,0,.35); pointer-events: none; animation: banner 1.5s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(.7); } 20% { opacity: 1; transform: scale(1.05); } 75% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- controls row ---------- */
.ctl { display: flex; gap: 8px; align-items: center; }
.ctl .grow { flex: 1; min-width: 0; }
.next { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: 0 3px 0 var(--ink); }
.next .lbl { font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.next .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--plaster); }
.pill i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }

/* ---------- coach ---------- */
.coach { display: flex; gap: 10px; align-items: flex-start; background: var(--plaster); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; min-height: 58px; box-shadow: 0 3px 0 var(--ink); }
.coach .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--teal); border: 2px solid var(--ink); display: grid; place-items: center; }
.coach .av svg { width: 32px; height: 32px; }
.coach p { margin: 0; font-size: 15px; }
.coach p b.who { color: var(--teal-2); }

/* ---------- sheets (build / draft / info) ---------- */
.sheet { background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 0 var(--ink); }
.sheet h2 { font-size: 22px; }
.sheet h3 { font-size: 17px; }
.sheet p { margin: 0; }
.sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.shop { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.shop button { background: var(--plaster); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; min-height: 88px; box-shadow: 0 3px 0 var(--ink); min-width: 0; }
.shop button svg { width: 40px; height: 40px; }
.shop button b { font-size: 13px; }
.shop button small { font-size: 12px; color: #9A6A12; font-weight: 700; }
.shop button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.shop button[aria-pressed="true"] small { color: #FFE9A8; }
.shop button:disabled { opacity: .45; cursor: not-allowed; }
.shop button.hint { animation: glow 1s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 0 5px rgba(217,164,65,.55); } }
.twinfo { display: flex; gap: 12px; align-items: center; }
.twinfo svg { width: 56px; height: 56px; flex: none; }
.twinfo .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.twinfo .txt small { color: var(--muted); font-size: 13px; }
.branches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.branches button { background: var(--plaster); border: 2px solid var(--ink); border-radius: 12px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 3px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); min-width: 0; }
.branches button b { font-size: 15px; }
.branches button small { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.branches button:disabled { opacity: .5; cursor: not-allowed; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { background: var(--plaster); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 8px; text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); min-height: 150px; min-width: 0; position: relative; }
.card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.card .kind { font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 700; }
.card.buff .kind { color: var(--rust); } .card.economy .kind { color: #9A6A12; } .card.keep .kind { color: var(--teal-2); }
.card b { font-family: var(--display); font-size: 16px; line-height: 1.1; }
.card small { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.card.hint { animation: glow 1s ease-in-out infinite; }
.deck { display: flex; gap: 6px; flex-wrap: wrap; }
.deck .pill { font-size: 12px; }
.waves { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.waves i { height: 8px; border-radius: 4px; background: var(--paper-2); border: 1.5px solid var(--ink); }
.waves i.done { background: var(--moss); } .waves i.now { background: var(--gold); }

/* ---------- overlays ---------- */
.veil-bg { position: fixed; inset: 0; background: rgba(58,37,24,.55); display: grid; place-items: end center; z-index: 50; }
.modal { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); width: min(560px, 100%); max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; animation: sheetUp .3s ease-out; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h2 { font-size: 26px; }
.modal p, .modal ol, .modal ul { margin: 0; }
.modal ol, .modal ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.modal .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu .btn { justify-content: space-between; }
.menu h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal-2); margin: 10px 0 2px; }
.tester-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tester-row .btn { flex: 1 1 auto; min-width: 44px; }
.tester-note { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.top .t .test-flag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--rust); color: #fff; font-size: 10.5px; letter-spacing: 1px; font-weight: 800; vertical-align: middle; }
.foot { padding-inline: 52px; margin-bottom: 36px; }
.music-btn { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 80; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); color: var(--teal-2); font-size: 18px; font-weight: 800; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 0 var(--ink); }
.music-btn.off { color: var(--muted); background: var(--paper-2); text-decoration: line-through; }
.music-btn:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 15px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
textarea, input[type=text] { font: inherit; color: var(--ink); background: var(--plaster); border: 2px solid var(--ink); border-radius: 10px; padding: 10px; width: 100%; }
.copybox { background: var(--plaster); border: 2px solid var(--ink); border-radius: 10px; padding: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }
.endstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.endstats div { background: var(--plaster); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; text-align: center; }
.endstats b { font-family: var(--display); font-size: 24px; display: block; }
.endstats span { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- story / intro ---------- */
.story { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: linear-gradient(180deg, #E3D4CB 0%, var(--sky) 50%, #C9B5AB 100%); }
.story-in { min-height: 100%; max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; text-align: center; }
.story .hero { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--teal-2); box-shadow: 0 6px 0 var(--ink); }
.story .hero img, .story .hero svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.title { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 12vw, 72px); line-height: .95; margin: 0; color: var(--ink); letter-spacing: -.02em; }
.story .lead { font-size: clamp(17px, 4.4vw, 20px); color: var(--ink-2); max-width: 34ch; margin: 0; }
.story .copy { max-width: 38ch; margin: 0; color: var(--muted); font-size: 15.5px; }
.story .skip { background: transparent; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 10px; min-height: 44px; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(58,37,24,.25); }
.dots span.on { background: var(--ink); }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.rise.d1 { animation-delay: .15s; } .rise.d2 { animation-delay: .35s; } .rise.d3 { animation-delay: .55s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; }
.legend div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.legend svg { width: 48px; height: 48px; }
.legend.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.doors { display: grid; gap: 10px; width: 100%; max-width: 420px; }
.door { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
.door b { font-family: var(--display); font-size: 19px; }
.door small { color: var(--muted); font-size: 13px; }
.door.primary { background: var(--teal); color: #fff; } .door.primary small { color: #D9EEEA; }

@media (min-width: 720px) { .app { max-width: 720px; } .cards { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 340px) { .shop { grid-template-columns: repeat(2, 1fr); } .cards { grid-template-columns: 1fr; } .card { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <div class="t"><h1>Tower Defense</h1><span id="modeTag">Prototype 1.1 · solo run</span></div>
    <button class="btn icon" id="bMenu" type="button" aria-label="Menu">☰</button>
  </header>
  <section class="hud" id="hud" aria-label="Run status"></section>
  <div class="map-wrap" id="mapWrap"><canvas id="map" width="960" height="640" aria-label="The keep and the road"></canvas><div id="bannerHost"></div></div>
  <section class="ctl" id="ctl"></section>
  <section class="coach" id="coach" aria-live="polite"></section>
  <section class="sheet" id="sheet"></section>
  <p class="foot">© 2026 F Lane d/b/a One Fifty Labs. All rights reserved. Prototype: placeholder vector art, not final art.</p>
</div>
<div class="owner" aria-hidden="true">© 2026 F Lane d/b/a One Fifty Labs</div>
<div id="overlay"></div>
<div id="story" class="story" hidden></div>
<script>
/* Tower Defense (working title) — Prototype 1 engine.
   © 2026 F Lane d/b/a One Fifty Labs. All rights reserved.
   Pure game logic, no DOM. Runs in the browser as window.TD and in node (sim.js).
   Fixed-step simulation (20 ticks/sec). One map whose path grows twice. */
(function (root) {
  'use strict';
  const TICK = 1 / 20; // seconds per tick

  // ---------- seeded RNG ----------
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    const next = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    next.int = (n) => Math.floor(next() * n);
    next.pick = (a) => a[next.int(a.length)];
    return next;
  }

  // ---------- map: 12 cols x 8 rows; the path grows in three stages ----------
  const COLS = 12, ROWS = 8;
  // stage 0: enemies walk from the left edge to the keep's old gate at (5,3)
  // stage 1: the path extends and the keep moves out; stage 2 again. Enemies always walk toward the LAST cell.
  const PATHS = [
    [[0, 3], [1, 3], [2, 3], [2, 2], [3, 2], [4, 2], [4, 3], [5, 3]],
    [[5, 4], [5, 5], [6, 5], [7, 5], [8, 5], [8, 4], [8, 3]],
    [[9, 3], [9, 2], [10, 2], [11, 2], [11, 3], [11, 4]],
  ];
  const SPOTS = [
    [[1, 2], [3, 3], [3, 1], [5, 2]],
    [[6, 4], [7, 6], [9, 4]],
    [[10, 3], [9, 1], [10, 5]],
  ];
  function pathUpTo(stage) { return PATHS.slice(0, stage + 1).flat(); }
  function spotsUpTo(stage) { return SPOTS.slice(0, stage + 1).flat(); }
  function keepCell(stage) { const p = PATHS[stage]; return p[p.length - 1]; }

  // ---------- towers ----------
  // Each tower has two upgrade branches (A/B). Upgrading picks one; tier 2 = that branch.
  const TOWERS = {
    arrow: { name: 'Arrow', cost: 60, range: 2.8, rate: 1.4, dmg: 13, color: '#B8873A', hit: 'single',
      desc: 'Steady single-target shots. Cheap and reliable.',
      up: { A: { name: 'Pierce', cost: 70, desc: 'Arrows pass through, hitting up to 3 enemies in a line.', dmg: 15, pierce: 3 },
            B: { name: 'Multishot', cost: 70, desc: 'Fires twice as fast.', rate: 2.8, dmg: 11 } } },
    cannon: { name: 'Cannon', cost: 90, range: 2.4, rate: 0.55, dmg: 30, color: '#6B5B7A', hit: 'splash', splash: 0.9,
      desc: 'Slow, heavy splash damage. Great against packs. Can\'t hit flyers.', ground: true,
      up: { A: { name: 'Big Shot', cost: 90, desc: 'Much bigger blast radius.', splash: 1.5, dmg: 34 },
            B: { name: 'Siege', cost: 90, desc: 'Double damage to armored enemies.', armorMul: 2, dmg: 32 } } },
    spark: { name: 'Spark', cost: 85, range: 2.6, rate: 1.0, dmg: 16, color: '#4F8FD6', hit: 'chain', chain: 3,
      desc: 'Chain lightning jumps between enemies. Strong against flyers.', vsFlying: 1.6,
      up: { A: { name: 'Storm', cost: 80, desc: 'Chains to 5 enemies.', chain: 5 },
            B: { name: 'Overload', cost: 80, desc: 'Each jump does full damage, not less.', decay: 1 } } },
    frost: { name: 'Frost', cost: 70, range: 2.4, rate: 0.9, dmg: 6, color: '#8FC8D8', hit: 'splash', splash: 1.0, slow: 0.45, slowT: 1.6,
      desc: 'Slows everything it touches so other towers get more shots.',
      up: { A: { name: 'Deep Freeze', cost: 75, desc: 'Slows much harder, for longer.', slow: 0.65, slowT: 2.4 },
            B: { name: 'Shatter', cost: 75, desc: 'Slowed enemies take 30% more damage from everything.', brittle: 1.3 } } },
  };
  const SELL_RATE = 0.7;

  // ---------- enemies ----------
  const ENEMIES = {
    grunt:  { name: 'Grunt',  hp: 40,  speed: 1.2, bounty: 6,  leak: 1, color: '#8C6D4F' },
    runner: { name: 'Runner', hp: 22,  speed: 2.1, bounty: 5,  leak: 1, color: '#D9A441' },
    flyer:  { name: 'Flyer',  hp: 30,  speed: 1.4, bounty: 7,  leak: 1, color: '#9FB7E8', flying: true },
    brute:  { name: 'Brute',  hp: 140, speed: 0.85, bounty: 16, leak: 2, color: '#5E6B73', armor: 4 },
    boss:   { name: 'Warlord', hp: 1100, speed: 0.7, bounty: 80, leak: 5, color: '#A3382E', armor: 6, boss: true },
  };

  // ---------- waves (10) ----------
  // each: list of [type, count, gap seconds]; groups run in sequence. stage: which path stage must be unlocked BEFORE the wave.
  const WAVES = [

  cv.addEventListener('click', (e) => { const [c, r] = cellAt(e.clientX, e.clientY); tapCell(c, r); });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pick && G.phase === 'build') { ui.pick = b.dataset.pick; renderAll(); return; }
    if (b.dataset.build && ui.sel) { const [c, r] = ui.sel; if (TD.act(G, { k: 'build', type: b.dataset.build, c, r })) { ui.pick = b.dataset.build; ui.sel = null; renderAll(); } return; }
    if (b.dataset.pick && G.phase === 'draft') { TD.act(G, { k: 'pick', card: b.dataset.pick }); closeOverlay(); ui.upHint = true; if (G.events && G.events[0] && G.events[0].k === 'grow') { banner('The road grows!'); M.sting('grow'); } ui.sel = null; renderAll(); return; }
    if (b.dataset.up) { if (TD.act(G, { k: 'upgrade', c: ui.sel[0], r: ui.sel[1], branch: b.dataset.up })) renderAll(); return; }
    if (b.dataset.tjump !== undefined) { const w = +b.dataset.tjump; if (G.phase !== 'build' || w <= G.wave) newRun(G.seed); TD.testJump(G, w); afterTest(`Jumped to wave ${w + 1}. The bot played the waves before it.`); return; }
    if (b.dataset.tcard) { TD.testCard(G, b.dataset.tcard); afterTest(`Added ${TD.CARDS.find((c) => c.id === b.dataset.tcard).name}.`); return; }
    const a = b.dataset.act; if (!a) return;
    if (a === 'start') { if (TD.act(G, { k: 'start' })) { ui.sel = null; ui.upHint = false; acc = 0; M.mood('wave'); renderAll(); } }
    else if (a === 'speed') { ui.speed = ui.speed > 1 ? 1 : 3; ctl(); coachLine(); }
    else if (a === 'sell') { if (TD.act(G, { k: 'sell', c: ui.sel[0], r: ui.sel[1] })) { ui.sel = null; renderAll(); } }
    else if (a === 'unsel') { ui.sel = null; renderAll(); }
    else if (a === 'again') { closeOverlay(); newRun(); }
    else if (a === 'menu') showOverlay(menuHTML());
    else if (a === 'close') closeOverlay();
    else if (a === 'how') showOverlay(howHTML());
    else if (a === 'feedback') showOverlay(feedbackHTML());
    else if (a === 'fbsend') sendFeedback();
    else if (a === 'fbcopy') { const t = feedbackText(); navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {}); const box = $('#fbCopy'); if (box) { const rg = document.createRange(); rg.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); } }
    else if (a === 'tCoach') { ui.coach = !ui.coach; lsSet('td-coach', ui.coach ? '1' : '0'); showOverlay(menuHTML()); coachLine(); }
    else if (a === 'intro') { closeOverlay(); showIntro(0); }
    else if (a === 'newrun') { closeOverlay(); newRun(); }
    else if (a === 'sim') showOverlay(simHTML());
    else if (a === 'runsim') { runSim(); }
    else if (a === 'tester') showOverlay(testerHTML());
    else if (a === 'tMusic') { if (window.TDMusic) TDMusic.set(!TDMusic.on); showOverlay(menuHTML()); }
    else if (a === 'tgold') { TD.testGold(G, 500); afterTest('+500 gold.'); }
    else if (a === 'theal') { TD.testHeal(G); afterTest('Keep repaired.'); }
    else if (a === 'tinv') { G.test.invincible = !G.test.invincible; G.test.used = true; afterTest(G.test.invincible ? 'Keep can’t lose health now.' : 'Keep takes damage again.'); }
    else if (b.dataset.s === 'next') showIntro(ui.lesson + 1);
    else if (a === 'skipintro') { hideStory(); if (!ui.started) { ui.started = true; newRun(); } }
  });
  for (const k of ['fbText', 'fbName']) document.addEventListener('input', (e) => { if (e.target.id === k) FB[k === 'fbText' ? 'text' : 'nm'] = e.target.value; });
  document.addEventListener('click', (e) => { const b = e.target.closest('button[data-fq]'); if (!b) return; FB.q[b.dataset.fq] = b.dataset.fv; document.querySelectorAll(`button[data-fq="${b.dataset.fq}"]`).forEach((x) => x.setAttribute('aria-pressed', x === b)); });

  // ---------- overlays ----------
  function showOverlay(html) { $('#overlay').innerHTML = `<div class="veil-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
  function closeOverlay() { $('#overlay').innerHTML = ''; showDraft(); }
  function menuHTML() {
    const on = (b) => (b ? 'On' : 'Off');
    return `<h2>Menu</h2><div class="menu">
      <button class="btn" data-act="how" type="button">How to play <span>›</span></button>
      <button class="btn" data-act="tCoach" type="button" aria-pressed="${ui.coach}">Pell coaches you <span>${on(ui.coach)}</span></button>
      <button class="btn" data-act="newrun" type="button">New run <span>›</span></button>
      <button class="btn" data-act="intro" type="button">Replay the intro <span>›</span></button>
      <button class="btn" data-act="tMusic" type="button" aria-pressed="${!!(window.TDMusic && TDMusic.on)}">Music (placeholder) <span>${on(window.TDMusic && TDMusic.on)}</span></button>
      <h3>For testers</h3>
      <button class="btn" data-act="tester" type="button">Tester tools: jump, gold, any card <span>›</span></button>
      <button class="btn" data-act="sim" type="button">Bot simulation <span>›</span></button>
      <button class="btn" data-act="feedback" type="button">Give feedback <span>›</span></button>
    </div><div class="acts"><button class="btn primary" data-act="close" type="button">Close</button></div>`;
  }
  function howHTML() {
    return `<h2>How to play</h2>
      <ol><li><b>Build:</b> pick a tower, tap a <b>+</b> spot. Tap a built tower to upgrade it (two paths, pick one) or sell it.</li>
      <li><b>Send the wave:</b> enemies walk the road to your keep. Each one that reaches it costs health. At 0 the run is over.</li>
      <li><b>Draft:</b> after each wave, pick one of three cards. Buffs, gold, or keep repairs. They last the whole run.</li>
      <li><b>The road grows</b> before wave 4 and wave 7. The keep moves out and new spots open. Old towers stay where they are.</li></ol>
      <p><b>Counters:</b> Cannons crack armored Brutes but can’t hit Flyers. Spark loves Flyers and packs. Frost slows everything so the rest get more shots. Arrows are cheap and steady.</p>
      <div class="acts"><button class="btn primary" data-act="close" type="button">Got it</button></div>`;
  }
  function endScreen(won) {
    cancelSpeed();
    showOverlay(`<span class="eyebrow">${won ? 'The keep stands' : 'The keep has fallen'}</span><h2>${won ? 'You held all 10 waves.' : 'Lost on wave ' + (G.wave + 1) + '.'}</h2>
      <div class="endstats"><div><b>${G.stats.kills}</b><span>Kills</span></div><div><b>${G.stats.wavesCleared}</b><span>Waves held</span></div><div><b>${G.cards.length}</b><span>Cards</span></div></div>
      ${G.cards.length ? `<p class="muted" style="font-size:14px">Your deck: ${G.cards.map((c) => esc(c.name)).join(', ')}</p>` : ''}
      <p>${won ? 'That’s the whole first slice. Want to run it back and try a different deck?' : 'Every run is different: new cards, same road. Try a different build.'}</p>
      <div class="acts"><button class="btn" data-act="feedback" type="button">Give feedback</button><button class="btn primary" data-act="again" type="button">Play again</button></div>`);
    renderAll();
  }
  function cancelSpeed() { ui.speed = 1; }

  // ---------- tester tools ----------
  // Lets playtesters reach late waves and any card without grinding. A run that used them is flagged
  // (tag in the header, `tester: true` in feedback) so balance notes can leave it out.
  function testerHTML(msg) {
    const owned = new Set(G.cards.map((c) => c.id));
    return `<h2>Tester tools</h2><p class="muted">Anything here marks this run as a tester run.</p>
      ${msg ? `<p style="color:var(--good);font-weight:700">${esc(msg)}</p>` : ''}
      <div class="menu"><h3>Jump to wave</h3>
      <div class="tester-row">${TD.WAVES.map((w, i) => `<button class="btn sm" type="button" data-tjump="${i}" ${i === G.wave && G.phase === 'build' ? 'aria-pressed="true"' : ''}>${i + 1}</button>`).join('')}</div>
      <p class="tester-note">The smart bot builds and plays every wave before it, so you land on a fair board. Waves 4 and 7 open the bigger road.</p>
      <h3>Resources</h3>
      <div class="tester-row"><button class="btn sm" data-act="tgold" type="button">+500 gold</button><button class="btn sm" data-act="theal" type="button">Repair keep</button><button class="btn sm" data-act="tinv" type="button" aria-pressed="${G.test.invincible}">Invincible keep</button></div>
      <h3>Add any card</h3>
      <div class="tester-row">${TD.CARDS.map((c) => `<button class="btn sm" type="button" data-tcard="${c.id}" title="${esc(c.text)}" ${owned.has(c.id) && c.id !== 'levy' && c.id !== 'walls' ? 'disabled' : ''}>${esc(c.name)}</button>`).join('')}</div></div>
      <div class="acts"><button class="btn" data-act="menu" type="button">Back</button><button class="btn primary" data-act="close" type="button">Play</button></div>`;
  }
  function afterTest(msg) { ui.sel = null; tag(); renderAll(); showOverlay(testerHTML(msg)); }

  // ---------- feedback ----------
  const FQ = [
    { id: 'fun', q: 'Did you want to play a second run?', opts: ['Yes, right away', 'Maybe later', 'No'] },
    { id: 'draft', q: 'Did the card draft feel like a real choice?', opts: ['Yes', 'Sometimes', 'No'] },
    { id: 'grow', q: 'The road growing: good surprise or annoying?', opts: ['Loved it', 'Fine', 'Annoying'] },
    { id: 'hard', q: 'Difficulty?', opts: ['Too easy', 'About right', 'Too hard'] },
    { id: 'watch', q: 'Watching the wave: tense or boring?', opts: ['Tense', 'OK', 'Boring'] },
    { id: 'read', q: 'Could you tell towers and enemies apart?', opts: ['Always', 'Mostly', 'No'] },
  ];
  function feedbackHTML() {
    const qs = FQ.map((f) => `<div class="field"><label>${esc(f.q)}</label><div class="choices">${f.opts.map((o) => `<button class="btn" type="button" data-fq="${f.id}" data-fv="${esc(o)}" aria-pressed="${FB.q[f.id] === o}">${esc(o)}</button>`).join('')}</div></div>`).join('');
    const summary = feedbackText();
    return `<h2>What did you think?</h2><p class="muted">Six taps plus anything you want to say. Goes to Hunter and Joe.</p>${qs}
      <div class="field"><label for="fbText">What was confusing, or what would you change?</label><textarea id="fbText" rows="3">${esc(FB.text)}</textarea></div>
      <div class="field"><label for="fbName">Your name (optional)</label><input id="fbName" type="text" value="${esc(FB.nm)}"></div>
      ${FB.saved === true ? '<p style="color:var(--good);font-weight:700">Saved. Thank you!</p>' : FB.saved === 'copy' ? `<p class="muted">Couldn’t save from this device, so copy your answers and text them over:</p><div class="copybox" id="fbCopy">${esc(summary)}</div>` : ''}
      <div class="acts">${FB.saved === 'copy' ? '<button class="btn" data-act="fbcopy" type="button">Copy answers</button>' : ''}<button class="btn" data-act="close" type="button">Close</button>${FB.saved !== true ? '<button class="btn primary" data-act="fbsend" type="button">Send</button>' : ''}</div>`;
  }
  function feedbackText() { const lines = FQ.map((f) => `${f.q} ${FB.q[f.id] || '–'}`); lines.push(`Notes: ${FB.text || '–'}`); lines.push(`From: ${FB.nm || 'anonymous'} · seed ${G.seed} · waves held ${G.stats.wavesCleared} · cards ${G.cards.map((c) => c.id).join(',')}${G.test.used ? ' · TESTER RUN' : ''}`); return 'Tower Defense P1.1 feedback\n' + lines.join('\n'); }
  async function sendFeedback() {
    const ta = $('#fbText'), nm = $('#fbName'); if (ta) FB.text = ta.value; if (nm) FB.nm = nm.value;
    const body = { answers: Object.assign({}, FB.q), notes: FB.text, name: FB.nm, seed: G.seed, waves: G.stats.wavesCleared, phase: G.phase, cards: G.cards.map((c) => c.id), tester: !!G.test.used, version: 'p1.1', at: new Date().toISOString() };
    try {
      const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (!db) throw new Error('no db');
      await db.collection('feedback').add(body); FB.saved = true;
    } catch (e) {
      try { const r = await fetch('/forge/api/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ game: 'tower-defense' }, body)) }); FB.saved = r.ok ? true : 'copy'; } catch (e2) { FB.saved = 'copy'; }
    }
    ui.feedbackDone = true; showOverlay(feedbackHTML());
  }

  // ---------- bot sim (in-page) ----------
  const sim = { res: null, running: false };
  function simHTML() {
    const r = sim.res;
    return `<h2>Bot simulation</h2><p class="muted">Three bots play the whole run with no screen on the same engine. Smart reads the wave preview; Random is a sloppy player.</p>
      ${r ? `<ul>${r.map((x) => `<li><b>${x.style}:</b> wins ${x.wins}%, median waves held ${x.med}, leaks per game ${x.leaks}</li>`).join('')}</ul>` : '<p>Not run yet.</p>'}
      <div class="acts"><button class="btn" data-act="close" type="button">Close</button><button class="btn primary" data-act="runsim" type="button" ${sim.running ? 'disabled' : ''}>${sim.running ? 'Running…' : 'Run 60 games each'}</button></div>`;
  }
  function runSim() {
    sim.running = true; showOverlay(simHTML());
    setTimeout(() => {
      const q = (a, p) => a.slice().sort((x, y) => x - y)[Math.floor(p * (a.length - 1))];
      sim.res = ['smart', 'saver', 'random'].map((style) => { const r = TD.simulate(60, 4242, style); return { style, wins: Math.round(100 * r.wins / 60), med: q(r.waves, .5), leaks: (r.leaks / 60).toFixed(1) }; });
      sim.running = false; showOverlay(simHTML());
    }, 30);
  }

  // ---------- intro ----------
  const SCENES = [
    () => `<div class="hero rise">${HERO_SVG()}</div><h1 class="title rise d1">Tower Defense</h1><p class="lead rise d2">Hold the road. Draft a deck. Build a keep worth holding.</p><p class="copy rise d3">Prototype 1.1: one road that grows, four towers, ten waves. Solo for now; co-op is next.</p>`,
    () => `<span class="eyebrow rise">Four towers</span><div class="legend rise d1">${Object.entries(TD.TOWERS).map(([k, t]) => `<div>${towerIcon(k).replace('width="40" height="40"', 'width="48" height="48"')}${esc(t.name)}</div>`).join('')}</div><p class="lead rise d2">Each has two upgrade paths. Pick one.</p><p class="copy rise d3">Arrows are cheap and steady. Cannons crack armor but can’t hit flyers. Spark chains through packs and loves flyers. Frost slows everything.</p>`,
    () => `<span class="eyebrow rise">Five enemies</span><div class="legend five rise d1">${['grunt', 'runner', 'flyer', 'brute', 'boss'].map((k) => `<div>${enemyIcon(k)}${esc(TD.ENEMIES[k].name)}</div>`).join('')}</div><p class="lead rise d2">Each one that reaches the keep costs you health.</p><p class="copy rise d3">The next wave is always shown before you send it. Build the counter.</p>`,
    () => `<span class="eyebrow rise">After every wave</span><div class="cards rise d1" style="width:100%;max-width:420px">${['sharp', 'tithe', 'walls'].map((id) => { const c = TD.CARDS.find((x) => x.id === id); return `<div class="card ${c.kind}"><span class="kind">${c.kind}</span><b>${esc(c.name)}</b><small>${esc(c.text)}</small></div>`; }).join('')}</div><p class="lead rise d2">Draft one card. Your deck is your build.</p><p class="copy rise d3">And twice per run, the road grows: the keep moves out and new spots open.</p>`,
  ];
  function enemyIcon(type) { const c = document.createElement('canvas'); c.width = c.height = 96; const ctx = c.getContext('2d'); A.enemyArt(ctx, type, 48, 54, 80, 0.3, 1, false); return `<img src="${c.toDataURL()}" alt="${esc(TD.ENEMIES[type].name)}" width="48" height="48">`; }
  function HERO_SVG() {
    const c = document.createElement('canvas'); c.width = 480; c.height = 270; const ctx = c.getContext('2d'); const s = 40;
    const g = TD.newGame(7); g.stage = 2;
    ctx.fillStyle = '#D9C9C0'; ctx.fillRect(0, 0, 480, 270);
    ctx.save(); ctx.translate(0, -30);
    const pathSet = new Set(TD.path(g).map(([x, y]) => x + ',' + y));
    for (let r = 0; r < 8; r++) for (let cc = 0; cc < 12; cc++) { if (pathSet.has(cc + ',' + r)) A.road(ctx, cc * s, r * s, s, cc * 7 + r * 13); else A.grass(ctx, cc * s, r * s, s, cc * 7 + r * 13); }
    [['arrow', 1, 2], ['cannon', 3, 3], ['spark', 6, 4], ['frost', 9, 4], ['arrow', 10, 3]].forEach(([t, cc, r]) => A.towerArt(ctx, t, cc * s, r * s - 4, s, 1, null, false));
    const [kx, ky] = TD.keep(g); A.keepArt(ctx, kx * s, ky * s - 4, s, false);
    [['grunt', 0.5, 3], ['grunt', 1.6, 3], ['runner', 2.5, 2], ['brute', 4.2, 1.9], ['flyer', 5, 4.6]].forEach(([t, x, y]) => A.enemyArt(ctx, t, (x + .5) * s, (y + .5) * s, s, 0.4, 1, false));
    ctx.restore();
    return `<img src="${c.toDataURL()}" alt="A road winding to a small keep, lined with towers">`;
  }
  function showIntro(i) {
    ui.lesson = i; const s = $('#story'); s.hidden = false;
    const last = i === SCENES.length - 1;
    s.innerHTML = `<div class="story-in">${SCENES[i]()}<div class="dots">${SCENES.map((_, k) => `<span class="${k === i ? 'on' : ''}"></span>`).join('')}</div>
      <div style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap"><button class="skip" data-act="skipintro" type="button">Skip</button><button class="btn primary" data-act="${last ? 'skipintro' : 'next'}" ${last ? '' : 'data-s="next"'} type="button">${last ? 'Start the run' : 'Next'}</button></div></div>`;
    s.scrollTop = 0;
  }
  function hideStory() { const s = $('#story'); s.hidden = true; s.innerHTML = ''; }

  // ---------- boot ----------
  ui.coach = lsGet('td-coach') !== '0';
  $('#bMenu').addEventListener('click', () => showOverlay(menuHTML()));
  G = TD.newGame(1); // placeholder so draw() has state before the first run
  showIntro(0);
  window.TDUI = { get G() { return G; }, ui, newRun, tapCell, showIntro, hideStory, renderAll };
})();

</script>
</body>
</html>
