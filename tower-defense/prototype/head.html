<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column. Top bar, map canvas, context sheet (build / draft / wave info), coach line.
   One committed look pulled from the chosen art reference: ink linework over flat painterly color.
   Teal slate, warm timber, cream plaster, moss, dusty-rose sky. */
:root {
  --sky: #D9C9C0; --sky-2: #CDB9B0; --paper: #F1E4CC; --paper-2: #E6D6B8; --ink: #3A2518; --ink-2: #6B4226; --muted: #8A6B52;
  --teal: #4E8F86; --teal-2: #3A6E67; --moss: #6E9A4C; --moss-2: #4F7A33; --timber: #6B4226; --plaster: #F7EEDC;
  --gold: #D9A441; --rust: #B8533A; --frost: #8FC8D8; --spark: #4F8FD6; --good: #4F7A33; --bad: #A3382E;
  --display: 'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); height: 100%; }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(180deg, #E3D4CB 0%, var(--sky) 40%, var(--sky-2) 100%); }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px 72px; display: flex; flex-direction: column; gap: 10px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; letter-spacing: -.01em; line-height: 1.05; text-wrap: balance; }
.btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 12px; min-height: 44px; padding: 8px 16px; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }
.btn.primary { background: var(--teal); color: #fff; }
.btn.gold { background: var(--gold); }

.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }

.btn[aria-pressed="true"] { background: var(--moss); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.eyebrow { font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--teal-2); }
.muted { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }
.owner { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 80; font-size: 10.5px; font-weight: 700; color: rgba(58,37,24,.6); background: rgba(241,228,204,.85); padding: 3px 8px; border-radius: 999px; pointer-events: none; }

/* ---------- top bar ---------- */

.stat .bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; margin-top: 4px; }
.stat .bar i { display: block; height: 100%; background: var(--rust); transition: width .3s; }

.banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 8vw, 40px); color: var(--plaster); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 0 3px 0 var(--ink), 0 6px 18px rgba(0,0,0,.35); pointer-events: none; animation: banner 1.5s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(.7); } 20% { opacity: 1; transform: scale(1.05); } 75% { opacity: 1; } 100% { opacity: 0; } }

.coach { display: flex; gap: 10px; align-items: flex-start; background: var(--plaster); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; min-height: 58px; box-shadow: 0 3px 0 var(--ink); }

.sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.shop { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.shop button { background: var(--plaster); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; min-height: 88px; box-shadow: 0 3px 0 var(--ink); min-width: 0; }
.shop button svg { width: 40px; height: 40px; }
.shop button b { font-size: 13px; }
.shop button small { font-size: 12px; color: #9A6A12; font-weight: 700; }
.shop button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.shop button[aria-pressed="true"] small { color: #FFE9A8; }
.shop button:disabled { opacity: .45; cursor: not-allowed; }
.shop button.hint { animation: glow 1s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 0 5px rgba(217,164,65,.55); } }
.twinfo { display: flex; gap: 12px; align-items: center; }
.twinfo svg { width: 56px; height: 56px; flex: none; }
.twinfo .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.twinfo .txt small { color: var(--muted); font-size: 13px; }
.branches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.branches button { background: var(--plaster); border: 2px solid var(--ink); border-radius: 12px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 3px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); min-width: 0; }
.branches button b { font-size: 15px; }
.branches button small { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { background: var(--plaster); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 8px; text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); min-height: 150px; min-width: 0; position: relative; }

.deck { display: flex; gap: 6px; flex-wrap: wrap; }

.modal { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); padding: 20px 18px; width: min(560px, 100%); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow: auto; display: flex; flex-direction: column; gap: 14px; animation: sheetUp .3s ease-out; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h2 { font-size: 26px; }
.modal p, .modal ol, .modal ul { margin: 0; }
.modal ol, .modal ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.modal .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu .btn { justify-content: space-between; }

.tester-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tester-row .btn { flex: 1 1 auto; min-width: 44px; }
.tester-note { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.top .t .test-flag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--rust); color: #fff; font-size: 10.5px; letter-spacing: 1px; font-weight: 800; vertical-align: middle; }
.foot { padding-inline: 52px; margin-bottom: 36px; }
.music-btn { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 80; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); color: var(--teal-2); font-size: 18px; font-weight: 800; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 0 var(--ink); }
.music-btn.off { color: var(--muted); background: var(--paper-2); text-decoration: line-through; }
.music-btn:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 15px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
textarea, input[type=text] { font: inherit; color: var(--ink); background: var(--plaster); border: 2px solid var(--ink); border-radius: 10px; padding: 10px; width: 100%; }
.copybox { background: var(--plaster); border: 2px solid var(--ink); border-radius: 10px; padding: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }
.endstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.endstats div { background: var(--plaster); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; text-align: center; }
.endstats b { font-family: var(--display); font-size: 24px; display: block; }
.endstats span { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- story / intro ---------- */
.story { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: linear-gradient(180deg, #E3D4CB 0%, var(--sky) 50%, #C9B5AB 100%); }
.story-in { min-height: 100%; max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; text-align: center; }
.story .hero { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--teal-2); box-shadow: 0 6px 0 var(--ink); }
.story .hero img, .story .hero svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.title { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 12vw, 72px); line-height: .95; margin: 0; color: var(--ink); letter-spacing: -.02em; }
.story .lead { font-size: clamp(17px, 4.4vw, 20px); color: var(--ink-2); max-width: 34ch; margin: 0; }
.story .copy { max-width: 38ch; margin: 0; color: var(--muted); font-size: 15.5px; }
.story .skip { background: transparent; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 10px; min-height: 44px; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(58,37,24,.25); }
.dots span.on { background: var(--ink); }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.rise.d1 { animation-delay: .15s; } .rise.d2 { animation-delay: .35s; } .rise.d3 { animation-delay: .55s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; }
.legend div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.legend svg { width: 48px; height: 48px; }
.legend.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.doors { display: grid; gap: 10px; width: 100%; max-width: 420px; }
.door { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
.door b { font-family: var(--display); font-size: 19px; }
.door small { color: var(--muted); font-size: 13px; }
.door.primary { background: var(--teal); color: #fff; } .door.primary small { color: #D9EEEA; }

@media (min-width: 720px) { .app { max-width: 720px; } .cards { grid-template-columns: repeat(3, 1fr); } }

</style>
