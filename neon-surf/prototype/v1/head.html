<title>Neon Surf · Wave Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#F2EFE6; --mute:#B9B4CC; --dim:#8A85A3; --night:#07031A; --panel:#120A2E; --panel2:#1C1242;
  --pink:#FF3DA8; --pink2:#FF7AD0; --cyan:#3DF0FF; --gold:#FFB547; --line:rgba(242,239,230,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="light"], :root[data-theme="dark"]{ color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;font-weight:700}
#hudL{top:calc(10px + var(--sat));left:calc(12px + var(--sal));background:rgba(5,5,12,.6);border-radius:10px;padding:8px 12px;max-width:58vw}
#hudL .a{font-size:14px;color:var(--pink2)} #hudL .b{font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
#hudR{top:calc(10px + var(--sat));right:calc(12px + var(--sar));background:rgba(5,5,12,.6);border-radius:10px;padding:8px 12px;text-align:right}
#hudR .a{font-size:14px} #hudR .flow{display:flex;gap:4px;margin-top:5px;justify-content:flex-end} #hudR .flow i{width:18px;height:8px;border-radius:2px;background:rgba(242,239,230,.2)} #hudR .flow i.on{background:var(--pink)} #hudR .flow i.max{background:var(--gold)}
#hudR .sc{font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
#menuBtn{position:absolute;top:calc(64px + var(--sat));right:calc(12px + var(--sar));width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(5,5,12,.6);color:var(--ink);font:700 18px 'Space Grotesk';pointer-events:auto;z-index:5}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));background:rgba(4,2,14,.82);overflow-y:auto}
.sheet[hidden]{display:none}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:auto}
.card h1{margin:0 0 4px;font-size:34px;letter-spacing:1px;line-height:1.05}
.card h1 .p{color:var(--pink)} .card h1 .c{color:var(--cyan)}
.card h2{margin:0 0 10px;font-size:20px}
.card p{margin:0 0 12px;color:var(--mute);line-height:1.5;font-size:15px}
.card .tag{display:inline-block;font-size:12px;color:var(--gold);border:1px solid rgba(255,181,71,.4);border-radius:99px;padding:3px 10px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px 'Space Grotesk';margin-top:10px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#1A0414}
.btn.cy{background:var(--cyan);border-color:var(--cyan);color:#022A30}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.row{display:flex;gap:10px} .row .btn{flex:1}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-top:1px solid var(--line);font-size:15px}
.tog small{display:block;color:var(--dim);font-size:12px}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:rgba(242,239,230,.18);border:0;flex:0 0 auto;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--cyan)} .sw[aria-pressed="true"]::after{transform:translateX(22px)}
.steps{list-style:none;padding:0;margin:0 0 6px;counter-reset:s}
.steps li{position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line);color:var(--ink);font-size:15px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--panel2);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:700}
.steps b.p{color:var(--pink2)} .steps b.c{color:var(--cyan)} .steps b.g{color:var(--gold)}
.big{font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--mute)}
.note{font-size:14px;color:var(--ink);background:rgba(61,240,255,.08);border:1px solid rgba(61,240,255,.25);border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.45}
.fq{border-top:1px solid var(--line);padding:12px 0}
.fq .q{font-size:15px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:500 14px 'Space Grotesk';cursor:pointer}
.opt[aria-pressed="true"]{background:var(--cyan);color:#022A30;border-color:var(--cyan);font-weight:700}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:15px 'Space Grotesk';padding:10px}
label.lb{display:block;font-size:15px;margin-bottom:8px}
.err{color:#FF8A80;font-size:13px;margin-top:6px;min-height:1em}
#tapZone{position:absolute;inset:0}
#calRing{width:160px;height:160px;border-radius:50%;margin:16px auto;border:4px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute);text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#calRing.flash{background:rgba(61,240,255,.2)}
.mark{position:fixed;left:calc(8px + var(--sal));bottom:calc(4px + var(--sab));font-size:10px;color:rgba(242,239,230,.45);z-index:30;pointer-events:none}
.foot{font-size:11px;color:var(--dim);margin-top:14px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){ .sw::after{transition:none} }
@media (max-width:340px){ .card{padding:16px} .card h1{font-size:28px} .big{font-size:52px} }
</style>
