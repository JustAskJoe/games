<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
:root{
  --ink:#F2EFE6; --mute:#B9B4CC; --dim:#8A85A3; --night:#07031A; --panel:#120A2E; --panel2:#1C1242;
  --pink:#FF3DA8; --pink2:#FF7AD0; --cyan:#3DF0FF; --gold:#FFB547; --line:rgba(242,239,230,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="light"], :root[data-theme="dark"]{ color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;font-weight:700}
#hudL{top:calc(10px + var(--sat));left:calc(12px + var(--sal));background:rgba(5,5,12,.6);border-radius:10px;padding:8px 12px;max-width:58vw}
#hudL .a{font-size:14px;color:var(--pink2)} #hudL .b{font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
#hudR{top:calc(10px + var(--sat));right:calc(12px + var(--sar));background:rgba(5,5,12,.6);border-radius:10px;padding:8px 12px;text-align:right}
#hudR .a{font-size:14px} #hudR .flow{display:flex;gap:4px;margin-top:5px;justify-content:flex-end} #hudR .flow i{width:18px;height:8px;border-radius:2px;background:rgba(242,239,230,.2)} #hudR .flow i.on{background:var(--pink)} #hudR .flow i.max{background:var(--gold)}
#hudR .sc{font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
#menuBtn{position:absolute;top:calc(64px + var(--sat));right:calc(12px + var(--sar));width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(5,5,12,.6);color:var(--ink);font:700 18px 'Space Grotesk';pointer-events:auto;z-index:5}

.sheet[hidden]{display:none}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:auto}
.card h1{margin:0 0 4px;font-size:34px;letter-spacing:1px;line-height:1.05}
.card h1 .p{color:var(--pink)} .card h1 .c{color:var(--cyan)}
.card h2{margin:0 0 10px;font-size:20px}
.card p{margin:0 0 12px;color:var(--mute);line-height:1.5;font-size:15px}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px 'Space Grotesk';margin-top:10px;cursor:pointer;text-decoration:none}

.row{display:flex;gap:10px} .row .btn{flex:1}

.tog small{display:block;color:var(--dim);font-size:12px}

.sw[aria-pressed="true"]{background:var(--cyan)} .sw[aria-pressed="true"]::after{transform:translateX(22px)}

.steps li{position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line);color:var(--ink);font-size:15px;line-height:1.45}

.steps b.p{color:var(--pink2)} .steps b.c{color:var(--cyan)} .steps b.g{color:var(--gold)}
.big{font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--mute)}
.note{font-size:14px;color:var(--ink);background:rgba(61,240,255,.08);border:1px solid rgba(61,240,255,.25);border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.45}
.fq{border-top:1px solid var(--line);padding:12px 0}
.fq .q{font-size:15px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:500 14px 'Space Grotesk';cursor:pointer}
.opt[aria-pressed="true"]{background:var(--cyan);color:#022A30;border-color:var(--cyan);font-weight:700}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:15px 'Space Grotesk';padding:10px}
label.lb{display:block;font-size:15px;margin-bottom:8px}

#tapZone{position:absolute;inset:0}

@media (max-width:340px){ .card{padding:16px} .card h1{font-size:28px} .big{font-size:52px} }

<div id="game" aria-label="Neon surf wave test">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="hud" id="hudL"><div class="a" id="secName">Neon Surf</div><div class="b" id="secHint">Wave test</div></div>

</div>

<script>
/* Neon Surf — pure timing engine (no DOM). window.SURF in the browser, module.exports in node.
   Two layouts: 'test' (one-minute wave test on the placeholder beat) and 'song' (full Pure Water-length run, estimated sections).
   © 2026 F Lane d/b/a One Fifty Labs. All rights reserved. */
(function (root) {
  const LANES = [0.26, 0.54, 0.82];          // face height: 0 = lip, 1 = trough
  const LANE_TOL = 0.15;
  const WIN = { perfect: 0.045, good: 0.09, ok: 0.14 };
  // the gate line players learn: the same in every hook (lane index per snare)
  const PATTERN = [1, 2, 1, 0, 0, 1, 2, 1, 2, 2, 1, 0, 1, 0, 1, 2];
  const DEFS = {
    test: [
      { id: 'intro', kind: 'intro', name: 'Paddle in', bars: 2, verb: 'GET READY', hint: 'Listen for the beat', speed: 0.24 },
      { id: 'drop', kind: 'drop', name: 'Drop in', bars: 1, verb: 'DROP', hint: 'Tap on the first beat', speed: 0.24 },
      { id: 'hook1', kind: 'hook', name: 'Hook 1 · The face', bars: 8, verb: 'CARVE', hint: 'Slide to the gate, tap on the snare', speed: 0.26 },
      { id: 'verse', kind: 'pump', name: 'Verse · Glass swells', bars: 8, verb: 'PUMP', hint: 'Tap on every beat', speed: 0.24 },
      { id: 'hook2', kind: 'hook', spray: true, name: 'Hook 2 · Bigger set', bars: 8, verb: 'CARVE', hint: 'Gates on the snare, steer through the gold', speed: 0.32 },
      { id: 'finish', kind: 'finish', name: 'Kick out', bars: 2, verb: 'SNAP', hint: 'One last hit', speed: 0.32 }
    ],
    // section lengths are estimates from 101 BPM / 3:12; players can shift the whole map in the sync screen
    song: [
      { id: 'intro', kind: 'intro', name: 'Cold open', bars: 2, verb: 'GET READY', hint: 'Drop comes with the hook', speed: 0.24 },
      { id: 'hook1', kind: 'hook', drop: true, name: 'Hook 1 · The face', bars: 8, verb: 'CARVE', hint: 'Slide to the gate, tap on the snare', speed: 0.26 },
      { id: 'verse1', kind: 'pump', name: 'Verse 1 · Glass swells', bars: 16, verb: 'PUMP', hint: 'Tap on every beat', speed: 0.24 },
      { id: 'hook2', kind: 'hook', spray: true, name: 'Hook 2 · Bigger set', bars: 8, verb: 'CARVE', hint: 'Gates on the snare, steer through the gold', speed: 0.3 },
      { id: 'verse2', kind: 'reef', name: 'Verse 2 · The reef', bars: 16, verb: 'SNAP', hint: 'Every snare is a gate: zigzag', speed: 0.3 },
      { id: 'hook3', kind: 'hook', spray: true, name: 'Hook 3 · The bomb', bars: 8, verb: 'CARVE', hint: 'Same line, full speed', speed: 0.34 },
      { id: 'verse3', kind: 'adlib', name: 'Verse 3 · Ad-libs', bars: 16, verb: 'PUMP', hint: 'Pump on 1 and 3, steer through the gold', speed: 0.28 },
      { id: 'hook4', kind: 'hook', spray: true, snapEnd: true, name: 'Final hook · The barrel', bars: 7, verb: 'CARVE', hint: 'Last gates, then snap on the final hit', speed: 0.34 }
    ]
  };

  const SURF = { LANES, LANE_TOL, WIN, PATTERN };
  let LAYOUT = [], END = Infinity;

  function configure(o) {
    o = o || {};
    SURF.MODE = o.mode || 'test';
    SURF.BPM = o.bpm || 101;
    SURF.BEAT = 60 / SURF.BPM;
    END = o.end || Infinity;
    let beat = 0;
    LAYOUT = DEFS[SURF.MODE].map(s => { const r = Object.assign({}, s, { b0: beat, b1: beat + s.bars * 4 }); beat += s.bars * 4; return r; });
    SURF.SECTIONS = LAYOUT;
    SURF.TOTAL_BEATS = beat;
    SURF.DURATION = Math.min(beat * SURF.BEAT, END);
    return SURF;
  }
  function sectionAt(t) { const b = t / SURF.BEAT; for (const s of LAYOUT) if (b < s.b1) return s; return LAYOUT[LAYOUT.length - 1]; }
  function speedOf(id) { const s = LAYOUT.find(x => x.id === id); return s ? s.speed : 0.26; }

  function buildChart() {
    const notes = []; let id = 0; const B = SURF.BEAT;
    const add = (b, type, extra) => notes.push(Object.assign({ id: id++, b, t: b * B, type, judged: null }, extra));
    let lc = 0; // lane cycle for ad-lib sprays
    for (const s of LAYOUT) {
      const at = (bar, q) => s.b0 + bar * 4 + q;
      if (s.kind === 'drop') add(s.b0, 'tap', { kind: 'drop', sec: s.id });
      if (s.kind === 'finish') add(s.b0, 'tap', { kind: 'snap', sec: s.id });
      if (s.kind === 'hook') {
        if (s.drop) add(s.b0, 'tap', { kind: 'drop', sec: s.id });
        let k = 0;
        for (let bar = 0; bar < s.bars; bar++) {
          if (s.snapEnd && bar === s.bars - 1) { add(at(bar, 0), 'tap', { kind: 'snap', sec: s.id }); break; }
          for (const off of [1, 3]) {
            const lane = PATTERN[k % PATTERN.length];
            add(at(bar, off), 'gate', { lane, y: LANES[lane], sec: s.id, n: k });
            if (s.spray) { const prev = k === 0 ? 1 : PATTERN[(k - 1) % PATTERN.length]; add(at(bar, off) - 0.5, 'spray', { y: (LANES[prev] + LANES[lane]) / 2, sec: s.id }); }
            k++;
          }
        }
      }
      if (s.kind === 'pump') {
        for (let bar = 0; bar < s.bars; bar++) {
          if (bar === s.bars - 1) { add(at(bar, 0), 'pump', { sec: s.id }); add(at(bar, 1), 'gate', { lane: 1, y: LANES[1], sec: s.id, n: -1 }); add(at(bar, 3), 'gate', { lane: 2, y: LANES[2], sec: s.id, n: -1 }); }
          else for (let q = 0; q < 4; q++) add(at(bar, q), 'pump', { sec: s.id });
        }
      }
      if (s.kind === 'reef') { // one-beat zigzag: every snare is a gate, low/high alternating, mid every 4th bar
        let k = 0;
        for (let bar = 0; bar < s.bars; bar++) for (const off of [1, 3]) { const lane = bar % 4 === 3 && off === 3 ? 1 : (k % 2 ? 0 : 2); add(at(bar, off), 'gate', { lane, y: LANES[lane], sec: s.id, n: -1 }); k++; }
      }
      if (s.kind === 'adlib') { // pump on 1 and 3, gold ad-lib spray on the off-beats in a wandering lane
        const cyc = [0, 2, 1, 2, 0, 1];
        for (let bar = 0; bar < s.bars; bar++) {
          add(at(bar, 0), 'pump', { sec: s.id }); add(at(bar, 2), 'pump', { sec: s.id });
          for (const off of [1.5, 3.5]) { add(at(bar, off), 'spray', { y: LANES[cyc[lc % cyc.length]], sec: s.id }); lc++; }
        }
      }
    }
    return notes.filter(n => n.t < END - 0.25).sort((a, b) => a.t - b.t);
  }

  const isPress = n => n.type !== 'spray';
  function newRun(opts) {
    opts = opts || {};
    return { chart: buildChart(), easy: !!opts.easy, score: 0, combo: 0, maxCombo: 0, flow: 1, streak: 0,
      counts: { perfect: 0, good: 0, ok: 0, wide: 0, miss: 0, spray: 0, sprayMiss: 0, whiff: 0 }, errs: [], events: [], over: false, lastT: -1 };
  }
  const mult = f => [1, 1, 1.5, 2, 3][f];
  function win(S) { const k = S.easy ? 1.5 : 1; return { perfect: WIN.perfect * k, good: WIN.good * k, ok: WIN.ok * k }; }
  function hit(S, n, grade, t, dt) {
    n.judged = grade;
    S.score += Math.round(({ perfect: 300, good: 200, ok: 100, wide: 40 }[grade] || 0) * mult(S.flow));
    S.counts[grade]++;
    if (grade === 'wide') { S.combo = 0; S.streak = 0; }
    else { S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); if (++S.streak >= 8 && S.flow < 4) { S.flow++; S.streak = 0; S.events.push({ type: 'flowUp', t, flow: S.flow }); } }
    if (dt != null) S.errs.push(dt);
    S.events.push({ type: 'judge', t, grade, note: n, dt });
  }
  function miss(S, n, t) {
    n.judged = 'miss'; S.counts.miss++; S.combo = 0; S.streak = 0;
    if (S.flow > 1) { S.flow--; S.events.push({ type: 'flowDown', t, flow: S.flow }); }
    S.events.push({ type: 'judge', t, grade: 'miss', note: n });
  }
  function press(S, t, y) {
    if (S.over) return null;
    const w = win(S); let best = null, bestAbs = 1e9;
    for (const n of S.chart) { if (!isPress(n) || n.judged) continue; if (n.t - t > w.ok) break; const a = Math.abs(t - n.t); if (a <= w.ok && a < bestAbs) { best = n; bestAbs = a; } }
    if (!best) { S.counts.whiff++; S.events.push({ type: 'whiff', t }); return null; }
    const dt = t - best.t;
    let grade = bestAbs <= w.perfect ? 'perfect' : bestAbs <= w.good ? 'good' : 'ok';
    if (best.type === 'gate' && Math.abs(y - best.y) > LANE_TOL * (S.easy ? 1.3 : 1)) grade = 'wide';
    hit(S, best, grade, t, dt);
    return { grade, note: best, dt };
  }
  function tick(S, t, y) {
    if (S.over) return;
    const w = win(S);
    for (const n of S.chart) {
      if (n.t > t + 0.01) break;
      if (n.judged) continue;
      if (n.type === 'spray') {
        if (t >= n.t) {
          if (Math.abs(y - n.y) <= 0.12 * (S.easy ? 1.3 : 1)) { n.judged = 'spray'; S.counts.spray++; S.score += Math.round(50 * mult(S.flow)); S.events.push({ type: 'spray', t, note: n }); }
          else { n.judged = 'sprayMiss'; S.counts.sprayMiss++; }
        }
      } else if (t > n.t + w.ok) miss(S, n, t);
    }
    if (t >= SURF.DURATION) S.over = true;
    S.lastT = t;
  }
  function nextPress(S, t) { for (const n of S.chart) if (isPress(n) && !n.judged && n.t > t - 0.2) return n; return null; }
  function results(S) {
    const c = S.counts, total = S.chart.filter(isPress).length || 1;
    const acc = (c.perfect + c.good * 0.7 + c.ok * 0.4 + c.wide * 0.2) / total;
    const grade = acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D';
    const e = S.errs.slice().sort((a, b) => a - b);
    const mean = e.length ? e.reduce((a, b) => a + b, 0) / e.length : 0, median = e.length ? e[Math.floor(e.length / 2)] : 0;
    // drift check: mean error over the first vs last third of hits (a tempo mismatch shows up here)
    const third = Math.floor(S.errs.length / 3), avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    const drift = third > 4 ? avg(S.errs.slice(-third)) - avg(S.errs.slice(0, third)) : 0;
    return { total, acc, grade, score: S.score, maxCombo: S.maxCombo, counts: c, meanMs: Math.round(mean * 1000), medianMs: Math.round(median * 1000), driftMs: Math.round(drift * 1000), mode: SURF.MODE };
  }

  // ---- beat detection on decoded audio (mono Float32Array) ----
  // returns { bpm, firstBeat } where firstBeat is the file time (s) of the first strong beat on the detected grid
  function detectBeat(x, sr, opts) {
    opts = opts || {};
    const hop = Math.round(sr / 100), fps = sr / hop, nF = Math.floor(x.length / hop), env = new Float32Array(nF);
    let prev = 0;
    for (let f = 0; f < nF; f++) { let s = 0, r = 0; const o = f * hop; for (let i = 1; i < hop; i++) { const d = x[o + i] - x[o + i - 1]; s += d * d; r += x[o + i] * x[o + i]; } env[f] = Math.log(1e-6 + Math.sqrt(r / hop) + 2 * Math.sqrt(s / hop)); }
    const nov = new Float32Array(nF);
    for (let f = 1; f < nF; f++) { const d = env[f] - env[f - 1]; nov[f] = d > 0 ? d : 0; prev = d; }
    const lo = opts.lo || 96, hi = opts.hi || 106, span = Math.min(nF, Math.round(fps * (opts.secs || 150)));
    let best = { score: -1 };
    const score = (bpm, ph) => { const bf = fps * 60 / bpm; let s = 0; for (let p = ph; p < span; p += bf) { const i = Math.round(p); s += nov[i] + 0.5 * ((nov[i - 1] || 0) + (nov[i + 1] || 0)); } return s; };
    for (let bpm = lo; bpm <= hi; bpm += 0.05) { const bf = fps * 60 / bpm; for (let ph = 0; ph < bf; ph += 1) { const s = score(bpm, ph); if (s > best.score) best = { score: s, bpm, ph }; } }
    for (let bpm = best.bpm - 0.06; bpm <= best.bpm + 0.06; bpm += 0.005) { const bf = fps * 60 / bpm; for (let ph = Math.max(0, best.ph - 3); ph < Math.min(bf, best.ph + 3); ph += 0.25) { const s = score(bpm, ph); if (s > best.score) best = { score: s, bpm, ph }; } }
    // first beat on the grid with real energy (cold open)
    const bf = fps * 60 / best.bpm, peak = nov.reduce((m, v) => Math.max(m, v), 0);
    let first = best.ph;
    for (let p = best.ph; p < nF; p += bf) { const i = Math.round(p); const v = Math.max(nov[i] || 0, nov[i - 1] || 0, nov[i + 1] || 0); if (v > peak * 0.15) { first = p; break; } }
    return { bpm: Math.round(best.bpm * 100) / 100, firstBeat: first / fps };
  }

  // ---- headless bots ----
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e9) / 1e9; }; }
  function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

    if (A.previewing) { stopPreview(); return songSheet(); }
    try { await A.ctx.resume(); } catch (e) {}
    S.configure({ mode: 'song', bpm: U.song.bpm });
    startClock(clickTrack(15), U.song); A.previewing = true; songSheet();
    clearTimeout(A.pvTo); A.pvTo = setTimeout(() => { if (A.previewing) { stopPreview(); if (!sheet.hidden && $('songFile')) songSheet(); } }, (15 + U.song.offset + 0.6) * 1000);
  }
  function stopPreview() { A.previewing = false; clearTimeout(A.pvTo); stopClock(); }

  // ---------- feedback (artifact db, copy fallback) ----------
  const FQ = [
    { k: 'fun', q: 'How fun was it?', o: ['1', '2', '3', '4', '5'] },
    { k: 'beat', q: 'Did tapping on the beat feel good?', o: ['Yes', 'Sort of', 'No'] },
    { k: 'steer', q: 'Steering felt…', o: ['Too slow', 'Just right', 'Too twitchy'] },
    { k: 'hard', q: 'Difficulty', o: ['Too easy', 'About right', 'Too hard'] },
    { k: 'music', q: 'Did the wave feel connected to the music?', o: ['1', '2', '3', '4', '5'] },
    { k: 'dir', q: 'Which direction excites you more?', o: ['Surfing', 'Racing', 'Neither yet'] }
  ];
  function feedback() {
    showSheet(`<h2>Quick feedback</h2><p>Tap an answer for each. Only the first one is required.</p>
      ${FQ.map(f => `<div class="fq"><div class="q">${f.q}</div><div class="opts">${f.o.map(o => `<button class="opt" data-fq="${f.k}" data-fv="${o}" aria-pressed="${U.fb[f.k] === o}">${o}</button>`).join('')}</div></div>`).join('')}
      <div class="fq"><label class="lb" for="fbNote">Anything else? What would make you ride again?</label><textarea id="fbNote">${(U.fb.note || '').replace(/</g, '&lt;')}</textarea></div>
      <div class="err" id="fbErr" role="alert"></div>
      <button class="btn pri" data-act="fbSend">Send</button>
      <button class="btn" data-act="${U.run && U.paused ? 'menu' : U.lastRes ? 'results' : 'title'}">Back</button>`);
  }
  async function sendFeedback() {
    U.fb.note = ($('fbNote') || {}).value || '';
    if (!U.fb.fun) { $('fbErr').textContent = 'Pick how fun it was first (1 to 5).'; return; }
    const r = U.lastRes;
    const row = Object.assign({}, U.fb, { at: Date.now(), build: 'wave-test-v2', mode: U.mode, songBpm: U.song ? U.song.bpm : null, easy: U.easy, coach: U.coach, calibMs: Math.round(U.calib * 1000),
      result: r ? { grade: r.grade, acc: Math.round(r.acc * 100), score: r.score, miss: r.counts.miss, wide: r.counts.wide, meanMs: r.meanMs } : null,
      device: (navigator.userAgent || '').slice(0, 140) });
    let saved = false;
    try {
      const db = window.claude && await window.claude.use('db');
      if (db) {
        try { const user = await window.claude.use('user'); if (user) row.uid = await user.id(); } catch (e) {}
        await db.collection('feedback').add(row); saved = true;
      }
    } catch (e) { saved = false; }
    if (saved) { U.fb = {}; showSheet(`<h2>Thanks!</h2><p>Your feedback was saved.</p><button class="btn pri" data-act="ride">Ride again</button><button class="btn" data-act="title">Title</button>`); return; }
    const txt = 'Neon Surf wave test feedback\n' + FQ.map(f => `${f.q} ${row[f.k] || '-'}`).join('\n') + `\nNotes: ${row.note || '-'}\nResult: ${r ? `${r.grade} ${Math.round(r.acc * 100)}% (mean ${r.meanMs} ms)` : '-'}`;
    showSheet(`<h2>Couldn't save here</h2><p>This view can't store feedback. Copy your answers and send them to F instead.</p><textarea id="fbCopy" readonly>${txt.replace(/</g, '&lt;')}</textarea>
      <button class="btn pri" data-act="fbCopy">Copy answers</button><button class="btn" data-act="title">Title</button>`);
  }

  card.addEventListener('click', async e => {
    const b = e.target.closest('[data-act],[data-tog],[data-fq]'); if (!b) return;
    if (b.dataset.tog) { const k = b.dataset.tog; U[k] = !U[k]; b.setAttribute('aria-pressed', U[k]); savePrefs(); return; }
    if (b.dataset.fq) { U.fb.note = ($('fbNote') || {}).value || U.fb.note; U.fb[b.dataset.fq] = b.dataset.fv; card.querySelectorAll(`[data-fq="${b.dataset.fq}"]`).forEach(x => x.setAttribute('aria-pressed', x === b)); if ($('fbErr')) $('fbErr').textContent = ''; return; }
    const a = b.dataset.act;
    if (a === 'ride' || a === 'rideTest' || a === 'rideSong') {
      const mode = a === 'rideTest' ? 'test' : a === 'rideSong' ? 'song' : (U.mode || 'test');
      if (A.previewing) stopPreview();
      if (!U.seenHow) { U.mode = mode; return how(true); }
      if (U.playing) { stopClock(); U.playing = false; } return ride(mode);
    }
    if (a === 'song') { if (A.previewing) stopPreview(); return songSheet(); }
    if (a === 'preview') return preview();
    if (a === 'nudge' || a === 'shiftBeat' || a === 'bpm') {
      const v = +b.dataset.v, sg = U.song;
      if (a === 'nudge') sg.offset = Math.max(0, sg.offset + v);   // clicks sit at file time offset + k beats
      if (a === 'shiftBeat') sg.offset = Math.max(0, sg.offset + v * 60 / sg.bpm);
      if (a === 'bpm') sg.bpm = Math.round((sg.bpm + v) * 100) / 100;
      saveSong(); const was = A.previewing; if (was) stopPreview(); songSheet(); if (was) preview(); return;
    }
    if (a === 'how') return how(false);
    if (a === 'cal') return cal();
    if (a === 'calStart') return startCal();
    if (a === 'calReset') { U.calib = 0; savePrefs(); $('calMsg').textContent = 'Offset reset to 0 ms.'; return; }
    if (a === 'title') { if (A.previewing) stopPreview(); if (U.playing) return quit(); return title(); }
    if (a === 'menu') return showSheet(menuHTML());
    if (a === 'resume') return resume();
    if (a === 'quit') return quit();
    if (a === 'results') return showResults(U.lastRes);
    if (a === 'feedback') return feedback();
    if (a === 'fbSend') return sendFeedback();
    if (a === 'fbCopy') { const ta = $('fbCopy'); try { await navigator.clipboard.writeText(ta.value); b.textContent = 'Copied'; } catch (er) { ta.select(); try { document.execCommand('copy'); b.textContent = 'Copied'; } catch (e2) { b.textContent = 'Select the text and copy it'; } } }
  });

  resize(); title(); requestAnimationFrame(frame);
  window.SURFUI = { U, A, songAt, ride, loadSong, openMenu, endRun: () => endRun(songAt(performance.now())) };
})();

</script>
