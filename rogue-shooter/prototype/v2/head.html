<title>Rogue Shooter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #1a1612; --panel: #2a2218; --wood: #6b4c22; --wood-hi: #b08a50; --wood-lo: #2e1e0e; --ink: #2b1d14;
  --fg: #f0e4c8; --dim: #b4a27e; --gold: #ffcc44; --gold-deep: #5a3a00;
  --hp: #c0402f; --hp-hi: #df6448; --xp: #2fa894; --xp-hi: #5fe0c8;
  --common: #a08050; --rare: #4a86e8; --epic: #a060e0; --legend: #ffcc44; --ok: #8fe07a; --no: #ff8a70;
  --display: 'Press Start 2P', monospace;
  --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); }
canvas#game { display: block; width: 100%; height: 100%; position: fixed; inset: 0; z-index: 0; image-rendering: pixelated; }
canvas.spr, .spr { image-rendering: pixelated; display: block; }
.abs { position: absolute; }

/* ---------- menus live on a 1280x800 stage (1:1 at 1280x800, whole-number steps when bigger) ---------- */
#shade { position: fixed; inset: 0; z-index: 40; background: rgba(12, 8, 6, var(--a, 0.5)); pointer-events: none; }
#stage { position: fixed; left: 50%; top: 50%; width: 1280px; height: 800px; transform: translate(-50%, -50%) scale(var(--k, 1)); z-index: 50; font-family: var(--display); color: var(--fg); }
.screen { position: absolute; inset: 0; }
.vig { position: fixed; inset: 0; pointer-events: none; z-index: 41; background: radial-gradient(ellipse at center, transparent 0 66%, rgba(8,6,4,.18) 66% 80%, rgba(8,6,4,.36) 80% 92%, rgba(8,6,4,.55) 92%); }
.redvig { position: fixed; inset: 0; pointer-events: none; z-index: 41; background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(120,10,6,.55) 100%); }
#loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; font-family: var(--display); font-size: 16px; color: var(--gold); text-shadow: 3px 3px 0 var(--gold-deep); background: var(--bg); }

/* ---------- the in-game UI kit (screen px; 3 px = one art pixel), from art/tools/ui/menus_template.html ---------- */
.panel { background: repeating-linear-gradient(180deg, #34281a 0 21px, #2c2216 21px 24px); border: 3px solid var(--ink);
         box-shadow: inset 0 3px 0 0 var(--wood-hi), inset 0 0 0 3px #7a5a2c, 0 6px 0 0 rgba(0,0,0,.35); }
.plank { background: #4a3418; border: 3px solid var(--ink); box-shadow: inset 0 3px 0 0 var(--wood-hi), inset 0 -3px 0 0 var(--wood-lo); }
.t8 { font-size: 8px; line-height: 12px; } .t16 { font-size: 16px; line-height: 24px; } .t24 { font-size: 24px; line-height: 30px; } .t32 { font-size: 32px; line-height: 39px; } .t48 { font-size: 48px; line-height: 57px; }
.gold { color: var(--gold); text-shadow: 3px 3px 0 var(--gold-deep); } .dim { color: var(--dim); } .cream { color: var(--fg); text-shadow: 3px 3px 0 var(--ink); }
.btn { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: 16px; line-height: 24px; color: var(--fg); background: #4a3418; border: 3px solid var(--ink);
       box-shadow: inset 0 3px 0 0 var(--wood-hi), inset 0 -3px 0 0 var(--wood-lo); padding: 12px 18px; text-shadow: 3px 3px 0 var(--ink); cursor: pointer; user-select: none; }
.btn.sel { background: #6b4c22; color: var(--gold); box-shadow: inset 0 3px 0 0 #e0b870, inset 0 -3px 0 0 var(--wood-lo), 0 0 0 3px var(--gold); }
.btn.sel::before { content: ''; width: 12px; height: 18px; background: var(--gold); clip-path: polygon(0 0, 100% 50%, 0 100%); flex: none; }
.btn .sub { font-size: 8px; color: var(--dim); margin-left: auto; text-shadow: none; }
.btn.primary { background: #8e2c22; box-shadow: inset 0 3px 0 0 #df6448, inset 0 -3px 0 0 #4e140e, 0 0 0 3px var(--gold); color: #fff3d0; }
.btn.primary.sel { box-shadow: inset 0 3px 0 0 #df6448, inset 0 -3px 0 0 #4e140e, 0 0 0 3px #fff, 0 0 0 6px var(--gold); }
.btn.off { opacity: .45; cursor: default; }
.key { text-shadow: none; display: inline-block; font-family: var(--display); font-size: 8px; line-height: 12px; color: var(--ink); background: var(--fg); border: 3px solid var(--ink); box-shadow: inset 0 -3px 0 0 #b4a27e; padding: 3px 6px 6px; min-width: 24px; text-align: center; }
.hint { font-size: 8px; line-height: 24px; color: var(--fg); display: flex; gap: 9px; align-items: center; text-shadow: 3px 3px 0 var(--ink); }
.ico { display: block; flex: none; background-image: var(--icons); background-repeat: no-repeat; image-rendering: pixelated; }
.slot { width: 60px; height: 60px; display: grid; place-items: center; background: #1a120a; border: 3px solid var(--ink); box-shadow: inset 0 0 0 3px #5a4020, inset 0 3px 0 3px #3a2a14; position: relative; flex: none; }
.bar { height: 24px; border: 3px solid var(--ink); background: #1a120a; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); box-shadow: inset 0 3px 0 0 var(--hi), inset 0 -3px 0 0 rgba(0,0,0,.25); }
.bar > b { position: absolute; inset: 0; font-size: 8px; line-height: 18px; text-align: center; font-weight: 400; color: #fff; text-shadow: 3px 3px 0 var(--ink); }
.seg { display: flex; gap: 3px; } .seg > i { width: 9px; height: 12px; background: #1a120a; box-shadow: inset 0 0 0 3px #3a2a14; } .seg > i.on { background: var(--c, var(--gold)); box-shadow: inset 0 3px 0 0 rgba(255,255,255,.35); }
.notch { clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); }

/* ---------- 1 title ---------- */
.logo { left: 50%; top: 66px; transform: translateX(-50%); text-align: center; }
.logo .word { display: block; margin-bottom: 15px; font-size: 48px; line-height: 57px; color: var(--gold); text-shadow: 3px 3px 0 #c89220, 6px 6px 0 var(--gold-deep), 9px 9px 0 rgba(0,0,0,.4); letter-spacing: 3px; }
.logo .word.two { font-size: 64px; line-height: 72px; color: #fff3d0; text-shadow: 3px 3px 0 #c0402f, 6px 6px 0 #4e140e, 9px 9px 0 rgba(0,0,0,.4); }
.logo .tag { margin-top: 18px; font-size: 16px; color: var(--fg); text-shadow: 3px 3px 0 var(--ink); letter-spacing: 3px; }
.mainmenu { left: 50%; top: 318px; transform: translateX(-50%); width: 420px; padding: 21px; display: grid; gap: 12px; }
.lineup { left: 0; right: 0; bottom: 36px; display: flex; justify-content: center; gap: 48px; }
.corner { font-size: 8px; color: var(--dim); text-shadow: 3px 3px 0 var(--ink); }

/* ---------- 2 class select ---------- */
.cs-title { left: 0; right: 0; top: 30px; text-align: center; }
.cs-row { left: 34px; right: 34px; top: 96px; display: flex; gap: 18px; align-items: flex-start; }
.ccard { width: 228px; padding: 15px; display: grid; gap: 12px; cursor: pointer; transition: transform .1s steps(2); }
.ccard.sel { transform: translateY(-12px); box-shadow: inset 0 3px 0 0 #e0b870, inset 0 0 0 3px #b08a50, 0 0 0 3px var(--gold), 0 12px 0 0 rgba(0,0,0,.4); }
.ccard .pic { height: 150px; display: grid; place-items: end center; background: #5ea23c; border: 3px solid var(--ink); position: relative; overflow: hidden; }
.ccard .pic::after { content: ''; position: absolute; left: 50%; bottom: 9px; width: 66px; height: 12px; margin-left: -30px; background: rgba(20,30,70,.3); z-index: 0; }
.ccard .pic canvas { position: relative; z-index: 1; margin-bottom: 3px; }
.ccard .nm { font-size: 16px; line-height: 24px; color: var(--fg); text-shadow: 3px 3px 0 var(--ink); }
.ccard.sel .nm { color: var(--gold); }
.ccard .ep { font-size: 8px; line-height: 12px; color: var(--dim); margin-top: 6px; }
.ccard .num { position: absolute; left: -12px; top: -12px; }
.stats { display: grid; grid-template-columns: 36px 1fr 36px; gap: 6px 6px; align-items: center; font-size: 8px; }
.stats .v { text-align: right; color: var(--fg); }
.kit { display: grid; gap: 9px; }
.kit .k { display: flex; gap: 9px; align-items: center; }
.kit .kframe { background: #1a120a; border: 3px solid var(--ink); padding: 3px; }
.kit .k div { display: grid; gap: 6px; font-size: 8px; line-height: 12px; }
.kit .k small { font-size: 8px; color: var(--dim); }
.trait { font-family: var(--body); font-size: 16px; line-height: 18px; font-weight: 600; color: var(--fg); }
.trait.minus { color: #e8a090; }
.trait b { font-family: var(--display); font-size: 8px; font-weight: 400; margin-right: 6px; }
.cs-foot { left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; gap: 30px; }

/* ---------- 3 battle map ---------- */
.mapbox { left: 36px; top: 36px; width: 762px; height: 728px; padding: 21px; }
.mapbox .ground { position: absolute; left: 21px; right: 21px; top: 84px; bottom: 21px; border: 3px solid var(--ink); background-size: 288px 288px; image-rendering: pixelated; filter: brightness(.8); overflow: hidden; }
.node { position: absolute; width: 84px; height: 84px; display: grid; place-items: center; font-size: 16px; color: var(--fg); background: #4a3418; border: 3px solid var(--ink); box-shadow: inset 0 3px 0 0 var(--wood-hi), inset 0 -3px 0 0 var(--wood-lo); text-shadow: 3px 3px 0 var(--ink); }
.nlabel { position: absolute; font-size: 8px; line-height: 12px; white-space: nowrap; color: var(--fg); text-shadow: 3px 3px 0 var(--ink); transform: translateX(-50%); }
.node.done { background: #3a5a28; box-shadow: inset 0 3px 0 0 #6cb046, inset 0 -3px 0 0 #1e3412; }
.check { position: absolute; width: 30px; height: 30px; background: var(--gold); clip-path: polygon(0 55%, 18% 37%, 40% 60%, 82% 8%, 100% 26%, 40% 94%); filter: drop-shadow(3px 3px 0 #2b1d14); }
.node.cur { background: #6b4c22; box-shadow: inset 0 3px 0 0 #e0b870, inset 0 -3px 0 0 var(--wood-lo), 0 0 0 3px var(--gold), 0 0 0 9px rgba(255,204,68,.25), 0 0 0 15px rgba(255,204,68,.12); color: var(--gold); }
.node.boss { width: 108px; height: 108px; background: #3a1840; box-shadow: inset 0 3px 0 0 #b066dc, inset 0 -3px 0 0 #1a0820, 0 0 0 3px #b066dc, 0 0 0 12px rgba(176,102,220,.2); }
.node.boss.cur { box-shadow: inset 0 3px 0 0 #b066dc, inset 0 -3px 0 0 #1a0820, 0 0 0 3px var(--gold), 0 0 0 12px rgba(255,204,68,.25); }
.node.lock { filter: saturate(.3) brightness(.7); }
.hero-pin { position: absolute; }
.deco { position: absolute; image-rendering: pixelated; }
.info { left: 822px; top: 36px; width: 422px; height: 728px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.info h3 { margin: 0; font-weight: 400; }
.portraits { display: flex; gap: 9px; flex-wrap: wrap; }
.portraits .slot { width: 84px; height: 84px; overflow: hidden; }
.pips { display: flex; gap: 6px; align-items: center; }
.info .rule, .rule { height: 3px; background: #6b4c22; box-shadow: 0 3px 0 0 #1a120a; }
.info .btns { margin-top: auto; display: grid; gap: 12px; }

/* ---------- 4 combat HUD (window corners, not the stage) ---------- */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; font-family: var(--display); color: var(--fg); }
.hud-tl { left: 18px; top: 18px; display: flex; gap: 12px; align-items: flex-start; }
.portrait { width: 84px; height: 84px; background: #3a6a8a; border: 3px solid var(--ink); box-shadow: inset 0 0 0 3px #a08050; display: grid; place-items: center; overflow: hidden; position: relative; }
.lvl { position: absolute; left: 66px; top: 72px; font-size: 8px; line-height: 12px; padding: 3px 6px 6px; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); white-space: nowrap; }
.hud-bars { display: grid; gap: 6px; width: 330px; padding-top: 3px; }
.hud-bars .bar.hp { height: 30px; } .hud-bars .bar.hp > b { line-height: 24px; font-size: 8px; }
.hud-top { left: 50%; top: 18px; transform: translateX(-50%); display: grid; justify-items: center; gap: 9px; }
.roundplank { padding: 9px 18px; display: flex; gap: 18px; align-items: center; font-size: 16px; white-space: nowrap; }
.phase { font-size: 8px; color: #ffd27a; text-shadow: 3px 3px 0 var(--ink); letter-spacing: 3px; }
.bossbar { width: 480px; display: grid; gap: 6px; justify-items: center; }
.bossbar .bar { width: 100%; height: 24px; }
.hud-tr { right: 18px; top: 18px; display: grid; gap: 6px; justify-items: end; }
.cnt { display: flex; gap: 9px; align-items: center; font-size: 16px; padding: 6px 12px 6px 9px; }
.mats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 420px; }
.mats .cnt { font-size: 8px; padding: 3px 9px 3px 6px; gap: 6px; }
.hud-bl { left: 18px; bottom: 18px; display: flex; gap: 9px; align-items: flex-end; }
.wslot { display: grid; gap: 6px; justify-items: center; font-size: 8px; text-shadow: 3px 3px 0 var(--ink); }
.wslot .slot { width: 72px; height: 72px; } .wslot .lvpips { display: flex; gap: 3px; } .wslot .lvpips i { width: 9px; height: 9px; background: #1a120a; border: 3px solid var(--ink); box-sizing: content-box; } .wslot .lvpips i.on { background: var(--gold); }
.wslot.empty .slot { opacity: .7; font-size: 8px; color: var(--dim); }
.hud-bc { left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; align-items: flex-end; }
.ability { position: relative; } .ability .slot { width: 96px; height: 96px; overflow: hidden; }
.cool { position: absolute; inset: 3px; background: conic-gradient(transparent 0 var(--done, 360deg), rgba(10,8,20,.7) var(--done, 360deg) 360deg); }
.cool b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 400; color: #fff; text-shadow: 3px 3px 0 var(--ink); }
.keytag { position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); }
.charges { position: absolute; right: -6px; top: -9px; display: flex; gap: 3px; } .charges i { width: 12px; height: 12px; background: #1a120a; border: 3px solid var(--ink); box-sizing: content-box; } .charges i.on { background: #5ac860; }
.belt { display: flex; gap: 9px; padding: 9px; }
.belt .slot { width: 66px; height: 66px; } .belt .n { position: absolute; right: 3px; bottom: 0; font-size: 8px; color: #fff; text-shadow: 3px 3px 0 var(--ink); } .belt .key { position: absolute; left: -9px; top: -12px; }
.belt .slot.on { box-shadow: inset 0 0 0 3px var(--gold), inset 0 3px 0 3px #3a2a14; }
.toast { right: 18px; bottom: 18px; padding: 12px 15px; font-size: 8px; line-height: 15px; display: flex; gap: 12px; align-items: center; }
#notification { position: fixed; top: 150px; left: 50%; transform: translateX(-50%); z-index: 30; padding: 9px 18px; font-family: var(--display); font-size: 16px; line-height: 24px; text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; pointer-events: none; }

/* ---------- 5 level up ---------- */
.lu-title { left: 0; right: 0; top: 66px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.lu-row { left: 0; right: 0; top: 204px; display: flex; justify-content: center; gap: 36px; }
.card { width: 282px; height: 396px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; text-align: center; cursor: pointer; user-select: none;
        background: repeating-linear-gradient(180deg, #34281a 0 21px, #2c2216 21px 24px); border: 3px solid var(--ink);
        box-shadow: inset 0 0 0 6px var(--r), inset 0 9px 0 6px color-mix(in srgb, var(--r) 60%, white), 0 9px 0 0 rgba(0,0,0,.4); }
.card .rar { font-size: 8px; line-height: 12px; padding: 6px 9px; background: var(--r); color: var(--ink); margin-top: -3px; }
.card .art { width: 108px; height: 108px; display: grid; place-items: center; background: #1a120a; border: 3px solid var(--ink); box-shadow: inset 0 0 0 3px var(--r); }
.card .cn { font-size: 16px; line-height: 24px; color: var(--fg); text-shadow: 3px 3px 0 var(--ink); }
.card .val { font-size: 24px; line-height: 30px; color: var(--r); text-shadow: 3px 3px 0 var(--ink); }
.card .desc { font-family: var(--body); font-size: 18px; line-height: 20px; font-weight: 600; color: var(--dim); }
.card .now { font-size: 8px; line-height: 12px; color: var(--dim); margin-top: auto; }
.card .pref { position: absolute; top: -18px; right: -12px; font-size: 8px; line-height: 12px; padding: 6px 9px; background: #3a6a3a; border: 3px solid var(--ink); color: #dfffd0; transform: rotate(4deg); }
.card .newtag { position: absolute; top: -18px; right: -12px; font-size: 8px; line-height: 12px; padding: 6px 9px; background: var(--gold); border: 3px solid var(--ink); color: var(--ink); transform: rotate(4deg); }
.card .num { position: absolute; left: -15px; top: -15px; }
.card.sel { transform: translateY(-15px); box-shadow: inset 0 0 0 6px var(--r), inset 0 9px 0 6px color-mix(in srgb, var(--r) 60%, white), 0 0 0 3px #fff, 0 9px 0 3px rgba(0,0,0,.4); }
.card.legend::before { content: ''; position: absolute; inset: 6px; pointer-events: none; background: linear-gradient(115deg, transparent 0 40%, rgba(255,240,180,.18) 40% 46%, transparent 46% 100%); background-size: 300% 100%; animation: shine 2.4s steps(12) infinite; }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -50% 0; } }
@media (prefers-reduced-motion: reduce) { .card.legend::before { animation: none; } }
.cards.locked .card { pointer-events: none; }
.lu-foot { left: 0; right: 0; bottom: 42px; display: flex; justify-content: center; gap: 30px; }

/* ---------- menus, part 2 (art/tools/ui/build_menus2.py) ---------- */
.ghost { opacity: .45; }
.row { display: flex; gap: 12px; align-items: center; font-size: 8px; line-height: 12px; } .row > span:last-child { margin-left: auto; text-align: right; }
.row .slot { width: 48px; height: 48px; } .row.big { gap: 15px; }
.side .row span:nth-child(2) { flex: 1; }
.lbl { font-size: 8px; line-height: 12px; color: var(--dim); letter-spacing: 1px; }
.h { font-size: 16px; line-height: 24px; }
.desc { font-family: var(--body); font-size: 18px; line-height: 20px; font-weight: 600; color: var(--dim); }
.ok { color: var(--ok); } .rule2 { height: 3px; background: #7a5a2c; }
.srow2 { display: grid; grid-template-columns: 48px 1fr 72px 72px 72px; gap: 12px; align-items: center; font-size: 8px; line-height: 12px; }
.srow2 .slot { width: 48px; height: 48px; } .srow2 > span:nth-child(n+3) { text-align: right; }
.srow2.head { margin-bottom: 3px; }
.cgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.cc { display: grid; justify-items: center; gap: 6px; text-align: center; position: relative; }
.cc .slot { width: 66px; height: 66px; } .cc.none { opacity: .35; }
.cnt2 { position: absolute; right: 6px; top: 42px; font-size: 8px; color: var(--ink); background: var(--gold); border: 3px solid var(--ink); padding: 0 3px; }
.tally { display: flex; justify-content: space-between; align-items: center; font-size: 8px; line-height: 12px; }
.tally > span:first-child { display: flex; gap: 9px; align-items: center; }
.tally > span:last-child { font-size: 16px; }
.tally.big2 > span:last-child { font-size: 24px; }
.loots { display: flex; gap: 12px; flex-wrap: wrap; }
.loot { display: grid; justify-items: center; gap: 6px; font-size: 8px; } .loot .slot { width: 66px; height: 66px; }
.fallen { padding: 6px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 45; }
.confetti i { position: absolute; width: 9px; height: 9px; animation: fall 3s steps(30) infinite; }
@keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(840px); } }
@media (prefers-reduced-motion: reduce) { .confetti i { animation: none; } }
.opt { display: grid; grid-template-columns: 1fr auto 60px; gap: 12px; align-items: center; font-size: 8px; line-height: 12px; cursor: pointer; padding: 3px; }
.opt.sel { outline: 3px solid var(--gold); }
.opt small { display: block; font-family: var(--body); font-size: 14px; font-weight: 600; color: var(--dim); margin-top: 3px; }
.opt .v { text-align: right; color: var(--dim); }
.tog { width: 60px; height: 27px; background: #1a120a; border: 3px solid var(--ink); position: relative; box-shadow: inset 0 0 0 3px #3a2a14; }
.tog i { position: absolute; left: 3px; top: 3px; width: 21px; height: 15px; background: #6a5a46; } .tog.on { background: #2c5a1c; } .tog.on i { left: auto; right: 3px; background: var(--ok); }
.cs-anywhere { cursor: pointer; }

/* ---------- farm and town screens (menus-2.html) ---------- */
#farmhud { position: fixed; inset: 0; z-index: 10; pointer-events: none; font-family: var(--display); color: var(--fg); }
#farm-prompt { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 11; padding: 9px 15px; font-family: var(--display); font-size: 8px; line-height: 24px; color: var(--fg); text-shadow: 3px 3px 0 var(--ink); display: flex; gap: 9px; align-items: center; white-space: nowrap; pointer-events: none; }
.bhead { left: 24px; top: 18px; display: flex; gap: 12px; align-items: center; padding: 9px 18px 9px 9px; }
