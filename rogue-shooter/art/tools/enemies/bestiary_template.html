<title>{{PAGETITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: a field journal of monsters. One wooden band per zone, its ground color under every sprite; cards show move, attack and effect loops. */
:root {
  --bg: #1a1612; --panel: #2a2218; --panel-2: #231c14; --wood: #6b4c22; --wood-light: #a08050;
  --fg: #f0e4c8; --dim: #b4a27e; --gold: #ffcc44; --gold-deep: #5a3a00;
  --display: 'Press Start 2P', 'Courier New', monospace;
  --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
header.top { display: grid; gap: 10px; }
.eyebrow { font-family: var(--display); font-size: 9px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
h1 { font-family: var(--display); font-size: clamp(18px, 3.4vw, 28px); color: var(--gold); text-shadow: 2px 2px 0 var(--gold-deep); margin: 0; letter-spacing: 1px; line-height: 1.4; }
.lede { max-width: 76ch; color: var(--dim); font-weight: 600; margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0; border-bottom: 2px solid var(--panel); }
.controls span { font-family: var(--display); font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-right: 4px; }
.chip { font-family: var(--display); font-size: 9px; letter-spacing: 1px; color: var(--fg); background: var(--panel); border: 2px solid var(--wood); padding: 8px 10px; cursor: pointer; text-decoration: none; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sep { width: 2px; height: 22px; background: var(--wood); margin: 0 4px; }
section.zone { background: var(--panel-2); border: 2px solid var(--wood); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 4px 16px rgba(0,0,0,0.4); padding: 18px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: 60px; border-top-width: 6px; }
section.zone > header { display: grid; gap: 4px; }
h2 { font-family: var(--display); font-size: 14px; color: var(--gold); margin: 0; text-shadow: 1px 1px 0 var(--gold-deep); letter-spacing: 1px; line-height: 1.5; }
section.zone > header p { margin: 0; color: var(--dim); font-weight: 600; }
.z-universal { border-top-color: #5ea23c; } .z-meadow { border-top-color: #93cf63; } .z-forest { border-top-color: #3f8a34; }
.z-caverns { border-top-color: #38a8c0; } .z-volcanic { border-top-color: #e05a10; } .z-shadow { border-top-color: #825cc4; }
.z-void { border-top-color: #20e0d0; } .z-material { border-top-color: #c4b496; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; grid-auto-flow: row dense; }
article.foe { background: var(--panel); border: 2px solid var(--wood); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
article.foe.wide { grid-column: 1 / -1; }
article.foe > header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
h3 { font-family: var(--display); font-size: 11px; color: var(--fg); margin: 0; letter-spacing: 1px; line-height: 1.5; }
h4 { font-family: var(--display); font-size: 8px; color: var(--dim); margin: 0; letter-spacing: 1.5px; font-weight: 400; }
.tag { font-family: var(--display); font-size: 7px; color: var(--dim); letter-spacing: 1px; }
.beh { margin: 0; color: var(--fg); font-weight: 700; font-size: 15px; }
.note { margin: 0; color: var(--dim); font-weight: 600; font-size: 14px; }
.anims { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: start; }
.block { display: grid; gap: 6px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
figure { margin: 0; display: grid; gap: 4px; justify-items: center; min-width: 0; max-width: 100%; }
canvas { image-rendering: pixelated; border: 2px solid var(--wood); max-width: 100%; height: auto; display: block; }
figcaption { font-family: var(--display); font-size: 7px; color: var(--dim); letter-spacing: 1.5px; }
.fxnote { margin: 0; color: var(--dim); font-size: 12px; font-weight: 600; max-width: 30ch; text-align: center; }
details { border-top: 1px dashed var(--wood); padding-top: 6px; }
summary { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 1px; cursor: pointer; }
summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.sheet { image-rendering: pixelated; max-width: 100%; height: auto; background: repeating-conic-gradient(#3a3026 0 25%, #2e261e 0 50%) 0 0 / 8px 8px; margin-top: 8px; display: block; }
footer { color: var(--dim); font-size: 13px; font-weight: 600; }
</style>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{H1}}</h1>
    <p class="lede">{{LEDE}}</p>
  </header>
  <div class="controls" role="group" aria-label="Playback and zones">
    <span>PLAYBACK</span>
    <button class="chip" id="t-play" aria-pressed="true">Playing</button>
    <button class="chip" id="t-slow" aria-pressed="false">Slow motion</button>
    <i class="sep" aria-hidden="true"></i>
    {{NAV}}
  </div>
  {{ZONES}}
  <footer>Drawn by Claude in code (art/tools/enemies). {{FOOTSRC}} © 2026 justaskjoe. All rights reserved.</footer>
</div>
<script>
const D = {{DATA}};
const GROUND = { universal: '#5ea23c', meadow: '#5ea23c', forest: '#3e6a30', caverns: '#5a5e6a', volcanic: '#4a3a34', shadow: '#2e2640', void: '#14161e', material: '#8a6a44' };
const SLIME_GROUND = { meadow: '#5ea23c', forest: '#3e6a30', caverns: '#5a5e6a', volcanic: '#4a3a34', shadow: '#2e2640', void: '#14161e' };
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = c => Math.max(0, Math.min(255, Math.round(c * k))); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
const imgs = {};
function load(src) { if (!imgs[src]) { const i = new Image(); i.src = src; imgs[src] = i; } return imgs[src]; }
const PAD = 6, SCALE = 4, FXSCALE = 3;
const items = [...document.querySelectorAll('canvas[data-k]')].map(c => {
  const k = c.dataset.k, d = D[k], zone = c.closest('article').dataset.zone;
  const x = c.getContext('2d');
  if (c.dataset.extra) {
    const e = d.extras[c.dataset.extra];
    c.width = e.w + 8; c.height = e.h + 8; c.style.width = (c.width * FXSCALE) + 'px';
    return { c, x, kind: 'fx', e, img: load(e.src), bg: GROUND[zone] };
  }
  const float = d.float, view = c.dataset.view, v = c.dataset.var || null;
  c.width = d.w + PAD * 2; c.height = d.h + PAD + (float ? 6 : 2);
  c.style.width = (c.width * (d.w >= 40 ? 3 : SCALE)) + 'px';
  const row = (v ? d.variants.indexOf(v) : 0) * d.views.length + d.views.indexOf(view);
  const bg = v ? SLIME_GROUND[v] : GROUND[zone];
  return { c, x, kind: c.dataset.anim, d, row, img: load(d.sheet), bg, float };
});
function ground(o) {
  const { x, c, bg } = o;
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
  let r = 12345; const rnd = () => (r = (r * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  x.fillStyle = shade(bg, 0.86);
  for (let i = 0; i < c.width * c.height / 60; i++) x.fillRect(Math.floor(rnd() * c.width), Math.floor(rnd() * c.height), 1, 1);
  x.fillStyle = shade(bg, 1.12);
  for (let i = 0; i < c.width * c.height / 140; i++) x.fillRect(Math.floor(rnd() * c.width), Math.floor(rnd() * c.height), 1, 1);
}
function shadowAt(o) {
  const { x, d } = o; const cx = PAD + d.w / 2, cy = PAD + d.h - 2 + (o.float ? 5 : 0);
  const rx = Math.round(d.w * (o.float ? 0.22 : 0.34)), ry = o.float ? 1.5 : 2.5;
  x.fillStyle = 'rgba(16,24,64,0.32)';
  for (let yy = -Math.ceil(ry); yy <= Math.ceil(ry); yy++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (yy / (ry + 0.5)) ** 2)));
    x.fillRect(Math.round(cx - w + 1), Math.round(cy + yy), w * 2, 1);
  }
}
function pick(t, seq) { let m = t % seq.reduce((a, b) => a + b, 0), i = 0; while (m >= seq[i]) { m -= seq[i]; i++; } return i; }
let playing = true, slow = false, t0 = performance.now();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now) {
  const t = (now - t0) * (slow ? 0.3 : 1);
  for (const o of items) {
    if (!o.img.complete) continue;
    o.x.imageSmoothingEnabled = false;
    ground(o);
    if (o.kind === 'fx') {
      const n = o.e.n, i = pick(t, [...Array(n).fill(200), 360]);
      if (i < n) o.x.drawImage(o.img, i * o.e.w, 0, o.e.w, o.e.h, 4, 4, o.e.w, o.e.h);
      continue;
    }
    const d = o.d; let col;
    if (o.kind === 'move') col = Math.floor(t / d.tm) % d.nm;
    else { const i = pick(t, [...d.ta, 700]); col = i < d.na ? d.nm + i : 0; }
    shadowAt(o);
    o.x.drawImage(o.img, col * d.w, o.row * d.h, d.w, d.h, PAD, PAD, d.w, d.h);
  }
  if (playing && !reduce) requestAnimationFrame(draw);
}
Promise.all(Object.values(imgs).map(i => i.decode().catch(() => {}))).then(() => requestAnimationFrame(draw));
const pb = document.getElementById('t-play'), sb = document.getElementById('t-slow');
pb.addEventListener('click', () => { playing = !playing; pb.setAttribute('aria-pressed', playing); pb.textContent = playing ? 'Playing' : 'Paused'; if (playing) requestAnimationFrame(draw); });
sb.addEventListener('click', () => { slow = !slow; sb.setAttribute('aria-pressed', slow); });
</script>
