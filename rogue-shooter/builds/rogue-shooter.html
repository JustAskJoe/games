<title>Rogue Shooter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #080810; --fg: #e0e0f0; --dim: #5a5a7a;
  --cyan: #00d4ff; --red: #ff2255; --gold: #ffcc00;
  --green: #00ff88; --purple: #a855f7; --blue: #3b82f6;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; z-index: 0; }

#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; font-family: 'Rajdhani', sans-serif;
  display: flex; gap: 16px; align-items: flex-start;
}
.hud-left { flex: 1; max-width: 260px; display: flex; flex-direction: column; gap: 6px; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-family: 'Orbitron', sans-serif; font-size: 13px; color: var(--dim); }
.hud-right span { white-space: nowrap; }
.hud-right .val { color: var(--fg); font-weight: 700; }
.bar-wrap { height: 18px; border-radius: 9px; overflow: hidden; position: relative; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
.bar-fill { height: 100%; border-radius: 9px; transition: width 0.25s ease; position: absolute; left: 0; top: 0; }
.bar-hp .bar-fill { background: linear-gradient(90deg, #cc1144, #ff4477); }
.bar-xp .bar-fill { background: linear-gradient(90deg, #00aa55, #00ff88); }
.bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(0,0,0,0.9); z-index: 1; }
.level-badge { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px; color: var(--gold); letter-spacing: 1px; text-shadow: 0 0 12px rgba(255,204,0,0.4); }

.overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4,4,12,0.92); padding-inline: max(16px, env(safe-area-inset-left, 0px)); font-family: 'Rajdhani', sans-serif; overflow-y: auto; }
.overlay h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 3px; margin-bottom: 4px; }
.overlay p { color: var(--dim); font-size: 18px; font-weight: 600; }

#startscreen { padding-block: 32px; }
#startscreen h1 { font-size: clamp(24px, 5vw, 44px); color: var(--cyan); text-shadow: 0 0 40px rgba(0,212,255,0.3); }
.char-select { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 20px; max-width: 820px; }
.char-card {
  width: 142px; padding: 16px 10px 14px; border-radius: 10px; cursor: pointer;
  background: rgba(16,16,36,0.92); border: 2px solid rgba(255,255,255,0.06);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; text-align: center; user-select: none;
}
.char-card:hover { transform: translateY(-5px) scale(1.03); }
.char-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.char-icon svg { width: 24px; height: 24px; }
.char-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; }
.char-style { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.06); }
.char-desc { font-size: 12px; color: var(--dim); font-weight: 600; line-height: 1.3; }
.char-stats { font-size: 10px; color: var(--dim); font-family: 'Orbitron', sans-serif; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.char-stats span { white-space: nowrap; }

#deathscreen h1 { font-size: clamp(24px, 5vw, 42px); color: var(--red); text-shadow: 0 0 30px rgba(255,34,85,0.3); }
.end-stats { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px; text-align: center; }
.end-stats .stat-val { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 28px; color: var(--cyan); }
.end-stats .stat-lbl { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.end-sub { color: var(--dim); margin-top: 28px; font-size: 14px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

#winscreen h1 { font-size: clamp(24px, 5vw, 42px); color: var(--gold); text-shadow: 0 0 40px rgba(255,204,0,0.4); }

#statspanel { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4,4,12,0.9); padding-inline: max(16px, env(safe-area-inset-left, 0px)); font-family: 'Rajdhani', sans-serif; overflow-y: auto; }
#statspanel h2 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; color: var(--cyan); letter-spacing: 3px; margin-bottom: 24px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 36px; max-width: 360px; width: 100%; }
.stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.stat-name { font-size: 14px; color: var(--dim); font-weight: 600; }
.stat-value { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; color: var(--fg); }
#statspanel .hint { margin-top: 24px; font-size: 13px; color: var(--dim); font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
.weapons-list { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: 360px; width: 100%; }
.weapons-list h3 { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; color: var(--gold); letter-spacing: 2px; margin-bottom: 4px; }
.wpn-row { display: flex; justify-content: space-between; width: 100%; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.wpn-name { font-size: 13px; font-weight: 600; }
.wpn-lvl { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; color: var(--gold); }

#bosshp { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 15; padding-top: calc(10px + env(safe-area-inset-top, 0px)); width: min(400px, 70vw); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
#bosshp .boss-label { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 12px; color: #ff4422; letter-spacing: 3px; text-shadow: 0 0 10px rgba(255,30,0,0.5); }
#bosshp .boss-bar-wrap { width: 100%; height: 14px; border-radius: 7px; overflow: hidden; background: rgba(0,0,0,0.6); border: 1px solid #ff4422; box-shadow: 0 0 16px rgba(255,30,0,0.25); }
#bosshp .boss-bar-fill { height: 100%; border-radius: 7px; transition: width 0.2s ease; background: linear-gradient(90deg, #880000, #ff2200, #ff4422); }

#levelup { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4,4,12,0.88); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
#levelup h2 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 22px; color: var(--gold); letter-spacing: 3px; margin-bottom: 28px; text-shadow: 0 0 20px rgba(255,204,0,0.3); }
.cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.card { width: 175px; padding: 24px 14px; border-radius: 12px; cursor: pointer; background: rgba(20,20,40,0.92); border: 2px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; text-align: center; user-select: none; }
.card:hover { transform: translateY(-6px) scale(1.03); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.card[data-rarity="common"] { border-color: #4b5563; } .card[data-rarity="common"]:hover { border-color: #9ca3af; }
.card[data-rarity="uncommon"] { border-color: var(--green); } .card[data-rarity="uncommon"]:hover { box-shadow: 0 8px 32px rgba(0,255,136,0.15); }
.card[data-rarity="rare"] { border-color: var(--blue); } .card[data-rarity="rare"]:hover { box-shadow: 0 8px 32px rgba(59,130,246,0.2); }
.card[data-rarity="epic"] { border-color: var(--purple); } .card[data-rarity="epic"]:hover { box-shadow: 0 8px 32px rgba(168,85,247,0.2); }
.card[data-rarity="legendary"] { border-color: var(--gold); background: linear-gradient(135deg, rgba(40,30,10,0.95), rgba(20,15,5,0.95)); box-shadow: 0 0 18px rgba(255,204,0,0.15); animation: legendaryPulse 2s ease-in-out infinite; }
.card[data-rarity="legendary"]:hover { box-shadow: 0 8px 36px rgba(255,204,0,0.3); }
@keyframes legendaryPulse { 0%,100%{border-color:var(--gold);} 50%{border-color:#ff8800;} }
.card-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.card-icon svg { width: 26px; height: 26px; }
.card-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; }
.card-desc { font-size: 14px; color: var(--dim); font-weight: 600; line-height: 1.4; }
.card-rarity { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; font-weight: 500; }
.card[data-rarity="common"] .card-rarity { color: #6b7280; } .card[data-rarity="uncommon"] .card-rarity { color: var(--green); }
.card[data-rarity="rare"] .card-rarity { color: var(--blue); } .card[data-rarity="epic"] .card-rarity { color: var(--purple); }
.card[data-rarity="legendary"] .card-rarity { color: var(--gold); }
.card-evo-badge { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; font-family: 'Orbitron', sans-serif; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: rgba(255,204,0,0.15); color: var(--gold); }
#notification { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 10px 28px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; text-align: center; background: rgba(4,4,12,0.9); border: 2px solid; pointer-events: none; white-space: nowrap; animation: notifSlide 0.3s ease-out; }
@keyframes notifSlide { from{transform:translateX(-50%) translateY(-20px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
.syn-row { margin-top: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,0.04); font-size: 13px; font-weight: 600; font-family: 'Rajdhani', sans-serif; }
.evo-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: rgba(255,204,0,0.12); color: var(--gold); font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 1px; margin-left: 6px; }
.card-wpn-badge { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; font-family: 'Orbitron', sans-serif; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: rgba(255,170,0,0.12); color: #ffaa44; }
</style>

<canvas id="game"></canvas>
<div id="hud" hidden>
  <div class="hud-left">
    <div class="level-badge" id="level-text">LVL 1</div>
    <div class="bar-wrap bar-hp"><div class="bar-fill" id="hp-fill" style="width:100%"></div><div class="bar-label" id="hp-label">100 / 100</div></div>
    <div class="bar-wrap bar-xp"><div class="bar-fill" id="xp-fill" style="width:0%"></div><div class="bar-label" id="xp-label">0 / 30</div></div>
  </div>
  <div class="hud-right"><span id="time-text"><span class="val">0:00</span></span><span>KILLS <span class="val" id="kill-text">0</span></span></div>
</div>
<div id="bosshp" hidden><div class="boss-label">BOSS</div><div class="boss-bar-wrap"><div class="boss-bar-fill" id="boss-fill" style="width:100%"></div></div></div>
<div id="levelup" hidden><h2>LEVEL UP</h2><div class="cards" id="card-container"></div></div>
<div id="statspanel" hidden><h2>STATS</h2><div class="stats-grid" id="stats-grid"></div><div class="weapons-list" id="weapons-list"></div><div class="hint">TAB TO CLOSE</div></div>

<div class="overlay" id="startscreen">
  <h1>ROGUE SHOOTER</h1>
  <p>Choose your fighter</p>
  <div class="char-select" id="char-select"></div>
</div>

<div class="overlay" id="winscreen" hidden>
  <h1>LEVEL COMPLETE</h1>
  <div class="end-stats">
    <div><div class="stat-val" id="ws-level">1</div><div class="stat-lbl">Level</div></div>
    <div><div class="stat-val" id="ws-kills">0</div><div class="stat-lbl">Kills</div></div>
    <div><div class="stat-val" id="ws-time">0:00</div><div class="stat-lbl">Time</div></div>
    <div><div class="stat-val" id="ws-dps">0</div><div class="stat-lbl">DPS</div></div>
  </div>
  <div class="end-sub">PRESS SPACE TO PLAY AGAIN</div>
</div>
<div class="overlay" id="deathscreen" hidden>
  <h1>DEFEATED</h1>
  <div class="end-stats">
    <div><div class="stat-val" id="ds-level">1</div><div class="stat-lbl">Level</div></div>
    <div><div class="stat-val" id="ds-kills">0</div><div class="stat-lbl">Kills</div></div>
    <div><div class="stat-val" id="ds-time">0:00</div><div class="stat-lbl">Survived</div></div>
    <div><div class="stat-val" id="ds-dps">0</div><div class="stat-lbl">DPS</div></div>
  </div>
  <div class="end-sub">PRESS SPACE TO RETRY</div>
</div>

<div id="notification" hidden><span id="notif-text"></span></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const COL = { cyan:'#00d4ff', cyanDark:'#0088aa', red:'#ff2255', redDark:'#aa1133', gold:'#ffcc00', green:'#00ff88', purple:'#a855f7', purpleDark:'#7722cc', blue:'#3b82f6' };

function resize() { canvas.width=innerWidth*devicePixelRatio; canvas.height=innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', resize); resize();
const W=()=>innerWidth, H=()=>innerHeight;
function toScreen(wx,wy){return{x:wx-wy,y:(wx+wy)*0.5}}
function toWorld(sx,sy){return{x:sx*0.5+sy,y:-sx*0.5+sy}}
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function angleBetween(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}

// ─── Characters ───
const CHARS = {
  knight: {
    name:'Knight', style:'MELEE', desc:'Tanky brawler, short-range power slashes',
    color:'#ffaa33', outfit:{hair:'#c47730',dress:'#ffaa33',shoes:'#8b5e2b',eyes:'#dd6622',ribbon:'#cc7700'},
    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 6v5c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6z"/></svg>',
    stats:{speed:115,hp:150,maxHp:150,damage:25,attackInterval:0.6,critChance:0.03,critMult:1.5,bulletSpeed:250,pierce:2,regen:1,pickupRange:70,bulletCount:1,bulletLife:0.18,splashRadius:0,armor:0,lifeSteal:0},
    preferred:['damage','maxHp','regen','armor','pierce'],
    preferredWpn:['orbital','frostNova']
  },
  mage: {
    name:'Mage', style:'MAGE', desc:'Magic orbs that explode on impact',
    color:'#8855ff', outfit:{hair:'#6644cc',dress:'#8855ff',shoes:'#332266',eyes:'#aa44ff',ribbon:'#6633dd'},
    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16.8 5.6 21.2l2.4-7.2-6-4.8h7.6z"/></svg>',
    stats:{speed:125,hp:80,maxHp:80,damage:12,attackInterval:0.55,critChance:0.05,critMult:1.5,bulletSpeed:280,pierce:0,regen:0,pickupRange:70,bulletCount:1,bulletLife:1.2,splashRadius:55,armor:0,lifeSteal:0},
    preferred:['splash','atkSpeed','damage','critChance','multishot'],
    preferredWpn:['lightning','frostNova']
  },
  marksman: {
    name:'Marksman', style:'MARKSMAN', desc:'Long-range precision crits',
    color:'#00ccff', outfit:{hair:'#5599bb',dress:'#2299cc',shoes:'#446677',eyes:'#00bbff',ribbon:'#0088aa'},
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>',
    stats:{speed:120,hp:70,maxHp:70,damage:15,attackInterval:0.45,critChance:0.15,critMult:2.0,bulletSpeed:500,pierce:0,regen:0,pickupRange:70,bulletCount:1,bulletLife:2.2,splashRadius:0,armor:0,lifeSteal:0},
    preferred:['critChance','critMult','damage','bulletSpeed','multishot'],
    preferredWpn:['homing','lightning']
  },
  rogue: {
    name:'Rogue', style:'SPEED', desc:'Lightning-fast daggers and movement',
    color:'#44ff88', outfit:{hair:'#339966',dress:'#22cc66',shoes:'#226644',eyes:'#33ffaa',ribbon:'#22aa55'},
    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2l12 10-12 10V14H2v-4h4z"/></svg>',
    stats:{speed:195,hp:65,maxHp:65,damage:7,attackInterval:0.18,critChance:0.08,critMult:1.5,bulletSpeed:400,pierce:0,regen:0,pickupRange:90,bulletCount:1,bulletLife:0.9,splashRadius:0,armor:0,lifeSteal:0},
    preferred:['speed','atkSpeed','multishot','lifeSteal','magnet'],
    preferredWpn:['fireTrail','orbital']
  },
  witch: {
    name:'Witch', style:'AOE', desc:'Piercing orbs with devastating splash',
    color:'#cc44ff', outfit:{hair:'#772299',dress:'#9933cc',shoes:'#331144',eyes:'#dd55ff',ribbon:'#aa22dd'},
    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0 0 14 5 5 0 0 1 0 10 10 10 0 0 0 0-20 3 3 0 0 1 0-4z"/></svg>',
    stats:{speed:110,hp:85,maxHp:85,damage:18,attackInterval:0.85,critChance:0.05,critMult:1.5,bulletSpeed:160,pierce:99,regen:0,pickupRange:70,bulletCount:1,bulletLife:2.5,splashRadius:75,armor:0,lifeSteal:0},
    preferred:['splash','damage','atkSpeed','regen','armor'],
    preferredWpn:['frostNova','lightning']
  }
};

// ─── Enemy types ───
const ETYPES = {
  slime:{radius:12,speedMult:1.0,hpMult:1.0,damage:10,xp:10,color:'#44dd66',colorDark:'#1a8833',deathColor:'#44ee66',indicator:'rgba(68,221,102,0.5)'},
  bat:{radius:10,speedMult:1.6,hpMult:0.55,damage:8,xp:12,color:'#8855dd',colorDark:'#553399',deathColor:'#9966ee',indicator:'rgba(136,85,221,0.5)'},
  skeleton:{radius:14,speedMult:0.85,hpMult:3.0,damage:15,xp:20,color:'#dddccc',colorDark:'#999888',deathColor:'#eeeedd',indicator:'rgba(221,221,204,0.5)'},
  demon:{radius:22,speedMult:0.6,hpMult:10.0,damage:22,xp:40,color:'#dd3322',colorDark:'#881811',deathColor:'#ff5533',indicator:'rgba(221,51,34,0.55)'},
  boss:{radius:36,speedMult:0.4,hpMult:100.0,damage:30,xp:200,color:'#ff1100',colorDark:'#660500',deathColor:'#ff6644',indicator:'rgba(255,17,0,0.7)'}
};
function pickEnemyType(){const t=gameTime,r=Math.random();if(t<30)return'slime';if(t<60)return r<0.55?'slime':'bat';if(t<90)return r<0.25?'slime':r<0.50?'bat':'skeleton';return r<0.15?'slime':r<0.35?'bat':r<0.65?'skeleton':'demon';}

// ─── Buffs (stat upgrades) ───
const BUFFS = [
  {id:'atkSpeed',name:'Swift Trigger',desc:'Attack speed +15%',rarity:'common',color:COL.cyan,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2L3 14h8l-1 8 10-12h-8z"/></svg>',
    apply:p=>{p.attackInterval*=0.85}},
  {id:'damage',name:'Power Shot',desc:'Damage +5',rarity:'common',color:COL.red,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    apply:p=>{p.damage+=5}},
  {id:'critChance',name:'Keen Eye',desc:'Crit chance +8%',rarity:'uncommon',color:COL.gold,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>',

// ─── Weapon helpers (infinite scaling) ───
function getWpnCfg(wid,lvl){
  const w=WEAPONS[wid];
  let cfg;
  if(lvl<=3) cfg={...w.levels[lvl-1]};
  else{
    const b=w.levels[2],n=lvl-3;
    switch(wid){
      case'orbital':cfg={blades:Math.min(10,b.blades+Math.floor(n/2)),damage:b.damage+n*6,radius:b.radius+n*5,speed:b.speed+n*0.15};break;
      case'lightning':cfg={damage:b.damage+n*8,interval:Math.max(0.5,b.interval-n*0.1),chains:Math.min(8,b.chains+n)};break;
      case'fireTrail':cfg={damage:b.damage+n*5,radius:b.radius+n*3,duration:Math.min(8,b.duration+n*0.3)};break;
      case'frostNova':cfg={damage:b.damage+n*8,radius:b.radius+n*15,slowPct:Math.min(0.85,b.slowPct+n*0.02),slowDur:Math.min(6,b.slowDur+n*0.3),interval:Math.max(1.0,b.interval-n*0.15)};break;
      case'homing':cfg={count:Math.min(8,b.count+Math.floor(n/2)),damage:b.damage+n*8,interval:Math.max(0.5,b.interval-n*0.08),splash:b.splash+n*8};break;
    }
  }
  if(player&&player.evolvedWeapons&&player.evolvedWeapons[wid]){
    switch(wid){
      case'orbital':cfg.damage=Math.round(cfg.damage*1.5);cfg.speed*=1.4;cfg.evoSplash=25+Math.floor((lvl-1)*3);break;
      case'lightning':cfg.damage=Math.round(cfg.damage*2);cfg.chains+=3;break;
      case'fireTrail':cfg.damage=Math.round(cfg.damage*1.8);cfg.radius=Math.round(cfg.radius*1.5);break;
      case'frostNova':cfg.slowPct=1.0;cfg.damage=Math.round(cfg.damage*1.5);break;
      case'homing':cfg.count=Math.min(12,cfg.count*2);cfg.splash=Math.max(50,cfg.splash);cfg.interval*=0.7;break;
    }
  }
  if(player&&player.synBonus){
    const sb=player.synBonus;
    if(wid==='orbital'){if(sb.orbDmg)cfg.damage=Math.round(cfg.damage*sb.orbDmg);if(sb.orbBlades)cfg.blades+=sb.orbBlades;}
    if(wid==='lightning'){if(sb.ltDmg)cfg.damage=Math.round(cfg.damage*sb.ltDmg);if(sb.ltChains)cfg.chains+=sb.ltChains;}
    if(wid==='fireTrail'){if(sb.fireDmg)cfg.damage=Math.round(cfg.damage*sb.fireDmg);if(sb.fireDur)cfg.duration*=sb.fireDur;}
    if(wid==='frostNova'){if(sb.frostDmg)cfg.damage=Math.round(cfg.damage*sb.frostDmg);}
    if(wid==='homing'){if(sb.homCount)cfg.count+=sb.homCount;if(sb.homSplash)cfg.splash+=sb.homSplash;}
  }
  return cfg;
}
function getWpnDesc(wid,lvl){
  const c=getWpnCfg(wid,lvl);
  switch(wid){
    case'orbital':return c.blades+' blades, '+c.damage+' dmg';
    case'lightning':return c.damage+' dmg, '+c.chains+' chains, '+c.interval.toFixed(1)+'s';
    case'fireTrail':return c.damage+' dmg, r'+c.radius+', '+c.duration.toFixed(1)+'s';
    case'frostNova':return c.damage+' dmg, '+Math.round(c.slowPct*100)+'% slow, '+c.interval.toFixed(1)+'s';
    case'homing':return c.count+' missiles, '+c.damage+' dmg'+(c.splash>0?', splash':'');
  }
}

// ─── Enemy death helper ───
function onEnemyDeath(e,idx){
  spawnParticles(e.x,e.y,e.type==='boss'?40:16,ETYPES[e.type].deathColor);
  const oc=e.type==='boss'?8:e.type==='demon'?4:e.type==='skeleton'?2:1;
  for(let k=0;k<oc;k++) xpOrbs.push({x:e.x+(Math.random()-0.5)*30,y:e.y+(Math.random()-0.5)*30,value:Math.ceil(e.xpValue/oc),pulse:Math.random()*Math.PI*2});
  if(e.type==='boss'){bossRef=null;$('bosshp').hidden=true;xpVacuumActive=true;}
  if(player.lifeSteal>0) player.hp=Math.min(player.maxHp,player.hp+player.lifeSteal);
  if(player.evolvedWeapons.frostNova&&e.slowTimer>0){
    for(const se of enemies){if(se===e||dist(e,se)>60)continue;se.hp-=15;se.hitFlash=0.06;totalDamage+=15;se.slowTimer=1.5;se.slowFactor=0;}
    frostNovaRings.push({x:e.x,y:e.y,maxR:40,life:0.3,maxLife:0.3});
    spawnParticles(e.x,e.y,8,'#88ccff');
  }
  enemies.splice(idx,1);kills++;
}
function cleanupDeadEnemies(){
  for(let j=enemies.length-1;j>=0;j--){if(enemies[j].hp<=0)onEnemyDeath(enemies[j],j);}
}

// ─── Update ───
function updatePlayer(dt){
  let sdx=0,sdy=0;
  if(keys['w']||keys['arrowup'])sdy-=1;if(keys['s']||keys['arrowdown'])sdy+=1;
  if(keys['a']||keys['arrowleft'])sdx-=1;if(keys['d']||keys['arrowright'])sdx+=1;
  const slen=Math.sqrt(sdx*sdx+sdy*sdy);
  player.moving=slen>0;
  if(slen>0){
    sdx/=slen;sdy/=slen;
    const wd=toWorld(sdx,sdy),wlen=Math.sqrt(wd.x*wd.x+wd.y*wd.y);
    if(wlen>0){player.x+=(wd.x/wlen)*player.speed*1.4*dt;player.y+=(wd.y/wlen)*player.speed*1.4*dt;player.facingAngle=Math.atan2(wd.y,wd.x);if(Math.abs(sdx)>0.1)player.facingRight=sdx>0;}
    player.walkTime+=dt*10;
  }
  if(player.invTimer>0)player.invTimer-=dt;
  if(player.regen>0)player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);
  player.attackTimer-=dt;
  if(player.attackTimer<=0&&enemies.length>0){
    let nearest=null,nd=Infinity;
    for(const e of enemies){const d=dist(player,e);if(d<nd){nd=d;nearest=e;}}
    if(nearest&&nd<600){const st=toScreen(nearest.x-player.x,nearest.y-player.y);player.facingRight=st.x>=0;shootAt(nearest);player.attackTimer=player.attackInterval;}
  }
}

function shootAt(target){
  const angle=angleBetween(player,target),spread=player.bulletCount>1?0.15:0;
  for(let i=0;i<player.bulletCount;i++){
    let a=angle;if(player.bulletCount>1)a=angle+spread*(i-(player.bulletCount-1)/2);
    const isCrit=Math.random()<player.critChance,dmg=isCrit?Math.round(player.damage*player.critMult):player.damage;
    bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*player.bulletSpeed,vy:Math.sin(a)*player.bulletSpeed,
      damage:dmg,crit:isCrit,pierce:player.pierce,life:player.bulletLife,hitSet:new Set(),charType:selectedCharId});
  }
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];if(b.hitSet.has(e))continue;
      if(dist(b,e)<e.radius+6){
        e.hp-=b.damage;e.hitFlash=0.1;totalDamage+=b.damage;
        spawnParticles(e.x,e.y,b.crit?8:4,b.crit?COL.gold:'#ff8866');
        addFloatingText(e.x,e.y,b.damage,b.crit);
        const hitX=e.x,hitY=e.y;
        b.hitSet.add(e);
        if(e.hp<=0){onEnemyDeath(e,j);}
        if(player.splashRadius>0){
          const sDmg=Math.round(b.damage*0.5);
          for(let k=enemies.length-1;k>=0;k--){
            const se=enemies[k];if(b.hitSet.has(se))continue;
            if(dist({x:hitX,y:hitY},se)<player.splashRadius){
              se.hp-=sDmg;se.hitFlash=0.06;totalDamage+=sDmg;b.hitSet.add(se);
              addFloatingText(se.x,se.y,sDmg,false);
              if(se.hp<=0){onEnemyDeath(se,k);}
            }
          }
        }
        if(b.pierce<=0){bullets.splice(i,1);break;}
        b.pierce--;
      }
    }
  }
}

function updateEnemies(dt){
  for(const e of enemies){
    if(e.slowTimer>0)e.slowTimer-=dt;
    if(e.orbHitTimer>0)e.orbHitTimer-=dt;
    const slow=e.slowTimer>0?e.slowFactor:1;
    const a=angleBetween(e,player);e.x+=Math.cos(a)*e.speed*slow*dt;e.y+=Math.sin(a)*e.speed*slow*dt;
    e.animTime+=dt;if(e.hitFlash>0)e.hitFlash-=dt;
    if(player.invTimer<=0&&dist(e,player)<e.radius+14){
      const dmg=Math.round(e.damage*(1-player.armor));
      player.hp-=dmg;player.invTimer=0.5;shakeTimer=0.2;shakeIntensity=6;
      spawnParticles(player.x,player.y,6,COL.red);
      if(player.hp<=0){player.hp=0;die();return;}
    }
  }
}

function updateXpOrbs(dt){
  for(let i=xpOrbs.length-1;i>=0;i--){
    const o=xpOrbs[i];o.pulse+=dt*3;const d=dist(o,player);
    if(xpVacuumActive||d<player.pickupRange){const a=angleBetween(o,player),pull=xpVacuumActive?600:280+(player.pickupRange-d)*5;o.x+=Math.cos(a)*pull*dt;o.y+=Math.sin(a)*pull*dt;}
    if(d<16){player.xp+=o.value;xpOrbs.splice(i,1);
      if(player.xp>=player.xpToLevel){player.xp-=player.xpToLevel;player.level++;player.xpToLevel=Math.floor(player.xpToLevel*1.2);if(!xpVacuumActive)showLevelUp();}
    }
  }
  if(xpVacuumActive&&xpOrbs.length===0)win();
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=0.95;p.vy*=0.95;if(p.life<=0)particles.splice(i,1);}
  for(let i=floatingTexts.length-1;i>=0;i--){const f=floatingTexts[i];f.wy-=50*dt;f.life-=dt;if(f.life<=0)floatingTexts.splice(i,1);}
  for(let i=lightningBolts.length-1;i>=0;i--){lightningBolts[i].life-=dt;if(lightningBolts[i].life<=0)lightningBolts.splice(i,1);}
  for(let i=frostNovaRings.length-1;i>=0;i--){frostNovaRings[i].life-=dt;if(frostNovaRings[i].life<=0)frostNovaRings.splice(i,1);}
}
function spawnParticles(wx,wy,count,color){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*120;particles.push({x:wx,y:wy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.3,maxLife:0.6,color,size:2+Math.random()*2});}}
function addFloatingText(wx,wy,val,crit){floatingTexts.push({wx:wx+(Math.random()-0.5)*10,wy:wy-10,text:String(val),crit,life:0.8,maxLife:0.8});}

// ─── Weapon updates ───
function updateWeapons(dt){
  if(player.weapons.orbital)updateOrbital(dt);
  if(player.weapons.lightning)updateLightning(dt);
  if(player.weapons.fireTrail)updateFireTrailWpn(dt);
  if(player.weapons.frostNova)updateFrostNova(dt);
  if(player.weapons.homing)updateHoming(dt);
}

function updateOrbital(dt){
  const cfg=getWpnCfg('orbital',player.weapons.orbital);
  orbitalAngle+=cfg.speed*dt;
  for(let i=0;i<cfg.blades;i++){
    const a=orbitalAngle+Math.PI*2*i/cfg.blades;
    const bx=player.x+Math.cos(a)*cfg.radius, by=player.y+Math.sin(a)*cfg.radius;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(e.orbHitTimer>0)continue;
      if(dist({x:bx,y:by},e)<e.radius+10){
        e.hp-=cfg.damage;e.hitFlash=0.08;e.orbHitTimer=0.5;
        totalDamage+=cfg.damage;
        spawnParticles(bx,by,4,'#ffcc44');
        addFloatingText(e.x,e.y,cfg.damage,false);
        if(player.synBonus.orbSlow){e.slowTimer=1.5;e.slowFactor=0.75;}
        if(cfg.evoSplash){
          for(let k=enemies.length-1;k>=0;k--){
            const se=enemies[k];if(se===e||se.orbHitTimer>0)continue;
            if(dist({x:bx,y:by},se)<cfg.evoSplash){
              const sd=Math.round(cfg.damage*0.4);se.hp-=sd;se.hitFlash=0.06;totalDamage+=sd;
              if(se.hp<=0)onEnemyDeath(se,k);
            }
          }
        }
        if(e.hp<=0)onEnemyDeath(e,j);
      }
    }
  }
}

function updateLightning(dt){
  const cfg=getWpnCfg('lightning',player.weapons.lightning);
  weaponTimers.lightning-=dt;
  if(weaponTimers.lightning>0||enemies.length===0)return;
  weaponTimers.lightning=cfg.interval;
  let target=null,minD=350;
  for(const e of enemies){const d=dist(player,e);if(d<minD){minD=d;target=e;}}
  if(!target)return;
  const pts=[{x:player.x,y:player.y}];
  const slowMult=player.synBonus.ltVsSlow&&target.slowTimer>0?player.synBonus.ltVsSlow:1;
  const mainDmg=Math.round(cfg.damage*slowMult);
  target.hp-=mainDmg;target.hitFlash=0.12;totalDamage+=mainDmg;
  addFloatingText(target.x,target.y,mainDmg,slowMult>1);
  pts.push({x:target.x,y:target.y});
  const hit=new Set([target]);
  let cur=target;
  for(let c=0;c<cfg.chains;c++){
    let next=null,nd=160;
    for(const e of enemies){if(hit.has(e))continue;const d=dist(cur,e);if(d<nd){nd=d;next=e;}}
    if(!next)break;
    hit.add(next);
    const csm=player.synBonus.ltVsSlow&&next.slowTimer>0?player.synBonus.ltVsSlow:1;
    const cd=Math.round(cfg.damage*0.5*csm);
    next.hp-=cd;next.hitFlash=0.1;totalDamage+=cd;
    addFloatingText(next.x,next.y,cd,csm>1);
    pts.push({x:next.x,y:next.y});
    cur=next;
  }
  cleanupDeadEnemies();
  const zigzag=[];
  for(let i=0;i<pts.length-1;i++){
    zigzag.push(pts[i]);
    const segs=3;
    for(let s=1;s<segs;s++){
      const t=s/segs;
      zigzag.push({x:pts[i].x+(pts[i+1].x-pts[i].x)*t+(Math.random()-0.5)*28,
                    y:pts[i].y+(pts[i+1].y-pts[i].y)*t+(Math.random()-0.5)*28});
    }
  }
  zigzag.push(pts[pts.length-1]);
  lightningBolts.push({pts:zigzag,life:0.25,maxLife:0.25});
}

function updateFireTrailWpn(dt){
  const cfg=getWpnCfg('fireTrail',player.weapons.fireTrail);
  weaponTimers.fireTrail-=dt;
  if(player.moving&&weaponTimers.fireTrail<=0){
    firePatches.push({x:player.x,y:player.y,life:cfg.duration,maxLife:cfg.duration,radius:cfg.radius,damage:cfg.damage,tickTimer:0});
    weaponTimers.fireTrail=0.15;
  }
  for(let i=firePatches.length-1;i>=0;i--){
    const p=firePatches[i];p.life-=dt;
    if(p.life<=0){firePatches.splice(i,1);continue;}
    p.tickTimer-=dt;
    if(p.tickTimer<=0){
      p.tickTimer=0.3;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(dist(p,e)<p.radius+e.radius){
          const fm=player.synBonus.fireVsSlow&&e.slowTimer>0?player.synBonus.fireVsSlow:1;
          const fd=Math.round(p.damage*fm);
          e.hp-=fd;e.hitFlash=0.04;totalDamage+=fd;
          if(e.hp<=0)onEnemyDeath(e,j);
        }
      }
    }
  }
}

function updateFrostNova(dt){
  const cfg=getWpnCfg('frostNova',player.weapons.frostNova);
  weaponTimers.frostNova-=dt;
  if(weaponTimers.frostNova>0)return;
  weaponTimers.frostNova=cfg.interval;
  for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(dist(player,e)<cfg.radius){
      e.hp-=cfg.damage;e.hitFlash=0.1;e.slowTimer=cfg.slowDur;e.slowFactor=1-cfg.slowPct;
      totalDamage+=cfg.damage;
      addFloatingText(e.x,e.y,cfg.damage,false);
      if(e.hp<=0)onEnemyDeath(e,j);
    }
  }
  frostNovaRings.push({x:player.x,y:player.y,maxR:cfg.radius*0.7,life:0.45,maxLife:0.45});
  spawnParticles(player.x,player.y,10,'#88ccff');
}

function updateHoming(dt){
  const cfg=getWpnCfg('homing',player.weapons.homing);
  weaponTimers.homing-=dt;
  if(weaponTimers.homing<=0&&enemies.length>0){
    weaponTimers.homing=cfg.interval;
    for(let i=0;i<cfg.count;i++){
      const t=enemies[Math.floor(Math.random()*enemies.length)];
      const a=Math.random()*Math.PI*2;
      homingMissiles.push({x:player.x+Math.cos(a)*15,y:player.y+Math.sin(a)*15,angle:a,speed:220,damage:cfg.damage,target:t,life:4,splash:cfg.splash});
    }
  }
  for(let i=homingMissiles.length-1;i>=0;i--){
    const m=homingMissiles[i];m.life-=dt;
    if(m.life<=0){homingMissiles.splice(i,1);continue;}
    if(!enemies.includes(m.target))m.target=enemies.length>0?enemies[Math.floor(Math.random()*enemies.length)]:null;
    if(m.target){
      const ta=angleBetween(m,m.target);
      let da=ta-m.angle;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      m.angle+=da*Math.min(1,8*dt);
    }
    m.x+=Math.cos(m.angle)*m.speed*dt;m.y+=Math.sin(m.angle)*m.speed*dt;
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(dist(m,e)<e.radius+8){
        e.hp-=m.damage;e.hitFlash=0.1;totalDamage+=m.damage;
        spawnParticles(e.x,e.y,6,'#ff8844');addFloatingText(e.x,e.y,m.damage,false);
        if(player.synBonus.homSlow){e.slowTimer=2;e.slowFactor=0.7;}
        if(m.splash>0){
          for(let k=enemies.length-1;k>=0;k--){
            if(k===j)continue;const se=enemies[k];
            if(dist(m,se)<m.splash){const sd=Math.round(m.damage*0.5);se.hp-=sd;se.hitFlash=0.06;totalDamage+=sd;}
          }
        }
        if(player.synBonus.homFire){
          const fcfg=player.weapons.fireTrail?getWpnCfg('fireTrail',player.weapons.fireTrail):null;
          const fr=fcfg?fcfg.radius:18,fd=fcfg?fcfg.damage:8,fdr=fcfg?fcfg.duration*0.5:1.5;
          firePatches.push({x:m.x,y:m.y,life:fdr,maxLife:fdr,radius:fr,damage:fd,tickTimer:0});
        }
        cleanupDeadEnemies();
        homingMissiles.splice(i,1);hit=true;break;
      }
    }
  }
}

// ─── Synergy & Evolution helpers ───
function updateSynergy(){
  const prevSyn=player.synergy;
  player.synergy=null;player.synBonus={};
  const owned=Object.keys(player.weapons).filter(k=>player.weapons[k]>0).sort();
  if(owned.length!==2)return;
  const key=owned[0]+'+'+owned[1];
  const syn=SYNERGIES[key];
  if(!syn)return;
  player.synergy=key;
  switch(key){
    case'fireTrail+orbital':   player.synBonus={orbDmg:1.3,fireDmg:1.5};break;
    case'lightning+orbital':   player.synBonus={orbDmg:1.3,ltChains:2};break;
    case'frostNova+orbital':   player.synBonus={orbSlow:true};break;
    case'homing+orbital':      player.synBonus={orbBlades:2,homCount:1};break;
    case'fireTrail+lightning': player.synBonus={ltDmg:1.5,fireDmg:1.3};break;
    case'frostNova+lightning': player.synBonus={ltVsSlow:2.0};break;
    case'homing+lightning':    player.synBonus={ltChains:2,homSplash:25};break;
    case'fireTrail+frostNova': player.synBonus={fireVsSlow:2.0};break;
    case'fireTrail+homing':    player.synBonus={homFire:true,fireDur:1.3};break;
    case'frostNova+homing':    player.synBonus={homSlow:true,frostDmg:1.2};break;
  }
  if(!prevSyn&&player.synergy) showNotification('SYNERGY: '+syn.name,syn.color);
}

function checkEvolution(){
  if(!player)return null;
  for(const[wid,evo]of Object.entries(EVOLUTIONS)){
    if(!player.weapons[wid]||player.weapons[wid]<evo.lvl)continue;
    if(player.evolvedWeapons[wid])continue;
    if((player[evo.req.stat]||0)>=evo.req.val) return wid;
  }
  return null;
}

function showNotification(text,color){
  const el=$('notification');
  $('notif-text').textContent=text;
  el.style.color=color;el.style.borderColor=color;
  el.style.boxShadow='0 0 20px '+color+'44';
  el.hidden=false;notifTimer=2.5;
}

// ─── Level up (stat + weapon cards, weighted) ───
function showLevelUp(){
  state='levelup';
  const charPrefs=CHARS[selectedCharId].preferred;
  const charWpnPrefs=CHARS[selectedCharId].preferredWpn;
  const pool=[];
  BUFFS.forEach(b=>{
    const w=charPrefs.includes(b.id)?3:1;
    pool.push({card:b,weight:w});
  });
  const evoWpn=checkEvolution();
  if(evoWpn){
    const evo=EVOLUTIONS[evoWpn];
    const evoCard={
      id:'evo_'+evoWpn,name:evo.name,desc:evo.desc+' ('+evo.req.label+')',
      rarity:'legendary',color:evo.color,icon:evo.icon,isWeapon:true,isEvolution:true,weaponLevel:'EVO',
      apply:(function(wid){return function(p){p.evolvedWeapons[wid]=true;updateSynergy();showNotification('EVOLVED: '+EVOLUTIONS[wid].name,EVOLUTIONS[wid].color);};})(evoWpn)
    };
    pool.push({card:evoCard,weight:999});
  }
  const ownedWpns=Object.keys(player.weapons).filter(k=>player.weapons[k]>0);
  const showWeapons=Math.random()<0.4;
  if(showWeapons){
    for(const[wid,w]of Object.entries(WEAPONS)){
      const cur=player.weapons[wid]||0;
      if(cur===0&&ownedWpns.length>=2)continue;
      const next=cur+1;
      const card={
        id:'wpn_'+wid,name:w.name+(next>1?' LV'+next:''),
        desc:next<=3?w.desc[next-1]:getWpnDesc(wid,next),
        rarity:cur===0?'rare':'epic',color:w.color,icon:w.icon,
        isWeapon:true,weaponLevel:next,
        apply:(function(wid,next){return function(p){p.weapons[wid]=next;updateSynergy();};})(wid,next)
      };
      const wt=charWpnPrefs.includes(wid)?3:1;
      pool.push({card,weight:wt});
    }
  }
  const chosen=[],used=new Set();
  for(let i=0;i<3;i++){
    let totalW=0;
    for(const p of pool){if(!used.has(p.card.id))totalW+=p.weight;}
    if(totalW===0)break;
    let r=Math.random()*totalW;
    let pick=null;
    for(const p of pool){
      if(used.has(p.card.id))continue;
      r-=p.weight;if(r<=0){pick=p.card;break;}
    }
    if(!pick)break;
    chosen.push(pick);used.add(pick.id);
  }
  const container=$('card-container');container.innerHTML='';
  chosen.forEach(c=>{
    const div=document.createElement('div');div.className='card';div.dataset.rarity=c.rarity;
    let badge='';
    if(c.isEvolution) badge='<div class="card-evo-badge">★ EVOLUTION</div>';
    else if(c.isWeapon) badge='<div class="card-wpn-badge">WEAPON'+(c.weaponLevel>1?' LV'+c.weaponLevel:'')+'</div>';
    div.innerHTML='<div class="card-icon" style="background:'+c.color+'22;color:'+c.color+'">'+c.icon+'</div><div class="card-name">'+c.name+'</div>'+badge+'<div class="card-desc">'+c.desc+'</div><div class="card-rarity">'+c.rarity+'</div>';
    div.addEventListener('click',()=>{c.apply(player);$('levelup').hidden=true;state='playing';});
    container.appendChild(div);
  });
  $('levelup').hidden=false;
}

function showStats(){
  const p=player,stats=[['Damage',p.damage],['Attack Speed',(1/p.attackInterval).toFixed(2)+'/s'],['Crit Chance',Math.round(p.critChance*100)+'%'],['Crit Multiplier',p.critMult.toFixed(1)+'x'],
    ['Bullets',p.bulletCount],['Pierce',p.pierce],['Bullet Speed',Math.round(p.bulletSpeed)],['Splash Radius',Math.round(p.splashRadius)],
    ['Move Speed',Math.round(p.speed*1.4)],['Max HP',p.maxHp],['HP Regen',p.regen+'/s'],['Armor',Math.round(p.armor*100)+'%'],
    ['Life Steal',p.lifeSteal+'/kill'],['Pickup Range',Math.round(p.pickupRange)]];
  $('stats-grid').innerHTML=stats.map(s=>'<div class="stat-row"><span class="stat-name">'+s[0]+'</span><span class="stat-value">'+s[1]+'</span></div>').join('');
  const wl=$('weapons-list');
  const owned=Object.entries(p.weapons).filter(([k,v])=>v>0);

      return '<div class="wpn-row"><span class="wpn-name" style="color:'+color+'">'+name+evoTag+'</span><span class="wpn-lvl">LV '+v+'</span></div>'+req;

function endStats(prefix){
  $(prefix+'-level').textContent=player.level;$(prefix+'-kills').textContent=kills;
  const m=Math.floor(gameTime/60),s=Math.floor(gameTime%60);
  $(prefix+'-time').textContent=m+':'+String(s).padStart(2,'0');

}
function win(){state='won';$('hud').hidden=true;$('bosshp').hidden=true;endStats('ws');$('winscreen').hidden=false;shakeTimer=0.4;shakeIntensity=8;}
function die(){state='dead';$('hud').hidden=true;$('bosshp').hidden=true;endStats('ds');$('deathscreen').hidden=false;}

// ─── Camera & rendering ───
function updateCamera(dt){const t=toScreen(player.x,player.y);camera.x+=(t.x-camera.x)*Math.min(1,6*dt);camera.y+=(t.y-camera.y)*Math.min(1,6*dt);}
function worldToCanvas(wx,wy){const s=toScreen(wx,wy);let ox=0,oy=0;if(shakeTimer>0){ox=(Math.random()-0.5)*shakeIntensity*2;oy=(Math.random()-0.5)*shakeIntensity*2;}return{x:s.x-camera.x+W()/2+ox,y:s.y-camera.y+H()/2+oy};}

function drawGrid(){
  const G=64,range=Math.ceil(Math.max(W(),H())/G)+6,cx=Math.floor(player.x/G)*G,cy=Math.floor(player.y/G)*G;
  ctx.strokeStyle='rgba(22,22,50,0.6)';ctx.lineWidth=0.5;
  for(let i=-range;i<=range;i++){
    let wx=cx+i*G,p1=worldToCanvas(wx,cy-range*G),p2=worldToCanvas(wx,cy+range*G);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    let wy=cy+i*G,q1=worldToCanvas(cx-range*G,wy),q2=worldToCanvas(cx+range*G,wy);ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.stroke();
  }
}

// ─── Chibi girl ───
function drawChibiGirl(){
  if(player.invTimer>0&&Math.floor(player.invTimer*10)%2===0)return;
  const p=worldToCanvas(player.x,player.y),x=p.x,fy=p.y;
  const bob=player.moving?Math.sin(player.walkTime)*2:0;

  const o=CHARS[selectedCharId].outfit,cc=CHARS[selectedCharId].color;
  ctx.save();
  if(!player.facingRight){ctx.translate(x,0);ctx.scale(-1,1);ctx.translate(-x,0);}
  const by=fy+bob;
  // Char glow
  const cr=parseInt(cc.slice(1,3),16),cg=parseInt(cc.slice(3,5),16),cb=parseInt(cc.slice(5,7),16);
  ctx.fillStyle='rgba('+cr+','+cg+','+cb+',0.07)';
  ctx.beginPath();ctx.arc(x,fy-12,24,0,Math.PI*2);ctx.fill();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,fy+2,13,5,0,0,Math.PI*2);ctx.fill();
  // Hair tails (behind body)
  ctx.fillStyle=o.hair;
  ctx.beginPath();ctx.ellipse(x-8,by-19,4.5,11,-0.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+8,by-19,4.5,11,0.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath();ctx.ellipse(x-7,by-22,1.5,6,-0.15,0,Math.PI*2);ctx.fill();

function drawSlime(e){
  const p=worldToCanvas(e.x,e.y),x=p.x,fy=p.y,r=e.radius;
  const sq=1+Math.sin(e.animTime*5)*0.15,rw=r*(1+(1-sq)*0.4),rh=r*sq*0.72;

    ctx.fillStyle='#2a9944';
    const dt1=Math.sin(e.animTime*3)*2,dt2=Math.cos(e.animTime*2.5)*1.5;

  // Outline
  ctx.strokeStyle='rgba(15,80,30,0.5)';ctx.lineWidth=1.2;ctx.stroke();

    ctx.beginPath();ctx.ellipse(x-rw*0.25,by-rh*0.5,rw*0.25,rh*0.2,-0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.beginPath();ctx.ellipse(x+rw*0.1,by-rh*0.35,rw*0.12,rh*0.1,0.2,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#0a2210';
    ctx.beginPath();ctx.ellipse(x-r*0.28,by-rh*0.1,2,2.8,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.28,by-rh*0.1,2,2.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';

  }

function drawBat(e){

  }

function drawSkeleton(e){
  const p=worldToCanvas(e.x,e.y),x=p.x,fy=p.y,r=e.radius;
  const sw=Math.sin(e.animTime*4)*1.5;
  const bx=x+sw,wh=e.hitFlash>0;
  const bone=wh?'#fff':'#dddccc',boneDark=wh?'#eee':'#aaa99a',joint=wh?'#fff':'#bbbbaa';
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,fy+2,r*1,r*0.32,0,0,Math.PI*2);ctx.fill();
  // Legs with segments
  const legAnim=Math.sin(e.animTime*4)*0.8;
  ctx.strokeStyle=bone;ctx.lineWidth=2.5;ctx.lineCap='round';
  // Left leg
  ctx.beginPath();ctx.moveTo(bx-2,fy-6);ctx.lineTo(bx-3,fy-2+legAnim);ctx.lineTo(bx-2,fy+1+legAnim*0.5);ctx.stroke();
  // Right leg
  ctx.beginPath();ctx.moveTo(bx+2,fy-6);ctx.lineTo(bx+3,fy-2-legAnim);ctx.lineTo(bx+2,fy+1-legAnim*0.5);ctx.stroke();
  // Knee joints
  ctx.fillStyle=joint;
  ctx.beginPath();ctx.arc(bx-3,fy-2+legAnim,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+3,fy-2-legAnim,1.5,0,Math.PI*2);ctx.fill();
  // Feet
  ctx.fillStyle=bone;
  ctx.beginPath();ctx.ellipse(bx-2,fy+1.5+legAnim*0.5,3,1.2,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bx+2,fy+1.5-legAnim*0.5,3,1.2,0,0,Math.PI*2);ctx.fill();
  // Spine
  ctx.strokeStyle=bone;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx,fy-6);ctx.lineTo(bx,fy-16);ctx.stroke();
  // Ribcage
  ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){
    const ry=fy-9-i*2.5,spread=4-i*0.5;
    ctx.beginPath();ctx.moveTo(bx,ry);ctx.quadraticCurveTo(bx-spread,ry+1,bx-spread-1,ry-0.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,ry);ctx.quadraticCurveTo(bx+spread,ry+1,bx+spread+1,ry-0.5);ctx.stroke();
  }
  // Hip joints
  ctx.fillStyle=joint;
  ctx.beginPath();ctx.arc(bx-2,fy-6,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+2,fy-6,1.8,0,Math.PI*2);ctx.fill();
  // Arms
  const armAnim=Math.sin(e.animTime*3)*0.4;
  ctx.strokeStyle=bone;ctx.lineWidth=2;
  // Left arm
  ctx.beginPath();ctx.moveTo(bx-4,fy-14);ctx.lineTo(bx-8,fy-10+armAnim*2);ctx.lineTo(bx-6,fy-7+armAnim);ctx.stroke();
  // Right arm
  ctx.beginPath();ctx.moveTo(bx+4,fy-14);ctx.lineTo(bx+8,fy-10-armAnim*2);ctx.lineTo(bx+6,fy-7-armAnim);ctx.stroke();
  // Shoulder/elbow joints
  ctx.fillStyle=joint;
  ctx.beginPath();ctx.arc(bx-4,fy-14,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+4,fy-14,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx-8,fy-10+armAnim*2,1.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+8,fy-10-armAnim*2,1.3,0,Math.PI*2);ctx.fill();
  // Hands (bony)
  ctx.fillStyle=bone;
  ctx.beginPath();ctx.arc(bx-6,fy-7+armAnim,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+6,fy-7-armAnim,2,0,Math.PI*2);ctx.fill();
  // Skull
  ctx.fillStyle=bone;

function drawBullet(b){
  const p=worldToCanvas(b.x,b.y),a=Math.atan2(b.vy,b.vx),sd=toScreen(Math.cos(a),Math.sin(a)),sa=Math.atan2(sd.y,sd.x);
  const ct=b.charType;
  if(ct==='knight'){
    ctx.strokeStyle=b.crit?'#fff':'#ffaa33';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(p.x-Math.cos(sa)*6,p.y-Math.sin(sa)*6,12,sa-0.7,sa+0.7);ctx.stroke();ctx.lineCap='butt';
  } else if(ct==='mage'){
    ctx.fillStyle='rgba(136,85,255,0.2)';ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.crit?COL.gold:'#aa66ff';ctx.shadowColor='#8855ff';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  } else if(ct==='marksman'){
    ctx.strokeStyle=b.crit?'rgba(255,204,0,0.5)':'rgba(0,200,255,0.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-Math.cos(sa)*22,p.y-Math.sin(sa)*22);ctx.stroke();
    ctx.fillStyle=b.crit?COL.gold:'#00ccff';ctx.shadowColor=b.crit?COL.gold:'#00ccff';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  } else if(ct==='rogue'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(sa);
    ctx.fillStyle=b.crit?COL.gold:'#44ff88';
    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-3,-2.5);ctx.lineTo(-1,0);ctx.lineTo(-3,2.5);ctx.closePath();ctx.fill();
    ctx.restore();
  } else if(ct==='witch'){
    ctx.strokeStyle='rgba(180,60,255,0.25)';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-Math.cos(sa)*18,p.y-Math.sin(sa)*18);ctx.stroke();
    ctx.fillStyle='rgba(100,20,160,0.3)';ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.crit?COL.gold:'#cc44ff';ctx.shadowColor='#9922ee';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  } else {
    ctx.fillStyle=b.crit?COL.gold:'#ffaa44';ctx.shadowColor=b.crit?COL.gold:'#ff8800';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
}

    const p=worldToCanvas(r.x,r.y),progress=1-r.life/r.maxLife,cr=r.maxR*progress,al=r.life/r.maxLife;
    ctx.strokeStyle='rgba(136,200,255,'+(al*0.7)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,cr,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(200,235,255,'+(al*0.3)+')';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(p.x,p.y,cr+5,0,Math.PI*2);ctx.stroke();
  }
}

function drawOrbitalBlades(){
  if(!player.weapons.orbital)return;
  const cfg=getWpnCfg('orbital',player.weapons.orbital);
  for(let i=0;i<cfg.blades;i++){
    const a=orbitalAngle+Math.PI*2*i/cfg.blades;
    const bwx=player.x+Math.cos(a)*cfg.radius,bwy=player.y+Math.sin(a)*cfg.radius;
    const bp=worldToCanvas(bwx,bwy);
    ctx.save();ctx.translate(bp.x,bp.y);ctx.rotate(a+gameTime*6);
    ctx.fillStyle='#ffcc44';ctx.shadowColor='#ffaa00';ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(3,0);ctx.lineTo(0,10);ctx.lineTo(-3,0);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
}

function drawLightningBoltsLayer(){
  for(const bolt of lightningBolts){
    const al=bolt.life/bolt.maxLife;
    ctx.shadowColor='#44ccff';ctx.shadowBlur=12;
    ctx.strokeStyle='rgba(100,200,255,'+al+')';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<bolt.pts.length;i++){
      const p=worldToCanvas(bolt.pts[i].x,bolt.pts[i].y);
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(220,240,255,'+(al*0.8)+')';ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<bolt.pts.length;i++){
      const p=worldToCanvas(bolt.pts[i].x,bolt.pts[i].y);
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();ctx.shadowBlur=0;ctx.lineCap='butt';
  }
}

function drawHomingMissile(m){
  const p=worldToCanvas(m.x,m.y),sd=toScreen(Math.cos(m.angle),Math.sin(m.angle)),sa=Math.atan2(sd.y,sd.x);
  ctx.strokeStyle='rgba(255,136,68,0.3)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-Math.cos(sa)*14,p.y-Math.sin(sa)*14);ctx.stroke();
  ctx.fillStyle='#ff8844';ctx.shadowColor='#ff6622';ctx.shadowBlur=8;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(sa);
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-3);ctx.lineTo(-2,0);ctx.lineTo(-4,3);ctx.closePath();ctx.fill();
  ctx.restore();ctx.shadowBlur=0;
}

function drawXpOrb(o){const p=worldToCanvas(o.x,o.y),pu=1+Math.sin(o.pulse)*0.2,r=5*pu;ctx.fillStyle='rgba(0,255,136,0.12)';ctx.beginPath();ctx.arc(p.x,p.y,r*2.8,0,Math.PI*2);ctx.fill();ctx.shadowColor=COL.green;ctx.shadowBlur=10;ctx.fillStyle=COL.green;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
function drawParticlesLayer(){for(const p of particles){const sp=worldToCanvas(p.x,p.y),al=p.life/p.maxLife;ctx.globalAlpha=al;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sp.x,sp.y,p.size*al,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.textAlign='center';for(const f of floatingTexts){const sp=worldToCanvas(f.wx,f.wy);ctx.globalAlpha=f.life/f.maxLife;ctx.font=(f.crit?'700 16px':'600 13px')+' Orbitron, sans-serif';ctx.fillStyle=f.crit?COL.gold:'#fff';ctx.fillText(f.text,sp.x,sp.y);}ctx.globalAlpha=1;}
function drawOffscreenIndicators(){const mg=32,cx=W()/2,cy=H()/2;for(const e of enemies){const p=worldToCanvas(e.x,e.y);if(p.x>-20&&p.x<W()+20&&p.y>-20&&p.y<H()+20)continue;const a=Math.atan2(p.y-cy,p.x-cx),ix=Math.max(mg,Math.min(W()-mg,cx+Math.cos(a)*(cx-mg))),iy=Math.max(mg,Math.min(H()-mg,cy+Math.sin(a)*(cy-mg)));ctx.fillStyle=ETYPES[e.type].indicator;ctx.save();ctx.translate(ix,iy);ctx.rotate(a);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();ctx.restore();}}

function updateHUD(){
  $('hp-fill').style.width=((player.hp/player.maxHp)*100)+'%';$('hp-label').textContent=Math.ceil(player.hp)+' / '+player.maxHp;
  $('xp-fill').style.width=((player.xp/player.xpToLevel)*100)+'%';$('xp-label').textContent=player.xp+' / '+player.xpToLevel;
  $('level-text').textContent='LVL '+player.level;$('kill-text').textContent=kills;
  const m=Math.floor(gameTime/60),s=Math.floor(gameTime%60);$('time-text').innerHTML='<span class="val">'+m+':'+String(s).padStart(2,'0')+'</span>';
  if(bossRef)$('boss-fill').style.width=Math.max(0,(bossRef.hp/bossRef.maxHp)*100)+'%';
}

// ─── Main loop ───
let lastTime=0;
function gameLoop(now){
  requestAnimationFrame(gameLoop);const dt=Math.min((now-lastTime)/1000,0.05);lastTime=now;
  ctx.fillStyle='#080810';ctx.fillRect(0,0,W(),H());
  if(state==='start'||state==='dead'||state==='won')return;
  const active=state==='playing';
  if(active){
    gameTime+=dt;shakeTimer=Math.max(0,shakeTimer-dt);if(shakeTimer<=0)shakeIntensity=0;
    if(notifTimer>0){notifTimer-=dt;if(notifTimer<=0)$('notification').hidden=true;}
    spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=getSpawnInterval();}
    if(!bossSpawned&&gameTime>=180){spawnBoss();bossSpawned=true;}
    updatePlayer(dt);updateBullets(dt);updateEnemies(dt);updateWeapons(dt);updateXpOrbs(dt);updateParticles(dt);updateCamera(dt);updateHUD();
  }
  drawGrid();
  drawFirePatchesLayer();
  drawFrostNovaRingsLayer();
  const all=[];
  for(const o of xpOrbs)all.push({d:o.x+o.y,t:'xp',o});
  for(const e of enemies)all.push({d:e.x+e.y,t:'e',o:e});
  all.push({d:player.x+player.y,t:'p'});
  for(const b of bullets)all.push({d:b.x+b.y,t:'b',o:b});
  for(const m of homingMissiles)all.push({d:m.x+m.y,t:'hm',o:m});
  all.sort((a,b)=>a.d-b.d);
  for(const item of all){if(item.t==='xp')drawXpOrb(item.o);else if(item.t==='e')drawEnemy(item.o);else if(item.t==='p')drawChibiGirl();else if(item.t==='b')drawBullet(item.o);else if(item.t==='hm')drawHomingMissile(item.o);}
  drawOrbitalBlades();
  drawLightningBoltsLayer();
  drawParticlesLayer();drawOffscreenIndicators();
}
requestAnimationFrame(gameLoop);
</script>
